<script>
'use strict';
const CHAPTER = { number: 1, title: 'The Forgotten Crisis', minutes: 8, language: 'en', lead: false };

const CN = ['Beijing', 'Shanghai', 'Guangzhou', 'Chongqing', 'Chengdu', 'Xian', 'Zhengzhou', 'Changsha', 'Nanjing', 'Hangzhou', 'Shenzhen', 'Harbin', 'Kunming'];
const C = n => GEO.cities[n];

// a doctor's chip: a toned portrait in a red ring. li-wenliang is his own selfie (fair use); doctor-1..7 are AI
// illustrations standing in for the other seven, who are not identified here
const LI_CLIP = mk('clipPath', { id: 'liclip', clipPathUnits: 'objectBoundingBox' }, DEFS);
mk('circle', { cx: .5, cy: .5, r: .5 }, LI_CLIP);
function liChip(p, x, y, r, t0, { o = 1, img = 'li-wenliang' } = {}) {
  const g = G(p, { x, y, s: 0, o: 0 }), k = r * .9;
  mk('circle', { r, fill: RED }, g);
  mk('image', { href: `../img/${img}.webp`, x: -k, y: -k, width: 2 * k, height: 2 * k, 'clip-path': 'url(#liclip)' }, g);
  tw(g, { s: 1, o }, t0, .5, back);
  return g;
}

// the first cases around Wuhan (world px), the same in every beat that shows them
const CASES = (() => { const R = rng(4), a = [[.6, -.4]]; for (let i = 0; i < 9; i++) a.push([-4 + R() * 5, -3 + R() * 4.5]); for (let i = 0; i < 8; i++) a.push([5 + R() * 4, 2 + R() * 3.5]); return a; })();
function caseDots(g, on = () => 1) {
  return CASES.map(([x, y]) => mk('circle', { cx: x, cy: y, r: .9, fill: RED }, g));
}
// the city framing where Li's story plays: Wuhan on screen at (BX, BY)
const BX = 420, BY = 440, ZL = 9, VIEW_LI = { x: (800 - BX) / ZL, y: (450 - BY) / ZL, z: ZL };

// the people who left before the gates closed: 30 trains of about 10,000 (the 300,000), each a destination, a phase and
// a speed; positions are fractions of the way. People are ink: red is kept for the virus, which lights a city on arrival
const EXO = (() => { const R = rng(8); return [...Array(30)].map((_, i) => [CN[i % CN.length], i / 30 + R() * .03, .18 + R() * .2]); })();
const exoLaunch = (tS, ph) => tS + ph * 2.6;
// a train: three cars heading away from Wuhan, and a faint wake back to it (data-sw: the paper map keeps its width)
function trainMk(g) {
  const tr = mk('path', { d: '', fill: 'none', stroke: MAPINK, 'data-sw': 1.6, opacity: 0 }, g), car = G(g, { o: 0 });
  for (let k = 0; k < 3; k++) mk('rect', { x: -33 + k * 11.5, y: -3.6, width: 10, height: 7.2, rx: k === 2 ? 3.6 : 1.2, fill: MAPINK, stroke: '#f6f1e4', 'stroke-width': 1.2 }, car);
  return { tr, car };
}
function trainAt({ tr, car }, x, y, z, car_, wake) {
  put(car, { x, y, r: Math.atan2(y, x) * 180 / Math.PI, s: 1 / z, o: car_ ? 1 : 0 });
  tr.setAttribute('d', `M0 0L${x.toFixed(1)} ${y.toFixed(1)}`); tr.setAttribute('opacity', wake ? .35 : 0);
}

// §3: Italy and New York; a lon/lat on the globe to screen px for view v (orthographic, as globe.js draws it)
const ROME_LL = [12.4964, 41.9028], CODOGNO = [9.7046, 45.16], NYC_LL = [-74.006, 40.713];
function globeXY([lon, lat], v) {
  const r = Math.PI / 180, k = 450 / v.H, dl = (lon - v.lon) * r, f = lat * r, f0 = v.lat * r;
  return [800 + (v.dx || 0) + k * Math.cos(f) * Math.sin(dl), 450 + (v.dy || 0) - k * (Math.cos(f0) * Math.sin(f) - Math.sin(f0) * Math.cos(f) * Math.cos(dl))];
}

// a lon/lat to world px on a paper map made from geo (orthographic about geo.center, as geo.mjs projects it)
function mapXY(geo, [lon, lat]) {
  const r = Math.PI / 180, dl = (lon - geo.center[0]) * r, f = lat * r, f0 = geo.center[1] * r;
  return [geo.R * Math.cos(f) * Math.sin(dl), -geo.R * (Math.cos(f0) * Math.sin(f) - Math.sin(f0) * Math.cos(f) * Math.cos(dl))];
}
// Wuhan's hatching at the zoom each shot looks at it from (pattern units are world px): S a town, M a region, L a country
[['hatchS', .18], ['hatchM', .9], ['hatchL', 3.4], ['hatchE', 5], ['hatchW', 11]].forEach(([id, w]) => {
  const pt = mk('pattern', { id, width: w, height: w, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, DEFS);
  mk('rect', { width: w, height: w, fill: RED, opacity: .18 }, pt);
  mk('path', { d: `M0 0V${w}`, stroke: RED, 'stroke-width': w * .4 }, pt);
});

// §4: every country of the world map as a hatched shape, hidden ([element, [d, first strict day, weekly bits]])
function worldHatch(M, pat = 'hatchW') {
  return Object.entries(GEO_W.countries).filter(([, c]) => c[2]).map(([, c]) => [mk('path', { d: c[0], fill: `url(#${pat})`, stroke: RED, 'data-sw': 1, opacity: 0 }, M.marks), c]);
}
const dateFmt = () => d => new Date(d).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' }).toUpperCase();

// §5: the master picture of the waves, rebuilt in each beat: above, the world map, each country red by its deaths per
// million that week, with the variants' pins; below, the world's cases and deaths a day (OWID, weekly). The playhead
// follows keys [[t, date], ...] (piecewise, so each date lands on the word that names it; a key earlier than the one
// before rewinds).
function wavesStage(p, D, keys) {
  const g = G(p, {});
  ground(g, MAPLAND); paperTop(g, .4);
  const M = paperMap(g, D + HOLD, { box: [400, 20, 960, 480], x: 0, y: 0, z: .3, bg: MAPSEA }, { geo: GEO_W }), cam = M.cam;
  const iOf = d => WAVES.findIndex(w => w[0] >= d), K = keys.map(([t, d]) => [t, iOf(d)]);
  // each country's deaths that week, over the map (no data: no colour)
  const ch = Object.values(GEO_W.countries).filter(c => c[3]).map(c => [mk('path', { d: c[0], fill: RED, opacity: 0 }, M.marks), c[3]]);
  const X0 = 150, X1 = 1470, X = i => X0 + (X1 - X0) * i / (WAVES.length - 1);
  const strips = [['CASES A DAY', 1, 3.5e6, 680, MAPINK], ['DEATHS A DAY', 2, 15000, 860, RED]].map(([name, col, max, base, fill]) => {
    const sg = G(g, {});
    mk('path', { d: `M${X0} ${base}H${X1}`, stroke: '#b9ad94', 'stroke-width': 1.5 }, sg);
    T(sg, name, { x: X0, y: base - 108, size: 20, fill, font: KEY, weight: 500 }).setAttribute('letter-spacing', '.12em');
    const area = mk('path', { d: '', fill, opacity: .85 }, sg);
    return { sg, col, max, base, fill, area, Y: v => base - 110 * Math.min(1.08, v / max) };
  });
  ['2021-01-04', '2022-01-03'].forEach(d => {
    const x = X(iOf(d));
    mk('path', { d: `M${x} 560V860`, stroke: '#b9ad94', 'stroke-width': 1, 'stroke-dasharray': '4 4' }, g);
    T(g, d.slice(0, 4), { x: x + 8, y: 882, size: 20, fill: '#6a6258', font: SER });
  });
  T(g, 'Our World in Data · 7-day averages', { x: X1, y: 556, size: 16, fill: '#6a6258', font: SER, anchor: 'end' });
  const dt = dateTag(g, '', 0, { fill: MAPINK }), fmt = d => new Date(Date.parse(d)).toLocaleDateString('en-GB', { month: 'long', year: 'numeric', timeZone: 'UTC' }).toUpperCase();
  const kOf = t => {
    if (t <= K[0][0]) return K[0][1];
    for (let j = 1; j < K.length; j++) if (t <= K[j][0]) return K[j - 1][1] + (K[j][1] - K[j - 1][1]) * soft(span01(t, K[j - 1][0], K[j][0]));
    return K[K.length - 1][1];
  };
  let lastW = -1;
  clockRun(t => {
    const k = kOf(t), n = Math.floor(k), f = k - n;
    strips.forEach(S => {
      const pts = [];
      for (let i = 0; i <= n; i++) pts.push([X(i), S.Y(WAVES[i][S.col])]);
      if (f > 0 && n + 1 < WAVES.length) pts.push([X(n + f), S.Y(WAVES[n][S.col] + (WAVES[n + 1][S.col] - WAVES[n][S.col]) * f)]);
      S.area.setAttribute('d', `M${X0} ${S.base}` + pts.map(([x, y]) => `L${x.toFixed(1)} ${y.toFixed(1)}`).join('') + `L${pts[pts.length - 1][0].toFixed(1)} ${S.base}Z`);
    });
    const w = Math.round(k);
    dt.lastChild.textContent = fmt(WAVES[w][0]);
    if (w !== lastW) { lastW = w; ch.forEach(([e, q]) => e.setAttribute('opacity', +q[w] * .09)); }
  }, D, { tail: true });
  mk('rect', { x: 1150, y: 448, width: 200, height: 14, fill: 'url(#dpmRamp)' }, g);
  T(g, 'deaths per million a day: low → high', { x: 1350, y: 482, size: 15, fill: '#6a6258', font: SER, anchor: 'end' });
  return {
    g, M,
    pin(name, label, ta, tb) {
      const [x, y] = GEO_W.pins[name];
      const d = mk('circle', { cx: x, cy: y, r: 0, fill: RED }, M.marks), r = mk('circle', { cx: x, cy: y, r: 0, fill: 'none', stroke: RED, 'stroke-width': 6, opacity: 0 }, M.marks);
      prog(q => d.setAttribute('r', 18 * q), ta, .25, back);
      for (let j = 0; j < 3; j++) {   // rings ripple out from where the variant was found
        const rj = j ? mk('circle', { cx: x, cy: y, r: 0, fill: 'none', stroke: RED, 'stroke-width': 6, opacity: 0 }, M.marks) : r;
        prog(q => { rj.setAttribute('r', 18 + 420 * q); rj.setAttribute('opacity', .9 * (1 - q)); }, ta + j * .6, 2.2, out);
      }
      const [sx, sy] = cam.screen(x, y, ta);
      key(g, label.toUpperCase(), sx, sy - 30, tb, { size: 46, fill: RED });
    },
    peak(date, which, text, ta) {
      const S = strips[which === 'c' ? 0 : 1], i = iOf(date), x = X(i), y = S.Y(WAVES[i][S.col]);
      mk('circle', { cx: x, cy: y, r: 7, fill: S.fill, opacity: 0 }, g); tw(g.lastChild, { o: 1 }, ta, .2);
      const r = x > 1000;   // near the right edge the label reads leftwards
      chipLabel(g, text, x + (r ? -40 : 40), y - 30, ta, { tx: x + (r ? -5 : 5), ty: y - 5, fill: S.fill, size: 22, anchor: r ? 'end' : 'start' });
    },
    mark(date, text, ta) {
      const x = X(iOf(date)), l = path(g, `M${x} 860V560`, { stroke: '#2f6f9f', 'stroke-width': 3 }, { d: 0 });
      draw(l, ta, .5);
      T(g, text.toUpperCase(), { x: x + 10, y: 590, size: 22, fill: '#2f6f9f', font: KEY, weight: 500, o: 0 }).setAttribute('letter-spacing', '.1em');
      tw(g.lastChild, { o: 1 }, ta + .2, .3);
    },
    dim(ta) { tw(strips[0].sg, { o: .3 }, ta, .4); },
  };
}

// §6: n dots for 100,000 people each, 32 to a row from y0, hidden
function dotGrid(p, n, y0) {
  return [...Array(n)].map((_, i) => mk('circle', { cx: 335 + (i % 32) * 30, cy: y0 + Math.floor(i / 32) * 30, r: 10, fill: 'none', stroke: SOFT, 'stroke-width': 2, opacity: 0 }, p));
}

// the origin: the paper map close over Wuhan, the Huanan market (north) and the Wuhan Institute of Virology (south),
// each with a card that names an answer, what it rests on and who leans to it. Both sides are drawn alike on purpose.
function originStage(p, D, tQ, tIn) {
  ground(p, NIGHT);
  const MK = mapXY(GEO, [114.2576, 30.6196]), WV = mapXY(GEO, [114.2625, 30.3764]), mid = [(MK[0] + WV[0]) / 2, (MK[1] + WV[1]) / 2];
  const M = paperMap(p, D + HOLD, tIn < 0 ? { x: mid[0], y: mid[1], z: 36 } : { x: 0, y: 0, z: 3 }, {}), cam = M.cam;
  paperTop(p, .4);
  if (tIn >= 0) {
    const q = chipLabel(p, 'Where did it come from?', 800, 160, tQ, { anchor: 'middle', size: 34, fill: MAPINK });
    hide(q, tIn + 1.2, .3);
    cam.to({ x: mid[0], y: mid[1], z: 36 }, tIn, 1.6, soft);
  }
  const SIDES = [
    { at: MK, x: 60, title: 'NATURE', lines: ['a bat virus → another animal', '→ people, perhaps at the market', 'where early cases clustered', ''],
      place: 'Huanan Seafood Market', who: 'Many scientists; the WHO-convened study, 2021' },
    { at: WV, x: 1080, title: 'A LABORATORY ACCIDENT', lines: ['at the Wuhan Institute of', 'Virology, which studied bat', 'coronaviruses in the same city', ''],
      place: 'Wuhan Institute of Virology', who: 'The FBI; the US Department of Energy' },
  ];
  const cards = [], labels = [];
  return {
    cam, M, cards, labels, mid,
    // one answer: its card on the beat of its name, its place lit, a detail, then who leans to it (-1: shown at once)
    side(k, tName, tPlace, tDetail, tWho) {
      const S = SIDES[k], y0 = 310, on = t => t < 0 ? 0 : t;
      const pin = mk('circle', { cx: S.at[0], cy: S.at[1], r: .4, fill: MAPINK, opacity: 0 }, M.marks);
      const ring = mk('circle', { cx: S.at[0], cy: S.at[1], r: 1.2, fill: 'none', stroke: MAPINK, 'data-sw': 3, opacity: 0 }, M.marks);
      [pin, ring].forEach(e => tw(e, { o: 1 }, on(tPlace), tPlace < 0 ? .01 : .3));
      labels.push(trackLabel(p, cam, S.place, S.at, on(tPlace), D, { size: 22, dy: 44, spacing: '.12em' }));
      const c = G(p, { o: 0 }); cards.push(c);
      mk('rect', { x: S.x, y: y0, width: 460, height: 280, fill: '#f6f1e4', opacity: .96 }, c);
      T(c, S.title, { x: S.x + 30, y: y0 + 52, size: 34, fill: MAPINK, font: KEY, weight: 600 }).setAttribute('letter-spacing', '.1em');
      S.lines.forEach((l, i) => T(c, l, { x: S.x + 30, y: y0 + 100 + i * 32, size: 24, fill: MAPINK, font: SER }));
      const who = T(c, S.who, { x: S.x + 30, y: y0 + 252, size: 21, fill: '#6a6258', font: SER, o: tWho < 0 ? 1 : 0 });
      who.setAttribute('font-style', 'italic');
      if (tWho >= 0) tw(who, { o: 1 }, tWho, .3);
      const lx = k ? S.x : S.x + 460, ly = y0 + 140;
      const ld = mk('path', { d: '', stroke: MAPINK, 'stroke-width': 2, 'stroke-dasharray': '6 5', fill: 'none' }, c);
      clockRun(t => { const [sx, sy] = cam.screen(S.at[0], S.at[1], t); ld.setAttribute('d', `M${lx} ${ly}L${sx} ${sy}`); }, D, { tail: true });
      tw(c, { o: 1 }, on(tName), tName < 0 ? .01 : .35);
      return c;
    },
  };
}

/* ---------- beats ---------- */
const BEATS = [
  // 0. Cold open: the flicker, the list, the wall going dark, the two numbers, the words that crumble, a breath, the globe dives
  ['open', 'The only story on Earth', (m, D) => {
    const p = panel(0);
    ground(p, NIGHT);
    const glob = G(p, { o: 0 }), gb = blurOn(glob, 'x');
    const lon0 = -30, spin = t => lon0 + t * 2.4, tA = m('one') - 1.9, tB = m('one') - .55;   // the whip turn to China on "go back"
    globeShot(glob, D, (t, E) => {   // E: where the beat really ends, so the dive lands there
      const q = soft(span01(t, tA, tB)), lonA = spin(tA);
      const lon = t < tA ? spin(t) : lonA + (WUHAN_LL[0] - lonA) * q, lat = 12 + (WUHAN_LL[1] - 12) * q;
      const creep = 1.15 - .1 * span01(t, m('count') - 1, tA);
      const dive = span01(t, m('one') - .4, E), H = creep * (.33 / creep) ** (dive ** 1.6);
      const gain = 1.6 - .5 * span01(t, m('real'), m('real') + .8) - .9 * span01(t, m('biggest') + 1, m('biggest') + 2.6) + 1.4 * span01(t, tA, tB);
      return { lon, lat, H, gain };
    });
    clockRun(t => gb(Math.sin(Math.PI * span01(t, tA, tB)) ** 3 * 46), D, { tail: true });
    tw(glob, { o: .55 }, m('shut') + .75, .9, lin);
    tw(glob, { o: 1 }, tA - .3, .6, lin);

    // the flicker under 2020: the world's pictures at seven a second, then one picture per word
    const mon = G(p, {});
    const fl = ['virus-sem-red', 'airport-pek-empty', 'street-glenview-24', 'school-empty-classroom', 'closed-sign-temporary', 'ppe-nurses-faceshields',
      'mask-cbp-officer', 'street-hwy407', 'mask-hawaii-guard', 'school-closed-banner', 'airport-pek-empty', 'virus-sem-red', 'closed-sign-temporary'];
    const tN = m('y2020') + 1.85, step = (tN - .8) / fl.length;
    fl.forEach((n, i) => { const s = still(mon, n, .8 + i * step, .8 + (i + 1) * step + .1, { s0: 1.08, s1: 1.1 }); hide(s, .8 + (i + 1) * step, .01); });
    const shots = [['ppe-nurses-faceshields', tN, m('y2020') + 3.1, [.5, .4]], ['mask-hawaii-guard', m('y2020') + 3.1, m('schools'), [.35, .5]],
      ['school-closed-banner', m('schools'), m('borders'), [.55, .45]], ['mask-cbp-officer', m('borders'), m('whole'), [.4, .45]], ['street-hwy407', m('whole'), m('shut') + .9, [.5, .55]]];
    shots.forEach(([n, a, b, f], i) => { const s = still(mon, n, a, b + .3, { focus: f }); if (i < shots.length - 1) hide(s, b + .02, .01); });
    const dim = mk('rect', { x: 0, y: 0, width: SW, height: SH, fill: '#000', opacity: .3 }, mon);
    const y20 = key(mon, '2020', 800, 560, m('y2020'), { size: 300, from: 0 });
    put(y20, { s: 1.25 }); tw(y20, { s: 1 }, m('y2020'), .18, out); tw(y20, { s: 1.06 }, m('y2020') + .2, 1.6, lin); hide(y20, tN, .01);
    sfx('open', m('y2020'), 'thud', 1.2);
    // "shut": the last picture pulls back into a wall of the year's pictures, and they go dark one by one, like windows
    // 4 x 4 tiles of the stage's shape; tile 5 (the street) starts exactly where the street still is: the same picture
    // scale (the still's push at tS) and the same picture row (focus .55) at the centre of the screen
    const tS = m('shut') - .35, sT = 1.04 + .1 * (tS - m('whole')) / (m('shut') + 1.2 - m('whole'));
    const [aw, ah] = ART['street-hwy407'], kS = sT * Math.max(SW / aw, SH / ah), kT = 394 / aw;   // screen px per picture px
    const rowT = ah - 219 / kT / 2;   // the tile shows the picture's bottom (YMax): the row at its centre
    const W4 = kS / kT, wall = G(mon, { x: SW / 2 - W4 * 600, y: SH / 2 - W4 * (337.5 - (rowT - .55 * ah) * kT), s: W4, o: 0 });
    mk('rect', { x: 0, y: 0, width: SW, height: SH, fill: '#000' }, wall);
    const offs = ['virus-sem-red', 'airport-pek-empty', 'street-glenview-24', 'school-empty-classroom', 'closed-sign-temporary', 'street-hwy407',
      'ppe-nurses-faceshields', 'mask-cbp-officer', 'mask-hawaii-guard', 'school-closed-banner', 'airport-pek-empty', 'virus-sem-red',
      'street-glenview-24', 'school-empty-classroom', 'mask-hawaii-guard', 'closed-sign-temporary'].map((n, i) => {
      const x = (i % 4) * 400 + 3, y = Math.floor(i / 4) * 225 + 3;
      // the picture itself fades to the black behind it: a black cover the same size leaves a hairline at its edges
      return put(mk('image', { href: `../img/${n}.webp`, x, y, width: 394, height: 219, preserveAspectRatio: i === 5 ? 'xMidYMax slice' : 'xMidYMid slice' }, wall), { o: .7 });
    });
    tw(wall, { o: 1 }, tS, .01, lin); tw(wall, { x: 0, y: 0, s: 1 }, tS, .5, out);
    [3, 9, 14, 0, 12, 6, 11, 2, 15, 8, 4, 13, 10, 1, 7, 5].forEach((k, i) => tw(offs[k], { o: 0 }, m('shut') + i * .045, .06, lin));   // the street goes last
    const labs = [['Schools', 'schools', 'borders'], ['Borders', 'borders', 'whole'], ['Whole countries', 'whole', 'shut']]
      .map(([l, a, b]) => { const c = chipLabel(mon, l, 110, 810, m(a), { size: 66 }); hide(c, m(b), .01); return c; });
    hide(mon, m('shut') + .75, .4);   // the wall is dark: the globe comes up at once, no dead black before the count

    // the two numbers, and the gap between them
    const n1 = counter(p, 800, 470, 0, 7115706, m('count'), 1.7, { size: 150 });
    const t1 = tag(p, 'confirmed COVID-19 deaths', 800, 535, m('count') + 1, { anchor: 'middle', size: 30, fill: CREAM });
    tw(n1, { y: 330, s: .62 }, m('real') - .2, .6, io); tw(t1, { y: 385 }, m('real') - .2, .6, io);
    const n2 = counter(p, 800, 600, 0, 27000000, m('twentyseven') - .3, 1.4, { size: 190, fill: RED, weight: 600 });
    const t2 = tag(p, 'estimated from excess deaths (The Economist, 2024)', 800, 665, m('twentyseven') + .2, { anchor: 'middle', size: 28, fill: CREAM });
    // the gap as lengths: a cream bar for the confirmed deaths, then red lengths of the same size push out to the estimate
    const bars = G(p, {}), U = 340, K = 27000000 / 7115706, bx = 800 - U * K / 2;
    const conf = mk('rect', { x: bx, y: 720, width: 0, height: 26, fill: CREAM }, bars);
    prog(q => conf.setAttribute('width', U * q), m('real') - .1, .5, out);

  const mg = mk('marker', { id: 'arrowG', viewBox: '0 0 10 10', refX: 6, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse' }, DEFS);
  mk('path', { d: 'M0 0L10 5L0 10Z', fill: '#aeb4bd' }, mg);
})();

window.MUSIC_UP_IN_PRE = ['open', 'far', 'half', 'count', 'origin', 'end'];
// One track per part, never stopped, crossfading at the turn; ?bgm= sets their level by ear (gain under the ducking to 30 %)
const BGM_GAIN = +(new URLSearchParams(location.search).get('bgm') || .6), PART = id => BEATS.findIndex(b => b.id === id);
music('audio/bgm/theme.mp3', BEATS.slice(0, PART('far')).map(b => b.id), BGM_GAIN, 0);
music('audio/bgm/s3-spread.mp3', BEATS.slice(PART('far'), PART('half')).map(b => b.id), BGM_GAIN, 2);   // §3 Out of China (Lyria)
music('audio/bgm/s4-still.mp3', BEATS.slice(PART('half'), PART('alpha')).map(b => b.id), BGM_GAIN, 2);   // §4 The world stops (Lyria)
music('audio/bgm/s5-waves.mp3', BEATS.slice(PART('alpha'), PART('count')).map(b => b.id), BGM_GAIN, 2);   // §5 Waves (Lyria)
music('audio/bgm/s6-count.mp3', BEATS.slice(PART('count'), PART('origin')).map(b => b.id), BGM_GAIN, 2);   // §6 The count (Lyria)
music('audio/bgm/s7-open.mp3', BEATS.slice(PART('origin')).map(b => b.id), BGM_GAIN, 2);   // the origin, and the end (Lyria)

Promise.all([...['600 40px Oswald', '500 40px Oswald', '700 40px Oswald', 'italic 400 40px "EB Garamond"', '400 40px "EB Garamond"', '500 40px "EB Garamond"']
  .map(f => document.fonts.load(f)), import('../lib/globe.js'), new Promise(r => { (function w() { window.GLOBE_READY ? r() : setTimeout(w, 30); })(); })])
  .then(boot);
</script>
