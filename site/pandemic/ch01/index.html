<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Forgotten Crisis</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/film.js"></script>
<script src="audio/en/timings.js"></script>
<script src="../img/art.js"></script>
<script src="../img/geo.js"></script>
<script src="../img/spread.js"></script>
<script src="../lib/doc.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'The Forgotten Crisis', minutes: 2, language: 'en', lead: false };

const CN = ['Beijing', 'Shanghai', 'Guangzhou', 'Chongqing', 'Chengdu', 'Xian', 'Zhengzhou', 'Changsha', 'Nanjing', 'Hangzhou', 'Shenzhen', 'Harbin', 'Kunming'];
const C = n => GEO.cities[n];

// a doctor's chip: a toned portrait in a red ring. li-wenliang is his own selfie (fair use); doctor-1..7 are AI
// illustrations standing in for the other seven, who are not identified here
const LI_CLIP = mk('clipPath', { id: 'liclip', clipPathUnits: 'objectBoundingBox' }, DEFS);
mk('circle', { cx: .5, cy: .5, r: .5 }, LI_CLIP);
function liChip(p, x, y, r, t0, { o = 1, img = 'li-wenliang' } = {}) {
  const g = G(p, { x, y, s: 0, o: 0 }), k = r * .9;
  mk('circle', { r, fill: RED }, g);
  mk('image', { href: `../img/${img}.webp`, x: -k, y: -k, width: 2 * k, height: 2 * k, 'clip-path': 'url(#liclip)' }, g);
  tw(g, { s: 1, o }, t0, .5, back);
  return g;
}

// the first cases around Wuhan (world px), the same in every beat that shows them
const CASES = (() => { const R = rng(4), a = [[.6, -.4]]; for (let i = 0; i < 9; i++) a.push([-4 + R() * 5, -3 + R() * 4.5]); for (let i = 0; i < 8; i++) a.push([5 + R() * 4, 2 + R() * 3.5]); return a; })();
function caseDots(g, on = () => 1) {
  return CASES.map(([x, y]) => mk('circle', { cx: x, cy: y, r: .9, fill: RED }, g));
}
// the city framing where Li's story plays: Wuhan on screen at (BX, BY)
const BX = 420, BY = 440, ZL = 9, VIEW_LI = { x: (800 - BX) / ZL, y: (450 - BY) / ZL, z: ZL };

// the people who left before the gates closed: 30 trains of about 10,000 (the 300,000), each a destination, a phase and
// a speed; positions are fractions of the way. People are ink: red is kept for the virus, which lights a city on arrival
const EXO = (() => { const R = rng(8); return [...Array(30)].map((_, i) => [CN[i % CN.length], i / 30 + R() * .03, .18 + R() * .2]); })();
const exoLaunch = (tS, ph) => tS + ph * 2.6;
// a train: three cars heading away from Wuhan, and a faint wake back to it (data-sw: the paper map keeps its width)
function trainMk(g) {
  const tr = mk('path', { d: '', fill: 'none', stroke: MAPINK, 'data-sw': 1.6, opacity: 0 }, g), car = G(g, { o: 0 });
  for (let k = 0; k < 3; k++) mk('rect', { x: -33 + k * 11.5, y: -3.6, width: 10, height: 7.2, rx: k === 2 ? 3.6 : 1.2, fill: MAPINK, stroke: '#f6f1e4', 'stroke-width': 1.2 }, car);
  return { tr, car };
}
function trainAt({ tr, car }, x, y, z, car_, wake) {
  put(car, { x, y, r: Math.atan2(y, x) * 180 / Math.PI, s: 1 / z, o: car_ ? 1 : 0 });
  tr.setAttribute('d', `M0 0L${x.toFixed(1)} ${y.toFixed(1)}`); tr.setAttribute('opacity', wake ? .35 : 0);
}

/* ---------- beats ---------- */
const BEATS = [
  // 0. Cold open: the flicker, the list, the wall going dark, the two numbers, the words that crumble, a breath, the globe dives
  ['open', 'The only story on Earth', (m, D) => {
    const p = panel(0);
    ground(p, NIGHT);
    const glob = G(p, { o: 0 }), gb = blurOn(glob, 'x');
    const lon0 = -30, spin = t => lon0 + t * 2.4, tA = m('one') - 1.9, tB = m('one') - .55;   // the whip turn to China on "go back"
    globeShot(glob, D, (t, E) => {   // E: where the beat really ends, so the dive lands there
      const q = soft(span01(t, tA, tB)), lonA = spin(tA);
      const lon = t < tA ? spin(t) : lonA + (WUHAN_LL[0] - lonA) * q, lat = 12 + (WUHAN_LL[1] - 12) * q;
      const creep = 1.15 - .1 * span01(t, m('count') - 1, tA);
      const dive = span01(t, m('one') - .4, E), H = creep * (.33 / creep) ** (dive ** 1.6);
      const gain = 1.6 - .5 * span01(t, m('real'), m('real') + .8) - .9 * span01(t, m('forget'), m('forget') + 1.6) + 1.4 * span01(t, tA, tB);
      return { lon, lat, H, gain };
    });
    clockRun(t => gb(Math.sin(Math.PI * span01(t, tA, tB)) ** 3 * 46), D, { tail: true });
    tw(glob, { o: .55 }, m('shut') + .75, .9, lin);
    tw(glob, { o: 1 }, tA - .3, .6, lin);

    // the flicker under 2020: the world's pictures at seven a second, then one picture per word
    const mon = G(p, {});
    const fl = ['virus-sem-red', 'airport-pek-empty', 'street-glenview-24', 'school-empty-classroom', 'closed-sign-temporary', 'ppe-nurses-faceshields',
      'mask-cbp-officer', 'street-hwy407', 'mask-hawaii-guard', 'school-closed-banner', 'airport-pek-empty', 'virus-sem-red', 'closed-sign-temporary'];
    const tN = m('y2020') + 1.85, step = (tN - .8) / fl.length;
    fl.forEach((n, i) => { const s = still(mon, n, .8 + i * step, .8 + (i + 1) * step + .1, { s0: 1.08, s1: 1.1 }); hide(s, .8 + (i + 1) * step, .01); });
    const shots = [['ppe-nurses-faceshields', tN, m('y2020') + 3.1, [.5, .4]], ['mask-hawaii-guard', m('y2020') + 3.1, m('schools'), [.35, .5]],
      ['school-closed-banner', m('schools'), m('borders'), [.55, .45]], ['mask-cbp-officer', m('borders'), m('whole'), [.4, .45]], ['street-hwy407', m('whole'), m('shut') + .9, [.5, .55]]];
    shots.forEach(([n, a, b, f], i) => { const s = still(mon, n, a, b + .3, { focus: f }); if (i < shots.length - 1) hide(s, b + .02, .01); });
    const dim = mk('rect', { x: 0, y: 0, width: SW, height: SH, fill: '#000', opacity: .3 }, mon);
    const y20 = key(mon, '2020', 800, 560, m('y2020'), { size: 300, from: 0 });
    put(y20, { s: 1.25 }); tw(y20, { s: 1 }, m('y2020'), .18, out); tw(y20, { s: 1.06 }, m('y2020') + .2, 1.6, lin); hide(y20, tN, .01);
    sfx('open', m('y2020'), 'thud', 1.2);
    // "shut": the last picture pulls back into a wall of the year's pictures, and they go dark one by one, like windows
    // 4 x 4 tiles of the stage's shape; tile 5 (the street) starts exactly where the street still is: the same picture
    // scale (the still's push at tS) and the same picture row (focus .55) at the centre of the screen
    const tS = m('shut') - .35, sT = 1.04 + .1 * (tS - m('whole')) / (m('shut') + 1.2 - m('whole'));
    const [aw, ah] = ART['street-hwy407'], kS = sT * Math.max(SW / aw, SH / ah), kT = 394 / aw;   // screen px per picture px
    const rowT = ah - 219 / kT / 2;   // the tile shows the picture's bottom (YMax): the row at its centre
    const W4 = kS / kT, wall = G(mon, { x: SW / 2 - W4 * 600, y: SH / 2 - W4 * (337.5 - (rowT - .55 * ah) * kT), s: W4, o: 0 });
    mk('rect', { x: 0, y: 0, width: SW, height: SH, fill: '#000' }, wall);
    const offs = ['virus-sem-red', 'airport-pek-empty', 'street-glenview-24', 'school-empty-classroom', 'closed-sign-temporary', 'street-hwy407',
      'ppe-nurses-faceshields', 'mask-cbp-officer', 'mask-hawaii-guard', 'school-closed-banner', 'airport-pek-empty', 'virus-sem-red',
      'street-glenview-24', 'school-empty-classroom', 'mask-hawaii-guard', 'closed-sign-temporary'].map((n, i) => {
      const x = (i % 4) * 400 + 3, y = Math.floor(i / 4) * 225 + 3;
      // the picture itself fades to the black behind it: a black cover the same size leaves a hairline at its edges
      return put(mk('image', { href: `../img/${n}.webp`, x, y, width: 394, height: 219, preserveAspectRatio: i === 5 ? 'xMidYMax slice' : 'xMidYMid slice' }, wall), { o: .7 });
    });
    tw(wall, { o: 1 }, tS, .01, lin); tw(wall, { x: 0, y: 0, s: 1 }, tS, .5, out);
    [3, 9, 14, 0, 12, 6, 11, 2, 15, 8, 4, 13, 10, 1, 7, 5].forEach((k, i) => tw(offs[k], { o: 0 }, m('shut') + i * .045, .06, lin));   // the street goes last
    const labs = [['Schools', 'schools', 'borders'], ['Borders', 'borders', 'whole'], ['Whole countries', 'whole', 'shut']]
      .map(([l, a, b]) => { const c = chipLabel(mon, l, 110, 810, m(a), { size: 66 }); hide(c, m(b), .01); return c; });
    hide(mon, m('shut') + .75, .4);   // the wall is dark: the globe comes up at once, no dead black before the count

    // the two numbers, and the gap between them
    const n1 = counter(p, 800, 470, 0, 7115706, m('count'), 1.7, { size: 150 });
    const t1 = tag(p, 'confirmed COVID-19 deaths', 800, 535, m('count') + 1, { anchor: 'middle', size: 30, fill: CREAM });
    tw(n1, { y: 330, s: .62 }, m('real') - .2, .6, io); tw(t1, { y: 385 }, m('real') - .2, .6, io);
    const n2 = counter(p, 800, 600, 0, 27000000, m('twentyseven') - .3, 1.4, { size: 190, fill: RED, weight: 600 });
    const t2 = tag(p, 'estimated from excess deaths (The Economist, 2024)', 800, 665, m('twentyseven') + .2, { anchor: 'middle', size: 28, fill: CREAM });
    // the gap as lengths: a cream bar for the confirmed deaths, then red lengths of the same size push out to the estimate
    const bars = G(p, {}), U = 340, K = 27000000 / 7115706, bx = 800 - U * K / 2;
    const conf = mk('rect', { x: bx, y: 720, width: 0, height: 26, fill: CREAM }, bars);
    prog(q => conf.setAttribute('width', U * q), m('real') - .1, .5, out);
    for (let j = 1; j < Math.ceil(K); j++) {
      const seg = mk('rect', { x: bx + U * j, y: 720, width: 0, height: 26, fill: RED }, bars), w = U * Math.min(1, K - j) - 4;
      prog(q => seg.setAttribute('width', w * q), m('twentyseven') - .2 + (j - 1) * .2, .22, out);
    }
    st(conf).c_fill = CREAM; tw(conf, { c_fill: RED }, m('twentyseven') + 1.05, .3);   // one red length
    tag(bars, 'nearly 4×', bx + U * K, 790, m('twentyseven') + .6, { anchor: 'end', size: 30, fill: RED });
    [n1, t1, n2, t2].forEach(e => hide(e, m('biggest') - .2, .25));
    hide(bars, m('forget'), 1);   // the bars stay under the words, so "nearly 4×" can be read

    // the words that crumble, and the lights going out with them; then nothing is said for two seconds
    crumble(p, 'THE BIGGEST CRISIS', 800, 400, m('forget') + .1, 1.7, { size: 120, appear: m('biggest') - .1 });
    crumble(p, 'OF OUR GENERATION', 800, 540, m('forget') + .3, 1.6, { size: 120, appear: m('biggest') + .7, seed: 9 });
  }, { pre: .8 }],

  // 1. Wuhan: the globe dives, hands over to the paper map at full speed, the first cases
  ['wuhan', 'Wuhan', (m, D) => {
    const p = panel(0);
    ground(p, NIGHT);
    const H0 = .33, H1 = .06, tH = 1.1, z1 = zOfH(H1);
    const glob = G(p, {});
    globeShot(glob, D, t => ({ lon: WUHAN_LL[0], lat: WUHAN_LL[1], H: H0 * (H1 / H0) ** (span01(t, 0, tH) ** .8), gain: 1.6 }));
    const mp = G(p, { o: 0 }), M = paperMap(mp, D + HOLD, { x: 0, y: 0, z: z1 }), cam = M.cam;
    paperTop(mp, .4);
    tw(mp, { o: 1 }, tH - .12, .14, lin); hide(glob, tH + .05, .01);   // the style change hides in the fastest moment
    cam.to({ z: z1 * 1.8 }, tH, 1.2, out);
    cam.to({ z: .62 }, m('eleven') + 1.3, 1.4, soft);                     // "right in the middle of China"
    cam.to({ z: .56 }, m('eleven') + 2.7, m('dec') - m('eleven') - 3.3, lin);   // a creep while it sinks in
    cam.to({ z: 9 }, m('dec') - .6, 1.1, soft);                           // snap back into the city on "December"
    cam.to({ z: 10.5 }, m('dec') + .5, D - m('dec') - .5, lin);
    st(M.hubei)['a_fill-opacity'] = 0;
    tw(M.hubei, { 'a_fill-opacity': .22 }, m('eleven') + 1.6, .6);
    tw(M.hubei, { 'a_fill-opacity': .05 }, m('dec') - .6, .8);
    const wm = mk('circle', { r: 1, fill: 'none', stroke: MAPINK, 'data-sw': 3 }, M.marks);
    clockRun(t => wm.setAttribute('r', 9 / cam.at(t).z), D, { tail: true });
    for (let i = 0; i < 3; i++) {   // rings: the middle of China
      const r = mk('circle', { r: 60, fill: 'none', stroke: RED, 'data-sw': 2.2, opacity: 0 }, M.marks);
      prog(q => { r.setAttribute('r', 60 + q * 900); r.setAttribute('opacity', (1 - q) * .9); }, m('eleven') + 2.4 + i * .35, 1.2, out);
    }
    const lab = trackLabel(p, cam, 'Wuhan', [0, 0], .25, D, { size: 46, fill: CREAM, dy: -64, font: KEY, spacing: '.35em' });
    lab.firstChild.setAttribute('fill', CREAM); st(lab.firstChild).c_fill = CREAM;
    tw(lab.firstChild, { c_fill: MAPINK }, tH - .1, .2);
    const pop = trackLabel(p, cam, '11 million people', [0, 0], Math.max(m('eleven'), tH + .3), D, { size: 26, fill: MAPINK, dy: 34, italic: true, spacing: '.05em' });
    hide(pop, m('dec') - .7, .3);
    dateTag(p, 'December 2019', m('dec') - .1, { fill: MAPINK });
    const unk = chipLabel(p, 'Pneumonia of unknown cause', 1000, 300, m('explain') - .6, { tx: 830, ty: 430, fill: MAPINK });
    hide(unk, m('more') - .2, .3);
    // under the label, a lung CT on dark film: the hazy patches circled
    const ct = G(p, { x: 1040, y: 350, o: 0 });
    mk('rect', { x: -10, y: -10, width: 440, height: 342, rx: 6, fill: '#0b0f12' }, ct);
    mk('image', { href: '../img/ct-pneumonia.webp', x: 0, y: 0, width: 420, height: 322 }, ct);
    [[93, 256], [322, 256]].forEach(([x, y], i) => draw(mk('ellipse', { cx: x, cy: y, rx: 62, ry: 44, fill: 'none', stroke: RED, 'stroke-width': 3 }, ct), m('explain') + .5 + i * .25, .5));
    tag(ct, 'CT scan, COVID-19 pneumonia · Hellerhoff, CC BY-SA 3.0, toned', 0, 352, m('explain') + .2, { size: 15, fill: MAPINK });
    tw(ct, { o: 1, y: 330 }, m('explain') - .3, .4, out);
    hide(ct, m('more') - .2, .3);
    // the cases: one, a cluster, another cluster
    const ds = caseDots(M.marks);
    ds.forEach((d, i) => {
      const t0 = i === 0 ? m('cluster') : i < 10 ? m('cluster') + .95 + (i - 1) * .07 : m('more') - .05 + (i - 10) * .06;
      put(d, { o: 0 }); tw(d, { o: 1 }, t0, .12, lin);
      const ring = mk('circle', { cx: CASES[i][0], cy: CASES[i][1], r: .9, fill: 'none', stroke: RED, 'data-sw': 2, opacity: 0 }, M.marks);
      prog(q => { ring.setAttribute('r', .9 + q * 4); ring.setAttribute('opacity', 1 - q); }, t0, .8, out);
    });
    // push through the first case into red
    cam.to({ x: CASES[0][0], y: CASES[0][1], z: 1600 }, D, HOLD, ease3);
    const red = mk('rect', { x: 0, y: 0, width: SW, height: SH, fill: RED, opacity: 0 }, p);
    clockRun((t, E) => red.setAttribute('opacity', span01(t, E - .16, E)), D, { tail: true });   // E: the beat's real end
  }],

  // 2. The doctor: his badge on the Wuhan map, his message and the letter as cards beside it, then eight badges
  ['message', 'Li Wenliang', (m, D) => {
    const p = panel(0);
    ground(p, MAPSEA);
    const M = paperMap(p, D + HOLD, { x: CASES[0][0], y: CASES[0][1], z: 1600 }), cam = M.cam;
    paperTop(p, .4);
    caseDots(M.marks);
    cam.to(VIEW_LI, 0, .8, unease3);
    cam.to({ z: ZL * 1.07 }, .8, D - .8, lin);   // a creep
    const shade = mk('rect', { x: 0, y: 0, width: SW, height: SH, fill: '#0b0d11', opacity: 0 }, p);
    prog(q => shade.setAttribute('opacity', .55 * q), .3, .6, lin);
    // the red flood closes into his badge, which stays pinned to Wuhan
    const pin = G(p, {});
    clockRun(t => { const [x, y] = cam.screen(0, 0, t); put(pin, { x, y }); }, D, { tail: true });
    const disc = mk('circle', { r: 1100, fill: RED }, pin);
    prog(q => disc.setAttribute('r', 1100 - 990 * q), 0, .7, unease3);
    prog(q => disc.setAttribute('opacity', 1 - q), .65, .15, lin);
    const chip = liChip(pin, 0, 0, 110, .5);
    const d1 = dateTag(p, '30 December 2019', .9);
    const nm = G(pin, { o: 1 });
    key(nm, 'Li Wenliang', 0, 175, m('li') - .1, { size: 52 });
    tag(nm, 'eye doctor, Wuhan Central Hospital', 0, 212, m('li') + .5, { anchor: 'middle', size: 26, fill: CREAM });
    tag(nm, 'photo: his own selfie, Weibo', 0, 240, m('li') + .5, { anchor: 'middle', size: 16 });
    // the message: a dark card beside the badge
    const card = G(p, { x: 1700 });
    mk('rect', { x: 0, y: 0, width: 740, height: 420, rx: 22, fill: '#1b1e24', stroke: '#3a3f48', 'stroke-width': 2 }, card);
    T(card, 'MEDICAL SCHOOL CLASSMATES', { x: 40, y: 56, size: 22, fill: '#aeb4bd', font: KEY, weight: 500 }).setAttribute('letter-spacing', '.14em');
    mk('path', { d: 'M40 78H700', stroke: '#3a3f48', 'stroke-width': 2 }, card);
    tw(card, { x: 720, y: 210 }, m('classmates') - .45, .5, out); put(card, { y: 210 });
    const bub = G(card, { o: 0, x: 40, y: 110 });
    mk('rect', { x: 0, y: 0, width: 600, height: 190, rx: 18, fill: '#f2f0ea' }, bub);
    ['7 confirmed cases of SARS were', 'reported … from Huanan', 'Seafood Market.'].forEach((l, i) =>
      stream(T(bub, '', { x: 28, y: 56 + i * 46, size: 34, fill: '#16181c', font: UI, weight: 500 }), l, m('msg') + .05 + i * .6, .65));
    T(bub, '17:43', { x: 580, y: 178, size: 18, fill: '#7a7f88', font: UI, anchor: 'end' });
    tw(bub, { o: 1 }, m('msg') - .1, .15);
    tag(card, 'his message, translated', 40, 395, m('msg') + 1.4, { size: 24 });
    // "tell your families": the message is forwarded, copy after copy sliding out of frame
    for (let i = 0; i < 5; i++) {
      const c = G(card, { x: 40, y: 110, o: 0 });
      mk('rect', { x: 0, y: 0, width: 600, height: 190, rx: 18, fill: '#f2f0ea', opacity: .9 }, c);
      T(c, '↪ Forwarded', { x: 28, y: 40, size: 22, fill: '#7a7f88', font: UI, weight: 600 });
      const t0 = m('tell') + .1 + i * .22;
      tw(c, { o: 1 }, t0, .05, lin); tw(c, { x: 1000, y: 110 + (i - 2) * 70, o: 0 }, t0 + .05, .9, p => p * p);
    }
    // the letter slides up over the card on "police"
    const four = m('four');
    hide(d1, four - .2, .2);
    dateTag(p, '3 January 2020', four + .1);
    const doc_ = G(p, { x: 1090, y: 1400, r: 4, s: .58 });
    mk('rect', { x: -330, y: -400, width: 660, height: 800, fill: '#efe9da' }, doc_);
    T(doc_, '训 诫 书', { x: 0, y: -315, size: 52, fill: '#2a2521', font: '"Songti SC", "Noto Serif CJK SC", serif', weight: 600, anchor: 'middle' });
    T(doc_, 'LETTER OF ADMONITION', { x: 0, y: -270, size: 22, fill: '#6a6258', font: KEY, weight: 500, anchor: 'middle' }).setAttribute('letter-spacing', '.2em');
    const R2 = rng(3);
    for (let i = 0; i < 12; i++) if (i !== 5) mk('rect', { x: -270, y: -210 + i * 34, width: 380 + R2() * 160, height: 12, rx: 4, fill: '#c9c1b0' }, doc_);
    const hl = mk('rect', { x: -282, y: -48, width: 0, height: 44, fill: YEL, opacity: .85 }, doc_);
    T(doc_, '“publishing untrue statements”', { x: -270, y: -16, size: 33, fill: '#2a2521', font: SER, weight: 500 }).setAttribute('font-style', 'italic');
    T(doc_, 'signed:', { x: 20, y: 300, size: 22, fill: '#6a6258', font: SER });
    const sig = path(doc_, 'M90 300c20-40 30-40 34-10s10 20 26-14 20-30 24 0 14 24 34-6c12-18 30-10 40 4', { stroke: '#1d3f8a', 'stroke-width': 4 }, { d: 0 });
    tw(doc_, { y: 450, r: -2 }, four - .25, .45, out);
    hide(card, four + .2, .01);
    sfx('message', four - .25, 'page', .9);
    tw(doc_, { s: .62 }, four + .2, m('eight') - four - .6, lin);
    draw(sig, m('sign'), .9, lin);
    prog(q => hl.setAttribute('width', 600 * q), m('untrue') - .3, .6, io);
    // one of eight: the letter goes, seven more badges ring Wuhan
    tw(doc_, { x: 1500, y: 1300, r: 12 }, m('eight') - .45, .45, p => p * p);
    hide(nm, m('eight') - .4, .2);
    for (let i = 0; i < 7; i++) {
      const a = (-90 + i * (360 / 7)) * Math.PI / 180;
      liChip(pin, Math.cos(a) * 215, Math.sin(a) * 215, 50, m('eight') + .15 + i * .07, { img: `doctor-${i + 1}` });
    }
    tw(chip, { s: .7 }, m('eight') - .2, .4, io);
    key(p, '8 doctors', 1110, 430, m('eight') + .4, { size: 110 });
    tag(p, 'punished for “spreading rumours”', 1110, 490, m('eight') + .9, { anchor: 'middle', size: 32, fill: CREAM });
    tag(p, 'the other seven: AI illustrations', 1110, 525, m('eight') + .9, { anchor: 'middle', size: 18 });
  }],

  // 3. Meanwhile, on the same map, the cases double
  ['double', 'Doubling', (m, D) => {
    const p = panel(0);
    ground(p, MAPSEA);
    const end = { ...VIEW_LI, z: ZL * 1.07 };
    const M = paperMap(p, D + HOLD, end), cam = M.cam;
    paperTop(p, .4);
    caseDots(M.marks);
    // what the last beat left: the shade, the badges, the words; they clear as the camera pulls out
    const left = G(p, {});
    mk('rect', { x: 0, y: 0, width: SW, height: SH, fill: '#0b0d11', opacity: .55 }, left);
    const pin = G(left, {}), [bx, by] = cam.screen(0, 0, 0); put(pin, { x: bx, y: by });
    liChip(G(pin, { s: .7 }), 0, 0, 110, -1);   // scaled from outside: liChip's own pop-in tween sets its s to 1
    for (let i = 0; i < 7; i++) { const a = (-90 + i * (360 / 7)) * Math.PI / 180; liChip(pin, Math.cos(a) * 215, Math.sin(a) * 215, 50, -1, { img: `doctor-${i + 1}` }); }
    T(left, '8 DOCTORS', { x: 1110, y: 430, size: 110, fill: CREAM, font: KEY, weight: 600, anchor: 'middle' }).setAttribute('letter-spacing', '.02em');   // as key() drew it
    for (const [str, y, size, fill] of [['punished for “spreading rumours”', 490, 32, CREAM], ['the other seven: AI illustrations', 525, 18, SOFT]])
      T(left, str, { x: 1110, y, size, fill, font: SER, anchor: 'middle' }).setAttribute('font-style', 'italic');   // the last beat's tags, as tag() drew them
    tw(left, { o: 0 }, .05, .4, lin);
    cam.to({ x: 2, y: 0, z: 3 }, .2, D + .2, soft);
    // generations: a red stain whose area doubles at each one (the first cases' dots under it); every size it leaves
    // stays as a thin ring, like a tree's
    const times = [m('d1'), m('d2'), m('d2') + .55, m('d2') + 1.05, m('week') - .15, m('week') + .35, m('week') + .8, D - .35];
    const rOf = g => 7 * 2 ** ((g + 1) / 2);
    const stain = put(mk('circle', { cx: 1, cy: 0, r: rOf(-1), fill: RED, 'fill-opacity': .28, stroke: RED, 'data-sw': 2.5 }, M.marks), { o: 0 });
    tw(stain, { o: 1 }, times[0] - .15, .15, lin);
    times.forEach((t, g) => {
      const r0 = rOf(g - 1), r1 = rOf(g);
      prog(q => stain.setAttribute('r', r0 + (r1 - r0) * q), t, .3, back);
      tw(put(mk('circle', { cx: 1, cy: 0, r: r0, fill: 'none', stroke: RED, 'data-sw': 1.2 }, M.marks), { o: 0 }), { o: .6 }, t, .05, lin);
    });
    // the count and the date, from the later studies
    const box = G(p, { x: 1180, y: 120, o: 0 });
    mk('rect', { x: 0, y: 0, width: 360, height: 150, rx: 14, fill: '#1b1e24', opacity: .92 }, box);
    T(box, 'PEOPLE WITH SYMPTOMS', { x: 24, y: 40, size: 20, fill: '#aeb4bd', font: KEY, weight: 500 }).setAttribute('letter-spacing', '.14em');
    const num = T(box, '266', { x: 24, y: 112, size: 72, fill: RED, font: KEY, weight: 600 });
    tw(box, { o: 1 }, m('d1') - .3, .25);
    prog(q => { num.textContent = Math.round(266 * (6174 / 266) ** q).toLocaleString('en-US'); }, m('d1'), D - m('d1') - .2, lin);
    tag(p, 'Hubei, counted afterwards: 266 by 31 December, 6,174 by 20 January', 1540, 300, m('d1') + .4, { anchor: 'end', size: 22, fill: MAPINK });
    const dt = dateTag(p, '31 December 2019', m('d1') - .2, { fill: MAPINK }), dtx = dt.lastChild;
    const day0 = Date.parse('2019-12-31'), day1 = Date.parse('2020-01-20');
    prog(q => { dtx.textContent = new Date(day0 + Math.round(q * 20) * 864e5).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase(); }, m('d1'), D - m('d1') - .2, lin);
    const band = mk('rect', { x: 0, y: 790, width: SW, height: 100, fill: '#0b0d11', opacity: 0 }, p); tw(band, { o: .85 }, m('week') - .2, .3);
    key(p, 'Cases double every 7½ days', 800, 860, m('week') - .05, { size: 60, fill: CREAM });
    whipOut(p, D, 1, 'y');
  }],

  // 4. The migration, the order, the rewind: they left before the gates closed
  ['migration', 'New Year', (m, D) => {
    const p = panel(0);
    ground(p, MAPSEA);
    const all = G(p, {});
    const M = paperMap(all, D + HOLD, { x: -150, y: -40, z: .62 }, { rails: true }), cam = M.cam;
    paperTop(all, .4);
    whipIn(all, -1, 'y');
    const dj = dateTag(all, 'January 2020', .4, { fill: MAPINK });
    cam.to({ x: -120, y: -25, z: .68 }, .4, m('rails') - .4, lin);
    const ny = key(all, 'Chinese New Year', 800, 150, m('ny') - .1, { size: 84, fill: MAPINK });
    const ny2 = tag(all, 'the largest annual human migration in the world', 800, 195, m('migr') - .1, { anchor: 'middle', size: 30, fill: MAPINK });
    [ny, ny2].forEach(e => hide(e, m('rails') - .4, .4));
    // people on the move: short trails between cities, then all of them drawn to Wuhan on "middle"
    const R = rng(21), cities = ['Wuhan', ...CN].map(C);
    const trips = [...Array(220)].map(() => [cities[Math.floor(R() * cities.length)], cities[Math.floor(R() * cities.length)], R(), .22 + R() * .3]).filter(([a, b]) => a !== b);
    const movers = G(M.marks, { o: 0 });
    const mv = trips.map(() => mk('path', { d: '', stroke: MAPINK, 'data-sw': 2.4 }, movers));
    const tC = m('rails') - .4;
    clockRun(t => trips.forEach(([a, b, ph, v], i) => {
      const pos = tt => { const q = (ph + tt * v) % 1; return [a[0] + (b[0] - a[0]) * q, a[1] + (b[1] - a[1]) * q]; };
      let [x, y] = pos(t), [x0, y0] = pos(t - .25);
      if (Math.hypot(x - x0, y - y0) > 200) [x0, y0] = [x, y];   // the wrap from b back to a
      const k = smooth01(span01(t, tC, tC + 1));                   // drawn in to Wuhan
      x *= 1 - k; y *= 1 - k; x0 *= 1 - k; y0 *= 1 - k;
      mv[i].setAttribute('d', `M${x0.toFixed(1)} ${y0.toFixed(1)}L${x.toFixed(1)} ${y.toFixed(1)}`);
    }), D, { tail: true });
    tw(movers, { o: .8 }, m('migr') - .5, .5); hide(movers, tC + .9, .3);
    M.rail.forEach((e, i) => prog(q => e.setAttribute('opacity', q), tC + .8 + i * .05, .25, lin));
    const cds = CN.map(n => cityDot(M.marks, C(n), 5, .7));
    clockRun(t => { const z = cam.at(t).z; cds.forEach(c => c.setAttribute('r', 5 / z)); }, D, { tail: true });
    const wu = mk('circle', { r: 9, fill: RED }, M.marks);
    clockRun(t => wu.setAttribute('r', 9 / Math.max(1, cam.at(t).z)), D, { tail: true });
    // the order at 2 a.m.: push in, the clock runs to ten, the ring closes
    cam.to({ x: 0, y: 0, z: 2.4 }, tC + .9, 2, soft);
    hide(dj, m('two') - .25, .2);
    dateTag(all, '23 January 2020 · 2 a.m.', m('two'), { fill: MAPINK });
    const ring = mk('circle', { r: 46, fill: 'none', stroke: RED, 'data-sw': 5, pathLength: 1, 'stroke-dasharray': '1 1', 'stroke-dashoffset': 1, transform: 'rotate(-90)' }, M.marks);
    const clk = G(all, { x: 1380, y: 200, o: 0 });
    mk('circle', { r: 92, fill: '#f6f1e4', stroke: MAPINK, 'stroke-width': 4 }, clk);
    for (let h = 0; h < 12; h++) mk('path', { d: `M0 -80V${h % 3 ? -70 : -62}`, stroke: MAPINK, 'stroke-width': h % 3 ? 3 : 5, transform: `rotate(${h * 30})` }, clk);
    const sweep = mk('path', { d: '', fill: RED, opacity: .3 }, clk);
    const hand = G(clk, { r: 60 }); mk('path', { d: 'M0 10V-66', stroke: MAPINK, 'stroke-width': 6 }, hand);
    mk('circle', { r: 7, fill: MAPINK }, clk);
    const dig = T(clk, '02:00', { x: 0, y: 140, size: 40, fill: MAPINK, font: KEY, weight: 600, anchor: 'middle' });
    tw(clk, { o: 1 }, m('two') - .2, .3);
    const hb = blurOn(clk, 'x');
    const setClock = h => {
      const a = h * 30, r = 86, A = (a - 90) * Math.PI / 180;
      put(hand, { r: a });
      sweep.setAttribute('d', h <= 2.01 ? '' : `M0 0L${r * Math.cos(-Math.PI / 6)} ${r * Math.sin(-Math.PI / 6)}A${r} ${r} 0 ${a - 60 > 180 ? 1 : 0} 1 ${r * Math.cos(A)} ${r * Math.sin(A)}Z`);
      dig.textContent = `${String(Math.floor(h)).padStart(2, '0')}:${String(Math.floor((h % 1) * 60)).padStart(2, '0')}`;
      ring.setAttribute('stroke-dashoffset', 1 - (h - 2) / 8);
    };
    // first pass: 2 → 10 by "ten"; the rewind on "Before"; second pass with the trains, closing at the end
    const a0 = m('two') + .3, a1 = m('ten') + .3, r0 = m('before') - .25, r1 = r0 + .5, b1 = D - .15;
    prog(q => setClock(2 + 8 * q), a0, a1 - a0, lin);
    prog(q => { setClock(10 - 8 * soft(q)); hb(Math.sin(Math.PI * q) * 14); }, r0, r1 - r0, lin);
    prog(q => setClock(2 + 8 * q), r1, b1 - r1, lin);
    chipLabel(all, '10:00 · everything stops', 1530, 400, m('ten'), { fill: RED, size: 30, anchor: 'end' });
    const rw = chipLabel(all, '◀◀ before 10:00', 1530, 440, r0, { fill: MAPINK, size: 26, anchor: 'end' });
    // the trains leave during the second pass and freeze where they are when the ring closes
    const fd = EXO.map(() => trainMk(M.marks));
    clockRun(t => {
      const z = cam.at(t).z, tt = Math.min(t, b1);
      EXO.forEach(([n, ph, v], i) => {
        const L = exoLaunch(r1, ph), q = Math.min(1, Math.max(0, (tt - L) * v)), [x, y] = C(n);
        trainAt(fd[i], x * q, y * q, z, tt > L && q < 1, tt > L);
      });
    }, D, { tail: true });
    cam.to({ x: -60, y: -10, z: 1.05 }, r1 + .2, b1 - r1 - .2, soft);
    counter(all, 800, 820, 0, 300000, m('k300') - .2, 1.6, { size: 96, fill: MAPINK, font: KEY, weight: 600 });
    tag(all, 'left Wuhan by train before 10 a.m.', 800, 860, m('k300') + .5, { anchor: 'middle', size: 28, fill: MAPINK });
  }],

  // 5. Locked, too late: the frozen trains arrive; the world; the doctor
  ['gone', 'Gone', (m, D) => {
    const p = panel(0);
    ground(p, NIGHT);
    const but = m('but'), t0g = but + 1.3;
    const glob = G(p, { o: 0 });
    const list = SPREAD.filter(s => s[3] <= '2020-02-29' && s[0] !== 'China');
    // the date steps a week at a time; each country lights on its week
    const weeks = ['2020-01-23', '2020-01-30', '2020-02-06', '2020-02-13', '2020-02-20', '2020-02-29'], tD0 = t0g + .25, wk = (m('every') - tD0) / (weeks.length - 1);
    const wOf = s => Math.max(0, weeks.findIndex(w => s[3] <= w)), tOf = s => tD0 + wOf(s) * wk;
    Globe.clearMarks();
    list.forEach(s => Globe.dot(s[1], s[2])); list.slice(0, 40).forEach(s => Globe.arc(WUHAN_LL, [s[1], s[2]]));
    const H0 = HofZ(.62), H1 = 1.12, tilt0 = m('butone') - 1.1, tilt1 = m('butone');
    globeShot(glob, D, t => {
      const q = soft(span01(t, t0g, m('feb') + .4)), s = soft(span01(t, tilt0, tilt1));
      return { lon: WUHAN_LL[0] - 110 * q, lat: WUHAN_LL[1] - 18 * q - 50 * s, H: H0 * (H1 / H0) ** unease3(span01(t, t0g, t0g + 1.3)), gain: 1.4, dotScale: .045 };
    }, (i, t) => span01(t, tOf(list[i]), tOf(list[i]) + .2), (i, t) => span01(t, tOf(list[i]) - .1, tOf(list[i]) + .45));
    // the map, exactly where the last beat left it; the frozen trains move again and reach the cities
    const mp = G(p, {}), M = paperMap(mp, D + HOLD, { x: -60, y: -10, z: 1.05 }, { rails: true }), cam = M.cam;
    M.rail.forEach(e => e.setAttribute('opacity', 1));
    paperTop(mp, .4);
    const cds = CN.map(n => cityDot(M.marks, C(n), 5, 1.05));
    clockRun(t => { const z = cam.at(t).z; cds.forEach(c => c.setAttribute('r', 5 / z)); }, D, { tail: true });
    mk('circle', { r: 46, fill: 'url(#hatch)', stroke: RED, 'data-sw': 5, 'fill-opacity': 0 }, M.marks);
    const lockFill = M.marks.lastChild;
    const Tm = TIMINGS.migration, mb1 = Tm.dur - .15, mr1 = Tm.marks.before - .25 + .5;   // the last beat's freeze, in its own clock
    const fd = EXO.map(([n, ph, v], i) => {
      const L = exoLaunch(mr1, ph), q0 = Math.max(0, Math.min(1, (mb1 - L) * v)), ta = but + .05 + ph * .9;
      return { n, q0, ta, launched: mb1 > L, e: trainMk(M.marks) };
    });
    clockRun(t => {
      const z = cam.at(t).z;
      fd.forEach(f => {
        if (!f.launched) return;
        const q = f.q0 + (1 - f.q0) * span01(t, 0, f.ta), [x, y] = C(f.n);
        trainAt(f.e, x * q, y * q, z, q < 1, true);
      });
    }, D, { tail: true });
    cam.to({ z: .95 }, 0, m('locks'), lin);
    // "Wuhan locks down": the slam on the word
    prog(q => lockFill.setAttribute('fill-opacity', q), m('locks'), .2, lin);
    cam.shake(7, m('locks'), .45);
    // a news print drops beside the ring: the Yangtze bridge, empty, six days in
    const ph = G(mp, { x: 1230, y: 380, r: -3, s: 1.05, o: 0 });
    mk('rect', { x: -296, y: -228, width: 592, height: 476, fill: '#f6f1e4' }, ph);
    mk('image', { href: '../img/wuhan-bridge-empty.webp', x: -280, y: -212, width: 560, height: 420 }, ph);
    T(ph, 'Wuhan, 29 January 2020 · photo 汮汐, CC BY-SA 4.0, toned', { x: -280, y: 234, size: 18, fill: MAPINK, font: SER });
    tw(ph, { s: .85, o: 1 }, m('locks') + .05, .16, out);
    hide(ph, but - .3, .3);
    tag(mp, 'Wuhan, then all of Hubei: about 57 million people', 800, 860, m('locks') + .6, { anchor: 'middle', size: 28, fill: MAPINK });
    // "But the virus has already left": each city lights as the first train reaches it
    cam.to({ x: 0, y: 0, z: .62 }, but - .1, 1.2, soft);
    CN.forEach(n => {
      const ts = fd.filter(f => f.n === n && f.launched && f.q0 < 1).map(f => f.ta), t = ts.length ? Math.min(...ts) : but + .9, [x, y] = C(n);
      const d = mk('circle', { cx: x, cy: y, r: 0, fill: RED }, M.marks), r = mk('circle', { cx: x, cy: y, r: 0, fill: 'none', stroke: RED, 'data-sw': 2 }, M.marks);
      prog(q => d.setAttribute('r', 12 * q), t, .2, back);
      prog(q => { r.setAttribute('r', 12 + 50 * q); r.setAttribute('opacity', 1 - q); }, t, .7, out);
    });
    // the paper map gives way to the night globe in the fastest moment of the pull-out
    tw(glob, { o: 1 }, t0g - .05, .01); hide(mp, t0g, .18, lin);
    const dl = dateTag(p, '23 January 2020', t0g + .2), txt = dl.lastChild;
    const fmtD = w => new Date(Date.parse(w)).toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }).toUpperCase();
    weeks.forEach((w, i) => prog(() => { txt.textContent = fmtD(w); }, tD0 + i * wk, 0, lin));
    const cnt = T(p, '0', { x: 1530, y: 98, size: 64, fill: RED, font: KEY, weight: 600, anchor: 'end', o: 0 });
    tw(cnt, { o: 1 }, tD0, .2);
    weeks.forEach((w, i) => prog(() => { cnt.textContent = String(list.filter(s => wOf(s) <= i).length); }, tD0 + i * wk, 0, lin));
    const cntTag = tag(p, 'countries with cases', 1530, 136, tD0 + .3, { anchor: 'end', size: 24, fill: CREAM });
    const owid = tag(p, 'data: Our World in Data, CC BY 4.0', 1530, 162, tD0 + .3, { anchor: 'end', size: 16 });
    const ant = chipLabel(p, 'Antarctica: not until December 2020', 800, 830, tilt1 - .15, { size: 30, anchor: 'middle' });
    // the old-TV switch-off: the world squashes to a line, the line to a point, then black
    const tv = G(p, {}); p.insertBefore(tv, glob); tv.appendChild(glob); [cnt, cntTag, owid, dl, ant].forEach(e => tv.appendChild(e));
    const tOff = m('lw') - .45;
    prog(q => tv.setAttribute('transform', `translate(800 450) scale(${1 - .98 * q * q},${Math.max(.004, 1 - q)}) translate(-800 -450)`), tOff, .14, lin);
    prog(q => tv.setAttribute('transform', `translate(800 450) scale(${.02 * (1 - q) + .001},.004) translate(-800 -450)`), tOff + .14, .1, lin);
    const flash = mk('rect', { x: 0, y: 447, width: SW, height: 6, fill: '#fff', opacity: 0 }, p);
    prog(q => flash.setAttribute('opacity', Math.sin(Math.PI * q)), tOff + .08, .22, lin);
    // Li Wenliang, over black
    const L = G(p, { o: 0 });
    ground(L, '#000');
    tw(L, { o: 1 }, m('lw') - .2, .01, lin);
    const chip = liChip(L, 800, 380, 150, m('died') - .5);
    tw(chip, { s: 1.06 }, m('died'), D - m('died') + 1.5, lin);
    key(L, 'Li Wenliang', 800, 640, m('died') - .2, { size: 72 });
    tag(L, '1985 – 2020', 800, 690, m('feb7') + .2, { anchor: 'middle', size: 32, fill: CREAM });
    dateTag(L, '7 February 2020', m('feb7') - .2);
    hide(L, D + 1.4, 1.6, lin);
  }, { pre: 1.6 }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// the lockdown hatching (world px) and an arrowhead
(() => {
  const pt = mk('pattern', { id: 'hatch', width: 6, height: 6, patternUnits: 'userSpaceOnUse', patternTransform: 'rotate(45)' }, DEFS);
  mk('rect', { width: 6, height: 6, fill: RED, opacity: .18 }, pt);
  mk('path', { d: 'M0 0V6', stroke: RED, 'stroke-width': 2.4 }, pt);
  const mkr = mk('marker', { id: 'arrowR', viewBox: '0 0 10 10', refX: 6, refY: 5, markerWidth: 5, markerHeight: 5, orient: 'auto-start-reverse' }, DEFS);
  mk('path', { d: 'M0 0L10 5L0 10Z', fill: RED }, mkr);
})();

window.MUSIC_UP_IN_PRE = ['open'];
// One track for the whole film, never stopped; ?bgm= sets its level by ear (gain under the ducking to 30 %)
music('audio/bgm/theme.mp3', BEATS.map(b => b.id), +(new URLSearchParams(location.search).get('bgm') || .6), 0);

Promise.all([...['600 40px Oswald', '500 40px Oswald', '700 40px Oswald', 'italic 400 40px "EB Garamond"', '400 40px "EB Garamond"', '500 40px "EB Garamond"']
  .map(f => document.fonts.load(f)), import('../lib/globe.js'), new Promise(r => { (function w() { window.GLOBE_READY ? r() : setTimeout(w, 30); })(); })])
  .then(boot);
</script>
