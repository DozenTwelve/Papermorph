<script>
'use strict';
const CHAPTER = { number: 1, title: 'Madness and Civilization', minutes: 10, language: 'en' };

const OPEN_PRE = 5;

// the confined, one figure per word (inmates), then small in the lower half (idle); without m, all shown at once
const INMATES = [['beg', 'beggars', 'callot1'], ['unemp', 'the unemployed', 'callot2'], ['vag', 'vagrants', 'callot3'],
  ['pros', 'prostitutes', 'callot4'], ['blas', 'blasphemers', 'callot1'], ['old', 'the old', 'callot2'], ['mad', 'the mad', 'fool-1656']];
const ROW_SMALL = { s: .55, x: 800 * .45, y: 735 - 470 * .55 };   // scaled about the stage origin: centre (800, 470) lands at (800, 735)
function inmatesRow(p, m) {
  const row = G(p, {});
  INMATES.forEach(([mark, label, img], i) => {
    const x = 130 + i * 223, t0 = m ? m(mark) - .2 : undefined;
    const g = pic(row, img, { x, y: 470, h: 400, ...(m ? { at: t0, from: [0, 60], dur: .6 } : {}) });
    if (i === 4 || i === 5) g.firstChild.setAttribute('transform', 'scale(-1,1)');
    const l = T(row, label, { x, y: 760, size: 32, fill: i === 6 ? HOT : CREAM, font: SER, anchor: 'middle', o: m ? 0 : 1 });
    l.setAttribute('font-style', 'italic');
    if (m) show(l, m(mark), .5);
  });
  return row;
}

/* ---------- beats ---------- */
const BEATS = [
  // 0. Cold open
  ['open', 'A town and its madmen', (m, D) => {
    const p = panel(0), P0 = OPEN_PRE;   // P0 s of music and title before the first line
    const ti = key(p, 'Madness and Civilization', 800, 420, .5, { size: 96 });
    const su = tag(p, 'after Michel Foucault, 1961', 800, 490, 1.6, { anchor: 'middle', size: 32, fill: CREAM });
    hide(ti, P0 - .9, .6); hide(su, P0 - .9, .6);
    pic(p, 'town', { x: 800, y: 760, w: 1500, at: P0 - .6, from: [0, 120], dur: 1.2 });
    say(p, ['Imagine a town that no longer wants its madmen.'], 800, 250, P0 + .2, P0 + 2.9, { size: 52, anchor: 'middle' });
    const f = pic(p, 'fool', { x: 760, y: 640, h: 200, at: m('mad'), from: [0, 30] });
    say(p, ['What does it do with them?'], 800, 340, m('do') - 1, m('do') + .8, { size: 52, anchor: 'middle', fill: HOT });
    tw(f, { x: 1700 }, m('do') + .4, D - m('do') + .4, io);
  }, { pre: OPEN_PRE }],
  ['bosch', 'Bosch', (m, D) => {
    const p = panel(0);
    const b = pic(p, 'bosch', { x: 620, y: 470, h: 800, at: .1, from: [0, 900], dur: 1.2 });
    push(b, 1.3, D + .6, 1.08, 0, -30);
    tag(p, 'Hieronymus Bosch, The Ship of Fools, c. 1500', 1080, 820, m('bosch'));
    key(p, 'Put them in a boat.', 1300, 360, m('boat'), { size: 60 });
    key(p, 'Let them drift.', 1300, 450, m('drift'), { size: 60, fill: HOT });
  }],
  ['foucault', 'Michel Foucault', (m, D) => {
    const p = panel(0);
    dateChip(p, '1950s', 'Paris');
    traced(p, 'mf-front', { x: 1130, y: 500, h: 760, at: m('mf') - .6, draw: 4.2 });
    key(p, 'Michel Foucault', 80, 380, m('mf') + .2, { size: 84, anchor: 'start' });
    tag(p, '1926 – 1984', 84, 430, m('mf') + .8, { size: 30 });
    tag(p, 'psychologist at a psychiatric hospital in Paris', 84, 490, m('hosp'), { size: 30, fill: CREAM });
    say(p, ['who may speak,', 'and who is only spoken about'], 84, 600, m('about') - 2.6, m('about') + .9, { size: 46, fill: SOFT });
  }],
  ['uppsala', 'Uppsala', (m, D) => {
    const p = panel(0);
    dateChip(p, '1955', 'Uppsala, Sweden', m('upp') - .2);
    const g = traced(p, 'mf-glass', { x: 1180, y: 480, h: 560, at: .1 });
    const ds = [['city accounts', -7, 330, 380], ['royal edicts', 5, 560, 470], ['hospital registers', -3, 420, 600]]
      .map(([l, r, x, y], i) => { const t = m('edicts') - 1.6 + i * .9; sfx('uppsala', t + .2, 'page', .5); return doc(p, l, x, y, r, t, 3 + i); });
    ds.forEach(d => leave(d, m('title') - .9, -200, 0));
    hide(g, m('title') - .9, .6);
    key(p, 'Madness and Civilization', 800, 440, m('title') - .1, { size: 100 });
    tag(p, 'Michel Foucault · Histoire de la folie, 1961', 800, 510, m('title') + .6, { size: 30, anchor: 'middle' });
  }],
  ['preface', 'Two sentences', (m, D) => {
    const p = panel(0);
    key(p, 'The preface', 800, 300, .2, { size: 70, fill: SOFT });
    say(p, ['two sentences'], 800, 380, 1.4, 2.4, { size: 50, anchor: 'middle' });
    [...p.children].forEach(e => hide(e, m('pascal') - .6, .4));
    epigraph(p, 'pascal', 'Blaise Pascal, Pensées', PASCAL, m('pascal') - .3, m('q1'), m('fd') - .7, m('fd') - .6);
    epigraph(p, 'dosto', 'Fyodor Dostoevsky, Diary of a Writer', DOSTO, m('fd') - .1, m('q2'), D - .3);
  }],
  ['thesis', 'The sane and the mad', (m, D) => {
    const p = panel(0);
    const top = tag(p, 'Pascal', 800, 115, 0, { anchor: 'middle', size: 34, fill: SOFT });
    const bot = tag(p, 'Dostoevsky', 800, 835, 0, { anchor: 'middle', size: 34, fill: SOFT });
    const r1 = line(p, 'M300 140H1300', .4, .9, 2, { opacity: .6 }), r2 = line(p, 'M300 790H1300', .6, .9, 2, { opacity: .6 });
    const C = TIMINGS.thesis.cues;
    const mi = key(p, 'A history of mental illness', 800, 470, C[1][0] + .2, { size: 74 });
    const ms = strike(p, mi, 800, 470, C[1][0] + 2, 74);
    hide(mi, C[2][0] - .3, .5); hide(ms, C[2][0] - .3, .5);
    const a = key(p, 'The sane', 540, 470, m('sane'), { size: 110 });
    const b = key(p, 'The mad', 1060, 470, m('mad'), { size: 110, fill: HOT });
    const l = line(p, 'M800 360V500', m('sane') + .6, .6, 3);
    [a, b, l, top, bot, r1, r2].forEach(e => hide(e, C[3][0] - .2, .6));
    // the timeline the fool will walk
    line(p, 'M240 860H1360', C[3][0] + .2, 1.2, 2, { opacity: .6 });
    [['1400', 240], ['1500', 470], ['1656', 760], ['1790', 1020], ['1889', 1360]].forEach(([y, x], i) =>
      tag(p, y, x, 840, C[3][0] + .4 + i * .2, { anchor: 'middle', size: 22 }));
    pic(p, 'fool', { x: 300, y: 560, h: 520, at: m('fool') - .4, from: [0, 30], dur: .8 });
  }],

  // 1. The empty leper house
  ['lepers', 'Leper houses', (m, D) => {
    const p = panel(0);
    dateChip(p, 'c. 1200', 'Leper houses');
    pic(p, 'leper', { x: 320, y: 480, h: 560, r: -2, at: .3, from: [-500, 0] });
    const ds = europe(p, .4);
    ds.el.forEach((e, i) => show(e, m('houses') + (i / ds.el.length) * 2.2, .3));
    key(p, '19,000', 1090, 790, m('n'), { size: 120, fill: HOT });
    tag(p, 'leper houses in Christendom, by one medieval count', 1090, 840, m('n') + .5, { anchor: 'middle' });
  }],
  ['outside', 'Outside the walls', (m, D) => {
    const p = panel(0);
    pic(p, 'town', { x: 620, y: 700, w: 1200, at: .1, from: [0, 60] });
    const lep = pic(p, 'leper', { x: 620, y: 470, h: 360, at: .3 });
    tw(lep, { x: 1340 }, m('walls'), 1.6, io);
    pic(p, 'clapper', { x: 1340, y: 760, h: 170, r: -10, at: m('clap'), from: [0, 30] });
    key(p, 'clack', 1480, 680, m('clap') + .3, { size: 44, fill: HOT });
    sfx('outside', m('clap') + .2, 'clack', .9); sfx('outside', m('clap') + .55, 'clack', .7); sfx('outside', m('clap') + 1.6, 'bell', .45);
  }],
  ['empty', 'Leprosy fades', (m, D) => {
    const p = panel(0);
    const ds = europe(p, 0);
    put(ds.g, { o: 1 });
    ds.el.forEach(e => put(e, { o: 1 }));
    const R = rng(11);
    ds.el.forEach(e => hide(e, m('fade') + R() * 2.4, .4));
    pic(p, 'leper-house', { x: 430, y: 470, h: 480, r: 2, at: .2, from: [-500, 0] });
    key(p, 'Empty', 1090, 470, m('emptied'), { size: 120 });
  }],
  ['remain', 'The place of exclusion', (m, D) => {
    const p = panel(0);
    const C = TIMINGS.remain.cues;
    const h = pic(p, 'leper-house', { x: 640, y: 430, h: 560 });
    push(h, 0, D + .6, 1.06, 0, 10);
    tag(p, 'the buildings remained', 640, 790, m('bld'), { anchor: 'middle', size: 34, fill: CREAM });
    say(p, ['and the habit of mind that built them'], 640, 850, C[2][0] + .2, C[2][0] + 2.2, { size: 40, anchor: 'middle', fill: SOFT });
    const lep = pic(p, 'leper', { x: 1300, y: 450, h: 300, at: C[2][0] + 1.5, from: [0, 30] });
    const hand = pic(p, 'hand', { x: 1080, y: 420, h: 130, at: m('push') - .6, from: [-160, 0], dur: .6 });
    tw(hand, { x: 1260 }, m('push') + .1, .35, io);
    tw(lep, { x: 1850, r: 8 }, m('push') + .25, .9, io);
    hide(hand, m('push') + 1.4, .5);
    tw(h, { o: .3 }, m('wait'), 1.2);
    say(p, ['Who would fill it?'], 800, 460, m('who'), m('who') + 1.2, { size: 84, anchor: 'middle', fill: CREAM });
  }],

  // 2. The Ship of Fools
  ['float', 'The answer floated', (m, D) => {
    const p = panel(0);
    dateChip(p, '1494', 'The Ship of Fools');
    water(p, 690, D + 1);
    const b = pic(p, 'fool-boat', { x: 800, y: 560, h: 380, at: .1, from: [-1100, 0], dur: 2.6 });
    bob(b, D + 1);
    key(p, 'The Ship of Fools', 800, 300, m('ship'), { size: 110 });
  }],
  ['brant', 'Brant', (m, D) => {
    const p = panel(0);
    pic(p, 'brant-title', { x: 300, y: 450, h: 640, r: -3, at: m('brant') - .3, from: [0, 700], dur: 1 });
    sfx('brant', m('brant') + .2, 'page', .5);
    tag(p, 'Sebastian Brant, Das Narrenschiff, Basel 1494', 300, 820, m('brant') + 1, { anchor: 'middle', size: 26 });
    const w = pic(p, 'nar-1549', { x: 1040, y: 470, w: 960, r: 2, at: m('greedy') - 1.7, from: [0, 700], dur: .9 });
    sfx('brant', m('greedy') - 1.3, 'page', .5);
    // a close-up on each fool as he is named (points measured on a grid over the woodcut)
    closeups(p, w, 'nar-1549', [['greedy', .12, .34, 'the greedy', 3.4], ['vain', .48, .44, 'the vain', 3.4],
      ['drunk', .69, .37, 'the drunk', 3.4], ['idle', .89, .34, 'the idle', 3.4]], m, m('idle') + .9, { x: 1040, y: 470, r: 2 });
    // the section ends on the fools' giggle (ElevenLabs v4 'callum', first 2 s; books/madness/voices/laugh): the beat runs on
    // past the narration so the effect finishes before the next beat cuts it
    sfx('brant', D + .1, 'laugh-jester', .9);
    prog(() => {}, D, 1.6, lin);
    push(w, m('cuts') + .2, D + .6, 1.08, -20, 10);
  }],
  ['records', 'The real ships', (m, D) => {
    const p = panel(0);
    pic(p, 'rhine', { x: 560, y: 470, w: 1040, r: -1, at: .1, from: [-600, 0] });
    traced(p, 'mf-glass', { x: 1240, y: 520, h: 560, at: m('real') - .3, draw: 3.2 });
    dateChip(p, '1399', 'Frankfurt', m('ffm') - .2);
    const pin = G(p, { x: 510, y: 500, o: 0, s: 0 }); mk('circle', { r: 13, fill: HOT, stroke: CREAM, 'stroke-width': 3 }, pin);
    pop(pin, m('ffm'));
    const fl = G(p, { x: 510, y: 548, o: 0 }), fw = wid('FRANKFURT', 30, KEY, '', 600) + 30;   // on the light map: a band
    mk('rect', { x: -fw / 2, y: -28, width: fw, height: 40, fill: COL.board }, fl);
    T(fl, 'FRANKFURT', { y: 2, size: 30, font: KEY, weight: 600, fill: CREAM, anchor: 'middle' });
    show(fl, m('ffm') + .3, .4);
    tag(p, 'sailors paid to take a madman away', 560, 800, m('away') - .4, { anchor: 'middle', fill: CREAM, size: 32 });
    const route = [[520, 492], [600, 468], [690, 440], [760, 405], [790, 350], [840, 250]];
    line(p, 'M' + route.map(q => q.join(' ')).join('L'), m('down'), 2.4, 5, { 'stroke-dasharray': '10 12', stroke: HOT });
    const b = pic(p, 'fool-boat-ink', { x: 520, y: 470, h: 90, at: m('down') - .4, from: [0, 0], dur: .4 });
    prog(q => { const [x, y] = along(route, q); put(b, { x, y: y - 26 }); }, m('down'), D - m('down') + .4, io);
  }],
  ['passage', 'Prisoner of the passage', (m, D) => {
    const p = panel(0);
    const C = TIMINGS.passage.cues;
    water(p, 650, D + 1);
    pic(p, 'town', { x: 160, y: 600, w: 700, at: .1, from: [-300, 0] });
    pic(p, 'town', { x: 1440, y: 600, w: 700, at: .1, from: [300, 0] });
    const b = pic(p, 'fool-boat', { x: 330, y: 560, h: 280, at: .3, from: [0, 0] });
    const t0 = C[2][0] + .4, t1 = m('land') - .2;
    bob(b, D + 1, 6, t => 330 + 470 * smooth01(span01(t, t0, t1)));
    const bars = pic(p, 'bars', { x: 800, y: 260, h: 200, at: C[1][0] - .1, from: [0, -30] });
    const nl = key(p, 'Not locked up', 800, 420, C[1][0] + .4, { size: 60 });
    tw(bars, { o: 0, y: 140 }, C[2][0], .6); hide(nl, C[2][0], .5);
    const sa = key(p, 'Sent away', 800, 300, C[2][0] + .2, { size: 64, fill: HOT });
    hide(sa, m('pris') - .5, .5);
    tag(p, 'land', 160, 700, m('land'), { anchor: 'middle', size: 34 });
    tag(p, 'water', 800, 790, m('land') + .4, { anchor: 'middle', size: 34 });
    tag(p, 'land', 1440, 700, m('land') + .8, { anchor: 'middle', size: 34 });
    say(p, ['“the prisoner of the passage”'], 800, 240, m('pris'), m('pris') + 1.6, { size: 74, anchor: 'middle' });
    peek(p, m('pris') - .6);
  }],
  ['water', 'Water', (m, D) => {
    const p = panel(0);
    water(p, 640, D + 1, { rows: 5, gap: 30, amp: t => 10 + 18 * smooth01(span01(t, m('unknown') - .3, m('unknown') + 1.5)) });
    const b = pic(p, 'fool-boat', { x: 980, y: 520, h: 300 });
    bob(b, D + 1, 9, t => 980 + 900 * smooth01(span01(t, m('carry') - .2, m('carry') + 3)));
    key(p, 'Washes', 120, 260, m('wash'), { size: 84, anchor: 'start' });
    key(p, 'Carries away', 120, 370, m('carry'), { size: 84, anchor: 'start' });
    key(p, 'The unknown', 120, 480, m('unknown'), { size: 84, anchor: 'start', fill: HOT });
  }],
  ['speaks', 'Madness speaks', (m, D) => {
    const p = panel(0);
    const g = G(p, {});
    const b = pic(g, 'fool-boat', { x: 620, y: 560, h: 300, at: .2, from: [-300, 0] });
    balloon(g, 780, 230, 360, 150, 700, 430, m('say') - .2);
    say(g, ['…'], 960, 320, m('say') + .3, m('say') + .3, { size: 60, anchor: 'middle' });
    tw(g, { o: 0, x: -200 }, m('lear') - .9, .6);
    pic(p, 'lear', { x: 440, y: 440, h: 600, r: -3, at: m('lear') - .4, from: [-600, 0] });
    tag(p, 'King Lear and his Fool', 440, 790, m('lear') + .5, { anchor: 'middle', size: 28 });
    pic(p, 'folly', { x: 1150, y: 440, h: 600, r: 3, at: m('folly') - .4, from: [600, 0] });
    tag(p, 'Erasmus, The Praise of Folly, 1511', 1150, 790, m('folly') + .5, { anchor: 'middle', size: 28 });
    say(p, ['and the wise look ridiculous'], 800, 860, m('rid'), m('rid') + 1.2, { size: 54, anchor: 'middle', fill: HOT });
  }],
  ['voice', 'Still talking', (m, D) => {
    const p = panel(0);
    const C = TIMINGS.voice.cues;
    const SING = 5.9;   // the fool's own line after the narrator (ElevenLabs v4 'callum'; books/madness/voices/fool/sings-a)
    water(p, 700, D + SING + 1);
    const b = pic(p, 'fool-boat', { x: 600, y: 580, h: 360 });
    bob(b, D + SING + 1, 5);
    key(p, 'Knowledge', 1180, 230, m('know'), { size: 90 });
    tag(p, 'a voice from the edge of the world', 1180, 290, m('know') + 1.5, { anchor: 'middle', size: 34, fill: CREAM });
    // punch in on the Fool's face as he drifts
    const cam = G(p, {}); cam.appendChild(b); p.insertBefore(cam, p.children[1]);
    tw(cam, { s: 1.9, x: -560, y: -420 }, C[1][0] - .4, 2.2, soft);
    balloon(p, 900, 330, 600, 250, 860, 470, m('talk') - .5);
    const s0 = D + .2;   // word times measured in the clip: "king" .14, "all" 1.78, "vanity" ends 2.74, cackle, "death" 4.34
    sfx('voice', s0, 'fool-sings', 2);
    say(p, ['the king is a fool!'], 1200, 400, s0, s0 + 1.1, { size: 50, anchor: 'middle' });
    say(p, ['all is vanity!'], 1200, 465, s0 + 1.75, s0 + 2.7, { size: 50, anchor: 'middle' });
    say(p, ['death laughs last!'], 1200, 530, s0 + 4.3, s0 + 5.1, { size: 50, anchor: 'middle', fill: HOT });
    prog(() => {}, D, SING + .3, lin);   // hold the picture while he sings
  }],

  // 3. The Great Confinement
  ['ashore', 'Ashore', (m, D) => {
    const p = panel(0);
    dateChip(p, '1656', 'The Great Confinement');
    line(p, 'M1000 900C1060 760 1160 690 1600 680', .1, 1);
    water(p, 720, D + 1, { len: 1150 });
    const b = pic(p, 'fool-boat', { x: 260, y: 600, h: 300 });
    tw(b, { x: 960 }, .2, m('ashore') + .2, io);
    tw(b, { r: -4 }, m('ashore') + .4, .25, out); tw(b, { r: 0 }, m('ashore') + .65, .5, io);
    sfx('ashore', m('ashore') + .4, 'thud', .8);
    // on land the woodcut fool becomes Callot's beggar-fool: the era changes
    const f = pic(p, 'fool-1656', { x: 1280, y: 480, h: 420, o: 0 });
    put(f, { o: 0 });
    show(f, m('ashore') + .6, 1.1, lin);
    tw(b, { o: .25 }, m('ashore') + .6, 1.1, lin);
  }],
  ['edict', 'The General Hospital', (m, D) => {
    const p = panel(0);
    const C = TIMINGS.edict.cues;
    pic(p, 'louis', { x: 330, y: 450, h: 720, r: -2, at: m('decree') - .3, from: [-500, 0] });
    tag(p, 'Louis XIV', 330, 850, m('decree') + .4, { anchor: 'middle' });
    pic(p, 'hg', { x: 1060, y: 330, w: 820, r: 2, at: m('hg') - .2, from: [500, 0] });
    tag(p, 'Hôpital Général, Paris, founded 1656', 1060, 590, m('hg') + .6, { anchor: 'middle' });
    const hk = key(p, 'Hospital', 1060, 730, C[1][0] + .3, { size: 90 });
    const hs = strike(p, hk, 1060, 730, C[1][0] + 2.2, 90);
    hide(hk, m('conf') - .5, .4); hide(hs, m('conf') - .5, .4);
    key(p, 'House of confinement', 1060, 760, m('conf') - .2, { size: 84, fill: HOT });
  }],
  ['hundred', 'One in a hundred', (m, D) => {
    const p = panel(0);
    const g = G(p, {}), cells = [];
    for (let i = 0; i < 100; i++) {
      const c = G(g, { x: 440 + (i % 10) * 66, y: 150 + Math.floor(i / 10) * 66, o: 0 });
      c._dot = mk('circle', { r: 20, fill: CREAM }, c);
      show(c, .1 + i * .012, .3); cells.push(c);
    }
    const one = cells[67];
    tw(one._dot, { c_fill: HOT }, m('one'), .4);
    pulse(one, m('one') + .3);
    key(p, '1 in 100', 1290, 470, m('one') + .3, { size: 90, fill: HOT });
    tag(p, 'of the people of Paris', 1290, 520, m('one') + .8, { anchor: 'middle', size: 30 });
    // only he is shut inside: a cell drawn around the one dot
    line(p, `M${440 + 7 * 66 - 30} ${150 + 6 * 66 - 30}h60v60h-60Z`, m('inside'), .6, 4, { stroke: HOT });
    pulse(one, m('inside') + .6, 1.3);
  }],
  ['inmates', 'Who was there', (m, D) => {
    const p = panel(0);
    const row = inmatesRow(p, m);
    tw(row, ROW_SMALL, D - .4, 1, soft);   // the whole row steps down into the lower half: it stays for the next beat
  }],
  ['idle', 'Idleness', (m, D) => {

PARTS.forEach(([n, beats, gain]) => music(`audio/bgm/${n}.mp3`, beats, gain, 3));

// the zoomed print's centre in Hogarth's plate 8 so the two ladies sit mid-frame (at zoom 2.6) and the print fills it

Promise.all(['600 40px Oswald', '500 40px Oswald', 'italic 400 40px "EB Garamond"', '400 40px "EB Garamond"']
  .map(f => document.fonts.load(f))).then(boot);
