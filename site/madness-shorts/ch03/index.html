Object.assign(ART, { 'e3-guard': [864, 1536], 'e3-head': [864, 1536], 'e3-unchain': [864, 1536], 'e3-watched': [864, 1536],
  'e3-judge': [864, 1536], 'e3-door-empty': [864, 1536], 'e3-beaten': [864, 1536], 'e3-tea': [864, 1536],
  'e3-silent': [864, 1536], 'e3-pinel': [1400, 971], 'e3-york': [1862, 1139], 'e3-hogarth': [1920, 1677],
  'e3-bastille': [1874, 1343], 'e3-chained': [1440, 1920], 'e3-fool-chained': [916, 970] });
const FLEURY = 'Tony Robert-Fleury, Pinel at the Salpêtrière, 1876';
// like wide(), but the point (fx, fy) goes to (CX, sy) and the picture may end inside the frame (the shot's ground
// shows below it): keys [t, fx, fy, s, sy]. For a subject at a picture's bottom edge, lifted out of the platform's UI zone.
function lifted(g, name, keys) {
  const [iw, ih] = ART[name], k = Math.max(H / ih, W / iw), Ws = iw * k, Hs = ih * k;
  const im = G(g, {});
  mk('image', { href: `../img/${name}.webp`, x: -Ws / 2, y: -Hs / 2, width: Ws, height: Hs }, im);
  const at = ([, fx, fy, s, sy]) => ({ x: CX - s * (fx - .5) * Ws, y: sy - s * (fy - .5) * Hs, s });
  put(im, at(keys[0]));
  keys.slice(1).forEach((key, i) => { const t = keys[i][0]; tw(im, at(key), t, key[0] - t, io); });
  return im;
}

const OPEN_PRE = .3;
const BEATS = [
  // 0. The hook: a chained woman of the Salpêtrière, the iron on the floor, the keeper, the keeper inside the head

    s = shot(p, ch, and);

    word(s, 'Inside', CX, 320, ins + .05, { maxW: 640, size: 190, fill: RED, stroke: DARK });

  // 1. Who says so, and which episode this is

    s = shot(p, sh, undefined, { whip: true });
    wide(s, 'e3-hogarth', [[sh, .66, .42, 1.25], [D + 1, .62, .44, 1.45]]);

    word(s, 'Shown', CX, 1150, sh + .05, { maxW: 640, size: 170, fill: '#fff', stroke: DARK });
    label(s, 'like animals', CX, 1270, sh + .9, { size: 64 });
  }],

  // 3. Pinel: revolutionary Paris; the doctor; the collar struck off
  ['pinel', 'Pinel', (m, D) => {
    const p = panel(0);
    const pa = m('paris'), pn = m('pinel'), sk = m('struck');

  // 4. The painting that made it a legend: one close-up per thing named
  ['legend', 'A legend', (m, D) => {

  // 5. Tuke's Retreat at York, and what it promised
  ['tuke', 'Tuke', (m, D) => {
    const p = panel(0);

  }],

    srcTag(s, 'AI illustration', 50, 150, ju);
    word(s, 'Judged', CX, 1240, ju + .05, { maxW: 640, size: 170, fill: '#fff', stroke: DARK });
    sfx('watched', ju + .1, 'thud', 1);
    s = shot(p, as, fa);
    wide(s, 'e3-judge', [[as, .8, .66, 1.65], [fa + .3, .8, .62, 1.8]]);

    word(s, 'Ashamed', CX, 300, as + .05, { maxW: 640, size: 160, fill: RED, stroke: DARK });

  // 9. The tea parties: best behaviour; the guard leaves the door and is inside the head
  ['tea', 'Tea at York', (m, D) => {

  // 10. Foucault's verdict: a gigantic moral imprisonment; liberation is its opposite's name
  ['moral', 'The verdict', (m, D) => {

    sfx('end', .15, 'chain', 1);

    s = shot(p, c1, c2, { whip: true });
    wide(s, 'e3-head', [[c1, .52, .45, 1.05], [c2 + .3, .55, .42, 1.2]]);

    hide(sw, al - .1, .15);
    word(s, 'Almost.', CX, 300, al + .05, { maxW: 640, size: 140, fill: RED, stroke: DARK });
    s = shot(p, nx, D, { bg: BURG, swipe: true });
    seriesCard(s, nx, 4, nx + .9);
    // and the next episode, full frame
    s = shot(p, D, undefined, { bg: DARK });
    label(s, 'Next', CX, 660, D, { size: 70, fill: RED, colour: DARK });
    word(s, 'The last voices', CX, 880, D + .05, { maxW: 640, size: 170, fill: LIGHT });
    T(s, 'PART 4 OF 4', { x: CX, y: 990, size: 52, fill: MUTED, font: SANS, weight: 500, anchor: 'middle', o: 0 }); show(s.lastChild, D + .2, .2);
    prog(() => {}, D, 1.8, lin);
  }],
].map(shortsBeat);

// One track for the whole film; ?bgm= sets its level by ear (gain under the ducking to 30 %)
music('audio/bgm/ep3.mp3', undefined, +(new URLSearchParams(location.search).get('bgm') || .4), .05);
