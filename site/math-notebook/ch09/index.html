}
function dmPlace(p,digits,{x=330,y=400,t=.2,places=['ones','tenths','hundredths','thousandths'],step=160,size=72,tDigits=null,tDot=null,boxW=.86}={}){

 places.forEach((s,i)=>{const numeric=places[0]==='1',stag=numeric||places.length>6,hy=stag&&i%2===0?-122:-90;T(g,s,{x:i*step,y:hy,size:numeric?22:places.length>6?21:24,anchor:'middle',fill:COL.dim});if(stag)path(g,`M${i*step} ${hy+10}V-68`,{stroke:COL.faint,'stroke-width':1});mk('rect',{x:i*step-step*boxW/2,y:-65,width:step*boxW,height:95,rx:12,fill:'none',stroke:COL.faint,'stroke-width':2},g);const dg=T(g,digits[i]??'',{x:i*step,y:10,size,font:'monospace',anchor:'middle',o:0});show(dg,tDigits?tDigits(i):0);});
 const dot=T(g,'.',{x:(ones+.5)*step,y:10,size,font:'monospace',anchor:'middle',fill:COL.task,o:0});show(dot,tDot??0);return g;
}

 if(!mini){path(g,`M${end-5*size*.6} ${dy*3+28}H${end+20}`,{stroke:COL.chalk,'stroke-width':3});dmText(g,'5184',end,dy*4+24,tSum,size,COL.task,'end');}
 return g;
}

['q2','Quick check',()=>{const p=panel(0);dmTitle(p,'The 1 in 16 is in the TENS place.','Which partial-product board preserves that value?');S.dmWhole=[0,1].map(j=>{const x=170+j*780,g=dmWhole(p,{x,y:280,mini:true,wrong:j===1});dmText(p,j?'B':'A',x+225,200,.2,31,COL.dim,'middle');dmText(p,j?'324 × 1':'324 × 10',x+225,590,.2,32,COL.task,'middle');return {el:g,box:[x-5,260,410,370],label:j?'B: partial product 324':'A: partial product 3240'};});},{ask:done=>quiz(BAND,[{id:'c-shift',prompt:'Choose the board with the correct tens-row partial product.',build:pickEls(S.dmWhole,0,'A uses 324 × 10 = 3240. The tens digit needs a shifted row or a zero in the ones place.',()=> 'B uses 324 × 1. But the 1 in 16 means ten, so the partial product must be 3240.',()=>pulseFx(S.dmWhole[0].el,1.03))}],done)}],
