const ddText=(p,s,x,y,t=0,size=30,col=COL.chalk,anchor='start')=>{const e=T(p,s,{x,y,size,fill:col,anchor,o:0});show(e,t);return e;};

 const g=G(p,{x,y,o:0});g.dataset.groups=String(n);g.dataset.total=total;g.dataset.divisor=group;show(g,t);

}
function ddScale(p,digits,label,{x=520,y=330,step=125,shift=1,t=0,tm=1}={}){

 const dot=T(g,'.',{x:step*.5,y:10,size:76,font:'monospace',fill:COL.task,anchor:'middle'});dot.dataset.shift=String(shift);dot.dataset.origin=String(step*.5);dot.dataset.target=String((shift+.5)*step);tw(dot,{x:(shift+.5)*step},tm,1.4,io);
 const a=path(g,`M${step*.5} 64H${(shift+.5)*step}m-12 -8 12 8-12 8`,{stroke:COL.task,'stroke-width':3},{d:0});draw(a,tm,1.4);ddText(g,'× '+10**shift,700,8,tm,33,COL.task);return {g,dot};
}

 g.dataset.dividend='2.700';g.dataset.divisor='4';g.dataset.quotient='0.675';

 ddText(g,'4',225,rows[0],0,sz);path(g,`M280 125V44H670`,{stroke:COL.chalk,'stroke-width':3});

 const ul=(x,r,t)=>{const ln=path(g,`M${x} ${rows[r]+20}H${x+156}`,{stroke:COL.chalk,'stroke-width':2},{d:0});draw(ln,t,.3);};
 const ts=n=>stage===n?(times.subtract??0):0,td=n=>stage===n?(times.digit??0):0,te=n=>stage===n?(times.exchange??0):0;
 if(stage>=1){digit('6',1,20,td(1),COL.task);digit('2',0,rows[1],ts(1));digit('4',1,rows[1],ts(1));ddText(g,'−',265,rows[1],ts(1),sz);ul(310,1,ts(1));digit('3',1,rows[2],ts(1));digit('0',2,rows[2],te(1),COL.task);down(520,2,te(1));}

 if(stage>=3){digit('5',3,20,td(3),COL.task);digit('2',2,rows[5],ts(3));digit('0',3,rows[5],ts(3));ddText(g,'−',445,rows[5],ts(3),sz);ul(490,5,ts(3));digit('0',3,rows[6],ts(3),COL.task);}
 return g;
}

['q2','Quick check',()=>{const p=panel(0);ddTitle(p,'0.27 ÷ 0.4','Which one multiplies BOTH numbers by ten?');S.ddBoards=[ddBoard(p,0,'2.7','4'),ddBoard(p,1,'2.7','0.4'),ddBoard(p,2,'27','4')];},{ask:done=>quiz(BAND,[{id:'c-move',prompt:'Which division gives the same answer as 0.27 ÷ 0.4?',build:pickEls(S.ddBoards,0,'A uses ×10 on both numbers, so 2.7 ÷ 4 has exactly the same answer.',i=>i===1?'B moves only the dividend’s point. You must multiply the divisor by ten too.':'C multiplies the dividend by 100 but the divisor by 10. Both factors must match.',()=>pulseFx(S.ddBoards[0].el,1.02))}],done)}],

['tenths','Six tenths per group',m=>{const p=panel(0);ddTitle(p,'27 tenths shared among 4 groups');ddLong(p,1,{digit:m('digit',5.7),subtract:m('subtract'),exchange:m('exchange')});ddText(p,'27 tenths − 24 tenths',1210,350,m('subtract'),38,COL.chalk,'middle');ddText(p,'= 3 tenths',1210,430,m('subtract'),42,COL.task,'middle');ddText(p,'3 tenths = 30 hundredths',1210,590,m('exchange'),38,COL.task,'middle');ddText(p,'1 tenth = 10 hundredths',1210,670,m('exchange',2),32,COL.dim,'middle');}],
['hundredths','Seven hundredths per group',m=>{const p=panel(0);ddTitle(p,'30 hundredths shared among 4 groups');ddLong(p,2,{digit:m('digit'),subtract:m('subtract'),exchange:m('exchange')});ddText(p,'30 hundredths − 28 hundredths',1180,390,m('subtract'),34,COL.chalk,'middle');ddText(p,'= 2 hundredths',1180,470,m('subtract'),42,COL.task,'middle');ddText(p,'2 hundredths = 20 thousandths',1180,620,m('exchange'),34,COL.task,'middle');ddText(p,'Bring down 0 to show the exchange.',1180,700,m('exchange',2),30,COL.dim,'middle');}],

['sizes','The size of the group matters',m=>{const p=panel(0);ddTitle(p,'Division can make a positive number larger or smaller');const b=ddBar(p,{x:250,y:330,w:324,h:130,total:'1.2',group:'0.2',t:m('small')});ddMath(p,'1.2 ÷ 0.2 = 6',412,640,m('small'),56);ddText(p,'six small groups',412,730,m('small'),32,COL.dim,'middle');const g=G(p,{x:900,y:330,o:0});g.dataset.groupSize='2';g.dataset.amount='1.2';show(g,m('large'));mk('rect',{width:540,height:130,fill:'none',stroke:COL.whole,'stroke-width':3},g);mk('rect',{width:324,height:130,fill:COL.whole,'fill-opacity':.38,stroke:COL.task,'stroke-width':2},g);for(let i=1;i<10;i++)path(g,`M${i*54} 0V130`,{stroke:COL.faint,'stroke-width':1});ddText(g,'one whole group = 2',270,-45,m('large'),34,COL.chalk,'middle');ddText(g,'1.2 fills 6/10 of the group',270,180,m('large'),32,COL.task,'middle');ddMath(p,'1.2 ÷ 2 = 0.6',1170,640,m('large'),56);ddText(p,'six tenths of one larger group',1170,730,m('large'),32,COL.dim,'middle');}],
