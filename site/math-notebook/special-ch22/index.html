// Pick once per page load, outside replayed beat state, so seeking never changes a question.
const seQuestions = SE.questions();
const seMoney = cents => '$' + SE.money(cents);
const seText = (p, s, x, y, t=0, size=32, color=COL.chalk, anchor='start') => {
  const e = T(p, s, {x,y,size,fill:color,anchor,o:0}); show(e,t); return e;
};
const seMath = (p, s, y, t=0, color=COL.chalk, size=50, x=800) => {
  const e = M(p,[s],{x,y,size,fill:color,anchor:'middle',o:0}); show(e,t); return e;
};
function seHeading(title, sub='') {
  const p=panel(0);
  seText(p,title,100,108,0,43);
  if(sub) seText(p,sub,100,163,0,27,COL.dim);
  return p;
}
// A fixed-scale bar for one price change. The whole bar shows first; at split the changing part is cut off (the
// paid part shrinks under it) or added on; away slides a removed piece clear of the bar. Grey is kept for a cost.
function seStrip(p, model, x, y, unit, {at=0, split=at, away=null, height=76, fill=model.up?COL.chalk:COL.whole}={}) {
  const g=G(p,{x,y,o:0}), w=model.base*unit, amount=model.amount*unit;
  mk('rect',{width:w,height,fill:'none',stroke:COL.chalk,'stroke-width':2,'stroke-dasharray':'8 7'},g);
  const kept=mk('rect',{height,fill,'fill-opacity':.3,stroke:fill,'stroke-width':2},g);
  put(kept,{a_width:w});
  if(!model.up) tw(kept,{a_width:w-amount},split,.6);
  const moved=G(g,{o:0});
  mk('rect',{x:model.up?w:w-amount,width:amount,height,fill:model.up?COL.rat:COL.nat,'fill-opacity':.65,stroke:model.up?COL.rat:COL.nat,'stroke-width':2},moved);
  show(g,at); show(moved,split);
  if(away!==null) tw(moved,{y:height+18},away,.9,io);
  // x of the end of the kept part and the middle of the moved piece, for labels
  return {g,kept,moved,w,unit,model,cut:x+(model.up?w:w-amount),mid:x+(model.up?w:w-amount)+amount/2,y,height};
}
// A bracket over (or under, h<0) a span of a bar, with its label.
function seBracket(p, x1, x2, y, label, t, color=COL.whole, h=14) {
  const g=G(p,{o:0});
  path(g,`M${x1} ${y+h}V${y}H${x2}V${y+h}`,{stroke:color,'stroke-width':2.5,fill:'none'});
  T(g,label,{x:(x1+x2)/2,y:h>0?y-12:y+36,size:31,fill:color,anchor:'middle'});
  show(g,t); return g;
}
function seTag(p, label, value, x, y, color=COL.whole, at=0) {
  const g=G(p,{x,y,o:0});
  mk('rect',{x:-155,y:-54,width:310,height:126,rx:15,fill:COL.board,stroke:color,'stroke-width':2},g);
  T(g,label,{x:0,y:-14,size:25,fill:COL.dim,anchor:'middle'});
  T(g,value,{x:0,y:39,size:43,fill:color,anchor:'middle'});
  show(g,at); return g;
}
function seQuestionPicture(q) {
  let title=q.title, sub=q.subtitle;
  if(q.kind==='original'||q.kind==='cost') {
    title=q.item+' · '+(q.kind==='cost'?'selling price ':'sale price ')+seMoney(q.a.next);
    sub=q.a.rate+'% '+(q.a.up?'markup on cost':'off the original price')+' · Find the missing base';
  } else if(q.kind==='rate') {
    title=q.item+' · original '+seMoney(q.a.base)+' · paid '+seMoney(q.a.next);
    sub='How much was saved out of the original price?';
  }
  const p=seHeading(title,sub);
  if(q.kind==='compare') {
    const unit=600/Math.max(q.a.base,q.b.base);  // one scale so the two tags compare by length
    seText(p,'A: '+seMoney(q.a.base)+' · '+q.a.rate+'% off',150,250,0,33);
    seStrip(p,q.a,150,280,unit);
    seText(p,'B: '+seMoney(q.b.base)+' · '+q.b.rate+'% off',850,250,0,33);
    seStrip(p,q.b,850,280,unit);
  } else if(q.kind==='two'||q.kind==='updown'||q.kind==='downup') {
    const unit=900/Math.max(q.a.base,q.a.next,q.b.next);
    seStrip(p,q.a,150,260,unit,{fill:COL.whole});
    seText(p,'First change: '+q.a.rate+'% of '+seMoney(q.a.base),150,230,0,30,COL.task);
    // The second bar is an empty outline: its length is the first answer, so no number goes on it.
    mk('rect',{x:150,y:422,width:q.a.next*unit,height:65,fill:'none',stroke:COL.whole,'stroke-width':2},p);
    seText(p,'Second base = your first answer',150,405,0,30,COL.whole);
    seText(p,q.b.rate+'% '+(q.b.up?'up':'off')+' this price',1100,465,0,28,COL.task);
  } else if(q.kind==='original'||q.kind==='cost') {
    const fraction=(100+(q.a.up?q.a.rate:-q.a.rate))/100;
    mk('rect',{x:150,y:280,width:1000,height:76,fill:'none',stroke:COL.chalk,'stroke-width':2},p);
    seText(p,'missing base = 100%',150,240,0,33);
    mk('rect',{x:150,y:400,width:1000*fraction,height:65,fill:COL.whole,'fill-opacity':.3,stroke:COL.whole,'stroke-width':2},p);
    // The percent this price is of the base is the student's first step, so it stays a question.
    seText(p,seMoney(q.a.next)+' = ?% of the base',150,515,0,33,COL.whole);
  } else {
    const bar=seStrip(p,q.a,150,300,1000/(q.a.base+(q.a.up?q.a.amount:0)));
    seText(p,q.a.up?'cost = 100%':'original = 100%',150,260,0,33);
    seText(p,q.kind==='rate'?'saved = original − paid':q.a.rate+'% '+(q.a.up?'added':'removed'),
      150+bar.w+(q.a.up?q.a.amount*bar.unit:0),420,0,32,q.a.up?COL.rat:COL.nat,'end');
  }
}
// One sentence per practice task: what is known, then what to find.
function seTask(q) {
  const a=q.a, b=q.b, $=seMoney;
  const text={
    discount:q.item+': '+$(a.base)+', '+a.rate+'% off. Find the discount and the price to pay.',
    compare:'Same ink tray. Supplier A: '+$(a.base)+', '+a.rate+'% off. Supplier B: '+$(b.base)+', '+b.rate+'% off. What is the lower final price?',
    two:q.item+': '+$(a.base)+', '+a.rate+'% off, then '+b.rate+'% off the reduced price. Find both prices.',
    downup:q.item+': '+$(a.base)+', '+a.rate+'% off, then a '+b.rate+'% increase on the reduced price. Find both prices.',
    original:q.item+': '+$(a.next)+' after '+a.rate+'% off. Find the original price.',
    cost:q.item+': sells for '+$(a.next)+' after a '+a.rate+'% markup on cost. Find the cost.',
    rate:q.item+': original '+$(a.base)+', paid '+$(a.next)+'. What percent was taken off?',
    markup:q.item+': costs '+$(a.base)+', with a '+a.rate+'% markup on cost. Find the markup and the selling price.'
  }[q.kind];
  return text+(q.rule?' '+q.rule:'')+(q.kind==='rate'?' Type the whole number, without %.':' Type dollars without $.');
}
function seAsk(id, done) {
  const items=seQuestions[id];
  const practice=id.startsWith('final');
  const qs=items.map((q,i)=>({
    id:(practice?'p-':'c-')+id+'-'+i,
    prompt:practice?seTask(q):'Calculate from the tag. Type dollars without $.',
    build:blanks([q.row])
  }));
  quiz(practice?SCREEN:BAND,qs,done,practice?'Studio practice · set '+id.slice(-1)+' of 3':'Studio quick check');
}

['q4','Predict, then calculate',()=>seQuestionPicture(seQuestions.q4[0]),{ask:done=>seAsk('q4',done)}],
['cents','When a fraction of a cent appears',m=>{
  const q=SE.worked.cents,p=seHeading(q.title,'Round the discount to cents; half a cent rounds up. Then subtract.');
  seStrip(p,q.a,200,285,1200/q.a.base,{split:m('exact')});
  // A short number line from $1.32 to $1.33, beside the maths: 1.323 sits nearer the lower end.
  const nl=G(p,{o:0}), x0=1090, x1=1450, at=v=>x0+(v-1.32)/.01*(x1-x0);
  T(nl,'the discount, in dollars',{x:(x0+x1)/2,y:520,size:28,fill:COL.dim,anchor:'middle'});
  path(nl,`M${x0} 600H${x1}M${x0} 588V612M${x1} 588V612M${at(1.325)} 592V608`,{stroke:COL.chalk,'stroke-width':2.5});
  T(nl,'1.32',{x:x0,y:650,size:30,fill:COL.chalk,anchor:'middle'});
  T(nl,'1.33',{x:x1,y:650,size:30,fill:COL.chalk,anchor:'middle'});
  T(nl,'half',{x:at(1.325),y:650,size:30,fill:COL.dim,anchor:'middle'});
  mk('circle',{cx:at(1.323),cy:600,r:9,fill:COL.nat},nl);
  T(nl,'1.323',{x:at(1.323),y:572,size:30,fill:COL.nat,anchor:'middle'});
  show(nl,m('exact'));
  const near=mk('circle',{cx:x0,cy:600,r:15,fill:'none',stroke:COL.task,'stroke-width':4},p);
  put(near,{o:0}); show(near,m('round'),.4);
  seMath(p,'0.18 × 7.35 = 1.323',520,m('exact'),COL.nat,50,600);
  seMath(p,'1.323 ≈ '+SE.money(q.a.amount),617,m('round'),COL.task,50,600);
  seMath(p,SE.money(q.a.base)+' − '+SE.money(q.a.amount)+' = '+SE.money(q.a.next),715,m('subtract'),COL.whole,50,600);
}],

  ].forEach(([a,b,key],i)=>{

}],
