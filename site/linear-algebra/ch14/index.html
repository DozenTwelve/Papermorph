<script>
'use strict';
const CHAPTER = { number: 14, title: 'Can We Solve for Every b?', minutes: 10, language: 'en' , next: '../ch15/' };

/* ---------- the systems of this chapter ---------- */
const LA = [[2, -1], [-1, 2]];                          // the lecture's 2 × 2: columns (2, −1), (−1, 2)
const PAR0 = [[1, -1], [2, 2]], PAR = [[1, 2], [2, 4]]; // column 2 swings from (−1, 2) to (2, 4) = 2·column 1
const LEC3 = [[2, -1, 0], [-1, 2, -1], [0, -3, 4]];      // the lecture's 3 × 3
const FLAT3 = [[2, -1, 1], [-1, 2, 1], [0, -3, -3]];     // column 3 = column 1 + column 2 = (1, 1, −3)
const N3 = [1, 2, 1];                                    // col 1 × col 2 / 3: the sheet of col 1, col 2 is x + 2y + z = 0
const VIEW = { yaw: 50, pitch: 20 };                     // chapter 13's view: the lecture columns land far apart

/* ---------- chapter drawing helpers ---------- */
const CARD = { x: 40, y: 600, w: 720, cls: 'side' };     // under the column form, beside the plane
const say = (p, parts, x, y, t0, { size = 40, fill = COL.chalk, anchor = 'start' } = {}) => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const fmt1 = n => { const r = Math.round(n * 10) / 10; return num(Number.isInteger(r) ? r : +r.toFixed(1)); };
const pairStr = (x, y) => `(${num(x)}, ${num(y)})`;
const tri = q => `(${q.map(c => fmt1(c)).join(', ')})`;
// A number changes: it lights amber and goes back to its own colour.
const flash = (els, t0) => els.forEach(e => {
  const base = e.getAttribute('fill');
  tw(e, { c_fill: base === COL.task ? COL.chalk : COL.task }, t0, .25); tw(e, { c_fill: base }, t0 + .7, .4);   // over in 1.1 s: flashes 1.3 s apart never overlap
});
const thick = (e, t0, w = 5) => { tw(e, { 'a_stroke-width': w + 5 }, t0, .3); tw(e, { 'a_stroke-width': w }, t0 + .8, .5); };
const box = (p, x, y, w, h, color, t, until) => {
  const r = mk('rect', { x, y, width: w, height: h, rx: 12, fill: color, 'fill-opacity': .08, stroke: color, 'stroke-width': 2.5, 'stroke-dasharray': '6 6' }, p);
  put(r, { o: 0 }); show(r, t, .3); if (until !== undefined) hide(r, until, .3);
  return r;
};

/* ---------- 2D: equations, column form, mix and plane, one linsys ---------- */
const sys2 = (p, A, b, { t0 = .1, view = 'col' } = {}) => {
  const sys = linsys(p, { A, b, eq: [90, 200], size: 46, mat: null, sol: false, view, t0 });
  sys.labels(['col 1', 'col 2', 'b']);
  return sys;
};
// x·[col 1] + y·[col 2] = [b], its numbers read from the system as it moves.
const colForm2 = (sys, p, t0, { x = 90, y = 420, size = 44 } = {}) => {
  const g = G(p, { o: 0 }), rh = 58, top = y - size * .95, bot = y + rh + size * .35, texts = {};
  const br = bx => path(g, `M${bx + 12} ${top}H${bx}V${bot}H${bx + 12}M${bx + 88} ${top}H${bx + 100}V${bot}H${bx + 88}`, { stroke: COL.chalk, 'stroke-width': 3, fill: 'none' });
  const sign = (s, sx, it = false) => { const t = T(g, s, { x: sx, y: y + rh / 2 + 4, size, fill: COL.chalk, font: MATH, anchor: 'middle' }); if (it) t.setAttribute('font-style', 'italic'); };
  sign('x', x + 14, true); br(x + 36); sign('+', x + 172); sign('y', x + 206, true); br(x + 228); sign('=', x + 365); br(x + 398);
  [['a00', x + 86, 0], ['a10', x + 86, 1], ['a01', x + 278, 0], ['a11', x + 278, 1], ['b0', x + 448, 0], ['b1', x + 448, 1]].forEach(([k, cx, i]) => {
    texts[k] = T(g, '', { x: cx, y: y + rh * i, size: size * .9, fill: k[0] === 'b' ? COL.task : LS_COLS[+k[2]], font: MATH, anchor: 'middle' });
  });
  const upd = v => { for (const k in texts) { const s = fmt1(v[k]); if (texts[k].textContent !== s) texts[k].textContent = s; } };
  sys.onChange(upd); upd(sys.v);
  show(g, t0);
  return { g, num: k => [texts[k]] };
};
// The mix, exact: "x = 2/3,  y = 1/3", or why there is none, or that there are endlessly many.
const exact2 = (n, v) => {   // whole numbers within 1e-9 count as whole: a tween's last step can land a hair off
  const det = Math.round(v.a00 * v.a11 - v.a01 * v.a10);
  if (!Object.values(v).every(z => Math.abs(z - Math.round(z)) < 1e-9) || !det) return [fmt1(n)];
  const k = Math.round(n * det), g = gcd(Math.abs(k), Math.abs(det)) || 1, nn = k / g * Math.sign(det), dd = Math.abs(det) / g;
  return dd === 1 ? [num(nn)] : [nn < 0 ? '−' : '', F(Math.abs(nn), dd)];
};
const mixOut = (sys, p, t0, { x = 90, y = 555 } = {}) => {
  const g = G(p, { o: 0 });
  let key = '';
  const upd = (v, s) => {
    const k = s.x !== undefined ? [...exact2(s.x, v), '|', ...exact2(s.y, v)].map(z => typeof z === 'string' ? z : z.f.join('/')).join() : s.none ? 'none' : 'many';
    if (k === key) return;
    key = k; g.replaceChildren();
    if (s.x !== undefined) M(g, ['mix:   x = ', ...exact2(s.x, v), ',   y = ', ...exact2(s.y, v)], { x, y, size: 40, fill: COL.task, anchor: 'start' });
    else T(g, s.none ? 'no mix reaches b' : 'endlessly many mixes reach b', { x, y: y - 4, size: 32, fill: s.none ? COL.bad : COL.task, weight: 600 });
  };
  sys.onChange(upd); upd(sys.v, sys.solve());
  show(g, t0);
  return g;
};
// The lattice of whole-number mixes on the plane (as chapter 6): dots at every x·col 1 + y·col 2 with whole x, y,
// lines along each column, a shade when the columns fill the plane and an amber line when they lie on one line.
const lattice2 = sys => {
  const P2 = sys.P, { PX, PY } = P2, g = G(P2.g, {});
  P2.g.insertBefore(g, sys.ROWV);   // under the lines and arrows
  const shade = mk('rect', { x: PX(P2.x0), y: PY(P2.y1), width: PX(P2.x1) - PX(P2.x0), height: PY(P2.y0) - PY(P2.y1), fill: COL.task, 'fill-opacity': .1 }, g);
  const L = [0, 1].map(i => path(g, '', { stroke: LS_COLS[i], 'stroke-width': 1.5, 'stroke-opacity': .5, fill: 'none' }));
  const dots = path(g, '', { stroke: COL.chalk, 'stroke-width': 7, 'stroke-linecap': 'round', 'stroke-opacity': .55, fill: 'none' });
  const span = path(g, '', { stroke: COL.task, 'stroke-width': 7, 'stroke-opacity': .6, 'stroke-linecap': 'round', fill: 'none' });
  [shade, ...L, dots, span].forEach(e => put(e, { o: 0 }));
  const inBox = (X, Y) => X >= P2.x0 - 1e-9 && X <= P2.x1 + 1e-9 && Y >= P2.y0 - 1e-9 && Y <= P2.y1 + 1e-9;
  const clipDir = (q, e) => {   // the part of the line through q along e inside the grid
    const ts = [], tryT = (t, val, lo, hi) => { if (val >= lo - 1e-9 && val <= hi + 1e-9) ts.push(t); };
    if (Math.abs(e[0]) > 1e-9) for (const X of [P2.x0, P2.x1]) { const t = (X - q[0]) / e[0]; tryT(t, q[1] + t * e[1], P2.y0, P2.y1); }
    if (Math.abs(e[1]) > 1e-9) for (const Y of [P2.y0, P2.y1]) { const t = (Y - q[1]) / e[1]; tryT(t, q[0] + t * e[0], P2.x0, P2.x1); }
    if (ts.length < 2) return '';
    const a = Math.min(...ts), b = Math.max(...ts);
    return b - a < 1e-9 ? '' : `M${PX(q[0] + a * e[0]).toFixed(1)} ${PY(q[1] + a * e[1]).toFixed(1)}L${PX(q[0] + b * e[0]).toFixed(1)} ${PY(q[1] + b * e[1]).toFixed(1)}`;
  };
  const att = (e, d) => { if (e.getAttribute('d') !== d) e.setAttribute('d', d); };
  const draw_ = v => {
    const a = [v.a00, v.a10], b = [v.a01, v.a11], det = a[0] * b[1] - b[0] * a[1];
    let d1 = '', d2 = '', dd = '', sp = '';
    if (Math.abs(det) > 1e-6) {
      const cs = [], ds = [];
      for (const X of [P2.x0, P2.x1]) for (const Y of [P2.y0, P2.y1]) { cs.push((X * b[1] - b[0] * Y) / det); ds.push((a[0] * Y - X * a[1]) / det); }
      const cr = [Math.ceil(Math.min(...cs)), Math.floor(Math.max(...cs))], dr = [Math.ceil(Math.min(...ds)), Math.floor(Math.max(...ds))];
      // ponytail: nearly parallel columns need ever more lines; past 300 the grid is left out (a smear by then)
      if (cr[1] - cr[0] < 300 && dr[1] - dr[0] < 300) {
        for (let k = dr[0]; k <= dr[1]; k++) d1 += clipDir([k * b[0], k * b[1]], a);
        for (let k = cr[0]; k <= cr[1]; k++) d2 += clipDir([k * a[0], k * a[1]], b);
      } else sp = clipDir([0, 0], a);   // too dense to draw: it is already all but the line
      if ((cr[1] - cr[0] + 1) * (dr[1] - dr[0] + 1) < 6000)
        for (let i = cr[0]; i <= cr[1]; i++) for (let j = dr[0]; j <= dr[1]; j++) { const X = i * a[0] + j * b[0], Y = i * a[1] + j * b[1]; if (inBox(X, Y)) dd += `M${PX(X).toFixed(1)} ${PY(Y).toFixed(1)}h0`; }
    } else {
      const e = Math.hypot(...a) > 1e-9 ? a : b;
      if (Math.hypot(...e) > 1e-9) sp = clipDir([0, 0], e);
      for (let i = -12; i <= 12; i++) for (let j = -12; j <= 12; j++) { const X = i * a[0] + j * b[0], Y = i * a[1] + j * b[1]; if (inBox(X, Y)) dd += `M${PX(X).toFixed(1)} ${PY(Y).toFixed(1)}h0`; }
    }
    att(L[0], d1); att(L[1], d2); att(dots, dd); att(span, sp);
  };
  sys.onChange(draw_); draw_(sys.v);
  return { g, shade, L, dots, span };
};
// A pointer that rides on b's tip while the beat moves b ("drag b anywhere").
const hand = sys => {
  const { PX, PY } = sys.P, g = G(sys.P.g, { o: 0 });
  g.style.pointerEvents = 'none';
  path(g, 'M0 0L0 30L8 23L14 36L20 33L14 21L24 21Z', { fill: COL.chalk, stroke: COL.board, 'stroke-width': 2.5, 'stroke-linejoin': 'round' });
  const upd = v => put(g, { x: PX(v.b0) + 6, y: PY(v.b1) + 6 });
  sys.onChange(upd); upd(sys.v);
  return g;
};
// A dashed trip on the plane: x·col 1 from the origin, then y·col 2, nudged sideways by off px so trips along one line stay apart.
const trip = (sys, into, A, x, y, t0, off = 0) => {
  const { PX, PY } = sys.P, c1 = [A[0][0], A[1][0]], c2 = [A[0][1], A[1][1]];
  const L = Math.hypot(...c1) || 1, nx = -c1[1] / L * off, ny = -c1[0] / L * off;   // screen normal (y is down)
  const pt = (X, Y) => `${(PX(X) + nx).toFixed(1)} ${(PY(Y) + ny).toFixed(1)}`;
  const m = [x * c1[0], x * c1[1]], e = [m[0] + y * c2[0], m[1] + y * c2[1]];
  const legs = [];
  if (x) legs.push(path(into, `M${pt(0, 0)}L${pt(...m)}`, { stroke: LS_COLS[0], 'stroke-width': 5, 'stroke-dasharray': '10 8', fill: 'none' }, { d: 0 }));
  if (y) legs.push(path(into, `M${pt(...m)}L${pt(...e)}`, { stroke: LS_COLS[1], 'stroke-width': 5, 'stroke-dasharray': '10 8', fill: 'none' }, { d: 0 }));
  legs.forEach((l, i) => draw(l, t0 + i * .7, .7));
  return legs;
};
const hideCols = (sys, which, t0 = 0, dur = 0) => which.forEach(e => tw(e, { o: 0 }, t0, dur));

/* ---------- 3D: the sheet of reachable points ---------- */
const sheet = (V, d = 0, { fo = .13 } = {}) => {
  const it = V.poly(S3_cut(...N3, d, V.R), { color: COL.task, fo, w: 2 });
  it.at = dd => it.set(S3_cut(...N3, dd, V.R) || null);
  return it;
};
const ring3 = (V, q, label, color = COL.task) => {
  const d = V.point(q, { color, r: 15, label, size: 26 });
  const c = d.e.firstChild; c.setAttribute('fill', 'none'); c.setAttribute('stroke', color); c.setAttribute('stroke-dasharray', '4 4'); c.setAttribute('stroke-width', 3);
  return d;
};
const sys3 = (p, A, b, { t0 = .1, mixAt } = {}) => {
  const sys = lin3(p, { A, b, eq: [90, 180], size: 44, mat: null, mix: [90, 450], mixAt, view: 'col', sol: false, space: { ...VIEW }, t0 });
  sys.labels(['col 1', 'col 2', 'col 3', 'b']);
  return sys;
};

/* ---------- practice data ---------- */
const FILLQ = [
  { parts: [$m('[1, 0]'), ' and ', $m('[0, 1]')], ans: ['y'], why: 'Right and up: different directions. x·[1, 0] + y·[0, 1] = [x, y] is every point.' },
  { parts: [$m('[2, 1]'), ' and ', $m('[4, 2]')], ans: ['n'], why: '[4, 2] is 2·[2, 1]: one line.' },
  { parts: [$m('[1, 3]'), ' and ', $m('[3, 1]')], ans: ['y'], why: 'Neither is a multiple of the other: they point different ways.' },
  { parts: [$m('[−1, 2]'), ' and ', $m('[2, −4]')], ans: ['n'], why: '[2, −4] is −2·[−1, 2]. A negative multiple still lies on the same line.' },
  { parts: [$m('[0, 0]'), ' and ', $m('[1, 1]')], ans: ['n'], why: 'The zero column adds nothing: only the line of [1, 1].' },
  { parts: [$m('[3, −1]'), ' and ', $m('[1, 2]')], ans: ['y'], why: 'Different directions: every b.' },
];
const FILL3Q = [
  { parts: [$m('(1, 0, 0), (0, 1, 0), (0, 0, 1)')], ans: ['y'], why: 'Along x, along y, up z: x·… + y·… + z·… = (x, y, z) is every point.' },
  { parts: [$m('(1, 0, 0), (0, 1, 0), (1, 1, 0)')], ans: ['n'], why: 'All three lie on the floor (bottom number 0). (1, 1, 0) is col 1 + col 2.' },
  { parts: [$m('(1, 1, 0), (0, 1, 1), (1, 0, 1)')], ans: ['y'], why: 'No column is a mix of the other two; they fill space.' },
  { parts: [$m('(1, 2, 3), (2, 4, 6), (0, 0, 1)')], ans: ['n'], why: 'Col 2 = 2·col 1. Two directions only: a plane.' },
  { parts: [$m('(2, −1, 0), (−1, 2, −3), (1, 1, −3)')], ans: ['n'], why: 'Col 3 = col 1 + col 2: the flat sheet of this chapter.' },
  { parts: [$m('(1, 0, 0), (1, 1, 0), (1, 1, 1)')], ans: ['y'], why: 'Only col 3 leaves the floor, and col 1, col 2 point different ways on it.' },
];
const REACH2Q = [
  { parts: ['b = ', $m('[2, −2]')], ans: ['y'], why: '−2 = −2. b is 2·col 1.' },
  { parts: ['b = ', $m('[−4, 4]')], ans: ['y'], why: '4 = −(−4). b is −4·col 1.' },
  { parts: ['b = ', $m('[1, 1]')], ans: ['n'], why: 'The bottom must be minus the top: 1 is not −1.' },
  { parts: ['b = ', $m('[0, 0]')], ans: ['y'], why: '0 = −0: the mix 0, 0 reaches it (and so do many others).' },
  { parts: ['b = ', $m('[3, −2]')], ans: ['n'], why: '−2 is not −3.' },
];
const REACH3Q = [
  { parts: ['floor columns, b = ', $m('(2, 3, 0)')], ans: ['y'], why: 'Bottom 0: on the floor. 2·col 1 + 3·col 2.' },
  { parts: ['floor columns, b = ', $m('(0, 0, 1)')], ans: ['n'], why: 'Every mix has bottom 0; this b has bottom 1.' },
  { parts: ['floor columns, b = ', $m('(−1, 4, 0)')], ans: ['y'], why: 'Bottom 0: −1·col 1 + 4·col 2.' },
  { parts: ['sheet columns, b = ', $m('(3, 0, −3)')], ans: ['y'], why: '3 + 2·0 + (−3) = 0: on the sheet. 2·col 1 + col 2 reaches it.' },
  { parts: ['sheet columns, b = ', $m('(0, −1, 4)')], ans: ['n'], why: '0 − 2 + 4 = 2, not 0: off the sheet.' },
  { parts: ['sheet columns, b = ', $m('(1, 1, 1)')], ans: ['n'], why: '1 + 2 + 1 = 4, not 0.' },
];
const YN = [['y', 'Yes', COL.good, 'Y'], ['n', 'No', COL.bad, 'N']];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Can we solve for every b?', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unit 1, Chapter 14', { x: 800, y: 300, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Can We Solve for Every b?', { x: 800, y: 410, size: 84, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'the big question of lecture 1: which targets can the columns reach?', 800, 530, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    // two columns at a point; the target b hops, and each time a dashed mix of the columns follows it there
    const k = 34, c1 = [2, -1], c2 = [-1, 2], lg = G(scene, { x: 800, y: 700, o: 0 });
    const P_ = (x, y) => `${x * k} ${-y * k}`;
    path(lg, `M0 0L${P_(...c1)}`, { stroke: LS_COLS[0], 'stroke-width': 6, 'stroke-linecap': 'round' });
    path(lg, `M0 0L${P_(...c2)}`, { stroke: LS_COLS[1], 'stroke-width': 6, 'stroke-linecap': 'round' });
    show(lg, m('sub') + 1, .6);
    const dot = G(lg, { x: 0, y: -3 * k, o: 0 });
    mk('circle', { r: 11, fill: COL.task, stroke: COL.board, 'stroke-width': 3 }, dot);
    [[1, 2], [2, 1], [-2, -2]].forEach(([x, y], i) => {
      const t = m('move') + .6 + i * 1.9, mid = [x * c1[0], x * c1[1]], end = [mid[0] + y * c2[0], mid[1] + y * c2[1]];
      const leg = G(lg, { o: 0 });
      path(leg, `M0 0L${P_(...mid)}`, { stroke: LS_COLS[0], 'stroke-width': 4, 'stroke-dasharray': '8 7', fill: 'none' });
      path(leg, `M${P_(...mid)}L${P_(...end)}`, { stroke: LS_COLS[1], 'stroke-width': 4, 'stroke-dasharray': '8 7', fill: 'none' });
      tw(dot, { x: end[0] * k, y: -end[1] * k, o: 1 }, t, .7);
      show(leg, t + .6, .4); hide(leg, t + 1.6, .3);
    });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(lg, D - .9, .8);
  }],

  ['ask', 'The big question', (m) => {
    const p = S.p = panel(0);
    text(p, 'Can we find a mix for every b?', 60, 110, .2, { size: 40, weight: 600 });
    const sys = S.sys = sys2(p, LA, [0, 3], { t0: m('eq') - .3 });
    put(sys.COLV, { o: 0 }); show(sys.COLV, m('cols') + 1.5, .6);
    S.cf = colForm2(sys, p, m('cols'));
    flash([...sys.num('a00'), ...sys.num('a10')], m('cols') + 1.2); flash([...sys.num('a01'), ...sys.num('a11')], m('cols') + 3.4);
    box(p, 114, 366, 124, 140, LS_COLS[0], m('cols') + 1.2, m('cols') + 3.2); box(p, 306, 366, 124, 140, LS_COLS[1], m('cols') + 3.4, m('cols') + 5.4);
    box(p, 476, 366, 124, 140, COL.task, m('cols') + 5.6, m('mix'));
    S.out = mixOut(sys, p, m('mix'));
    thick(sys.combo[0], m('mix') + 1.5, 4); thick(sys.combo[1], m('mix') + 2.3, 4);
    // "until now": one b at a time; "now": every point of the plane
    const one = text(p, 'until now:  one b  →  find its mix', 90, 650, m('flip'), { size: 30, fill: COL.dim });
    const all = text(p, 'now:  every b  →  is there always a mix?', 90, 700, m('big'), { size: 32, fill: COL.chalk, weight: 600 });
    const { PX, PY } = sys.P, qs = G(p, {});
    [[-4, 3], [3, 4], [5, -2], [-2, -5], [1, -1], [-5, 0], [4, 1], [-1, 5], [2, -4]].forEach(([x, y], i) => {
      const d = G(qs, { x: PX(x), y: PY(y), o: 0, s: .4 });
      mk('circle', { r: 9, fill: 'none', stroke: COL.task, 'stroke-width': 3 }, d);
      tw(d, { o: .9, s: 1 }, m('big') + 2.5 + i * .25, .4, back);
    });
    hide(qs, m('try') - .3, .4);
    [['b1', 3, 0], ['b2', -2, -2], ['b3', 1, 0]].forEach(([k, b0, b1]) => {
      sys.to({ b0, b1 }, m(k), 1.3);
      flash([...sys.num('b0'), ...sys.num('b1'), ...S.cf.num('b0'), ...S.cf.num('b1')], m(k) + .2);
    });
    S.notes = [one, all];
  }],

  ['lattice', 'Why every b works', (m) => {
    const p = S.p, sys = S.sys;

  }, { ask: playAsk(() => S.sys, { pos: { x: 40, y: 578, w: 720, cls: 'side' }, tip: 'Your two columns and b. Drag the tips, change any number, or draw on the board. Nothing is marked.' }) }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
