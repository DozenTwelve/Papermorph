<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A Matrix Moves the Whole Plane</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render"><!-- hold the first frame until the player exists, so the page transition can run -->
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/math.js"></script>
<script src="../lib/grid2.js"></script>
<script src="../lib/play.js"></script>
<script src="audio/en/timings.js"></script>
<script>
'use strict';
const CHAPTER = { number: 10, title: 'A Matrix Moves the Whole Plane', minutes: 10, language: 'en' , next: '../ch11/' };

/* ---------- layout and colours ---------- */
const DISP = [90, 230];                                        // the matrix in brackets, top left
const ROWC = [COL.whole, COL.nat], COLC = [COL.irr, COL.real];
const LEFT = { x: 40, y: 420, w: 720, cls: 'side' };          // question card under the matrix; the plane stays on the right
const TOPL = { x: 40, y: 190, w: 720, cls: 'side' };          // question card at the top left (matrix hidden)
const A1 = [[2, -1], [1, 1]];                                  // the chapter's first matrix
const I2 = [[1, 0], [0, 1]];
const ZOOM = { u: 68, x0: -5, x1: 5, y0: -5, y1: 5 };                 // a closer plane for the named moves: the square and flag read

/* ---------- chapter drawing helpers ---------- */
const say = (p, parts, x, y, t0, { size = 40, fill = COL.chalk, anchor = 'start' } = {}) => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const frame = (p, x, y, w, hh, c, t0, t1) => { const r = mk('rect', { x, y, width: w, height: hh, rx: 14, fill: 'none', stroke: c, 'stroke-width': 3 }, p); put(r, { o: 0 }); show(r, t0, .4); if (t1 !== undefined) hide(r, t1, .4); return r; };
const band = (p, x, y, w, hh, c, t0, t1, o = .2) => { const r = mk('rect', { x, y, width: w, height: hh, rx: 14, fill: c }, p); put(r, { o: 0 }); tw(r, { o }, t0, .4); if (t1 !== undefined) tw(r, { o: 0 }, t1, .4); return r; };
const flash = (g, key, t0) => g.num(key).forEach(e => { const c0 = e.getAttribute('fill'); tw(e, { c_fill: COL.task }, t0, .25); tw(e, { c_fill: c0 }, t0 + 1.2, .6); pulse(e, t0, 1.3); });
const keysOf = A => ({ a00: A[0][0], a01: A[0][1], a10: A[1][0], a11: A[1][1] });
const thick = (e, t, w = 5) => { tw(e, { 'a_stroke-width': w * 2 }, t, .3); tw(e, { 'a_stroke-width': w }, t + 1.4, .5); };
const pair = (x, y) => `(${num(x)}, ${num(y)})`;
// The moved plane in this chapter's layout: matrix top left, plane on the right, grid, unit square and flag on.
const planeOf = (p, A, o = {}) => grid2(p, { A, mat: DISP, shape: true, ...o });
// A column of the matrix in brackets, framed (j = 0, 1).
const colFrame = (p, g, j, t0, t1) => frame(p, g.lay.A[0][j] - 42, DISP[1] - 56, 84, 150, COLC[j], t0, t1);
// A dot carried by A: it slides from p to A·p.
const carry = (g, p, into, t0, { color = COL.chalk, dur = 1.6, r = 8, move = t0 + .4 } = {}) => {
  const [x, y] = p, [X, Y] = [g.v.a00 * x + g.v.a01 * y, g.v.a10 * x + g.v.a11 * y], { PX, PY } = g.P;
  const d = G(into, { x: PX(x), y: PY(y), o: 0 });
  mk('circle', { r, fill: color, stroke: COL.board, 'stroke-width': 2 }, d);
  show(d, t0, .3); tw(d, { x: PX(X), y: PY(Y) }, move, dur);
  return d;
};
const ring = (P2, [x, y], color, into, t0, label, { dx = 20, dy = -18, anchor = 'start' } = {}) => {
  const g = G(into, { x: P2.PX(x), y: P2.PY(y), o: 0 });
  mk('circle', { r: 17, fill: 'none', stroke: color, 'stroke-width': 3, 'stroke-dasharray': '5 5' }, g);
  if (label) T(g, label, { x: dx, y: dy, size: 22, fill: color, font: MATH, anchor });
  if (t0 !== undefined) show(g, t0, .4); else put(g, { o: 1 });
  return g;
};
// A pointer that drags a handle from a to b (stage px) over [tm, tm + dur], the same ease as g.to; shown t0 … t1.
// Its place is a function of time alone, so seeking shows the same frame as playing.
function pointer(p, a, b, tm, dur, t0, t1, ease = io) {
  const g = G(p, { o: 0 });
  path(g, 'M0 0L0 30L8 22L14 36L20 33L14 20L25 20Z', { fill: COL.chalk, stroke: COL.board, 'stroke-width': 2 });
  prog(q => { const t = t0 + q * (t1 - t0), k = ease(Math.max(0, Math.min(1, (t - tm) / dur))); put(g, { x: a[0] + (b[0] - a[0]) * k + 4, y: a[1] + (b[1] - a[1]) * k + 4 }); }, t0, t1 - t0, lin);
  show(g, t0, .3); hide(g, t1, .3);
  return g;
}
// Inline matrix for a card.
function matEl(rows, { size = 28 } = {}) {
  const n = rows[0].length, cw = size * 1.8, rh = size * 1.3, w = cw * n + 16, hh = rh * rows.length + size * .3;
  const svg = mk('svg', { class: 'm', viewBox: `0 0 ${w} ${hh}`, width: w, height: hh });
  svg.style.verticalAlign = 'middle';
  path(svg, `M12 2H3V${hh - 2}H12M${w - 12} 2H${w - 3}V${hh - 2}H${w - 12}`, { stroke: 'currentColor', 'stroke-width': 2.5 });
  rows.forEach((r, i) => r.forEach((v, j) => T(svg, num(v), { x: 8 + cw * (j + .5), y: rh * (i + .5) + size * .5, size, fill: COLC[j], font: MATH, anchor: 'middle' })));
  return svg;
}
const mul = (A, [x, y]) => [A[0][0] * x + A[0][1] * y, A[1][0] * x + A[1][1] * y];

/* ---------- practice data ---------- */
const LANDQ = [
  { A: [[2, 0], [0, 3]], pts: [[1, 1], [-2, 1], [0, -2]] },
  { A: [[1, 1], [0, 1]], pts: [[1, 2], [-1, 1], [3, -1]] },
  { A: [[0, -1], [1, 0]], pts: [[1, 0], [2, 1], [-1, 3]] },
];
const KINDS = [['st', 'Stretch', COL.irr, 'S'], ['fl', 'Flip', COL.nat, 'F'], ['sh', 'Shear', COL.real, 'H'], ['tu', 'Turn', COL.whole, 'T'], ['sq', 'Squash', COL.task, 'Q']];
const KINDQ = [
  { A: [[3, 0], [0, 1]], ans: ['st'], why: '(1, 0) goes 3 times as far, (0, 1) stays: 3 times as wide.' },
  { A: [[1, 0], [0, -1]], ans: ['fl'], why: '(0, 1) lands on (0, −1): a mirror image, upside down.' },
  { A: [[1, 0], [2, 1]], ans: ['sh'], why: '(0, 1) stays; (1, 0) leans up to (1, 2): the plane slides.' },
  { A: [[0, 1], [-1, 0]], ans: ['tu'], why: '(1, 0) lands on (0, −1) and (0, 1) on (1, 0): a quarter turn clockwise.' },
  { A: [[2, 4], [1, 2]], ans: ['sq'], why: 'Column 2 = 2 × column 1: both point the same way, the plane collapses onto a line.' },
  { A: [[2, 0], [0, 2]], ans: ['st'], why: 'Both columns twice as long, same directions: everything twice as big.' },
];
const READQ = [[[1, 2], [0, 1]], [[0, 2], [-1, 0]], [[2, -1], [1, 1]]];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'A matrix moves the whole plane', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unit 1, Chapter 10', { x: 800, y: 250, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'A Matrix Moves the Whole Plane', { x: 800, y: 360, size: 80, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'every point at once', 800, 450, m('sub'), { size: 36, fill: COL.dim, anchor: 'middle' });
    const sm = G(scene, { o: 0 });
    const k = grid2(sm, { A: I2, mat: null, shape: true, plane: { cx: 800, cy: 690, u: 30, x0: -5, x1: 5, y0: -3, y1: 3, labels: false } });
    show(sm, m('sub') + .5, .6);
    k.to({ a01: 1 }, m('move'), 1.6); k.to({ a00: 1.4, a10: .4 }, m('move') + 2, 1.4);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(sm, D - .9, .8);
  }],

  ['one', 'Where A sends a point', (m) => {
    const p = panel(0);
    text(p, 'A sends each point somewhere', 60, 110, .2, { size: 40, weight: 600 });
    const g = S.g = planeOf(p, A1, { x: [1, 1], grid: false, square: false, shape: false, units: false, t0: m('A') - .4 });
    g.combo.forEach(e => put(e, { o: 0 }));
    [g.axArrow, g.axDot, g.axLab].forEach(e => put(e, { o: 0 }));
    [0, 1].forEach(i => put(g.res(i), { o: 0 }));
    put(g.parts.cols, { o: 0 });
    put(g.parts.x, { o: 0 }); show(g.parts.x, m('x'), .4);
    ['x0', 'x1'].forEach(k => g.num(k).forEach(e => { put(e, { o: 0 }); show(e, m('x') + .2, .4); }));   // x's numbers come with "take the point"
    // by rows, then the answer appears in the brackets and in the plane
    [0, 1].forEach(i => band(p, DISP[0] + 6, g.lay.A[1][i] - 48, 192, 64, ROWC[i], m('rows') + i * 2.4, m('land')));
    say(p, ['2·1 − 1 = 1,'], 90, 480, m('rows') + .4, { size: 36 }); say(p, ['1 + 1 = 2'], 300, 480, m('rows') + 2.4, { size: 36 });
    [0, 1].forEach(i => { tw(g.res(i), { o: 1 }, m('land'), .4); tw(g.res(i), { o: 0 }, m('x2'), .3); tw(g.res(i), { o: 1 }, m('land2'), .4); });
    [g.axDot, g.axLab, g.axArrow].forEach(e => { show(e, m('land') + .2, .4); hide(e, m('x2'), .3); show(e, m('land2') + .2, .4); });
    hide(g.axArrow, m('many'), .3); hide(g.axDot, m('many'), .3); hide(g.axLab, m('many'), .3); hide(g.parts.x, m('many'), .3);
    const trail = G(p, {}), trail1 = G(trail, {});
    const tr = (from, to, t, into = trail) => g.P.arrow(...from, ...to, COL.dim, t, { into });
    tr([1, 1], [1, 2], m('land'), trail1); hide(trail1, m('x2'), .3);
    g.to({ x0: 2, x1: 0 }, m('x2'), .9);
    say(p, ['2·2 − 0 = 4,   2 + 0 = 2'], 90, 540, m('x2') + 1.6, { size: 36 });
    tr([2, 0], [4, 2], m('land2'));
    hide(trail, m('many'), .3);
    // many dots, each carried to where A sends it
    const dots = G(p, {});
    const pts = [];
    for (let x = -2; x <= 2; x++) for (let y = -2; y <= 2; y++) pts.push([x, y]);
    // they appear where they are, then all slide together on "Watch"
    const ghosts = G(p, { o: 0 });   // where the dots were: faint rings left behind
    pts.forEach((q, i) => {
      const special = (q[0] === 1 && q[1] === 1) || (q[0] === 2 && q[1] === 0);
      mk('circle', { cx: g.P.PX(q[0]), cy: g.P.PY(q[1]), r: 6, fill: 'none', stroke: COL.chalk, 'stroke-opacity': .45, 'stroke-width': 2 }, ghosts);
      const d = carry(g, q, dots, m('many') + .3 + i * .08, { color: special ? COL.task : COL.chalk, dur: 2.4, r: special ? 10 : 7, move: m('go') + .2 });
      if (special) pulse(d, m('check') + (q[0] === 1 ? .3 : 2.2), 1.5);
    });
    show(ghosts, m('go') + .2, .4);
    text(p, 'rings: where the dots started', 90, 760, m('go') + 1.4, { size: 26, fill: COL.dim });
    text(p, '(1, 1) → (1, 2)', 90, 640, m('check') + .3, { size: 32, fill: COL.task, weight: 600 });
    text(p, '(2, 0) → (4, 2)', 90, 690, m('check') + 2.2, { size: 32, fill: COL.task, weight: 600 });
  }],

  ['grid', 'The grid moves', (m) => {
    const p = panel(0);
    text(p, 'The whole grid moves', 60, 110, .2, { size: 40, weight: 600 });
    const g = S.g = planeOf(p, I2, { units: false, shape: false });
    put(g.M, { o: 0 }); show(g.M, m('go') + 3, .5);
    g.to(keysOf(A1), m('go') + .3, 2.6);
    // one line of the grid, and its neighbour: still straight, still parallel, evenly spaced
    const L = G(g.P.g, {});
    [1, 2, 3].forEach((k, i) => { const l = g.P.line(...mul(A1, [0, k]), ...mul(A1, [1, k]), COL.chalk, (i ? m('par') : m('straight')) + .3 + Math.max(0, i - 1) * .6, { into: L }); hide(l, m('faint'), .4); });
    const gp = g.P.g.querySelector('path'); tw(gp, { 'a_stroke-opacity': .45 }, m('faint') + .3, .4); tw(gp, { 'a_stroke-opacity': .1 }, m('faint') + 2.6, .6);
    text(p, 'straight lines stay straight', 90, 480, m('straight') + .4, { size: 30, weight: 600, fill: COL.task });
    text(p, 'parallel lines stay parallel,', 90, 530, m('par') + .4, { size: 30, weight: 600, fill: COL.task });
    text(p, 'equally spaced', 90, 575, m('par') + 1.6, { size: 30, weight: 600, fill: COL.task });
    text(p, 'faint: the plane before A', 90, 640, m('faint') + .4, { size: 28, fill: COL.dim });
    const sqe = g.parts.square.firstChild; tw(sqe, { 'a_fill-opacity': .4 }, m('sq') + .3, .4); tw(sqe, { 'a_fill-opacity': .12 }, m('sq') + 2.5, .6);
    text(p, 'the unit square → a slanted box', 90, 700, m('sq') + .4, { size: 28, fill: COL.chalk, weight: 600 });
  }],

  ['basis', 'Where (1, 0) and (0, 1) land', (m) => {
    const p = panel(0);
    text(p, 'Read the matrix off the picture', 60, 110, .2, { size: 40, weight: 600 });
    const g = S.g = planeOf(p, A1, { shape: false });
    g.labels(['col 1', 'col 2']);
    put(g.parts.cols, { o: 0 });
    // (1, 0) by rows, row 1 then row 2 while they are said; it lands as "it lands on two, one" is said
    [0, 1].forEach(i => band(p, DISP[0] + 6, g.lay.A[1][i] - 48, 192, 64, ROWC[i], m('e1') + 2 + i * 1.6, m('e1') + 5.6));
    carry(g, [1, 0], p, m('e1'), { color: COL.irr, dur: 1.4, r: 10, move: m('e1') + 4.4 });
    say(p, ['A·(1, 0) = (2, 1)'], 90, 480, m('e1') + 5.6, { size: 36, fill: COLC[0] });
    show(g.parts.cols, m('c1'), .4); put(g.cols[1], { o: 0 });
    colFrame(p, g, 0, m('c1'), m('why'));
    put(g.tipLabels[1], { o: 0 }); show(g.tipLabels[1], m('e2') + 1.8, .4);   // "col 2" comes with its arrow
    carry(g, [0, 1], p, m('e2'), { color: COL.real, dur: 1.4, r: 10, move: m('e2') + .9 });
    say(p, ['A·(0, 1) = (−1, 1)'], 90, 535, m('e2') + 1.6, { size: 36, fill: COLC[1] });
    show(g.cols[1], m('e2') + 1.8, .4);
    colFrame(p, g, 1, m('e2') + 1.8, m('why'));
    say(p, ['(1, 0) → 1·col 1 + 0·col 2'], 90, 610, m('why') + 2.5, { size: 32 });
    say(p, ['(x, y) → x·col 1 + y·col 2'], 90, 680, m('all') + 4, { size: 36, fill: COL.task });
    const st1 = G(p, {});
    [[0, 0, 1, 0], [1, 0, 2, 0], [2, 0, 2, 1]].forEach(([a, b, c, d], i) => g.P.arrow(a, b, c, d, COL.chalk, m('all') + 1 + i * .6, { into: st1 }).setAttribute('stroke-width', 6));
    tw(g.parts.square, { o: .25 }, m('all') + .6, .4); tw(g.parts.square, { o: 1 }, m('read'), .4);   // the slanted box steps back while the steps are walked
    thick(g.cols[0], m('why') + 4.5);
    hide(st1, m('grid') - .3, .3);
    // the moved grid is steps of the two columns: walk a few of them
    const steps = G(p, {});
    [[0, 0, 2, 1, COLC[0]], [2, 1, 4, 2, COLC[0]], [4, 2, 3, 3, COLC[1]]].forEach(([a, b, c, d, col], i) => g.P.arrow(a, b, c, d, col, m('grid') + .4 + i * .7, { into: steps }));
    hide(steps, m('read') - .2, .4);
    thick(g.cols[0], m('read') + 1.8); colFrame(p, g, 0, m('read') + 1.8, m('read') + 4);
    thick(g.cols[1], m('read') + 4.2); colFrame(p, g, 1, m('read') + 4.2);
    text(p, 'column 1 = where (1, 0) lands', 90, 760, m('read') + 1.8, { size: 28, fill: COLC[0], weight: 600 });
    text(p, 'column 2 = where (0, 1) lands', 90, 805, m('read') + 4.2, { size: 28, fill: COLC[1], weight: 600 });
  }],

  ['count', 'Counting on the moved grid', (m) => {
    const p = panel(0);
    text(p, 'Count steps of the columns', 60, 110, .2, { size: 40, weight: 600 });
    const g = S.g = planeOf(p, A1, { shape: false });
    g.labels(['col 1', 'col 2']);
    const P2 = g.P, w1 = G(p, {}), w2 = G(p, {});
    ring(P2, [3, 1], COL.chalk, w1, m('q'), '(3, 1)', { dx: 16, dy: 34 });
    say(w1, ['(3, 1):'], 90, 480, m('q') + .2, { size: 36 });
    const cs = [P2.arrow(0, 0, 2, 1, COLC[0], m('s1') + .2, { into: w1 }), P2.arrow(2, 1, 4, 2, COLC[0], m('s1') + .9, { into: w1 }), P2.arrow(4, 2, 6, 3, COLC[0], m('s1') + 1.6, { into: w1 })];
    say(w1, ['3·(2, 1) = (6, 3)'], 220, 480, m('s1') + .4, { size: 36, fill: COLC[0] });
    cs.push(P2.arrow(6, 3, 5, 4, COLC[1], m('s2') + .3, { into: w1 }));
    cs.forEach((a, i) => thick(a, m('grid') + 2.4 + i * 1.1, 4));
    say(w1, ['+ 1·(−1, 1)'], 220, 535, m('s2') + .4, { size: 36, fill: COLC[1] });
    pulse(P2.dot(5, 4, COL.chalk, m('land') + .3, { label: '(5, 4)', dx: -14, anchor: 'end', into: w1 }), m('land') + 3);
    say(w1, ['= (5, 4)'], 220, 590, m('land') + .5, { size: 36 });
    carry(g, [3, 1], w1, m('grid') + .2, { color: COL.chalk, dur: 1.6, r: 9 });
    say(w1, ['rows:  6 − 1 = 5,   3 + 1 = 4  ✓'], 90, 650, m('rows') + .4, { size: 32 });
    hide(w1, m('q2') - .3, .4);
    ring(P2, [-1, 2], COL.chalk, w2, m('q2'), '');
    say(w2, ['(−1, 2):'], 90, 480, m('q2') + .2, { size: 36 });
    P2.arrow(0, 0, -2, -1, COLC[0], m('t1') + .3, { into: w2 });
    say(w2, ['−1·(2, 1) = (−2, −1)'], 250, 480, m('t1') + .4, { size: 36, fill: COLC[0] });
    P2.arrow(-2, -1, -3, 0, COLC[1], m('t2') + .3, { into: w2 }); P2.arrow(-3, 0, -4, 1, COLC[1], m('t2') + 1, { into: w2 });
    say(w2, ['+ 2·(−1, 1) = (−2, 2)'], 250, 535, m('t2') + .4, { size: 36, fill: COLC[1] });
    P2.dot(-4, 1, COL.task, m('land2') + .3, { label: '(−4, 1)', dx: -10, dy: -18, anchor: 'end', into: w2 });
    say(w2, ['= (−4, 1)'], 250, 590, m('land2') + .5, { size: 36, fill: COL.task });
    carry(g, [-1, 2], w2, m('back') + .2, { color: COL.task, dur: 1.6, r: 9 });
  }],

  ['drag', 'Move a column, move the matrix', (m) => {
    const p = panel(0);
    text(p, 'Move a column, the matrix moves', 60, 110, .2, { size: 40, weight: 600 });
    const g = S.g = planeOf(p, A1);
    g.labels(['col 1', 'col 2']);
    const { PX, PY } = g.P;
    g.tips.forEach(t => { t._ring.style.opacity = 1; });   // the handles, as the reader will see them
    pointer(p, [PX(2), PY(1)], [PX(3), PY(0)], m('c1'), 1.6, m('grab') - .2, m('c1n') + 2);
    g.to({ a00: 3, a10: 0 }, m('c1'), 1.6);
    colFrame(p, g, 0, m('c1n'), m('grab2')); flash(g, 'a00', m('c1n')); flash(g, 'a10', m('c1n'));
    pointer(p, [PX(-1), PY(1)], [PX(1), PY(2)], m('c2'), 1.4, m('grab2') - .2, m('c2n') + 2);
    g.to({ a01: 1, a11: 2 }, m('c2'), 1.4);
    colFrame(p, g, 1, m('c2n'), m('scrub')); flash(g, 'a01', m('c2n')); flash(g, 'a11', m('c2n'));
    // a number, scrubbed sideways
    const [nx, ny] = [g.lay.A[0][0], g.lay.A[1][0]];
    pointer(p, [nx + 10, ny - 10], [nx + 10 - 44, ny - 10], m('scrubn') - 1.2, 1.6, m('scrub') + 1, m('scrubn') + 2.5, lin);
    frame(p, nx - 40, ny - 50, 80, 64, COLC[0], m('scrub') + 1, m('same'));
    g.to({ a00: 1 }, m('scrubn') - 1.2, 1.6, lin);
    thick(g.cols[0], m('same') + .4); thick(g.cols[1], m('same') + .4);

    build: pickPoint(S.g.P, [3, 1], '2·(1, 0) + 1·(1, 1) = (3, 1). By rows: 2 + 1 = 3 and 0 + 1 = 1.',
      (x, y) => x === 2 && y === 1 ? 'That is where the point starts. Where does A send it?' : `Not ${pair(x, y)}. Take 2 steps of column 1, (1, 0), then 1 step of column 2, (1, 1).`),
  }], done) }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [['A moves every point: x goes to Ax.', 'w1'], ['Straight lines stay straight; parallel lines stay parallel, evenly spaced.', 'w2'],
     ['Column 1 is where (1, 0) lands, column 2 where (0, 1) lands.', 'w3'], ['Stretch, flip, shear, turn, squash. Ax = b: find the x that lands on b.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 150 + i * 95, o: 0 });
      mk('circle', { cx: 150, cy: -12, r: 26, fill: COL.task }, g);
      T(g, String(i + 1), { x: 150, y: -1, size: 30, fill: COL.board, weight: 700, anchor: 'middle' });
      T(g, str, { x: 210, size: 32, weight: 600 });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
    const sm = G(p, { o: 0 });
    const k = grid2(sm, { A: I2, mat: [560, 610], size: 44, shape: true, plane: { cx: 1200, cy: 700, u: 30, x0: -5, x1: 5, y0: -5, y1: 5, labels: false } });
    show(sm, .3, .6);
    k.to(keysOf(A1), m('w1') + 1, 2);
    k.to({ a00: 3, a10: 0 }, m('w3') + 3.6, 1.2); k.to(keysOf(A1), m('w3') + 6.4, 1.2);
    thick(k.cols[0], m('w3') + .4); thick(k.cols[1], m('w3') + 1.6);
    k.to(keysOf([[2, 0], [0, 1]]), m('w4'), .8);
    k.to(keysOf([[1, 0], [0, 1]]), m('k2') - .1, .3); k.to(keysOf([[-1, 0], [0, 1]]), m('k2') + .2, .7);
    k.to(keysOf([[1, 0], [0, 1]]), m('k3') - .1, .3); k.to(keysOf([[1, 1], [0, 1]]), m('k3') + .2, .7);
    k.to(keysOf([[1, 0], [0, 1]]), m('k4') - .1, .3); k.turn(0, 90, m('k4') + .2, .8);
    k.to(keysOf([[1, 2], [2, 4]]), m('k5'), 1);
    const cap = G(sm, {});
    [['stretch', 'w4'], ['flip', 'k2'], ['shear', 'k3'], ['turn', 'k4'], ['squash', 'k5']].forEach(([w, mk_], i, arr) => {
      const c = text(cap, w, 1390, 708, m(mk_), { size: 30, weight: 600, fill: COL.chalk });
      hide(c, i < arr.length - 1 ? m(arr[i + 1][1]) - .1 : m('sol'), .2);
    });
    k.to(keysOf(A1), m('end') - 1, 1.2);
  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, LANDQ.map((q, k) => ({
    id: `p-land${k + 1}`, prompt: ['Where does ', $m('A'), ' = ', matEl(q.A), ' send each point?'],
    build: blanks(q.pts.map(pt => { const [X, Y] = mul(q.A, pt); return {
      parts: [`${pair(...pt)}   →   (`, { box: String(X) }, ', ', { box: String(Y) }, ')'],
      why: `${num(pt[0])}·col 1 + ${pt[1] < 0 ? `(${num(pt[1])})` : num(pt[1])}·col 2 = ${pair(X, Y)}`,
      hint: `By rows: (${q.A[0].map(num).join(', ')})·${pair(...pt)} for the first number, (${q.A[1].map(num).join(', ')})·${pair(...pt)} for the second.` }; })),
  })), done, 'Chapter practice · set 1 of 4') }],
  ['final2', 'Chapter practice', () => {}, { ask: done => quiz(SCREEN, [{
    id: 'p-kind', prompt: ['What does each matrix do to the plane?'],
    build: grid(KINDQ.map(q => ({ parts: [matEl(q.A, { size: 24 })], ans: q.ans, why: q.why })), KINDS, { multi: false, text: true }),
  }], done, 'Chapter practice · set 2 of 4') }],
  ['final3', 'Chapter practice', () => {
    const p = panel(0);
    text(p, 'Read the matrix', 60, 110, .2, { size: 40, weight: 600 });
    S.g = planeOf(p, I2, { showMat: false });
    S.g.labels(['col 1', 'col 2']);
  }, { ask: done => quiz(TOPL, READQ.map((A, k) => ({
    id: `p-read${k + 1}`, prompt: ['Which matrix moved the plane like this?'],
    build: (body, api) => {
      S.g.set(keysOf(A)); put(S.g.M, { o: 0 });
      return blanks([
        { parts: ['column 1  =  (', { box: String(A[0][0]) }, ', ', { box: String(A[1][0]) }, ')'], why: 'The green arrow: where (1, 0) lands.', hint: 'Column 1 is the tip of the green arrow.' },
        { parts: ['column 2  =  (', { box: String(A[0][1]) }, ', ', { box: String(A[1][1]) }, ')'], why: `The violet arrow. A = [${A[0].map(num).join(' ')}; ${A[1].map(num).join(' ')}].`, hint: 'Column 2 is the tip of the violet arrow.', fx: () => fx(S.g.M, { o: 1 }, 0, .5) },
      ])(body, api);
    },
  })), done, 'Chapter practice · set 3 of 4') }],
  ['final4', 'Chapter practice', () => {
    const p = panel(0);
    text(p, 'Make the move', 60, 110, .2, { size: 40, weight: 600 });
    S.g = planeOf(p, I2);
    S.g.labels(['col 1', 'col 2']);
  }, { ask: done => {
    const from = f => (body, api) => { S.g.set(keysOf(I2)); return f(body, api); };
    const is = (v, A) => v.a00 === A[0][0] && v.a01 === A[0][1] && v.a10 === A[1][0] && v.a11 === A[1][1];
    quiz(LEFT, [{
      id: 'p-turn', prompt: ['Make ', $m('A'), ' turn the plane a quarter turn ', h('b', '', 'clockwise'), '.'],
      build: from(g2Task(S.g, v => is(v, [[0, 1], [-1, 0]]), 'A = [0 1; −1 0]: (1, 0) goes down to (0, −1), (0, 1) goes right to (1, 0).',
        'Clockwise: (1, 0), pointing right, must end up pointing down, at (0, −1). Where must (0, 1) go?', () => S.g.set(keysOf([[0, 1], [-1, 0]])), ['A', 'cols'])),
    }, {
      id: 'p-tall', prompt: ['Make ', $m('A'), ' stretch the plane to 3 times its height, keeping widths.'],
      build: from(g2Task(S.g, v => is(v, [[1, 0], [0, 3]]), 'A = [1 0; 0 3]: (1, 0) stays, (0, 1) goes 3 times as high.',
        'Widths stay: (1, 0) stays where it is. Heights triple: (0, 1) goes to (0, 3).', () => S.g.set(keysOf([[1, 0], [0, 3]])), ['A', 'cols'])),
    }, {
      id: 'p-squash', prompt: ['Make ', $m('A'), ' squash the whole plane onto the line through ', $m('(1, 2)'), '.'],
      build: from(g2Task(S.g, v => (v.a00 || v.a10 || v.a01 || v.a11) && 2 * v.a00 === v.a10 && 2 * v.a01 === v.a11,
        'Both columns on the line through (1, 2) (multiples of it, like (1, 2) and (2, 4)): every point lands on that line.',
        'Put both column tips on the line through (0, 0) and (1, 2): points like (1, 2), (2, 4), (−1, −2). Not both at (0, 0).', () => S.g.set(keysOf([[1, 2], [2, 4]])), ['A', 'cols'])),
    }], done, 'Chapter practice · set 4 of 4');
  } }],
  ['play', 'Playground', (m, D) => {
    const p = panel(0);
    text(p, 'Playground', 60, 110, .2, { size: 40, weight: 600 });
    S.sys = planeOf(p, A1);
    S.sys.labels(['col 1', 'col 2']);
    const hint = text(p, 'try: a quarter turn · a flip · put one column on top of the other', 1160, 860, m('go'), { size: 24, fill: COL.dim, anchor: 'middle' });
    hide(hint, Math.min(m('go') + 9, D - .7), .6);
  }, { ask: playAsk(() => S.sys, { tip: 'The whole plane, live. Drag a column tip or change a number, or draw on the board. Nothing is marked.' }) }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
