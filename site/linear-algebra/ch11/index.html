<body>
<script src="../lib/engine.js"></script>
<script src="../lib/math.js"></script>

<script src="../lib/play.js"></script>

<script>
'use strict';
const CHAPTER = { number: 11, title: 'Three Unknowns: A Plane in Space', minutes: 12, language: 'en' , next: '../ch12/' };

/* ---------- chapter drawing helpers ---------- */
const BLUE = S3_ROW[0];                                         // the one equation's plane: blue, as row 1 everywhere in the book
const AXC = [COL.whole, COL.nat, COL.int];                      // the steps along x, y, z (as chapter 1's walk: x blue, y coral)
const VIEW = { yaw: 30, pitch: 24 };                            // x runs right and back, y left and back, z up: the origin's corner faces us
const CARD = { x: 40, y: 290, w: 720, cls: 'side' };            // question card under the one equation, beside the space
const say = (p, parts, x, y, t0, { size = 40, fill = COL.chalk, anchor = 'start' } = {}) => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const r1 = n => Math.round(n * 10) / 10;
const tri = q => `(${q.map(c => num(r1(c))).join(', ')})`;
// One equation a·x + b·y + c·z = d, top left, and its plane in space on the right.
const onePlane = (p, a, b, c, d, { t0 = .1, view = VIEW } = {}) => lin3(p, { rows: 1, A: [[a, b, c], [0, 0, 0], [0, 0, 0]], b: [d, 0, 0], eq: [90, 200], size: 50, space: { ...view }, t0 });
const flash = (sys, key, t0) => sys.num(key).forEach(e => { tw(e, { c_fill: COL.task }, t0, .25); tw(e, { c_fill: COL.chalk }, t0 + 1.2, .6); });
const glowPl = (pl, t0) => { prog(q => pl.width(3 + 5 * Math.sin(Math.PI * q)), t0, 1.2, lin); };
// Chalk dots where the plane crosses the three axes, following the numbers; labels keep tick numbers away.
const crossings = (sys, t0 = 0, { labels = true } = {}) => {
  const V = sys.space, g = G(V.content, { o: 0 });
  const dots = [0, 1, 2].map(() => V.point(null, { color: COL.chalk, r: 8, size: 24, into: g }));
  sys.onChange(v => [0, 1, 2].forEach(j => {
    const a = v[`a0${j}`], c = Math.abs(a) > 1e-6 ? v.b0 / a : null, ok = c !== null && Math.abs(c) <= V.R + 1e-6, q = [0, 0, 0];
    if (ok) q[j] = c;
    dots[j].set(ok ? q : null);
    if (ok && labels) dots[j].label(tri(q));
  }));
  V.avoid(proj => dots.filter(d => d.pos && labels).flatMap(d => { const q = proj(d.pos); return [[q[0] + 30, q[1] - 22], [q[0] + 75, q[1] - 22]]; }));
  show(g, t0, .4);
  return g;
};
const legend = (p, t0s, y0 = 610) => [['x', 'to the right'], ['y', 'away from you'], ['z', 'up']].map(([n, s], j) => {
  const g = G(p, { o: 0 });
  M(g, [n], { x: 90, y: y0 + j * 52, size: 36, fill: AXC[j], anchor: 'start' });
  T(g, s, { x: 130, y: y0 + j * 52, size: 28, fill: COL.dim });
  show(g, t0s[j]);
  return g;
});

/* ---------- practice data ---------- */
const YN = [['y', 'Yes', null, 'Y'], ['n', 'No', null, 'N']];
const ONQ = [
  { parts: ['Is ', $m('(4, 0, 0)'), ' on ', $m('x + 2y − z = 4'), '?'], ans: ['y'], why: '4 + 0 − 0 = 4. Yes: it is where the plane crosses the x-axis.' },
  { parts: ['Is ', $m('(1, 1, −1)'), ' on ', $m('x + 2y − z = 4'), '?'], ans: ['y'], why: '1 + 2 − (−1) = 1 + 2 + 1 = 4. Yes.' },
  { parts: ['Is ', $m('(2, 1, 1)'), ' on ', $m('x + 2y − z = 4'), '?'], ans: ['n'], why: '2 + 2 − 1 = 3, not 4.' },
  { parts: ['Is ', $m('(0, 0, 4)'), ' on ', $m('x + 2y − z = 4'), '?'], ans: ['n'], why: '0 + 0 − 4 = −4, not 4. Watch the minus in front of z.' },
  { parts: ['Is ', $m('(3, 1, 1)'), ' on ', $m('x + 2y − z = 4'), '?'], ans: ['y'], why: '3 + 2 − 1 = 4. Yes.' },
  { parts: ['Is ', $m('(1, 2, 0)'), ' on ', $m('x + 2y − z = 4'), '?'], ans: ['n'], why: '1 + 4 − 0 = 5, not 4. Order matters: the second number is y, and y is doubled.' },
];
const MISSQ = [
  { parts: ['x + y + z = 5,   x = 1,  y = 3:      z = ', { box: '1' }], why: '1 + 3 + z = 5, so z = 1.', hint: 'Put in x = 1 and y = 3: 4 + z = 5.' },
  { parts: ['2x + y + z = 6,   y = 0,  z = 0:      x = ', { box: '3' }], why: '2x = 6, so x = 3.', hint: 'With y and z both 0, only 2x is left: 2x = 6.' },
  { parts: ['x − y + z = 2,   x = 4,  z = 0:      y = ', { box: '2' }], why: '4 − y + 0 = 2, so y = 2.', hint: '4 − y = 2. What do you take away from 4 to leave 2?' },
  { parts: ['x + 2y + 3z = 6,   x = 0,  y = 0:      z = ', { box: '2' }], why: '3z = 6, so z = 2.', hint: 'Only 3z is left: 3z = 6.' },
  { parts: ['x + y − z = 0,   x = 2,  y = 1:      z = ', { box: '3' }], why: '2 + 1 − z = 0, so z = 3.', hint: '3 − z = 0. What must z be?' },
  { parts: ['3x − y + 2z = 1,   x = 1,  z = −1:      y = ', { box: '0' }], why: '3 − y − 2 = 1, so 1 − y = 1 and y = 0.', hint: '2 times −1 is −2. Then 3 − y − 2 = 1.' },
];
const CROSSQ = [
  { parts: ['2x + y + z = 4:     (', { box: '2' }, ', 0, 0),   (0, ', { box: '4' }, ', 0),   (0, 0, ', { box: '4' }, ')'], why: '2x = 4 gives x = 2;  y = 4;  z = 4.', hint: 'On each axis the other two letters are 0. On the x-axis: 2x = 4.' },
  { parts: ['x + 3y + 3z = 3:     (', { box: '3' }, ', 0, 0),   (0, ', { box: '1' }, ', 0),   (0, 0, ', { box: '1' }, ')'], why: 'x = 3;  3y = 3 gives y = 1;  3z = 3 gives z = 1.', hint: 'On the y-axis, x and z are 0: 3y = 3.' },
  { parts: ['−x + 2y + z = 2:     (', { box: '-2' }, ', 0, 0),   (0, ', { box: '1' }, ', 0),   (0, 0, ', { box: '2' }, ')'], why: '−x = 2 gives x = −2;  2y = 2 gives y = 1;  z = 2.', hint: 'On the x-axis: −x = 2. So x is negative.' },
];
const KINDQ = [
  { parts: [$m('z = −1')], ans: ['f'], why: 'Only z is there: x and y are free. A floor at height −1.' },
  { parts: [$m('x = 2')], ans: ['w'], why: 'z is missing, so z is free: the plane stands upright.' },
  { parts: [$m('x + y = 1')], ans: ['w'], why: 'No z: it is the floor line x + y = 1, stood up into a wall.' },
  { parts: [$m('x + z = 2')], ans: ['t'], why: 'z is there, and so is x: the plane leans, like a ramp. (It runs along y, the missing letter.)' },
  { parts: [$m('2z = 6')], ans: ['f'], why: 'Only z: z = 3, a floor at height 3.' },
  { parts: [$m('y − 2z = 0')], ans: ['t'], why: 'Both y and z are there: a tilted plane, running along x.' },
];
const KINDS = [['f', 'Floor', null, 'F'], ['w', 'Wall', null, 'W'], ['t', 'Tilted', null, 'T']];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Three unknowns: a plane in space', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unit 1, Chapter 11', { x: 800, y: 320, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Three Unknowns: A Plane in Space', { x: 800, y: 430, size: 80, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'one equation in x, y and z is a flat sheet in space', 800, 560, m('sub'), { size: 36, fill: COL.dim, anchor: 'middle' });
    // a line (two unknowns) that opens into a tilted sheet (three)
    const lg = G(scene, { x: 800, y: 690, o: 0 }), sh = path(lg, '', { stroke: BLUE, 'stroke-width': 5, fill: BLUE, 'fill-opacity': .22, 'stroke-linejoin': 'round' });
    const sheet = q => { const w = 160, h = 70 * q, sk = 60 * q; return `M${-w + sk} ${-h}L${w + sk} ${-h}L${w - sk} ${h}L${-w - sk} ${h}Z`; };
    sh.setAttribute('d', sheet(0));
    show(lg, m('sub') + 1.5, .4); tw(lg, { r: 8 }, m('sub') + 1.5, m('move') - m('sub') - 1, soft);
    prog(q => sh.setAttribute('d', sheet(q)), m('move') + .6, 1.4, io);
    tw(lg, { r: -8 }, m('move') + 2, 2.2, soft);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(lg, D - .9, .8);
  }],

  ['third', 'A third unknown', (m) => {
    const p = S.p = panel(0);
    text(p, 'One equation, three unknowns', 60, 110, .2, { size: 40, weight: 600 });
    const recap = G(p, {});
    say(recap, ['x + y = 4'], 90, 200, m('r0'), { size: 34, fill: COL.dim });
    say(recap, ['→  pairs  (1, 3), (2, 2), (4, 0) …'], 250, 200, m('rp'), { size: 34, fill: COL.dim });
    const rl = G(recap, { x: 300, y: 280 });
    const ld = path(rl, 'M-180 60L180 -60', { stroke: COL.whole, 'stroke-width': 5, 'stroke-linecap': 'round' }, { d: 0 });
    draw(ld, m('rl'), 1);
    [-120, -40, 40, 120].forEach((x, i) => { const c = mk('circle', { cx: x, cy: -x / 3, r: 8, fill: COL.chalk }, rl); put(c, { o: 0 }); show(c, m('rp') + .4 + i * .3, .3); });
    say(recap, ['→  a line'], 520, 290, m('rl') + .3, { size: 34, fill: COL.whole });
    hide(recap, m('eq') - .4, .4);
    say(p, ['x + y + z = 3'], 90, 200, m('eq'), { size: 54, fill: BLUE });
    const un = G(p, {});
    text(un, 'three unknowns:', 420, 196, m('eq') + 2.2, { size: 28, fill: COL.dim });
    ['x', 'y', 'z'].forEach((n, j) => { const e = say(un, [n], 668 + j * 44, 198, m('eq') + 2.8 + j * .5, { size: 36, fill: AXC[j], anchor: 'middle' }); pulse(e, m('eq') + 2.8 + j * .5); });
    hide(un, m('q') + 2, .5);
    const q = text(p, 'a solution gives a number to each letter', 90, 254, m('q'), { size: 28, fill: COL.dim });
    hide(q, m('x1') - .4, .4);
    const tx = [130, 230, 330, 500], ty = 300, rh = 64;
    const head = G(p, { o: 0 });
    ['x', 'y', 'z', 'x + y + z'].forEach((h, j) => M(head, [h], { x: tx[j], y: ty, size: 34, fill: j < 3 ? AXC[j] : COL.dim, anchor: 'middle' }));
    path(head, `M70 ${ty + 18}H660`, { stroke: COL.faint, 'stroke-width': 2 });
    show(head, m('q'));
    const qs = G(p, {});
    [0, 1, 2].forEach(j => { const e = M(qs, ['?'], { x: tx[j], y: ty + 66, size: 38, fill: COL.dim, anchor: 'middle', o: 0 }); show(e, m('q') + .5 + j * .3, .3); pulse(e, m('q') + 2 + j * .4); });
    hide(qs, m('x1') - .2, .2);
    const rows = [[1, 1, 1], [3, 0, 0], [0, 2, 1], [2, 2, -1]];
    const at = [[m('x1'), m('x1') + .8, m('z1'), m('ok1')], ...[m('r2'), m('r3'), m('r4')].map(t => [t, t + .5, t + 1, t + 2])];
    rows.forEach((r, i) => {
      const yy = ty + 66 + i * rh;
      r.forEach((c, j) => say(p, [num(c)], tx[j], yy, at[i][j], { size: 38, anchor: 'middle', fill: AXC[j] }));
      say(p, [`${r.map((c, j) => j && c < 0 ? `(${num(c)})` : num(c)).join(' + ')} = 3`], tx[3], yy, at[i][3], { size: 32, anchor: 'middle' });
      if (!i) { const w = say(p, ['1 + 1 + z = 3'], tx[3], yy, m('x1') + 3.2, { size: 32, anchor: 'middle', fill: COL.dim }); hide(w, at[0][3] - .2, .2); }
      text(p, '✓', 640, yy, at[i][3] + .3, { size: 34, fill: COL.good, anchor: 'middle', weight: 700 });
    });
    // while the first row is worked out, its triple builds large on the right: x, then y, then the z it forces
    const big = G(p, {}), bigX = [1035, 1085, 1120, 1170, 1205, 1255, 1295];
    ['(', '1', ',', '1', ',', '', ')'].forEach((c, k) => { if (c) say(big, [c], bigX[k], 420, k === 1 ? m('x1') : k === 3 ? m('x1') + .8 : m('x1'), { size: 72, fill: k % 2 ? AXC[(k - 1) / 2] : COL.chalk, anchor: 'middle' }); });
    const zq = say(big, ['?'], bigX[5], 420, m('x1') + 1.2, { size: 72, fill: COL.dim, anchor: 'middle' }); hide(zq, m('z1') + .2, .3);
    say(big, ['1'], bigX[5], 420, m('z1') + .3, { size: 72, fill: AXC[2], anchor: 'middle' });
    hide(big, m('tri') - .4, .4);
    text(p, 'solutions: triples', 1160, 250, m('tri') - .3, { size: 30, fill: COL.dim, anchor: 'middle' });
    // each row's numbers fly into its chip as the row is checked
    rows.forEach((r, i) => r.forEach((c, j) => {
      const t = i ? at[i][3] + .2 : m('tri'), cx_ = 1030 + (i % 2) * 260, cy_ = 343 + Math.floor(i / 2) * 100;
      const f = M(p, [num(c)], { x: tx[j], y: ty + 66 + i * rh, size: 38, fill: AXC[j], anchor: 'middle', o: 0 });
      tw(f, { o: 1 }, t, .1); tw(f, { x: cx_ + (j - 1) * 34, y: cy_ }, t + .1 * j, .9); hide(f, t + 1.1, .2);
    }));
    rows.forEach((r, i) => {
      const c = chip(p, [tri(r)], COL.chalk, { x: 1030 + (i % 2) * 260, y: 330 + Math.floor(i / 2) * 100, size: 38 });
      put(c, { o: 0, s: .6 });
      tw(c, { o: 1, s: 1 }, (i ? at[i][3] + .2 : m('tri')) + 1.1, .5, back);
    });
    text(p, 'x first, then y, then z', 1160, 486, m('tri') + 3, { size: 24, fill: COL.dim, anchor: 'middle' });
    const tl = text(p, 'a triple', 1030, 400, m('r2') - 2.2, { size: 26, fill: COL.chalk, anchor: 'middle', weight: 600 });
    hide(tl, m('r2') + 1.5, .4);
    [[0, 0, 1], [1, 0, 2], [3, 1, -1], [5, -1, -1], [-1, 2, 2], [4, -2, 1]].forEach((r, i) => {
      const c = chip(p, [tri(r)], COL.dim, { x: 990 + (i % 3) * 190, y: 580 + Math.floor(i / 3) * 66, size: 26 });
      put(c, { o: 0, s: .5 }); tw(c, { o: .8, s: 1 }, m('many') + .6 + i * .45, .4, back);
    });
    text(p, '… and endlessly many more', 1180, 730, m('many') + 3.6, { size: 30, fill: COL.chalk, anchor: 'middle', weight: 600 });
    text(p, 'a pair is a point on a flat plane. A triple?', 1180, 805, m('many') + 7, { size: 30, fill: COL.chalk, anchor: 'middle', weight: 600 });
  }],

  ['space', 'Space has three directions', (m) => {
    const p = panel(0);
    text(p, 'A third direction: up', 60, 110, .2, { size: 40, weight: 600 });
    const V = S.V = space3(p, { yaw: 0, pitch: 90, t0: .1 });
    put(V.axes[2], { o: 0 }); put(V.cube, { o: 0 });
    V.poly([[-4, -4, 0], [4, -4, 0], [4, 4, 0], [-4, 4, 0]], { color: COL.chalk, fo: .06, w: 0 });   // the sheet of paper that is laid down
    const pt = V.point([2, 1, 0], { color: COL.chalk, label: '(2, 1)' });
    // the walk of chapter 1, on the flat plane seen from above
    V.walk([2, 1, 0], m('pt'), { dur: 1.4, dot: false, w: 4 });
    const p2 = say(p, ['(2, 1)'], 90, 210, m('pt') + .6, { size: 46, fill: COL.chalk });
    hide(p2, m('floor') + .3, .3); say(p, ['(2, 1, 0)'], 90, 210, m('floor') + .5, { size: 46, fill: COL.chalk });
    put(pt.e, { o: 0 }); show(pt.e, m('pt') + 1.3, .3);
    [[0, 'xr'], [1, 'yu']].forEach(([j, mk_]) => {
      const a = V.line(null, null, { color: AXC[j], w: 7, into: V.content, head: true }), e = [0, 0, 0];
      prog(q => { e[j] = 4.6 * q; a.set([0, 0, 0], [...e]); }, m(mk_), .9, io);
      tw(a.e, { o: 0 }, m(mk_) + 1.6, .5);
    });
    V.turn({ pitch: VIEW.pitch, yaw: VIEW.yaw }, m('lay'), 2.6);   // straight from above to the chapter's view: y and z never overlap on screen
    const yl = V.line(null, null, { color: AXC[1], w: 7, into: V.content, head: true });
    prog(q => yl.set([0, 0, 0], [0, 4.6 * q, 0]), m('back'), 1, io);
    tw(yl.e, { o: 0 }, m('up') + 2, .6);
    show(V.axes[2], m('up'), .5); show(V.cube, m('up') + .4, .8);
    const zl = V.line(null, null, { color: AXC[2], w: 7, into: V.content, head: true });
    prog(q => zl.set([0, 0, 0], [0, 0, 4.6 * q]), m('up'), 1.1, io);
    tw(zl.e, { o: 0 }, m('floor') + 1.5, .6);
    legend(p, [m('lay') + 1.4, m('back'), m('up')], 330);
    const fl = G(p, { o: 0 });
    T(fl, 'the floor:  z = 0', { x: 90, y: 540, size: 34, weight: 600, fill: COL.chalk });
    show(fl, m('floor'));
    tw(V.floor, { 'a_stroke-opacity': .35 }, m('floor'), .4); tw(V.floor, { 'a_stroke-opacity': .09 }, m('floor') + 1.4, .8);
    prog(() => { pt.label('(2, 1, 0)'); }, m('floor') + .5, 0, lin);
    V.sway(4, 9, m('lay') + 2.6);
    V.turn({ yaw: VIEW.yaw - 15, pitch: VIEW.pitch }, m('turn'), 3.2);   // not below 15: y would run up the z axis
    V.turn({ yaw: VIEW.yaw + 20 }, m('turn') + 3.2, 3.6);
    V.turn({ yaw: VIEW.yaw }, m('turn') + 6.8, 2.4);
  }],

  ['point', 'Finding a point in space', (m) => {
    const p = panel(0);
    text(p, 'A point in space: three numbers', 60, 110, .2, { size: 40, weight: 600 });
    const V = space3(p, { ...VIEW, t0: .1 });
    V.sway(5, 11);
    const c1 = say(p, ['(2, 1, 3)'], 90, 210, .4, { size: 54, fill: COL.chalk });
    const O = V.point(null, { color: COL.chalk, r: 7 });
    prog(() => O.set([0, 0, 0]), m('o'), 0, lin); pulse(O.e, m('o'));
    const w1 = V.walk([2, 1, 3], 0, { at: [m('x'), m('y'), m('z')], dur: 3, label: '(2, 1, 3)', color: COL.chalk, w: 8 });
    const steps = [['2', 'steps along x'], ['1', 'step along y, away'], ['3', 'steps up']];
    const st1 = G(p, {});
    steps.forEach(([n, s], j) => { say(st1, [n], 110, 300 + j * 56, m(['x', 'y', 'z'][j]), { size: 40, fill: AXC[j], anchor: 'middle' }); text(st1, s, 150, 300 + j * 56, m(['x', 'y', 'z'][j]) + .2, { size: 28, fill: COL.dim }); });
    const shd = V.point(null, { color: COL.dim, r: 7, label: '(2, 1, 0)', size: 22, dy: 26 });
    prog(() => shd.set([2, 1, 0]), m('shadow'), 0, lin);
    const sn = text(p, 'its shadow on the floor: (2, 1, 0)', 90, 500, m('shadow') + .4, { size: 28, fill: COL.dim });
    pulse(w1.dot.e, m('here'));
    V.turn({ yaw: VIEW.yaw + 55, pitch: 12 }, m('turn'), 3);
    V.turn({ yaw: VIEW.yaw - 10, pitch: VIEW.pitch }, m('ex2') - .2, 2.2);
    [st1, sn].forEach(e => hide(e, m('ex2') - .4, .4));
    tw(w1.dot.e, { o: .5 }, m('ex2'), .4); tw(c1, { o: .5 }, m('ex2'), .4);   // the first point steps back for the second
    say(p, ['(−1, 2, −2)'], 360, 210, m('ex2'), { size: 54, fill: COL.chalk });
    const w2 = V.walk([-1, 2, -2], 0, { at: [m('x2'), m('y2'), m('z2')], dur: 3, label: '(−1, 2, −2)', color: COL.chalk, w: 8 });
    const steps2 = [['−1', 'step along x: to the left'], ['2', 'steps along y, away'], ['−2', 'steps: down, below the floor']];
    steps2.forEach(([n, s], j) => { say(p, [n], 110, 300 + j * 56, m(['x2', 'y2', 'z2'][j]), { size: 40, fill: AXC[j], anchor: 'middle' }); text(p, s, 150, 300 + j * 56, m(['x2', 'y2', 'z2'][j]) + .2, { size: 28, fill: COL.dim }); });
    pulse(w2.dot.e, m('here2'));
    text(p, 'one triple  =  one point in space', 90, 560, m('here2'), { size: 34, weight: 600, fill: COL.chalk });
    V.sway(8, 12, m('here2'));
  }],

  ['cloud', 'The solutions make a plane', (m) => {
    const p = panel(0);
    text(p, 'The solutions make a flat sheet', 60, 110, .2, { size: 40, weight: 600 });
    const sys = S.sys = onePlane(p, 1, 1, 1, 3);
    const V = sys.space, pl = sys.planes[0];
    V.sway(5, 12);
    pl.fade(0, 0, 0); pl.fade(1, m('plane') + .3, 1.2);

    build: lin3Task(S.sys, v => v.a02 === 0 && v.a00 !== 0 && v.a01 === -v.a00 && v.b0 === v.a00, 'x − y + 0z = 1: z is missing, so z is free and the line stands up.',
      'A wall has no z: put 0 in front of z. Then the rest is the line x − y = 1.', () => S.sys.set({ a00: 1, a01: -1, a02: 0, b0: 1 })),
  }], done, 'Chapter practice · set 4 of 4') }],
  ['play', 'Playground', (m) => {
    const p = panel(0);
    text(p, 'Playground', 60, 110, .2, { size: 40, weight: 600 });
    S.sys = onePlane(p, 1, 1, 1, 3);
    crossings(S.sys, .3);
    S.sys.space.sway(5, 16);
    const hint = text(p, 'try: make a floor, make it pass through (0, 0, 0), make a wall', 90, 330, m('go'), { size: 28, fill: COL.dim });
    hide(hint, m('go') + 7, .6);
  }, { ask: playAsk(() => S.sys, { tip: 'Your plane. Change any number, drag the plane by its edge, turn the space, or draw on the board. Nothing is marked.' }) }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
</script>
