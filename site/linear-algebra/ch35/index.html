<script>
'use strict';
const CHAPTER = { number: 35, title: 'The Transpose', minutes: 11, language: 'en', next: '../ch36/' };

/* ---------- chapter helpers ---------- */
const A1 = [[1, 2, 3], [4, 5, 6]];                                  // the first example: 2 × 3, Aᵀ = [1 4; 2 5; 3 6]
const SQ = [[1, 2, 7], [3, 4, 5], [6, 8, 9]];                       // square: the mirror across the diagonal
const PA = [[2, 1], [-1, 3]];                                       // the plane: columns (2, −1), (1, 3); rows (2, 1), (−1, 3)
const OA = [[1, 2], [0, 1]], OB = [[1, 0], [3, 1]];                 // (AB)ᵀ: AB = [7 2; 3 1], BᵀAᵀ = [7 3; 2 1], AᵀBᵀ = [1 3; 2 7]
const ZA = [[1, 0, 2], [0, 1, 1]], ZB = [[1, 1], [2, 0], [0, 3]];  // sizes: AB = [1 7; 2 3], BᵀAᵀ = [1 2; 7 3]
const tr = M_ => M_[0].map((_, j) => M_.map(r => r[j]));
const mul = (X, Y) => X.map(r => Y[0].map((_, j) => r.reduce((t, v, k) => t + v * Y[k][j], 0)));
const AT = [140, 300];                                              // A and Aᵀ, large, on the left; notes on the right from x 900
const CARD = { x: 40, y: 450, w: 740, cls: 'side' };
const say = (p, parts, x, y, t0, { size = 40, fill = COL.chalk, anchor = 'start' } = {}) => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const title = (p, str) => text(p, str, 60, 110, .2, { size: 40, weight: 600 });
// A beat that carries on the last beat's panel names itself: the old title fades, the new one comes in.
const retitle = str => { hide(S.title, .1, .3); S.title = text(S.p, str, 60, 110, .35, { size: 40, weight: 600 }); };
// A copy of A's number (i, j) flies on an arc to its place in Aᵀ, row j, column i, and fades there.
const ghost = (p, T_, i, j, t0, { size = 54, dur = 1.3, lift = 90 } = {}) => {
  const { a, t } = T_.L, x1 = a.cx(j), y1 = a.ry(i), x2 = t.cx(i), y2 = t.ry(j);
  const e = M(p, [num(T_.v[`a${i}${j}`])], { x: x1, y: y1, size, fill: MMT_ROW[i], o: 0 });
  prog(q => put(e, { x: x1 + (x2 - x1) * q, y: y1 + (y2 - y1) * q - lift * Math.sin(Math.PI * q), o: q <= 0 || q >= 1 ? 0 : Math.min(1, q / .08, (1 - q) / .12) }), t0, dur, io);
  return e;
};
// A chalk ring around a box, drawn on at t0.
const ring = (p, x, y, w, h, t0, color = COL.chalk) => { const r = path(p, `M${x + 14} ${y}H${x + w - 14}Q${x + w} ${y} ${x + w} ${y + 14}V${y + h - 14}Q${x + w} ${y + h} ${x + w - 14} ${y + h}H${x + 14}Q${x} ${y + h} ${x} ${y + h - 14}V${y + 14}Q${x} ${y} ${x + 14} ${y}Z`, { stroke: color, 'stroke-width': 3, fill: 'none' }, { d: 0 }); draw(r, t0, .6); return r; };
// A curved arrow from (x1, y1) to (x2, y2), bulging by `bend`, drawn on at t0.
const bow = (p, x1, y1, x2, y2, t0, { bend = -60, color = COL.chalk, w = 3 } = {}) => {
  const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, L = Math.hypot(x2 - x1, y2 - y1), nx = -(y2 - y1) / L, ny = (x2 - x1) / L;
  const cx = mx + nx * bend, cy = my + ny * bend, tx = x2 - cx, ty = y2 - cy, tl = Math.hypot(tx, ty), ux = tx / tl, uy = ty / tl;
  const g = G(p, {});
  draw(path(g, `M${x1} ${y1}Q${cx} ${cy} ${x2} ${y2}`, { stroke: color, 'stroke-width': w, fill: 'none' }, { d: 0 }), t0, .6);
  const hd = path(g, `M${x2 - 14 * ux - 8 * uy} ${y2 - 14 * uy + 8 * ux}L${x2} ${y2}L${x2 - 14 * ux + 8 * uy} ${y2 - 14 * uy - 8 * ux}`, { stroke: color, 'stroke-width': w, fill: 'none' });
  put(hd, { o: 0 });
  show(hd, t0 + .5, .2);
  return g;
};
// The size label under a matrix of mmT / mm: a ring around "m × n".
const sizeRing = (p, Mx, y, t0) => ring(p, Mx.x + Mx.W / 2 - 58, y - 32, 116, 44, t0);
// Thicken an arrow of mmT's plane for a moment.
const thick = (tp, t0) => { const w = tp.dash ? 4 : 6; tw(tp.shaft, { 'a_stroke-width': w + 5 }, t0, .3); tw(tp.shaft, { 'a_stroke-width': w }, t0 + 1.2, .6); };
// mmT's plane arrows hidden, to be shown on their words
const hideArrows = T_ => [...T_.arrows.cols, ...T_.arrows.rows].forEach(tp => put(tp.ag, { o: 0 }));
// The transpose of a product shown beside it: a hidden mmT whose A sits exactly on P_'s product, its Aᵀ beside.
const flipOf = (p, P_, { size, rh, names = ['AB', '(AB)ᵀ'], gap = 90, hideT = true, t0 = .1 } = {}) => {
  const L = P_.L;
  const TT = mmT(p, { A: P_.C(), at: [L.c.x, L.c.ry(0)], size, cw: L.c.c, rh, gap, names, tint: null, sizes: false, hideT, t0 });
  put(TT.L.a.g, { o: 0 });
  P_.onChange(() => { const c = P_.C(); if (c) TT.set(Object.fromEntries(c.flatMap((r, i) => r.map((v, j) => [`a${i}${j}`, v])))); });
  return TT;
};
const target = (P2, [x, y], into, t0 = .3) => {
  const g = G(into, { x: P2.PX(x), y: P2.PY(y), o: 0 });
  mk('circle', { r: 18, fill: 'none', stroke: COL.task, 'stroke-width': 3, 'stroke-dasharray': '5 5' }, g);
  T(g, `target (${num(x)}, ${num(y)})`, { x: 24, y: 40, size: 22, fill: COL.task, font: MATH });
  show(g, t0, .4);
  return g;
};
const matEl = rows => mmEl(rows, { size: 22 });
// blanks() writes a row's parts as math text and drops a drawn matrix (mmEl), so a row that shows one becomes its own
// question with the matrix in its prompt; rows without a matrix stay together in one question.
const blankQs = (id, prompt, rows) => {
  const qs = [], plain = [];
  const flush = () => { if (plain.length) qs.push({ id: `${id}${qs.length + 1}`, prompt: [prompt], build: blanks(plain.splice(0)) }); };
  rows.forEach(r => {
    const k = r.parts.findLastIndex(p => p instanceof Element);
    if (k < 0) { plain.push(r); return; }
    flush();
    const head = r.parts.slice(0, k + 1), rest = r.parts.slice(k + 1);
    if (typeof rest[0] === 'string') rest[0] = rest[0].replace(/^[\s.,]+/, '');
    qs.push({ id: `${id}${qs.length + 1}`, prompt: [prompt + '   ', ...(head[0] instanceof Element ? ['A = '] : []), ...head], build: blanks([{ ...r, parts: rest }]) });
  });
  flush();
  return qs;
};

/* ---------- practice data (every answer read off twice: by rows of A and by columns of Aᵀ) ---------- */
const TRQ = [
  { parts: [matEl([[2, -1], [0, 5]]), '   Aᵀ:  row 1 = (', { box: '2' }, ', ', { box: '0' }, '),   row 2 = (', { box: '-1' }, ', ', { box: '5' }, ')'],
    why: 'Column 1 of A is (2, 0): that is row 1 of Aᵀ. Column 2 is (−1, 5).', hint: 'Row 1 of Aᵀ is column 1 of A: read down the first column.' },
  { parts: [matEl([[1, 4, -3]]), '   Aᵀ is one column:  (', { box: '1' }, ', ', { box: '4' }, ', ', { box: '-3' }, ') standing up'],
    why: 'A row of three numbers stands up as a column of three: 1, 4, −3 from the top.', hint: 'The one row of A becomes the one column of Aᵀ, in the same order.' },
  { parts: [matEl([[3, 1], [0, 2], [-4, 6]]), '   Aᵀ:  row 1 = (', { box: '3' }, ', ', { box: '0' }, ', ', { box: '-4' }, '),   row 2 = (', { box: '1' }, ', ', { box: '2' }, ', ', { box: '6' }, ')'],
    why: 'A is 3 × 2, so Aᵀ is 2 × 3. Its rows are A’s columns: (3, 0, −4) and (1, 2, 6).', hint: 'Aᵀ has two rows: the two columns of A, read from the top down.' },
  { parts: [matEl([[0, 7, 1], [2, 0, 0], [5, 3, 0]]), '   Aᵀ:  row 2 = (', { box: '7' }, ', ', { box: '0' }, ', ', { box: '3' }, '),   row 3 = (', { box: '1' }, ', ', { box: '0' }, ', ', { box: '0' }, ')'],
    why: 'Row 2 of Aᵀ is column 2 of A: (7, 0, 3). Row 3 is column 3: (1, 0, 0).', hint: 'Row 2 of Aᵀ is column 2 of A, row 3 is column 3.' },
];
const SIZEQ = [
  { parts: ['A is 4 × 2.   Aᵀ is ', { box: '2' }, ' × ', { box: '4' }], why: 'Rows and columns trade: 4 rows of 2 become 2 rows of 4.', hint: 'The two numbers of the size swap places.' },
  { parts: ['A is 1 × 5 (one row).   Aᵀ is ', { box: '5' }, ' × ', { box: '1' }], why: 'One row of five numbers stands up as one column of five.', hint: 'The two numbers of the size swap places: a row becomes a column.' },
  { parts: ['Row 3, column 1 of Aᵀ is the number in row ', { box: '1' }, ', column ', { box: '3' }, ' of A'], why: 'Swap the address: row 3, column 1 of Aᵀ is row 1, column 3 of A.', hint: 'Swap the two numbers of the address.' },
  { parts: [matEl([[6, 2, 9], [1, 8, 4]]), '   row 3, column 2 of Aᵀ = ', { box: '4' }], why: 'It is row 2, column 3 of A: the 4.', hint: 'Swap the address: look in row 2, column 3 of A.' },
  { parts: [matEl([[1, 2], [3, 4]]), '   (Aᵀ)ᵀ:  row 1 = (', { box: '1' }, ', ', { box: '2' }, ')'], why: 'Two flips undo each other: (Aᵀ)ᵀ = A, so row 1 is (1, 2) again.', hint: 'Flip once: (1, 3) is row 1. Flip again: back to A.' },
];
const TFQ = [
  { parts: ['The transpose of a 2 × 3 matrix is 3 × 2.'], ans: ['t'], why: 'Rows and columns trade, so the size numbers swap.' },
  { parts: ['On a square matrix, the numbers on the main diagonal stay in place.'], ans: ['t'], why: 'Their address is row k, column k: swapping it changes nothing.' },
  { parts: ['(AB)ᵀ = AᵀBᵀ for every A and B.'], ans: ['f'], why: 'The order turns around: (AB)ᵀ = BᵀAᵀ. Chapter example: AᵀBᵀ gave (1, 3), (2, 7), not (7, 3), (2, 1).' },
  { parts: ['The transpose of a column is a row.'], ans: ['t'], why: 'n × 1 becomes 1 × n: the same numbers lying down.' },
  { parts: ['(Aᵀ)ᵀ = A.'], ans: ['t'], why: 'Flip twice and every number is back in its place.' },
  { parts: ['Iᵀ = I (the identity).'], ans: ['t'], why: 'Its 1s are on the diagonal and stay; every other number is 0, and a 0 lands on a 0.' },
];
const PRODQ = [
  { parts: ['A = ', matEl([[1, 1], [0, 2]]), ',  B = ', matEl([[3, 0], [1, 1]]), '.   BᵀAᵀ:  row 1 = (', { box: '4' }, ', ', { box: '2' }, '),  row 2 = (', { box: '1' }, ', ', { box: '2' }, ')'],
    why: 'AB = (4, 1), (2, 2). BᵀAᵀ = (AB)ᵀ = (4, 2), (1, 2). Check one: row 1 of Bᵀ (3, 1) times column 1 of Aᵀ (1, 1) = 3 + 1 = 4.', hint: 'Easiest: find AB first, then flip it. BᵀAᵀ is (AB)ᵀ.' },
  { parts: ['A = ', matEl([[2, 0], [1, 3]]), ',  x = (1, 2) as a column.   xᵀAᵀ = (', { box: '2' }, ', ', { box: '7' }, ')'],
    why: 'Ax = (2, 7) as a column. xᵀAᵀ = (Ax)ᵀ: the same numbers as a row.', hint: 'xᵀAᵀ is the transpose of Ax. Work out Ax, then lay it down as a row.' },
  { parts: ['A is 2 × 3,  B is 3 × 5.   (AB)ᵀ is ', { box: '5' }, ' × ', { box: '2' }, ',   Bᵀ is ', { box: '5' }, ' × ', { box: '3' }],
    why: 'AB is 2 × 5, so (AB)ᵀ is 5 × 2. Bᵀ is 5 × 3, and BᵀAᵀ = (5 × 3)(3 × 2) = 5 × 2 agrees.', hint: 'Find the size of AB first (outside numbers), then swap. For Bᵀ, swap B’s size.' },
];
const HANDQ = [
  { id: 'p-hand1', start: { mA: 2, nA: 2, a00: 1, a01: 0, a10: 0, a11: 1 }, prompt: ['Change A until Aᵀ = ', matEl([[1, 4], [-2, 0]]), '.'],
    test: (v, T_) => v.mA === 2 && v.nA === 2 && T_.T(0, 0) === 1 && T_.T(0, 1) === 4 && T_.T(1, 0) === -2 && T_.T(1, 1) === 0,
    why: 'A = (1, −2), (4, 0): its columns (1, 4) and (−2, 0) are the rows of Aᵀ.', hint: 'Row 1 of Aᵀ, (1, 4), must be column 1 of A. You can also type straight into Aᵀ.',
    ans: { a00: 1, a01: -2, a10: 4, a11: 0 } },
  { id: 'p-hand2', start: { mA: 2, nA: 2, a00: 1, a01: 0, a10: 0, a11: 1 }, prompt: ['Make column 2 of Aᵀ (the coral dashed arrow) end at (−3, 2). Drag it, or change numbers.'],
    test: v => v.mA === 2 && v.nA === 2 && v.a10 === -3 && v.a11 === 2,
    why: 'Column 2 of Aᵀ is row 2 of A: (−3, 2) across the bottom of A.', hint: v => v.a01 === -3 && v.a11 === 2 ? 'That moved the violet arrow, column 2 of A. The coral dashed one is row 2 of A: the bottom row.' : 'The coral dashed arrow is row 2 of A. Its numbers are the bottom row of A.',
    ans: { a10: -3, a11: 2 } },
  { id: 'p-hand3', start: { mA: 2, nA: 2, a00: 1, a01: 0, a10: 0, a11: 1 }, prompt: ['Change the size and the numbers of A so that Aᵀ is the row (1, 2, 3).'],
    test: v => v.mA === 3 && v.nA === 1 && v.a00 === 1 && v.a10 === 2 && v.a20 === 3,
    why: 'A must be the column (1, 2, 3): 3 × 1. Its transpose lies down as a row.', hint: v => v.mA === 1 && v.nA === 3 ? 'A is a row now, so Aᵀ is a column. Make A the column: 3 rows, 1 column.' : 'Aᵀ is 1 × 3, so A must be 3 × 1: three rows, one column. Change the size numbers under A.',
    ans: { mA: 3, nA: 1, a00: 1, a10: 2, a20: 3 } },
];

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'The transpose', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unit 5 · Transposes, permutations, spaces', { x: 800, y: 205, size: 24, fill: COL.faint, anchor: 'middle' });
    T(g, 'Unit 5, Chapter 35', { x: 800, y: 250, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'The Transpose', { x: 800, y: 360, size: 88, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'rows become columns', 800, 460, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    const lg = G(scene, { o: 0 });
    const T0 = mmT(lg, { A: A1, at: [586, 640], size: 36, cw: 56, rh: 52, gap: 100, hideT: true, sizes: false, t0: 0 });
    show(lg, m('sub') + .6, .5);
    T0.show('row', 0, m('move')); T0.show('row', 1, m('move') + 1.4); T0.show(null, null, m('move') + 3.2);
    T0.fly(m('move') + .2, { by: 'rows', step: 1.4, dur: .9 });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(lg, D - .9, .8);
  }],

  ['recall', 'Rows and columns', (m) => {
    const p = S.p = panel(0);
    S.title = title(p, 'Rows and columns, again');
    const T_ = S.T = mmT(p, { A: A1, at: AT, size: 54, cw: 86, rh: 76, gap: 200, hideT: true, t0: m('A') - .4 });
    put(T_.L.t.g, { o: 0 });
    const a = T_.L.a;
    [0, 1].forEach(i => text(p, `row ${i + 1}`, a.x - 16, a.ry(i) - 8, m(`r${i + 1}`), { size: 26, fill: MMT_ROW[i], anchor: 'end', weight: 600 }));
    T_.show('row', 0, m('r1'), { side: 'a' }); T_.show('row', 1, m('r2'), { side: 'a' });
    [0, 1, 2].forEach(j => { T_.show('col', j, m(`c${j + 1}`), { side: 'a' }); text(p, `col ${j + 1}`, a.cx(j), T_.L.bottom + 44, m(`c${j + 1}`), { size: 24, fill: COL.dim, anchor: 'middle', weight: 600 }); });
    T_.show(null, null, m('size'));
    const n = S.note = G(p, {});
    hide(sizeRing(p, a, T_.L.bottom - 12, m('size')), m('last') - .3, .3);
    const s1 = G(n, { o: 0 });
    M(s1, ['2 × 3'], { x: 900, y: 300, size: 44, fill: COL.chalk, anchor: 'start' });
    T(s1, '2 rows, 3 columns: rows first', { x: 900, y: 350, size: 28, fill: COL.dim, weight: 600 });
    show(s1, m('size') + .3, .4); hide(s1, m('last') - .3, .3);
    // chapter 34: the permutation P and its flip
    const P3 = [[0, 0, 1], [1, 0, 0], [0, 1, 0]], s2 = G(n, { o: 0 });
    T(s2, 'chapter 34', { x: 900, y: 270, size: 26, fill: COL.dim, weight: 600 });
    const TP = mmT(s2, { A: P3, at: [900, 350], size: 32, cw: 48, rh: 44, gap: 90, names: ['P', 'Pᵀ'], tint: null, sizes: false, hideT: true, t0: 0 });
    TP.diag(m('last') + 2.2);
    TP.fly(m('last') + 3, { by: 'rows', step: 1.2, dur: 1 });
    TP.show('diag', null, m('last') + 7.4); TP.show(null, null, m('last') + 9);
    T(s2, 'flipped across its diagonal', { x: 900, y: 520, size: 28, fill: COL.chalk, weight: 600 });
    show(s2, m('last') + .2, .5);
  }],

  ['flip', 'Rows stand up as columns', (m) => {
    const p = S.p, T_ = S.T, { a, t } = T_.L;
    hide(S.note, .1, .4); retitle('Rows stand up as columns');
    show(t.g, m('r1') + .3, .4);
    T_.show('row', 0, m('r1')); T_.show('row', 1, m('r2'));
    T_.fly(m('c1'), { by: (i, j) => (i ? m('c2') - m('c1') : 0) + j * .2, dur: 1.1 });
    bow(p, a.x + a.W + 24, T_.L.midY + 10, t.x - 24, T_.L.midY + 10, m('c1') - .4, { bend: -50 });
    T_.show(null, null, m('name'));
    const n = S.note = G(p, {});
    const nm = G(n, { o: 0 });
    M(nm, ['Aᵀ'], { x: 900, y: 320, size: 54, anchor: 'start' });
    T(nm, 'say: “A transpose”', { x: 900, y: 372, size: 28, fill: COL.dim, weight: 600 });
    show(nm, m('name') + .2, .4);
    sizeRing(p, a, T_.L.bottom - 12, m('size')); sizeRing(p, t, T_.L.bottom - 12, m('size') + .5);
    const sz = G(n, { o: 0 });
    M(sz, ['2 × 3  →  3 × 2'], { x: 900, y: 560, size: 40, anchor: 'start' });
    T(sz, 'the size numbers swap too', { x: 900, y: 606, size: 28, fill: COL.dim, weight: 600 });
    show(sz, m('size') + 1, .4);
  }],

  ['cols', 'Columns lie down as rows', (m) => {
    const p = S.p, T_ = S.T, { t } = T_.L;
    hide(S.note, .1, .4); retitle('Columns lie down as rows');
    [0, 1, 2].forEach(j => {
      T_.show('col', j, m(`col${j + 1}`), { side: 'a' });
      T_.show('col', j, m(`row${j + 1}`));
      text(p, `row ${j + 1}`, t.x + t.W + 16, t.ry(j) - 8, m(`row${j + 1}`), { size: 24, fill: COL.dim, weight: 600 });
    });
    T_.show(null, null, m('same') + 1.5);
    const n = S.note = G(p, { o: 0 });
    T(n, 'rows of A  →  columns of Aᵀ', { x: 960, y: 330, size: 32, weight: 600 });
    T(n, 'columns of A  →  rows of Aᵀ', { x: 960, y: 384, size: 32, weight: 600 });
    show(n, m('same'), .5);
  }],

  ['entry', 'One number at a time', (m) => {
    const p = S.p, T_ = S.T;
    hide(S.note, .1, .4); retitle('One number at a time');
    const n = S.note = G(p, {});
    T_.show('cell', [1, 0], m('pick'), { side: 't' }); T_.show('cell', [1, 0], m('from'));
    say(n, ['row 1, column 2 of Aᵀ:  4'], 960, 300, m('pick') + .3, { size: 32 });
    say(n, ['=  row 2, column 1 of A'], 960, 350, m('from') + .3, { size: 32 });
    ghost(n, T_, 1, 0, m('from') + .3);
    T_.show('cell', [0, 2], m('two'), { side: 't' }); T_.show('cell', [0, 2], m('from2'));
    say(n, ['row 3, column 1 of Aᵀ:  3'], 960, 440, m('two') + .3, { size: 32 });
    say(n, ['=  row 1, column 3 of A'], 960, 490, m('from2') + .3, { size: 32 });
    ghost(n, T_, 0, 2, m('from2') + .3);
    T_.show(null, null, m('rule'));
    const r = G(n, { o: 0 });
    M(r, ['row i, column j of Aᵀ'], { x: 960, y: 610, size: 34, fill: COL.chalk, anchor: 'start' });
    M(r, ['=  row j, column i of A'], { x: 960, y: 660, size: 34, fill: COL.chalk, anchor: 'start' });
