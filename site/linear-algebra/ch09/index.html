<script>
'use strict';
const CHAPTER = { number: 9, title: 'Matrix Times Vector, Two Ways', minutes: 10, language: 'en' , next: '../ch10/' };

/* ---------- layout and colours ---------- */
const DISP = [90, 230];                                        // A x = Ax in brackets, top left
const BIG = { cx: 900, cy: 780, u: 46, x0: -1, x1: 13, y0: -1, y1: 8 };   // a plane that reaches (12, 7)
const ROWC = [COL.whole, COL.nat, COL.int], COLC = [COL.irr, COL.real, COL.rat];
const SIDE = { x: 820, y: 170, w: 720, cls: 'side' };         // question card on the right, plane hidden
const LOW = { x: 40, y: 430, w: 720, cls: 'side' };           // question card under the matrix, plane kept

/* ---------- chapter drawing helpers ---------- */
const say = (p, parts, x, y, t0, { size = 40, fill = COL.chalk, anchor = 'start' } = {}) => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const pulseAll = (els, t, gap = .45, k = 1.3) => els.forEach((e, i) => pulse(e, t + i * gap, k));
const paren = n => n < 0 ? `(${num(n)})` : num(n);
const flashEl = (e, t0, col = COL.task) => { const c0 = e.getAttribute('fill'); tw(e, { c_fill: col }, t0, .25); tw(e, { c_fill: c0 }, t0 + 1.2, .6); };
const frame = (p, x, y, w, hh, c, t0, t1) => { const r = mk('rect', { x, y, width: w, height: hh, rx: 14, fill: 'none', stroke: c, 'stroke-width': 3 }, p); put(r, { o: 0 }); show(r, t0, .4); if (t1 !== undefined) hide(r, t1, .4); return r; };
const band = (p, x, y, w, hh, c, t0, t1, o = .2) => { const r = mk('rect', { x, y, width: w, height: hh, rx: 14, fill: c }, p); put(r, { o: 0 }); tw(r, { o }, t0, .4); if (t1 !== undefined) tw(r, { o: 0 }, t1, .4); return r; };
// A matrix drawn as a picture: brackets and entries (coloured by column unless fill is given).
function mtx(p, rows, x, y, { size = 42, cw = 78, rh = 62, fill = null, o = 1 } = {}) {
  const g = G(p, { o }), n = rows[0].length, w = cw * n + 20, top = y - size * .95, bot = y + rh * (rows.length - 1) + size * .4;
  path(g, `M${x + 14} ${top}H${x}V${bot}H${x + 14}M${x + w - 14} ${top}H${x + w}V${bot}H${x + w - 14}`, { stroke: COL.chalk, 'stroke-width': 3 });
  const cells = rows.map((r, i) => r.map((v, j) => {
    const t = T(g, typeof v === 'number' ? num(v) : v, { x: x + 10 + cw * (j + .5), y: y + rh * i, size, fill: fill || (typeof v === 'number' ? COLC[j] : COL.chalk), font: MATH, anchor: 'middle' });
    if (typeof v !== 'number') t.setAttribute('font-style', 'italic');
    return t;
  }));
  return { g, cells, w, x, y, top, bot, at: (i, j) => [x + 10 + cw * (j + .5), y + rh * i] };
}
// Pieces laid out left to right on one baseline: strings (math) and column vectors { v: [...], fill }.
// Every piece starts hidden; returns them with .at(k) for the k-th piece.
function lineUp(p, items, x0, y, { size = 40, gap = 14, rh = size * 1.25, lineH = size * 3.2 } = {}) {
  let x = x0;
  return items.map(it => {
    if (it === '\n') { x = x0 + 40; y += lineH; return { e: G(p, { o: 0 }), x, w: 0 }; }
    if (typeof it === 'string') { const e = M(p, [it], { x, y, size, anchor: 'start', o: 0 }); const r = { e, x, w: e._w }; x += e._w + gap; return r; }
    const n = it.v.length, c = y - size * .3, y1 = c - (n - 1) * rh / 2 + size * .35;
    const m = mtx(p, it.v.map(v => [v]), x, y1, { size, cw: size * 1.55, rh, fill: it.fill || COL.chalk, o: 0 });
    const r = { e: m.g, x, w: m.w, m }; x += m.w + gap; return r;
  });
}
// The column way: k₁·[col 1] + k₂·[col 2] (+ …) = [k₁·col 1] + … = [Ax], each part shown at its own time.
// wrap: the products and the sum go on a second line.
function colWork(p, ks, cols, x0, y, times, { size = 36, wrap = false } = {}) {
  const prod = cols.map((c, j) => c.map(v => ks[j] * v)), sum = cols[0].map((_, i) => prod.reduce((s, c) => s + c[i], 0));
  const items = [], at = [];
  const add = (it, t) => { items.push(it); at.push(t); };
  ks.forEach((k, j) => { add((j ? '+ ' : '') + (j && k < 0 ? `(${num(k)})·` : `${num(k)}·`), times.terms[j]); add({ v: cols[j], fill: COLC[j] }, times.terms[j]); });
  if (wrap) add('\n');
  add('=', times.prod);
  prod.forEach((c, j) => { if (j) add('+', times.prod + j * .5); add({ v: c, fill: COLC[j] }, times.prod + .2 + j * .5); });
  add('=', times.sum); add({ v: sum, fill: COL.task }, times.sum + .2);
  const parts = lineUp(p, items, x0, y, { size, lineH: cols[0].length * size * 1.25 + size * 1.3 });
  parts.forEach((r, k) => { if (at[k] !== undefined) show(r.e, at[k], .4); });
  return { parts, sum };
}
// The row way for one row: a₁·x₁ + a₂·x₂ (+ …) = products = result. The numbers fly in from where they sit.
function rowWork(p, a, xs, x0, y, { from = null, xFrom = null, tm, ts, tr = ts + 1.4, size = 40, color = COL.chalk } = {}) {
  const pr = a.map((v, j) => v * xs[j]), r = pr.reduce((s, v) => s + v, 0);
  const items = [];
  a.forEach((v, j) => { if (j) items.push(' + '); items.push({ t: paren(v), fill: COLC[j] }, '·', paren(xs[j])); });
  items.push(' = ', pr.map((v, j) => j ? (v < 0 ? ` − ${num(-v)}` : ` + ${num(v)}`) : num(v)).join(''), ' = ', { t: num(r), fill: COL.task });
  const row = tokens(p, items, { x: x0, y, size, fill: color });
  row.forEach(e => put(e, { o: 0 }));
  a.forEach((v, j) => {
    const ea = row[j * 4], ex = row[j * 4 + 2], t = tm + j * .9;
    if (from) { put(ea, { x: from[j][0], y: from[j][1] }); tw(ea, { x: ea._px, y }, t, .8); }
    if (xFrom) { put(ex, { x: xFrom[j][0], y: xFrom[j][1] }); tw(ex, { x: ex._px, y }, t + .25, .8); }
    show(ea, t, .2); show(ex, t + .25, .2); show(row[j * 4 + 1], t + .6, .3); if (j) show(row[j * 4 - 1], t, .3);
  });
  const k = a.length * 4 - 1;
  show(row[k], ts, .3); show(row[k + 1], ts + .2, .4); show(row[k + 2], tr, .3); show(row[k + 3], tr + .2, .4);
  return { row, r };
}
// A grid2 in this chapter's layout (no moved grid: the columns, x·col 1 + y·col 2 and Ax only).
const g2Of = (p, A, x, o = {}) => grid2(p, { A, x, mat: DISP, grid: false, square: false, units: false, brackets: true, ...o });
const hideX = g => { put(g.xRing, { o: 0 }); put(g.xLab, { o: 0 }); };
// Hide the product Ax (numbers in the brackets) behind question marks until t, or for good.
function hideRes(g, p, t) {
  const q = [0, 1].map(i => { const e = g.res(i), s = st(e); put(e, { o: 0 }); return T(g.M, '?', {   // inside the matrix group: it shows with the brackets
 x: s.x, y: s.y, size: 54, fill: COL.task, font: MATH, anchor: 'middle' }); });
  if (t !== undefined) { q.forEach(e => hide(e, t, .3)); [0, 1].forEach(i => show(g.res(i), t + .2, .4)); }
  return q;
}
const hideAx = g => [g.axArrow, g.axDot, g.axLab, ...g.combo].forEach(e => put(e, { o: 0 }));
// Positions in the A x = Ax display (from grid2's layout).
const aAt = (g, i, j) => [g.lay.A[0][j], g.lay.A[1][i]], xAt = (g, i) => [g.lay.x, g.lay.A[1][i]], rAt = (g, i) => [g.lay.r, g.lay.A[1][i]];
const rowBandA = (p, g, i, t0, t1) => band(p, DISP[0] + 6, g.lay.A[1][i] - 48, 192, 64, ROWC[i], t0, t1);
const xBand = (p, g, t0, t1) => band(p, g.lay.x - 40, DISP[1] - 52, 80, 140, COL.chalk, t0, t1, .12);
const target = (P2, [x, y], into, t0 = .3) => {
  const g = G(into, { x: P2.PX(x), y: P2.PY(y), o: 0 });
  mk('circle', { r: 17, fill: 'none', stroke: COL.task, 'stroke-width': 3, 'stroke-dasharray': '5 5' }, g);
  T(g, `target (${num(x)}, ${num(y)})`, { x: 20, y: 40, size: 22, fill: COL.task, font: MATH });
  show(g, t0, .4);
  return g;
};
const vecStr = v => `[${v.map(num).join(', ')}]`;   // a vector, as chapters 4–7 write it
// Inline matrix for a card prompt.
function matEl(rows, { size = 30, fill = null } = {}) {
  const n = rows[0].length, cw = size * 1.8, rh = size * 1.3, w = cw * n + 16, hh = rh * rows.length + size * .3;
  const svg = mk('svg', { class: 'm', viewBox: `0 0 ${w} ${hh}`, width: w, height: hh });
  svg.style.verticalAlign = 'middle';
  path(svg, `M12 2H3V${hh - 2}H12M${w - 12} 2H${w - 3}V${hh - 2}H${w - 12}`, { stroke: 'currentColor', 'stroke-width': 2.5 });
  rows.forEach((r, i) => r.forEach((v, j) => T(svg, num(v), { x: 8 + cw * (j + .5), y: rh * (i + .5) + size * .5, size, fill: fill || COLC[j], font: MATH, anchor: 'middle' })));
  return svg;
}
const prodEl = (A, x) => { const s = h('span', '', [rich([$m('A'), ' = ']), matEl(A), '      ', rich([$m('x'), ' = ']), matEl(x.map(v => [v]), { fill: 'currentColor' })]); s.style.whiteSpace = 'pre'; return s; };

/* ---------- practice data ---------- */
const COLQ = [
  { A: [[1, 2], [3, 1]], x: [2, 3] },
  { A: [[4, -1], [0, 2]], x: [1, -2], note: 'A minus number in x: go backwards along that column. [4, 0] + [2, −4] = [6, −4].' },
  { A: [[2, 0], [1, 5]], x: [3, 0], note: 'x = [3, 0] takes 3 of column 1 and none of column 2: [6, 3] + [0, 0] = [6, 3].' },
  { A: [[-1, 3], [2, 2]], x: [-2, 1] },
];
const ROWQ = [
  { A: [[2, 5], [1, 3]], x: [3, 1] },
  { A: [[1, -2], [4, 3]], x: [2, -1] },
  { A: [[1, 1, 1], [2, 0, -1], [0, 3, 1]], x: [2, 1, 4] },
  { A: [[2, 1], [0, -1], [5, 2]], x: [1, 3] },
];
const mul = (A, x) => A.map(r => r.reduce((s, v, j) => s + v * x[j], 0));
const colRows = ({ A, x, note }) => {
  const c = j => A.map(r => r[j]), pr = j => c(j).map(v => v * x[j]), ax = mul(A, x);
  return [
    { parts: [`${num(x[0])} · column 1  =  [`, { box: String(pr(0)[0]) }, ', ', { box: String(pr(0)[1]) }, ']'], why: `${num(x[0])}·${vecStr(c(0))} = ${vecStr(pr(0))}`, hint: `Multiply both numbers of column 1, ${vecStr(c(0))}, by ${num(x[0])}.` },
    { parts: [`${num(x[1])} · column 2  =  [`, { box: String(pr(1)[0]) }, ', ', { box: String(pr(1)[1]) }, ']'], why: `${num(x[1])}·${vecStr(c(1))} = ${vecStr(pr(1))}`, hint: `Multiply both numbers of column 2, ${vecStr(c(1))}, by ${num(x[1])}.` },
    { parts: ['Ax  =  [', { box: String(ax[0]) }, ', ', { box: String(ax[1]) }, ']'], why: note || `${vecStr(pr(0))} + ${vecStr(pr(1))} = ${vecStr(ax)}`, hint: 'Add the two vectors: top with top, bottom with bottom.' },
  ];
};
const rowRows = ({ A, x }) => A.map((r, i) => ({
  parts: [`row ${i + 1} · x  =  `, { box: String(mul([r], x)[0]) }],
  why: r.map((v, j) => `${paren(v)}·${paren(x[j])}`).join(' + ') + ` = ${num(mul([r], x)[0])}`,
  hint: `Row ${i + 1} is ${r.map(num).join(', ')}. Multiply each by the matching number of x, then add.`,
}));
const FITQ = [
  { parts: ['A is 2 by 3,   x has 3 numbers'], ans: ['y'], why: 'A has 3 columns and x has 3 numbers: it fits. Ax has 2 numbers.' },
  { parts: ['A is 3 by 2,   x has 3 numbers'], ans: ['n'], why: 'A has only 2 columns, so x needs exactly 2 numbers.' },
  { parts: ['A is 2 by 2,   x has 2 numbers'], ans: ['y'], why: '2 columns, 2 numbers. Ax has 2 numbers.' },
  { parts: ['A is 1 by 4,   x has 4 numbers'], ans: ['y'], why: '4 columns, 4 numbers: one row, so Ax is one number (a single dot product).' },
  { parts: ['A is 3 by 3,   x has 2 numbers'], ans: ['n'], why: '3 columns need 3 numbers in x.' },
  { parts: ['A is 2 by 4,   x has 2 numbers'], ans: ['n'], why: 'Count columns, not rows: A has 4 columns, so x needs 4 numbers.' },
];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Matrix times vector, two ways', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unit 1, Chapter 9', { x: 800, y: 290, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Matrix Times Vector, Two Ways', { x: 800, y: 400, size: 80, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'what A times x means', 800, 500, m('sub'), { size: 36, fill: COL.dim, anchor: 'middle' });
    const pic = G(scene, { o: 0 });
    const A = mtx(pic, [[2, 5], [1, 3]], 600, 640, { size: 40, cw: 66, rh: 56 });
    mtx(pic, [[1], [2]], 762, 640, { size: 40, cw: 52, rh: 56, fill: COL.chalk });
    M(pic, ['='], { x: 870, y: 682, size: 40 });
    const q = M(pic, ['?'], { x: 940, y: 682, size: 52, fill: COL.task });
    show(pic, m('sub') + 1, .5);
    // the two readings: down the columns, across the rows
    const cg = G(scene, { o: 0 }), rg = G(scene, { o: 0 });
    [0, 1].forEach(j => band(cg, A.at(0, j)[0] - 30, 596, 60, 118, COLC[j], m('move') + .6 + j * .5, D - 1, .25));
    T(cg, 'by columns', { x: 666, y: 790, size: 28, fill: COLC[0], anchor: 'middle', weight: 600 });
    [0, 1].forEach(i => band(rg, 606, A.at(i, 0)[1] - 40, 140, 54, ROWC[i], m('move') + 3 + i * .5, D - 1, .25));
    T(rg, 'by rows', { x: 580, y: 668, size: 28, fill: ROWC[0], anchor: 'end', weight: 600 });
    show(cg, m('move') + .6, .4); show(rg, m('move') + 3, .4);
    pulse(q, m('move') + 5.5);
    tw(g, { o: 0, y: -24 }, D - .9, .8); [r, pic, cg, rg].forEach(e => hide(e, D - .9, .8));
  }],

  ['setup', 'A matrix and a vector', (m) => {
    const p = panel(0);
    text(p, 'A times x', 60, 110, .2, { size: 40, weight: 600 });
    const g = S.g = g2Of(p, [[2, 5], [1, 3]], [1, 2], { plane: BIG, hidePlane: true, t0: m('A') - .4 });
    hideX(g);
    const q = hideRes(g, p);
    q.forEach(e => put(e, { o: 0 }));
    ['a00', 'a01', 'a10', 'a11'].forEach((k, i) => g.num(k).forEach(e => flashEl(e, m('A') + .6 + i * .5)));
    ['x0', 'x1'].forEach((k, i) => g.num(k).forEach(e => flashEl(e, m('x') + .4 + i * .6)));
    pulseAll(['a00', 'a01', 'a10', 'a11'].map(k => g.num(k)[0]), m('A') + .6, .9);
    pulseAll(['x0', 'x1'].map(k => g.num(k)[0]), m('x') + .4, .8);
    q.forEach((e, i) => { show(e, m('q') + .3 + i * .3, .3); pulse(e, m('q') + 1.6 + i * .3); });
    text(p, 'two numbers to find', g.lay.r, 430, m('q') + 1, { size: 26, fill: COL.task, anchor: 'middle', weight: 600 });
    const plan = G(p, { o: 0 });
    T(plan, '1.  by columns', { x: 90, y: 560, size: 34, weight: 600, fill: COLC[0] });
    T(plan, '2.  by rows', { x: 90, y: 615, size: 34, weight: 600, fill: ROWC[0] });
    show(plan, m('plan') + .3);
  }],

  ['cols', 'By columns', (m) => {
    const p = panel(0);
    text(p, 'By columns: a mix of the columns', 60, 110, .2, { size: 40, weight: 600 });
    const g = S.g = g2Of(p, [[2, 5], [1, 3]], [1, 2], { plane: BIG });
    hideX(g); hideAx(g); hideRes(g, p, m('ans'));
    g.labels(['col 1', 'col 2']);
    put(g.parts.cols, { o: 0 }); show(g.parts.cols, m('c1') - .2, .4);
    put(g.cols[1], { o: 0 }); show(g.cols[1], m('c2'), .5);
    put(g.tipLabels[1], { o: 0 }); show(g.tipLabels[1], m('c2'), .5);
    // x's first number goes with column 1, its second with column 2
    band(p, g.lay.A[0][0] - 40, DISP[1] - 52, 80, 140, COLC[0], m('c1'), m('c2'));
    g.num('x0').forEach(e => flashEl(e, m('c1') + .2));
    band(p, g.lay.A[0][1] - 40, DISP[1] - 52, 80, 140, COLC[1], m('c2'), m('add'));
    g.num('x1').forEach(e => flashEl(e, m('c2') + .2));
    colWork(p, [1, 2], [[2, 1], [5, 3]], 70, 500, { terms: [m('c1') + 1.5, m('c2') + 1.5], prod: m('c2') + 4.5, sum: m('add') + 3 });
    // tip to tail, one column step on each word: the columns step back so the steps read
    tw(g.parts.cols, { o: .3 }, m('pic'), .4);
    const steps = G(p, {});
    [[0, 0, 2, 1, COLC[0], .2], [2, 1, 7, 4, COLC[1], 1.4], [7, 4, 12, 7, COLC[1], 2.4]].forEach(([a, b, c, d, col, dt]) => g.P.arrow(a, b, c, d, col, m('pic') + dt, { into: steps }).setAttribute('stroke-width', 6));
    text(p, '1·col 1', g.P.PX(1) - 14, g.P.PY(.5) - 14, m('pic') + .5, { size: 24, fill: COLC[0], weight: 600, anchor: 'end' });
    text(p, '2·col 2', g.P.PX(7) - 14, g.P.PY(4) - 14, m('pic') + 1.8, { size: 24, fill: COLC[1], weight: 600, anchor: 'end' });
    g.axArrow.setAttribute('stroke-dasharray', '10 8'); g.axArrow.setAttribute('stroke-width', 3); g.axArrow.setAttribute('fill-opacity', .5);
    [g.axArrow, g.axDot, g.axLab].forEach(e => show(e, m('land'), .5));
    pulse(g.axDot, m('land') + .6);
    const lc = G(p, { o: 0 });
    M(lc, ['c·v + d·w'], { x: 90, y: 690, size: 38, anchor: 'start' });
    T(lc, 'chapter 6, with c = 1 and d = 2', { x: 300, y: 688, size: 28, fill: COL.dim });
    show(lc, m('same') + 1);
    text(p, 'c = 1,   d = 2', g.lay.x, 425, m('same') + 3, { size: 30, fill: COL.task, weight: 600, anchor: 'middle' });
    pulse(g.num('x0')[0], m('same') + 3); pulse(g.num('x1')[0], m('same') + 4.4);
  }],

  ['cols2', 'By columns, with a minus', (m) => {
    const p = panel(0);
    text(p, 'By columns: a minus sign goes backwards', 60, 110, .2, { size: 40, weight: 600 });
    const g = S.g = g2Of(p, [[1, -1], [2, 1]], [2, -1], { t0: m('A') - .4, plane: { cx: 1100, cy: 560, u: 80, x0: -2, x1: 5, y0: -2, y1: 5 } });
    hideX(g); hideAx(g); hideRes(g, p, m('ans'));
    g.labels(['col 1', 'col 2']);
    put(g.M, { o: 0 }); show(g.M, m('A') - .2, .4);
    ['x0', 'x1'].forEach((k, i) => g.num(k).forEach(e => flashEl(e, m('x') + .3 + i * .7)));
    pulseAll(['a00', 'a01', 'a10', 'a11'].map(k => g.num(k)[0]), m('A') + .3, .9);
    pulseAll(['x0', 'x1'].map(k => g.num(k)[0]), m('x') + .3, .7);
    band(p, g.lay.A[0][0] - 40, DISP[1] - 52, 80, 140, COLC[0], m('c1'), m('c2'));
    band(p, g.lay.A[0][1] - 40, DISP[1] - 52, 80, 140, COLC[1], m('c2'), m('add'));
    colWork(p, [2, -1], [[1, 2], [-1, 1]], 70, 500, { terms: [m('c1') + .5, m('c2') + .5], prod: m('c2') + 3.5, sum: m('add') + 2.5 });
    text(p, '−1 of column 2: backwards along it', 90, 650, m('c2') + 6, { size: 28, fill: COLC[1], weight: 600 });

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [['By columns: Ax = (first number of x)·column 1 + (second)·column 2 + …', 'w1'], ['By rows: each number of Ax is a row of A times x (a dot product).', 'w2'],
     ['Both ways use the same products, so they always agree.', 'w3'], ['x: one number per column of A.   Ax: one number per row.', 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 160 + i * 105, o: 0 });

    });
    // the lecture example, both ways, small
    const A = mtx(p, [[2, 5], [1, 3]], 300, 660, { size: 40, cw: 66, rh: 56, o: 0 });
    const X = mtx(p, [[1], [2]], 462, 660, { size: 40, cw: 52, rh: 56, fill: COL.chalk, o: 0 });

    say(p, ['2·1 + 5·2 = 12,   1·1 + 3·2 = 7'], 800, 740, m('w2') + 1.5, { size: 34, fill: ROWC[0] });
    frame(p, 780, 630, 560, 140, COL.task, m('w3') + .5, m('w4'));

    [0, 1].forEach(i => band(p, 306, 660 + 56 * i - 38, 136, 52, ROWC[i], m('w4') + 2.8 + i * .3, m('end'))); band(p, 610, 616, 80, 112, ROWC[0], m('w4') + 3.4, m('end'), .15);

  ['final4', 'Chapter practice', () => {
    const p = panel(0);

    S.g = g2Of(p, [[2, 1], [1, 1]], [0, 0]);

    S.tg = G(p, {});
  }, { ask: done => {
    const from = (A, x, tgt, f) => (body, api) => { S.g.set({ a00: A[0][0], a01: A[0][1], a10: A[1][0], a11: A[1][1], x0: x[0], x1: x[1] }); S.tg.replaceChildren(); target(S.g.P, tgt, S.tg, 0); put(S.tg.lastChild, { o: 1 }); return f(body, api); };
    const at = (v, [a, b]) => { const [p, q] = [v.a00 * v.x0 + v.a01 * v.x1, v.a10 * v.x0 + v.a11 * v.x1]; return p === a && q === b; };
    quiz(LOW, [{
      id: 'p-land1', prompt: ['Move ', $m('x'), ' until ', $m('Ax'), ' lands on the target ', $m('(5, 3)'), '.'],
      build: from([[2, 1], [1, 1]], [0, 0], [5, 3], g2Task(S.g, v => at(v, [5, 3]), 'x = [2, 1]: 2·[2, 1] + 1·[1, 1] = [5, 3].',
        'By rows: 2·(first) + (second) = 5 and (first) + (second) = 3. The difference is the first number: 2.', () => S.g.set({ x0: 2, x1: 1 }), ['x'])),
    }, {
      id: 'p-land2', prompt: ['Now ', $m('x = [1, 1]'), ' stays. Change ', $m('A'), ' (drag a column, or its numbers) so that ', $m('Ax = [3, 1]'), '.'],
      build: from([[1, 0], [0, 1]], [1, 1], [3, 1], g2Task(S.g, v => at(v, [3, 1]), 'x = [1, 1] means one of each column: column 1 + column 2 = [3, 1]. Many matrices do it, for example columns [2, 0] and [1, 1].',

      build: from([[1, 0], [0, 1]], [0, 2], [-2, 4], g2Task(S.g, v => at(v, [-2, 4]), 'x = [0, 2] takes none of column 1 and two of column 2: column 2 must be [−1, 2]. Column 1 can be anything.',
        'x = [0, 2] means 0 of column 1 plus 2 of column 2. So 2 · column 2 = [−2, 4].', () => S.g.set({ a01: -1, a11: 2 }), ['A', 'cols'])),
