const isPerm = (v, n) => { const I = [...Array(n).keys()], ok = x => x === 0 || x === 1; return I.every(i => I.every(j => ok(v[`e${i}${j}`]))) && I.every(i => I.reduce((s, j) => s + v[`e${i}${j}`], 0) === 1) && I.every(j => I.reduce((s, i) => s + v[`e${i}${j}`], 0) === 1); };

  };

};

  }],

  ['ex3', 'Three by three', (m) => {

    sys.planes[1].fade(.3, m('swap'), .4); sys.planes[2].fade(.3, m('swap'), .4);
    el.swap(1, 2, m('swap') + .3, 1.6);
    sys.planes[1].fade(1, m('swap') + 2.1, .5); sys.planes[2].fade(1, m('swap') + 2.1, .5);
    triangle(el, m('swap') + 2.4);
    const Pm = mat(p, P23, 190, 600, m('p'), { size: 30, cw: 46, rh: 42, name: 'P₂₃ =' });

  }],

  ['elim', 'Eliminate PA', (m) => {

    V.sway(5, 13);
    el.step(1, 0, 3, m('l21') + .2, 1.8);
    el.step(2, 0, 2, m('l31') + .2, 1.8);
    el.op(2, 1, 0, m('l32') + .3);
    triangle(el, m('u'));
    [0, 1, 2].forEach(i => el.ring(i, i, m('u') + 1 + .4 * i));
    const Lm = mat(p, L3, 150, 590, m('L'), { size: 30, cw: 58, rh: 50, name: 'L =' });
    const r1 = Lm.ring(1, 0, m('L') + 1, { dash: true }), r2 = Lm.ring(2, 0, m('L') + 1.4, { dash: true });
    Lm.ring(2, 1, m('L') + 3.2, { dash: true });
    const bf = G(p, { o: 0 }); show(bf, m('look') + 2, .4);
    T(bf, 'A’s multipliers:', { x: 470, y: 590, size: 26, fill: COL.dim, weight: 600 });
    M(bf, ['ℓ₂₁ = 2,   ℓ₃₁ = 3'], { x: 470, y: 636, size: 30, fill: COL.dim, anchor: 'start' });
    const af = G(p, { o: 0 }); show(af, m('moved'), .4);
    T(af, 'PA’s multipliers:', { x: 470, y: 690, size: 26, fill: COL.chalk, weight: 600 });
    M(af, ['ℓ₂₁ = 3,   ℓ₃₁ = 2'], { x: 470, y: 736, size: 30, fill: COL.chalk, anchor: 'start' });
    pulse(r1, m('moved') + .8); pulse(r2, m('moved') + .8);
  }],

  ['both', 'Both sides', (m, D) => {
    const p = panel(0);
    title(p, 'PA = LU: multiply out both sides');
    const sys = lin3(p, { A: U3.A, b: U3.b, eq: [90, 190], mat: null, sol: false, space: { cx: 1280, size: 480, yaw: -30, pitch: 22 }, t0: .4 });
    sys.E.style.display = 'none';
    sys.space.sway(5, 13);
    const top = G(p, { o: 0 }); show(top, m('left'), .5);
    const e1 = emat(top, bare(PZ3.A, PZ3.b), { A: Z3.A, b: Z3.b, E: P23, at: [64, 220], size: 28, cw: 46, ecw: 40, rh: 46, gap: 56, t0: 0, name: 'P', names: ['A', 'b', 'PA', 'Pb'] });
    [0, 1, 2].forEach(i => e1.Pt.flash(i, m('pa') + 1.4 * i));

    e2.focusE(2, m('r3')); e2.work(2, m('r3') + .2); e2.ringE(2, 0, m('r3') + .4);
    e2.to({ e20: 2 }, m('r3') + 1, 2.4);
    e2.work(null, m('eq')); e2.focusE(null, m('eq'));
    [0, 1, 2].forEach(i => { e1.Pt.flash(i, m('eq') + .4 + .9 * i); e2.Pt.flash(i, m('eq') + .4 + .9 * i); });
    say(p, ['PA = LU  ✓'], 64, 700, m('eq') + 2, { size: 40, fill: COL.good });
    say(p, ['Lc = (1, 4, 3) = Pb'], 64, 780, m('c') + 1, { size: 34 });
    [0, 1, 2].forEach(i => { e2.Pt.flash(i, m('c') + 1.5 + .5 * i); e1.Pt.flash(i, m('c') + 4 + .5 * i); });
  }],

  ['q1', 'Quick check', () => {

  ['ex2', 'A zero at the start', (m) => {
    const p = panel(0);

    const Um = mat(p, [[1, 2, 1], [0, 1, 1], [0, 0, 4]], 700, 600, m('LU') + 2.4, { size: 30, cw: 46, rh: 42, name: 'U =' });
    Lm.ring(2, 0, m('check') + .6); Lm.ring(2, 1, m('check') + .6);
    Um.glow(m('check') + 1.6, 3);
    say(p, ['2·(1, 2, 1) + 3·(0, 1, 1) + (0, 0, 4) = (2, 7, 9)'], 64, 790, m('check') + 4, { size: 30 });
    text(p, '= row 3 of PA:   PA = LU', 640, 786, m('check') + 7.5, { size: 28, fill: COL.good, weight: 600 });
  }],

  ['q2', 'Your turn', () => {
    const p = panel(0);

  }, { ask: done => quiz(CARD3, [{
    id: 'c-perm', prompt: ['Change the numbers of P until elimination on PA meets no zero pivot.'],
    build: emTask(S.em, (v, pr) => isPerm(v, 3) && noSwap(pr), 'Rows 1, 3, 2 (P₂₃) work, and so do three other orders. Only rows 1 and 2 on top fail: their 2 × 2 corner gives a 0 pivot.',
      permHint, () => S.em.set(eKeys(P23)), { only: ['e00', 'e01', 'e02', 'e10', 'e11', 'e12', 'e20', 'e21', 'e22'] }),
  }], done) }],

  ['stuck', 'When no P helps', (m) => {
    const p = panel(0);
    title(p, 'When no P can help');
    const { sys, el, V } = table3(p, STUCK, 'x + 2y + z = 1,    2x + 4y + 3z = 3,    3x + 6y + 5z = 5', { t0: .4 });
    V.sway(5, 13);
    [0, 1, 2].forEach(i => el.flash(i, m('A') + .3 + 2.3 * i));
    el.step(1, 0, 2, m('c1') + .3, 1.8);
    el.step(2, 0, 3, m('c1') + 3.2, 1.8);
    hide(el.op_.lab.g, m('zero') - .2, .3);
    el.ring(1, 1, m('zero'), { color: COL.bad });
    el.ring(2, 1, m('below'), { color: COL.bad, dash: true });
    text(p, 'every number below is 0 too', 90, 520, m('below') + 1, { size: 30, fill: COL.bad, weight: 600 });
    text(p, 'no row to exchange with: no P helps', 90, 580, m('none'), { size: 30, fill: COL.bad, weight: 600 });
    V.turn({ yaw: 35, pitch: 30 }, m('line') - .6, 3);   // the shared line lies across the view
    [[0, 0, 1], [-2, 1, 1], [2, -1, 1]].forEach((q, i) => { const pt = V.point(q, { label: `(${q.map(num).join(', ')})`, size: 24, halo: true, ...(i === 0 ? { dx: -20, dy: 34 } : {}) }); put(pt.e, { o: 0 }); show(pt.e, m('pts') + 1.2 * i, .4); });
    text(p, 'one whole line of solutions, not one point', 90, 640, m('pts') + .5, { size: 30, weight: 600 });
    text(p, 'P fixes a 0 pivot only when a number below it is not 0', 90, 740, m('rule'), { size: 30, fill: COL.good, weight: 600 });
  }],

  ['q3', 'Quick check', () => {
    const p = panel(0);
    title(p, 'Quick check');
    const t = two(p, { A: [[0, 2], [0, 5]], b: [4, 10] }, '2y = 4,    5y = 10');
    S.em = t.em;
  }, { ask: done => quiz({ x: 40, y: 450, w: 780, cls: 'side' }, [{
    id: 'c-none', prompt: ['A = (0, 2), (0, 5). Can a permutation P make elimination work?'],
    build: choice(['Yes: P₁₂', 'No: column 1 has no number that can be a pivot', 'Yes: P = I already works'], 1,
      'Every row starts with 0, so no order of the rows gives a first pivot: chapter 20’s permanent trouble.',
      ['P₁₂ puts (0, 5) on top: the first pivot spot is still 0.', null, 'With P = I the first pivot spot is 0.']),
  }], done) }],

  ['inv', 'Undoing P', (m) => {
    const p = panel(0);
    title(p, 'Undoing P');
    const ex = G(p, { o: 0 }); show(ex, m('undo') + .3, .4); hide(ex, m('cycle') - .2, .4);
    say(ex, ['P₂₃ P₂₃ = I'], 64, 190, 0, { size: 34 });
    const pp = emat(ex, bare(P23), { A: P23, b: [0, 0, 0], E: P23, at: [64, 290], size: 30, cw: 46, ecw: 40, rh: 46, gap: 56, t0: 0, noB: true, name: 'P₂₃', names: ['P₂₃', '', 'I', ''] });
    [0, 1, 2].forEach(i => { pp.flashE(i, m('undo') + 3.5 + 1.6 * i); pp.Pt.flash(i, m('undo') + 4 + 1.6 * i); });
    const Pm = mat(p, CYC, 160, 330, m('cycle'), { size: 36, cw: 56, rh: 50, name: 'P =' });
    text(p, 'moves every row', 110, 480, m('cycle') + .6, { size: 26, fill: COL.dim, weight: 600 });
    [0, 1, 2].forEach(i => Pm.glowRow(i, m('cycle') + 2.6 + 2 * i, 1.8));
    ['c1', 'c2', 'c3'].forEach((mk_, k) => { const [i, j] = [[0, 2], [1, 0], [2, 1]][k]; Pm.glowRow(i, m(mk_), 2); hide(Pm.ring(i, j, m(mk_) + .3), m('flip') - .3, .3); });
    // the undo sits on the right; the gap between is where the flip lands
    const Pv = mat(p, CYCT.map(r => r.map(() => '')), 880, 330, m('back'), { size: 36, cw: 56, rh: 50, name: 'P⁻¹ =' });
    text(p, 'fetches every row back', 820, 480, m('back') + 1, { size: 26, fill: COL.dim, weight: 600 });
    ['b1', 'b2', 'b3'].forEach((mk_, i) => {
      const said = m(mk_) + .55 * (m(['b2', 'b3', 'flip'][i]) - m(mk_));   // the row's numbers, as they are read out
      const r = G(p, { o: 0 }); CYCT[i].forEach((v, j) => M(r, [num(v)], { x: Pv.cx(j), y: Pv.ry(i), size: 36, anchor: 'middle' })); show(r, said, .4);
      const j = CYCT[i].indexOf(1); hide(Pv.ring(i, j, said + .8), m('flip') - .3, .3);
      Pm.glowRow(j, m(mk_), 2.2);   // where P put the old row i + 1
    });
    // the flip: P's diagonal dashed, every number flies from (i, j) to (j, i) of a new matrix
    const dg = path(p, `M${Pm.cx(0) - 20} ${Pm.ry(0) - 30}L${Pm.cx(2) + 20} ${Pm.ry(2) + 12}`, { stroke: COL.chalk, 'stroke-width': 2.5, 'stroke-dasharray': '8 7', fill: 'none' }, { d: 0 });
    tw(dg, { d: 1 }, m('flip'), .8); hide(dg, m('name') + 1, .5);
    Pm.glowRow(0, m('flip') + 4.6, 2.2);
    const Tm = mat(p, CYCT.map(r => r.map(() => '')), 500, 330, m('flip') + .4, { size: 36, cw: 56, rh: 50, name: 'Pᵀ =' });
    CYC.forEach((r, i) => r.forEach((v, j) => {
      const t = G(p, { x: Pm.cx(j), y: Pm.ry(i), o: 0 });
      M(t, [num(v)], { size: 36, fill: v ? COL.chalk : COL.dim, anchor: 'middle' });
      const at = m('flip') + 1 + .25 * (i * 3 + j);
      show(t, at, .1);
      tw(t, { x: Tm.cx(i), y: Tm.ry(j) }, at, 1.4);
    }));
    say(p, ['P⁻¹ = Pᵀ'], 640, 540, m('name') + 2, { size: 40, anchor: 'middle' });
    Tm.glow(m('name') + 2, 2); Pv.glow(m('name') + 2, 2);
    const e = emat(p, bare(CYC), { A: CYC, b: [0, 0, 0], E: CYCT, at: [64, 690], size: 28, cw: 46, ecw: 40, rh: 44, gap: 56, t0: m('check') - .2, noB: true, name: 'Pᵀ', names: ['P', '', 'I', ''] });
    [0, 1, 2].forEach(i => e.Pt.flash(i, m('check') + 1 + .7 * i));
    text(p, 'every permutation:  P⁻¹ = Pᵀ', 880, 600, m('rule'), { size: 30, weight: 600 });
    text(p, 'the transpose: chapter 35', 880, 660, m('next'), { size: 28, fill: COL.dim, weight: 600 });
  }],

  ['wrap', 'Summary', (m) => {
    const p = panel(0);
    [['A zero pivot is fixed by a row exchange; P can make every exchange first.', 'w1'], ['Then PA = LU: L holds the multipliers, U the pivots.', 'w2'],
     ['Check by multiplying out: P reorders the rows of A, L mixes the rows of U.', 'w3'], ['P⁻¹ = Pᵀ. If every number below a zero pivot is 0, no P helps.', 'w4']].forEach(([str, mark], i) => {

      T(g, str, { x: 170, size: 34, weight: 600 });

  }],
  ['final1', 'Chapter practice', () => { panel(0); }, { ask: done => quiz(SCREEN, [{
    id: 'p-swap', prompt: ['Eliminate until a pivot spot holds 0, and name the rows to exchange (smaller number first).'],

  }], done, 'Chapter practice · set 1 of 4') }],
  ['final2', 'Chapter practice', () => {}, { ask: done => quiz(SCREEN, [{

  ['final3', 'Chapter practice', () => {}, { ask: done => quiz(SCREEN, [{
    id: 'p-check', prompt: ['Multiply, and undo P. Rows are written (first number, second number, …).'],

  ['final4', 'Chapter practice', () => {

].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
