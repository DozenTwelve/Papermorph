<script>
'use strict';
const CHAPTER = { number: 38, title: 'Subspaces of the Plane', minutes: 11, language: 'en', next: '../ch39/' };

/* ---------- chapter drawing helpers ---------- */
const [GREEN, VIOLET] = VS_COL;          // u green, w violet (as v and w in chapters 4-6); the set S blue (an equation's line)
const SETC = COL.whole;
const CARD = { x: 40, y: 450, w: 720, cls: 'side' };
const say = (p, parts, x, y, t0, { size = 40, fill = COL.chalk, anchor = 'start' } = {}) => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const showRow = (r, t0, dur = .5) => r.parts.forEach(e => show(e, t0, dur));
const pulseG = (e, t0) => { tw(e, { o: .35 }, t0, .2); tw(e, { o: 1 }, t0 + .25, .3); tw(e, { o: .35 }, t0 + .6, .2); tw(e, { o: 1 }, t0 + .85, .3); };
const thickSet = (sb, t0) => { const e = sb.setG.querySelector('path:nth-of-type(2)'); tw(e, { 'a_stroke-width': 11 }, t0, .3); tw(e, { 'a_stroke-width': 6 }, t0 + .8, .5); };
// The test in the picture: one subspace2 with the equation on top, u and w as columns, the combination row and the verdict.
//   rows: u = [ ], w = [ ] at y 345;  c u + d w = [ ] at y 540;  checks under u and w at y 425;  readout at y 650
const testBoard = (p, { set = 'line', line = [1, -2, 0], u = [2, 1], w = [-4, -2], c = 1, d = 1, show: sh = [], t0 = .1, eq = true, o = 0, range } = {}) => {
  const sb = subspace2(p, { set, line, u, w, c, d, show: sh, t0, range });
  const R = {
    sb,
    eq: eq ? sb.eq({ x: 90, y: 200, size: 46, o }) : null,
    u: sb.row([{ t: 'u', fill: GREEN }, '=', { col: 'u' }], { x: 90, y: 345, size: 40, o }),
    w: sb.row([{ t: 'w', fill: VIOLET }, '=', { col: 'w' }], { x: 330, y: 345, size: 40, o }),
    combo: sb.row([{ key: 'c' }, { t: 'u', fill: GREEN }, { key: 'd', signed: true }, { t: 'w', fill: VIOLET }, '=', { col: 'sum' }], { x: 90, y: 540, size: 40, o, tight: true }),
    cu: sb.check('u', { x: 90, y: 428, size: 26, o }),
    cw: sb.check('w', { x: 330, y: 428, size: 26, o }),
    out: sb.readout({ x: 90, y: 650, size: 32, o }),
  };
  return R;
};
// A rounded box drawn around some numbers (the tops being added), then gone.
const boxNums = (p, els, t0, until, color = COL.chalk) => {
  const bs = els.map(e => e.getBBox()), x = Math.min(...bs.map(b => b.x)) - 8, y = Math.min(...bs.map(b => b.y)) - 6;
  const w = Math.max(...bs.map(b => b.x + b.width)) + 8 - x, hh = Math.max(...bs.map(b => b.y + b.height)) + 6 - y;
  const r = path(p, `M${x} ${y}H${x + w}V${y + hh}H${x}Z`, { stroke: color, 'stroke-width': 2.5, fill: 'none', 'stroke-linejoin': 'round' }, { d: 0 });
  draw(r, t0, .6); hide(r, until, .3);
  return r;
};
// A pointer riding on an arrow's tip while the beat moves it ("u can be anywhere on the line").
const hand = (sb, id) => {
  const { PX, PY } = sb.P, g = G(sb.P.g, { o: 0 });
  g.style.pointerEvents = 'none';
  path(g, 'M0 0L0 30L8 23L14 36L20 33L14 21L24 21Z', { fill: COL.chalk, stroke: COL.board, 'stroke-width': 2.5, 'stroke-linejoin': 'round' });
  const upd = v => { const q = id === 'u' || id === 'w' ? [v[id + '0'], v[id + '1']] : sb.vs.calc()[id]; put(g, { x: PX(q[0]) + 6, y: PY(q[1]) + 6 }); };
  sb.onChange(upd); upd(sb.v);
  return g;
};
// The walk tip to tail as hops over the line, as on a number line: u from 0, then w from u's tip (arrows on one line
// lie on top of each other, so the hops show the order). pts are plane points; the first hop bulges up, the next down.
const hops = (sb, pts, cols, t0, gap = 1.2) => {
  const { PX, PY } = sb.P, g = G(sb.P.g, {});
  g.style.pointerEvents = 'none';
  for (let i = 0; i + 1 < pts.length; i++) {
    const A = [PX(pts[i][0]), PY(pts[i][1])], B = [PX(pts[i + 1][0]), PY(pts[i + 1][1])], L = Math.hypot(B[0] - A[0], B[1] - A[1]);
    let n = [-(B[1] - A[1]) / L, (B[0] - A[0]) / L];
    if ((i % 2 === 0) === (n[1] > 0)) n = [-n[0], -n[1]];   // first hop above, the next below
    const C = [(A[0] + B[0]) / 2 + n[0] * L * .45, (A[1] + B[1]) / 2 + n[1] * L * .45];
    const arc = path(g, `M${A[0]} ${A[1]}Q${C[0]} ${C[1]} ${B[0]} ${B[1]}`, { stroke: cols[i], 'stroke-width': 3.5, 'stroke-dasharray': '1 1' }, { d: 0 });
    const dx = B[0] - C[0], dy = B[1] - C[1], dl = Math.hypot(dx, dy), ux = dx / dl, uy = dy / dl;
    const head = path(g, `M${B[0] - 16 * ux - 8 * uy} ${B[1] - 16 * uy + 8 * ux}L${B[0]} ${B[1]}L${B[0] - 16 * ux + 8 * uy} ${B[1] - 16 * uy - 8 * ux}`, { stroke: cols[i], 'stroke-width': 3.5 }, { o: 0 });
    draw(arc, t0 + i * gap, .8); show(head, t0 + i * gap + .7, .2);
  }
  return g;
};
// A dashed amber ring at a plane point: a target.
const ringAt = (sb, x, y, t0, into, { label = `(${num(x)}, ${num(y)})`, color = COL.task, dx = 22, dy = -16 } = {}) => {
  const g = G(into, { x: sb.P.PX(x), y: sb.P.PY(y), o: 0 });
  mk('circle', { r: 17, fill: 'none', stroke: color, 'stroke-width': 4, 'stroke-dasharray': '5 5' }, g);
  if (label) M(g, [label], { x: dx, y: dy, size: 26, fill: color, anchor: dx < 0 ? 'end' : 'start' });
  show(g, t0, .4);
  return g;
};
// A small plane with one set drawn on it, for the choice question.
const thumb = (p, cx, cy, n, draw_) => {
  const P2 = plane(p, { cx, cy, u: 20, x0: -4, x1: 4, y0: -4, y1: 4, t0: .3, step: 2 });
  const g = G(P2.g, {}), { PX, PY } = P2;
  draw_(g, PX, PY);
  T(p, String(n), { x: cx - 4 * 20 - 26, y: cy - 4 * 20 + 6, size: 30, fill: COL.chalk, weight: 700, anchor: 'middle' });
  return P2;
};

/* ---------- practice data ---------- */
const YN = [['y', 'Yes', null, 'Y'], ['n', 'No', null, 'N']];
const SETQ = [
  { parts: ['the line ', $m('y = 3x')], ans: ['y'], why: 'It is 3x − y = 0: right side 0, through the origin. Sums give 0 + 0, multiples c·0.' },
  { parts: ['the line ', $m('y = 3x + 1')], ans: ['n'], why: '(0, 0) gives 0 = 1? No: the zero vector is not on it.' },
  { parts: ['the x-axis, ', $m('y = 0')], ans: ['y'], why: 'A line through the origin: [a, 0] + [b, 0] = [a + b, 0], and c·[a, 0] = [ca, 0].' },
  { parts: ['the line ', $m('x = 2')], ans: ['n'], why: '[2, 0] + [2, 1] = [4, 1]: x is 4, not 2. It misses the origin.' },
  { parts: ['the zero vector alone'], ans: ['y'], why: '0 + 0 = 0 and c·0 = 0: the smallest subspace.' },
  { parts: ['the single point ', $m('(1, 1)')], ans: ['n'], why: '2·[1, 1] = [2, 2] is not [1, 1]; and the zero vector is missing.' },
  { parts: ['the whole plane ', $m('R²')], ans: ['y'], why: 'Every sum and multiple of vectors in the plane is in the plane.' },
  { parts: ['the upper half, ', $m('y ≥ 0')], ans: ['n'], why: '[0, 1] is in it, but −1·[0, 1] = [0, −1] is not.' },
];
// Lines with two vectors on them: add, then put the sum into the left side.
const SUMQ = [
  ['2x + y = 0', [1, -2], [-3, 6], (x, y) => 2 * x + y],
  ['x − 3y = 0', [3, 1], [-6, -2], (x, y) => x - 3 * y],
  ['x + y = 4', [1, 3], [2, 2], (x, y) => x + y],
  ['x − y = 1', [3, 2], [0, -1], (x, y) => x - y],
].map(([eq, u, w, f]) => {
  const s = [u[0] + w[0], u[1] + w[1]], val = f(...s);
  console.assert(f(...u) === f(...w), 'SUMQ: u and w on one line', eq);
  const br = q => `[${q.map(num).join(', ')}]`;
  return { eq, gives: f(...u), parts: [`${eq}:   u = ${br(u)},  w = ${br(w)}.     u + w = [`, { box: String(s[0]) }, ', ', { box: String(s[1]) }, '],   left side ', { box: String(val) }],
    why: `u + w = ${br(s)}, which gives ${num(val)}. ${val === f(...u) ? 'The same as u and w: on the line.' : `The line needs ${num(f(...u))}: off the line.`}`,
    hint: 'Add tops, add bottoms. Then put the two numbers into the left side of the equation.' };
});
const RULEQ = [
  { parts: ['every vector on x + 2y = 3 gives 3.   u + w gives ', { box: '6' }], why: '3 + 3 = 6: the sum is off the line.', hint: 'u gives 3 and w gives 3. What do they give together?' },
  { parts: ['…   and 4u gives ', { box: '12' }], why: '4 · 3 = 12.', hint: 'Four times u gives four times what u gives.' },
  { parts: ['…   and 0u, the zero vector, gives ', { box: '0' }], why: '0 + 2·0 = 0, not 3: the zero vector is not on this line.', hint: 'Put x = 0 and y = 0 into x + 2y.' },
  { parts: ['x + 5y = k is a subspace exactly when k = ', { box: '0' }], why: 'Only then does it pass through the origin.', hint: 'A subspace must hold the zero vector: put (0, 0) into x + 5y.' },
  { parts: ['u = [2, 1] is in a subspace, so −3u = [', { box: '-6' }, ', ', { box: '-3' }, '] is too'], why: 'Every multiple stays inside: −3·2 = −6, −3·1 = −3.', hint: 'Multiply both numbers of u by −3.' },
  { parts: ['u = [1, 2], w = [0, 1] are in it, so 2u − w = [', { box: '2' }, ', ', { box: '3' }, '] is too'], why: '[2, 4] − [0, 1] = [2, 3]: a combination stays inside.', hint: 'First 2u = [2, 4], then subtract w.' },
];

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Subspaces of the plane', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unit 5, Chapter 38', { x: 800, y: 250, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'Subspaces of the Plane', { x: 800, y: 360, size: 88, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'a space inside a space: add and stretch, and you never get out', 800, 460, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    // a line through the origin; two arrows on it and their sum, which stays on it
    const lg = G(scene, { x: 800, y: 700, o: 0 }), U = 46, at = (x, y) => [x * U, -y * U];
    path(lg, `M${at(-6, -3)}L${at(6, 3)}`, { stroke: SETC, 'stroke-width': 6, 'stroke-linecap': 'round' });
    const arr = (a, b, color, w = 5) => {
      const [x0, y0] = at(...a), [x1, y1] = at(...b), L = Math.hypot(x1 - x0, y1 - y0), ux = (x1 - x0) / L, uy = (y1 - y0) / L;
      return path(lg, `M${x0} ${y0}L${x1 - ux * 12} ${y1 - uy * 12}M${x1 - 20 * ux - 10 * uy} ${y1 - 20 * uy + 10 * ux}L${x1} ${y1}L${x1 - 20 * ux + 10 * uy} ${y1 - 20 * uy - 10 * ux}Z`, { stroke: color, fill: color, 'stroke-width': w, 'stroke-linejoin': 'round' }, { d: 0 });
    };
    mk('circle', { r: 6, fill: COL.chalk }, lg);
    const a1 = arr([0, 0], [2, 1], GREEN), a2 = arr([2, 1], [5, 2.5], VIOLET), a3 = arr([0, 0], [5, 2.5], COL.chalk, 6);
    show(lg, m('sub') + .8, .5); draw(a1, m('sub') + 1, .6); draw(a2, m('move'), .7); draw(a3, m('move') + .9, .7);
    const ok = text(lg, '✓ still on the line', 5 * U + 24, -2.5 * U + 10, m('move') + 1.8, { size: 28, fill: COL.good, weight: 700 });
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(lg, D - .9, .8);
  }],

  ['recap', 'The rule, and a smaller set', (m) => {
    const p = S.p = panel(0);
    text(p, 'A space inside a space', 60, 110, .2, { size: 40, weight: 600 });
    const sb = subspace2(p, { set: 'all', u: [2, 1], w: [-1, 3], show: [], t0: .3 });
    const r1 = text(p, 'rule 1:  add any two vectors: the sum stays inside', 90, 210, m('add'), { size: 30, weight: 600 });
    const r2 = text(p, 'rule 2:  multiply one by any number: it stays inside', 90, 262, m('scale'), { size: 30, weight: 600 });
    sb.show(['u', 'w'], m('add') + .3); sb.show(['dw', 'sum'], m('add') + 1.3);
    // R²: everything; a sum of two of its arrows, then a stretch
    const r2t = text(p, 'R²: every vector of the plane', 90, 340, m('r2'), { size: 30, fill: SETC, weight: 600 });
    sb.to({ c: 2, d: 0 }, m('scale') + 1, 1.2); sb.to({ c: 1, d: 1 }, m('r2') + .5, 1);
    sb.to({ u0: -1, u1: 2, w0: 3, w1: -1 }, m('r2') + 2.6, 1.6);
    sb.to({ c: 2, d: 0 }, m('r2') + 5.2, 1.4); sb.hide(['dw', 'w'], m('r2') + 5, .4);
    // a smaller set: the plane shrinks to one line through the origin
    hide(r2t, m('q') - .2, .3);
    // vs.to plans from the moves written before it, so moves are written in the order they play
    sb.to({ c: 1, d: 1, u0: 2, u1: 1, w0: -4, w1: -2 }, m('q') - .5, .8);
    sb.kind('line', m('q') + .4);
    sb.show(['w', 'dw'], m('q') + .6);
    tw(sb.setG, { o: 0 }, m('q'), .4); tw(sb.setG, { o: 1 }, m('q') + .45, .6);
    text(p, 'a part of the plane: one line', 90, 340, m('q') + .6, { size: 30, fill: SETC, weight: 600 });
    const nm = G(p, { o: 0 });
    T(nm, 'subspace:', { x: 90, y: 440, size: 40, weight: 700 });
    T(nm, 'a set inside R² that obeys the rule by itself', { x: 90, y: 490, size: 30, weight: 600 });
    show(nm, m('name'), .6);
    sb.to({ w0: 2, w1: 1 }, m('name') + 3, 2); sb.to({ u0: 4, u1: 2 }, m('name') + 5.5, 2); sb.to({ u0: 2, u1: 1 }, m('name') + 8, 2.4);   // 2u and −1.5u stay on the board
    const tt = G(p, { o: 0 });
    T(tt, 'the test:  pick u and w in the set', { x: 90, y: 580, size: 30, fill: COL.chalk, weight: 600 });
    T(tt, 'is u + w in it?   is every multiple c·u in it?', { x: 90, y: 628, size: 30, fill: COL.chalk, weight: 600 });
    show(tt, m('test'), .6);
    pulseG(sb.vs.A.u.g, m('test') + 1.6); pulseG(sb.vs.A.w.g, m('test') + 1.9);
    sb.hide(['dw', 'w'], m('test') + 4.6, .3); sb.to({ c: 2, d: 0 }, m('test') + 5, 1.2); sb.to({ c: -1.5 }, m('test') + 6.4, 1.4); sb.to({ c: 1, d: 1 }, m('fail') - .3, .8); sb.show(['dw', 'w'], m('fail'), .3);
    text(p, 'one sum or one multiple outside: not a subspace', 90, 710, m('fail'), { size: 30, fill: COL.bad, weight: 600 });
  }],

  ['line0', 'A line through the origin', (m) => {
    const p = S.p = panel(0);
    text(p, 'Test 1: the line x − 2y = 0', 60, 110, .2, { size: 40, weight: 600 });
    const B = S.B = testBoard(p, { line: [1, -2, 0], u: [2, 1], w: [-4, -2] }), sb = S.sb = B.sb;
    put(sb.setG, { o: 0 });
    showRow(B.eq, .3); show(sb.setG, m('eq'), .8); thickSet(sb, m('eq') + 3.2);
    text(p, 'right side 0: through the origin', 90, 256, m('eq') + 3.4, { size: 26, fill: COL.dim });
    showRow(B.u, m('u')); sb.show('u', m('u') + .2); show(B.cu, m('u') + 2.2);
    showRow(B.w, m('w')); sb.show('w', m('w') + .2); show(B.cw, m('w') + 3);
    showRow(B.combo, m('add'));
    sb.flash('u0', m('add') + 1); sb.flash('w0', m('add') + 1.6); sb.flash('sum0', m('add') + 2.6);
    sb.flash('u1', m('add') + 4.2); sb.flash('w1', m('add') + 4.8); sb.flash('sum1', m('add') + 5.8);
    const nb = k => sb.num(k)[0];
    boxNums(p, [nb('u0')], m('add') + .9, m('add') + 4, GREEN); boxNums(p, [nb('w0')], m('add') + 1.5, m('add') + 4, VIOLET); boxNums(p, [nb('sum0')], m('add') + 2.5, m('add') + 4);
    boxNums(p, [nb('u1')], m('add') + 4.1, m('add') + 7.6, GREEN); boxNums(p, [nb('w1')], m('add') + 4.7, m('add') + 7.6, VIOLET); boxNums(p, [nb('sum1')], m('add') + 5.7, m('add') + 7.6);
    sb.show('dw', m('pic')); sb.show('sum', m('pic') + 2.6);
    const hp = hops(sb, [[0, 0], [2, 1], [-2, -1]], [GREEN, VIOLET], m('pic') + .3);
    hide(hp, m('three') - .3, .3);
    show(B.out, m('test')); thickSet(sb, m('test') + 1.5);
    tw(sb.ring, { s: 1.5 }, m('test') + 3.4, .25); tw(sb.ring, { s: 1 }, m('test') + 3.7, .4);
    tw(sb.ring, { s: 1.5 }, m('on') + .2, .25); tw(sb.ring, { s: 1 }, m('on') + .5, .4);
    // multiples: 3u, −u, 0u (d = 0: w steps aside)
    sb.hide(['dw', 'w'], m('three') - .3, .3); hide(B.cw, m('three') - .3, .3);
    sb.to({ c: 3, d: 0 }, m('three'), 1.3); sb.flash('c', m('three'));
    sb.to({ c: -1 }, m('neg'), 1.3); sb.flash('c', m('neg'));
    sb.to({ c: 0 }, m('zero'), 1.1); sb.flash('c', m('zero'));
  }],

  ['why0', 'Why it always works', (m) => {
    const p = S.p, B = S.B, sb = S.sb;
    sb.to({ c: 1, d: 1 }, .2, .8); sb.show(['w', 'dw'], .3); show(B.cw, .3);
    pulseG(B.cu, m('each') + .6); pulseG(B.cw, m('each') + 3.2);
    sb.to({ u0: 6, u1: 3 }, m('each') + 4.6, 1.4); sb.to({ u0: 2, u1: 1 }, m('sum') + .2, 1.2);
    sb.to({ c: 2 }, m('mult') + 1.5, 1.2); sb.to({ c: -1 }, m('mult') + 3, 1.2); sb.to({ c: 1 }, m('mult') + 4.5, 1);
    const n1 = text(p, 'u + w gives  0 + 0 = 0', 90, 765, m('sum') + 4.6, { size: 30, weight: 600 });
    const n2 = text(p, 'c·u gives  c · 0 = 0', 430, 765, m('mult'), { size: 30, weight: 600 });
    // a hand moves u and w along the line; every check stays 0
    const hu = hand(sb, 'u'), hw = hand(sb, 'w');
    show(hu, m('drag') - .2, .3);
    sb.to({ u0: 6, u1: 3 }, m('drag') + .2, 1.1); sb.to({ u0: -2, u1: -1 }, m('drag') + 1.5, 1.1);
    hide(hu, m('drag') + 2.7, .3); show(hw, m('drag') + 2.7, .3);
    sb.to({ w0: 6, w1: 3 }, m('drag') + 3, 1.1); sb.to({ w0: 4, w1: 2 }, m('drag') + 4.3, 1);
    hide(hw, m('drag') + 5.4, .3);
    hide(n1, m('name') - .2, .3); hide(n2, m('name') - .2, .3);
    const nm = text(p, 'x − 2y = 0 is a subspace of R²', 90, 765, m('name') + 2.4, { size: 32, fill: COL.good, weight: 700 });
    thickSet(sb, m('name') + 2.4);
  }],

  ['ex2', 'Another line through the origin', (m) => {
    const p = S.p = panel(0);
    text(p, 'Test 2: the line 3x + y = 0', 60, 110, .2, { size: 40, weight: 600 });
    const B = S.B = testBoard(p, { line: [1, -2, 0], u: [2, 1], w: [-4, -2], o: 1, show: ['u', 'w'] }), sb = S.sb = B.sb;
    hide(B.combo.g, 0, 0); hide(B.out, 0, 0);
    [B.cu, B.cw].forEach(e => { hide(e, m('turn') - .2, .2); show(e, m('turn') + 1.9, .4); });
    sb.to({ a: 3, b: 1, u0: 1, u1: -3, w0: -2, w1: 6 }, m('turn'), 1.8);
    ['a', 'b'].forEach(k => sb.flash(k, m('turn')));

    id: 'p-back', prompt: ['Now ', $m('u = [2, 1]'), ' and ', $m('w = [4, 2]'), '. Find ', $m('c ≠ 0'), ' and ', $m('d'), ' with ', $m('cu + dw'), ' = the zero vector.'],
    build: (body, api) => {
      S.sb.set({ a: 1, b: -2, k: 0, u0: 2, u1: 1, w0: 4, w1: 2, c: 1, d: 1 });
      ['dw', 'sum'].forEach(id => { put(S.sb.vs.A[id].g, { o: 1 }); put(S.sb.vs.A[id].lab, { o: 1 }); }); put(S.sb.ring, { o: 1 }); put(S.B.out, { o: 1 });
      if (!S.combo) S.combo = S.sb.row([{ key: 'c' }, { t: 'u', fill: GREEN }, { key: 'd', signed: true }, { t: 'w', fill: VIOLET }, '=', { col: 'sum' }], { x: 90, y: 425, size: 38, tight: true });
      return sbTask(S.sb, v => Math.abs(v.c) > 1e-9 && Math.hypot(...S.sb.vs.calc().sum) < 1e-9, 'w = 2u, so 2u − w = 0 (and any multiple: −4u + 2w, …).',
        v => Math.abs(v.c) < 1e-9 ? 'c must not be 0.' : 'Not zero yet. w is twice u: how many u cancel one w?', () => S.sb.set({ c: 2, d: -1 }), { only: ['c', 'd'], drag: [] })(body, api);
    },
  }], done, 'Chapter practice · set 4 of 4') }],
  ['play', 'Playground', (m) => {
    const p = panel(0);
    text(p, 'Playground', 60, 110, .2, { size: 40, weight: 600 });
    const B = S.B = testBoard(p, { line: [1, -2, 0], u: [2, 1], w: [-4, -2], o: 1, show: ['u', 'w', 'dw', 'sum'] }), sb = S.sb = B.sb;
    [B.cu, B.cw].forEach(e => put(e, { o: 0 }));
    put(B.combo.g, { y: -80 }); put(B.out, { x: 330, y: -195 });   // the readout beside c u + d w: the card fits under them
    text(p, 'try: slide it off the origin · make c negative · turn the line', 90, 256, m('go'), { size: 24, fill: COL.dim });
  }, { ask: playAsk(() => S.sb, { pos: { x: 40, y: 540, w: 720, cls: 'side' }, tip: 'Your test. Change any number, drag the line, or a tip along it. The ring is green while c u + d w stays on the line.' }) }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

boot();
