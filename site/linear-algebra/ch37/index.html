<script>
'use strict';
const CHAPTER = { number: 37, title: 'What Is a Vector Space?', minutes: 13, language: 'en', next: '../ch38/' };

/* ---------- chapter helpers ---------- */
const GREEN = VS_COL[0], VIOLET = VS_COL[1];
const V2 = { v: [2, 1], w: [-1, 2] };                               // the plane's pair: v + w = (1, 3)
const Q2 = { v: [2, 1], w: [1, 3] };                                // the quarter: v + w = (3, 4)
const RV = [1, -2, 0, 3, 1], RW = [2, 1, -1, 0, 2];                 // R⁵: v + w = (3, −1, −1, 3, 3), 2v = (2, −4, 0, 6, 2)
const CARD = { x: 40, y: 450, w: 740, cls: 'side' };
const say = (p, parts, x, y, t0, { size = 40, fill = COL.chalk, anchor = 'start' } = {}) => { const e = M(p, [].concat(parts), { x, y, size, fill, anchor, o: 0 }); show(e, t0); return e; };
const text = (p, str, x, y, t0, { size = 30, fill = COL.chalk, anchor = 'start', weight = 500 } = {}) => { const e = T(p, str, { x, y, size, fill, anchor, weight, o: 0 }); show(e, t0); return e; };
const title = (p, str) => text(p, str, 60, 110, .2, { size: 40, weight: 600 });
const showRow = (r, t0, dur = .4) => r.parts.forEach(e => show(e, t0, dur));
// flash the columns of a row as the voice reads them: [[id, at], …] with id 'cv', 'dw', 'sum', 'v', 'w'
const readCols = (vs, list) => list.forEach(([id, at]) => { vs.flash(id + '0', at); vs.flash(id + '1', at); });
const thick = (vs, id, t0, w = 5) => { tw(vs.A[id].path, { 'a_stroke-width': w + 5 }, t0, .3); tw(vs.A[id].path, { 'a_stroke-width': w }, t0 + 1.2, .6); };
// a coordinate as the columns write it: whole, a half as ½ or 3/2, else one decimal (a value in passing)
const coord = x => Math.abs(x - Math.round(x)) < 1e-9 ? num(Math.round(x) || 0) : Math.abs(x * 2 - Math.round(x * 2)) < 1e-9 ? (x < 0 ? '−' : '') + (Math.round(Math.abs(x * 2)) === 1 ? '½' : Math.round(Math.abs(x * 2)) + '/2') : num(Math.round(x * 10) / 10);
const pair = (x, y) => `(${coord(x)}, ${coord(y)})`;
// c·v alone and d·w alone, named as written ("2v", "−w"); vs.combo names the whole combination.
const cvName = vs => s => vs.combo({ c: s.c, d: 0 }), dwName = vs => s => vs.combo({ c: 0, d: s.d });
const cvOnly = vs => s => Math.abs(s.c - 1) < 1e-9 ? [] : vs.combo({ c: s.c, d: 0 });   // c·v over v: at c = 1 the name is v's own
// The combination's name, live, right-aligned at x, then "= …columns" (items as in vs.row): "2v + w = [4 2] + [−1 2] = [3 4]".
// While c or d passes between nice values the name is the general one, idle. Returns the row: .parts[0] is "=", then the items.
const comboRow = (vs, p, x, y, items, t0, { name = s => vs.combo(s), idle = ['c v + d w'], size = 46 } = {}) => {
  const g = G(p, { o: 0 }), ink = G(g, {});
  let key = '';
  const up = () => { let pp = name(vs.v); if (!pp.length) pp = idle; const k = JSON.stringify(pp); if (k === key) return; key = k; ink.replaceChildren(); if (pp.length) M(ink, pp, { x, y, size, anchor: 'end' }); };
  vs.onChange(up); up();
  const r = vs.row(['=', ...items], { x: x + 14, y, size });
  g.appendChild(r.g);
  if (t0 != null) show(g, t0, .4);
  return r;
};
// The plane's vectors: v and w, c·v + d·w drawn tip to tail, the combination as the amber arrow.
const plane2 = (p, { v, w }, { c = 1, d = 1, show: sh = ['v', 'w'], t0 = .1, steps, colors } = {}) => {
  const vs = vecs(p, { vecs: { v, w }, c, d, show: sh, plane: { cx: 1160, cy: 460, u: 50 }, t0, steps, colors });
  vs.label('sum', s => vs.combo(s));
  vs.label('cv', ['']); vs.label('dw', ['']);
  return vs;
};
// A region of the plane drawn under the arrows: 'quarter' (x, y ≥ 0), 'half' (y ≥ 0), 'dots' (whole-number points).
const region = (vs, kind, t0 = .3) => {
  const { PX, PY, x0, x1, y0, y1 } = vs.P, g = G(vs.P.g, { o: 0 });
  vs.P.g.insertBefore(g, vs.layer);
  if (kind === 'dots') { for (let x = x0; x <= x1; x++) for (let y = y0; y <= y1; y++) mk('circle', { cx: PX(x), cy: PY(y), r: 5, fill: COL.chalk, 'fill-opacity': .55 }, g); }
  else if (kind === 'holey') {   // the whole plane with the origin cut out: a hole with a red rim
    mk('rect', { x: PX(x0), y: PY(y1), width: PX(x1) - PX(x0), height: PY(y0) - PY(y1), fill: COL.chalk, 'fill-opacity': .1 }, g);
    mk('circle', { cx: PX(0), cy: PY(0), r: 13, fill: COL.board, stroke: COL.bad, 'stroke-width': 3 }, g);
  } else if (kind === 'one') {   // one arrow, (1, 1), and nothing else
    mk('circle', { cx: PX(1), cy: PY(1), r: 16, fill: 'none', stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '5 5' }, g);
  } else {
    const yb = kind === 'half' ? y0 : 0;
    mk('rect', { x: PX(kind === 'half' ? x0 : 0), y: PY(y1), width: PX(x1) - PX(kind === 'half' ? x0 : 0), height: PY(yb) - PY(y1), fill: COL.chalk, 'fill-opacity': .1 }, g);
    path(g, kind === 'half' ? `M${PX(x0)} ${PY(0)}H${PX(x1)}` : `M${PX(0)} ${PY(y1)}V${PY(0)}H${PX(x1)}`, { stroke: COL.chalk, 'stroke-width': 4, 'stroke-opacity': .6, fill: 'none' });
  }
  if (t0 != null) show(g, t0, .5);
  return g;
};
const IN = {
  quarter: ([x, y]) => x > -1e-9 && y > -1e-9,
  holey: ([x, y]) => Math.hypot(x, y) > 1e-9,
  one: ([x, y]) => Math.abs(x - 1) < 1e-9 && Math.abs(y - 1) < 1e-9,
  half: ([x, y]) => y > -1e-9,
  dots: ([x, y]) => Math.abs(x - Math.round(x)) < 1e-9 && Math.abs(y - Math.round(y)) < 1e-9,
};
// A live line under the algebra: where the combination's tip is and whether it is inside the region.
// While a number passes between nice values the line only follows, dim: no verdict on a value in passing.
const verdict = (p, vs, kind, x, y, t0) => {
  const g = G(p, { o: 0 }), t = T(g, '', { x, y, size: 30, weight: 700 });
  const up = () => {
    const s = vs.calc().sum, ok = IN[kind](s), still = Object.values(vs.v).every(vs.nice);
    const str = `tip at ${pair(s[0], s[1])}` + (still ? `:  ${ok ? 'inside  ✓' : 'outside  ✗'}` : '');
    if (t.textContent !== str) t.textContent = str;
    t.setAttribute('fill', !still ? COL.dim : ok ? COL.good : COL.bad);
  };
  vs.onChange(up); up();
  if (t0 != null) show(g, t0, .4);
  return g;
};
// R⁵ (or any n) as bars: v and w, and x₁v + x₂w; b is not part of this chapter, so it is hidden.
const barsVW = (p, v, w, mix, { t0 = .1, top = 240, band = 86 } = {}) => {
  const bs = bars(p, { A: v.map((a, i) => [a, w[i]]), b: v.map(() => 99), mix, names: ['v', 'w', 'x₁v + x₂w'], top, band, unit: 9, t0 });
  put(bs.b.g, { o: 0 }); bs.eqs.forEach(e => put(e, { o: 0 })); bs.ax.goal.forEach(r => { r.style.display = 'none'; });
  return bs;
};
const col = xs => h('span', 'vcol', xs.map(x => h('span', '', [num(x)])));

/* ---------- practice data (every sum and multiple worked twice, number by number) ---------- */
const INR2 = [
  { parts: [hcol(3, -1)], ans: ['y'], why: 'Two real numbers: a pair, so it is in R².' },
  { parts: [hcol('1.5', 0)], ans: ['y'], why: 'Fractions and decimals are real numbers too: in R².' },
  { parts: [col([2, 4, 1])], ans: ['n'], why: 'Three numbers: that is a vector of R³, not R².' },
  { parts: [hcol(0, 0)], ans: ['y'], why: 'The zero vector of the plane: in R² (in every vector space).' },
];
const YN = [['y', 'In R²', COL.good, 'Y'], ['n', 'Not in R²', COL.bad, 'N']];
const WHICH = [
  { parts: [hcol(1, 2)], ans: ['2'] }, { parts: [col([0, 0, 0])], ans: ['3'] }, { parts: [col([3, -1, 4, 1, 5])], ans: ['5'] },
  { parts: [col([2, 2, 2, 2])], ans: ['4'] }, { parts: [hcol(-1, '0.5')], ans: ['2'] }, { parts: [col([7, 0, 0, 0, 0])], ans: ['5'] },
].map(r => ({ ...r, why: `It has ${r.ans[0]} numbers: in R${'⁰¹²³⁴⁵'[+r.ans[0]]}. Zeros count as numbers too.` }));
const SPACES = [['2', 'R²', null, '2'], ['3', 'R³', null, '3'], ['4', 'R⁴', null, '4'], ['5', 'R⁵', null, '5']];
const ADDQ = [
  { parts: ['(1, 2, 3) + (4, 0, −1) = (', { box: '5' }, ', ', { box: '2' }, ', ', { box: '2' }, ')'], why: '1 + 4 = 5, 2 + 0 = 2, 3 + (−1) = 2.', hint: 'Add number by number: first with first, second with second, third with third.' },
  { parts: ['3 · (2, −1, 0) = (', { box: '6' }, ', ', { box: '-3' }, ', ', { box: '0' }, ')'], why: 'Every number times 3: 6, −3, 0.', hint: 'Multiply every number by 3, the sign included.' },
  { parts: ['(1, 1, 0, 2) + (−1, 3, 1, 0) = (', { box: '0' }, ', ', { box: '4' }, ', ', { box: '1' }, ', ', { box: '2' }, ')'], why: '1 − 1 = 0, 1 + 3 = 4, 0 + 1 = 1, 2 + 0 = 2: four numbers, in R⁴.', hint: 'Four numbers each: add them in pairs, in order.' },
  { parts: ['2 · (1, 0, −1, 3, 1) − (0, 1, 1, 2, 2) = (', { box: '2' }, ', ', { box: '-1' }, ', ', { box: '-3' }, ', ', { box: '4' }, ', ', { box: '0' }, ')'], why: '2·(1, 0, −1, 3, 1) = (2, 0, −2, 6, 2); minus (0, 1, 1, 2, 2) gives (2, −1, −3, 4, 0).', hint: 'Double the first list, then subtract the second number by number.' },
  { parts: ['0 · (5, −2, 7) = (', { box: '0' }, ', ', { box: '0' }, ', ', { box: '0' }, ')'], why: 'Zero times anything is zero: the zero vector of R³.', hint: 'Every number times 0.' },
];
const ISQ = [
  { parts: ['All of R³ (every list of three numbers)'], ans: ['y'], why: 'Adding or stretching lists of three numbers gives lists of three numbers.' },
  { parts: ['The top right quarter: x ≥ 0 and y ≥ 0'], ans: ['n'], why: '−1 times (2, 1) is (−2, −1): outside.' },
  { parts: ['The upper half: y ≥ 0'], ans: ['n'], why: '−1 times (0, 1) is (0, −1): below, outside.' },
  { parts: ['The points with whole-number coordinates'], ans: ['n'], why: '½ times (1, 1) is (½, ½): between the dots.' },
  { parts: ['All of R⁵'], ans: ['y'], why: 'Five numbers in, five numbers out, whatever you add or multiply.' },
  { parts: ['Every pair (x, y) except (0, 0)'], ans: ['n'], why: '0 times any v is (0, 0), which was left out. Every vector space holds the zero vector.' },
  { parts: ['The single vector (1, 1), alone'], ans: ['n'], why: '(1, 1) + (1, 1) = (2, 2) is not in the collection.' },
];
const YN2 = [['y', 'A vector space', COL.good, 'Y'], ['n', 'Not one', COL.bad, 'N']];
const HANDQ = [
  { id: 'p-half', kind: 'half', start: { v0: 1, v1: 2, w0: 0, w1: 0, c: 1, d: 0 }, prompt: ['The shaded half is every arrow with y ≥ 0. Find v in it and a c that throws c·v out.'],
    why: (v, k) => `v = ${pair(v.v0, v.v1)} is in the half, but c·v = ${pair(k.sum[0], k.sum[1])} is below the x-axis: the half is not a vector space.`,
    hint: (v, k) => !IN.half([v.v0, v.v1]) ? 'Start with v inside: its second number must be 0 or more.' : v.v1 === 0 ? 'v lies on the x-axis: any multiple stays there. Give v a second number above 0.' : 'Try a negative c: it turns the arrow round.',
    ans: { c: -1 } },
  { id: 'p-dots', kind: 'dots', start: { v0: 1, v1: 1, w0: 0, w1: 0, c: 1, d: 0 }, prompt: ['The dots are the whole-number points. Find a c (in halves) that throws c·v off the dots.'],
    why: (v, k) => `c·v = ${pair(k.sum[0], k.sum[1])} is not a dot: the dots are not a vector space.`,
    hint: () => 'A whole c keeps whole numbers. Try c = ½ (scrub c by halves).', ans: { c: .5 } },
];
const testOut = kind => (v, k) => IN[kind]([v.v0, v.v1]) && !(v.v0 === 0 && v.v1 === 0) && !IN[kind](k.sum);

/* ---------- beats ---------- */
const BEATS = [
  ['intro', 'What is a vector space?', (m, D) => {
    const g = G(scene, { o: 0, y: 24 });
    T(g, 'Unit 5, Chapter 37', { x: 800, y: 250, size: 28, fill: COL.dim, anchor: 'middle' });
    T(g, 'What Is a Vector Space?', { x: 800, y: 360, size: 84, weight: 600, anchor: 'middle' });
    tw(g, { o: 1, y: 0 }, .2, 1.1, out);
    const r = text(scene, 'add, stretch, and stay inside', 800, 460, m('sub'), { size: 34, fill: COL.dim, anchor: 'middle' });
    // a small sheet with two arrows that add and stretch inside it
    const lg = G(scene, { x: 800, y: 680, o: 0 });
    mk('rect', { x: -230, y: -110, width: 460, height: 200, rx: 18, fill: COL.chalk, 'fill-opacity': .07, stroke: COL.faint, 'stroke-width': 2 }, lg);
    const arr = (c, w) => { const e = path(lg, '', { stroke: c, 'stroke-width': w, 'stroke-linecap': 'round', fill: 'none' }); return e; };
    const a1 = arr(GREEN, 6), a2 = arr(VIOLET, 6), s = arr(COL.task, 7);
    show(lg, m('move') - .2, .5);
    prog(q => {
      const k = 1 + .8 * Math.sin(Math.PI * Math.min(1, q * 1.4));
      a1.setAttribute('d', `M-60 40l${70 * k} -40`); a2.setAttribute('d', `M-60 40l${-20} -70`);
      s.setAttribute('d', q > .2 ? `M-60 40l${70 * k - 20} -110` : '');
    }, m('move'), 4, lin);
    tw(g, { o: 0, y: -24 }, D - .9, .8); hide(r, D - .9, .8); hide(lg, D - .9, .8);
  }],

  ['recall', 'Vectors so far', (m) => {
    const p = panel(0);
    title(p, 'Vectors so far: arrows you add and stretch');
    const vs = plane2(p, V2, { show: [], t0: m('v') - .4, c: 1, d: 1 });
    vs.label('cv', cvName(vs)); vs.label('dw', dwName(vs));
    vs.row([{ t: 'v', fill: GREEN }, '=', { col: 'v', fixed: true }], { x: 90, y: 250 });
    vs.show('v', m('v') + .3);
    thick(vs, 'v', m('v') + 2); vs.flash('v0', m('v') + 3.6); vs.flash('v1', m('v') + 3.6);
    const rw = vs.row([{ t: 'w', fill: VIOLET }, '=', { col: 'w', fixed: true }], { x: 380, y: 250, o: 0 }); showRow(rw, m('w'), .4);
    vs.show('w', m('w') + .3);
    vs.show(['dw'], m('add') + .6); vs.dim('w', m('add') + .6, .25);
    vs.show('sum', m('sum') + .2);
    const rs = vs.row(['v + w', '=', { fn: () => ['2 + (−1)', '1 + 2'], w: 200 }, '=', { fn: () => ['1', '3'], w: 70, fill: COL.task }], { x: 90, y: 450, o: 0 }); showRow(rs, m('sum'), .4);
    vs.hide(['dw', 'sum'], m('stretch') - .2); vs.dim('w', m('stretch') - .2, 1);
    vs.to({ c: 2, d: 0 }, m('stretch'), .1);
    vs.show('cv', m('stretch') + .3); vs.dim('v', m('stretch') + .3, .3);
    const r2 = vs.row(['2v', '=', { fn: () => ['2 · 2', '2 · 1'], w: 140 }, '=', { fn: () => ['4', '2'], w: 70, fill: GREEN }], { x: 90, y: 640, o: 0 }); showRow(r2, m('stretch') + .6, .4);
    vs.hide('cv', m('mix') - .2); vs.dim('v', m('mix') - .2, 1);
    vs.to({ c: 1, d: 1 }, m('mix'), .1);
    vs.show(['cv', 'dw', 'sum'], m('mix') + .3); vs.dim(['v', 'w'], m('mix') + .3, .25);
    // the mixes, each read number by number on the row that replaces the two above
    [rs, r2].forEach(r => hide(r.g, m('mix') + .2, .4));
    comboRow(vs, p, 250, 520, [{ col: 'cv', fixed: true }, '+', { col: 'dw', fixed: true }, '=', { col: 'sum', fixed: true }], m('mix1') - .3);
    [['mix1', { c: 2, d: 1 }, [1.6, 2.8, 4.4]], ['mix2', { c: -1, d: 2 }, [2.4, 4.3, 6.4]], ['mix3', { c: 1, d: -1 }, [1.4, 2.6, 4.1]]].forEach(([k, cd, at]) => {
      vs.to(cd, m(k) - .2, 1); readCols(vs, [['cv', m(k) + at[0]], ['dw', m(k) + at[1]], ['sum', m(k) + at[2]]]);
    });
    vs.to({ c: .5, d: 1.5 }, m('mix3') + 6.2, 1.6); vs.to({ c: -2, d: -1 }, m('mix3') + 8.4, 1.6);   // "every pair c, d": two more
  }],

  ['space', 'Two rules', (m) => {
    const p = panel(0);
    title(p, 'A vector space: two rules');
    const vs = S.vs = plane2(p, V2, { show: [], c: 1, d: 1 });
    const rules = G(p, {});
    text(rules, 'A vector space is a collection of vectors where', 90, 200, m('word'), { size: 28, fill: COL.dim, weight: 600 });
    text(rules, '1.  v + w is inside, for any two inside', 90, 260, m('rule1'), { size: 32, weight: 700 });
    text(rules, '2.  c·v is inside, for any one and any number c', 90, 310, m('rule2'), { size: 32, weight: 700 });
    // each rule underlined as it is read
    [['rule1', 260, 560], ['rule2', 310, 690]].forEach(([k, y, w]) => draw(path(rules, `M90 ${y + 12}h${w}`, { stroke: COL.chalk, 'stroke-width': 3, 'stroke-opacity': .6 }, { d: 0 }), m(k) + .4, 4.2, lin));
    const whole = G(p, { o: 0 }), { PX, PY } = vs.P;
    mk('rect', { x: PX(-6), y: PY(6), width: PX(6) - PX(-6), height: PY(-6) - PY(6), fill: COL.chalk, 'fill-opacity': .08 }, whole);
    vs.P.g.insertBefore(whole, vs.layer);
    tw(whole, { o: 1 }, m('plane'), .8);
    say(p, ['R² = every pair (x, y)'], 90, 410, m('plane') + 3, { size: 34 });
    // "every pair": pairs land all over the plane
    const dotsG = G(p, {}), { PX: px, PY: py } = vs.P;
    [[3, 4], [-5, 2], [1.5, -3], [-2, -4.5], [5, -1], [-.5, 3.5], [4, 2.5], [-4, -1.5], [2, -5], [0, 1], [-3, 5], [5.5, 4.5]].forEach(([x, y], k) => {
      const d_ = mk('circle', { cx: px(x), cy: py(y), r: 7, fill: COL.chalk }, dotsG); put(d_, { o: 0 }); show(d_, m('plane') + 1 + k * .45, .2);
    });
    hide(dotsG, m('add') - .3, .4);
    vs.show(['v', 'w'], m('plane') + 1.5);
    vs.show(['cv', 'dw', 'sum'], m('add')); vs.dim(['v', 'w'], m('add'), .25);
    comboRow(vs, p, 250, 560, [{ col: 'sum', fixed: true }], m('add') + .4);
    vs.flash('sum0', m('add') + 2.4); vs.flash('sum1', m('add') + 4.6);
    const ok = (t0, t1) => { const e = text(p, 'two numbers: in R²  ✓', 420, 572, t0, { size: 30, fill: COL.good, weight: 700 }); hide(e, t1, .3); };
    ok(m('in1'), m('scale') - .2);
    vs.to({ c: 3, d: 0 }, m('scale'), 1.2); vs.hide('dw', m('scale'), .4); vs.flash('sum0', m('scale') + 1.2); vs.flash('sum1', m('scale') + 1.2);
    ok(m('in2'), m('neg') - .2);
    vs.to({ c: -1, d: 0 }, m('neg'), 1.4);
    ok(m('neg') + 2, m('so') + 3);
    vs.to({ c: 1.5, d: -1 }, m('so') + .3, 1.4); vs.show('dw', m('so') + .3); vs.to({ c: -.5, d: 1.5 }, m('so') + 2, 1.4);
    text(p, 'R² is a vector space', 90, 680, m('so') + 4.2, { size: 36, weight: 700 });
  }],

  ['zero', 'The zero vector', (m) => {
    const p = panel(0);
    title(p, 'Every vector space holds the zero vector');
    const vs = plane2(p, { v: V2.v, w: [-2, -1] }, { show: ['cv'], c: 1, d: 0 });
    vs.label('cv', cvName(vs)); vs.label('dw0', ['−v']); vs.label('dw', ['−v'], 'mid', [-18, -30]); vs.label('sum', []);
    const top = vs.row([{ key: 'c' }, { t: 'v', fill: GREEN }, '=', { fn: s_ => [[...vs.parts(s_.c), ' · 2'], [...vs.parts(s_.c), ' · 1']], w: 150 }, '=', { col: 'cv', fixed: true }], { x: 90, y: 280 });
    hide(top.g, m('also') - .2, .4);   // "1 · 2" would follow when v comes back
    vs.to({ c: .5 }, m('half') - .3, 1.2); vs.flash('c', m('half') + .9);

  }, { ask: playAsk(() => S.vs, { pos: { x: 40, y: 470, w: 740, cls: 'side' },
