<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Three Little Pigs</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/cast.js"></script>
<script src="../lib/toon.js"></script>
<script src="../img/mother/rig/rig.js"></script><script src="../img/pig1/rig/rig.js"></script><script src="../img/pig2/rig/rig.js"></script><script src="../img/pig3/rig/rig.js"></script><script src="../img/wolf/rig/rig.js"></script>
<script src="../img/mother/pose/pose.js"></script><script src="../img/pig1/pose/pose.js"></script><script src="../img/pig2/pose/pose.js"></script><script src="../img/pig3/pose/pose.js"></script><script src="../img/wolf/pose/pose.js"></script>
<script src="audio/en/timings.js"></script>
<script src="audio/en/mouths.js"></script>
<script src="audio/en/shots.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'The Three Little Pigs', minutes: 4, language: 'en' };
// A picture book: captions are on unless the reader turned them off.
try { if (localStorage.getItem('captions') === null) setCaptions(true, false); } catch {}

/* ---------- helpers ---------- */
const clamp01 = x => Math.min(1, Math.max(0, x)), smooth = x => { x = clamp01(x); return x * x * (3 - 2 * x); };
const dur = id => TIMINGS[id].dur;
const mouthAt = (beat, t) => { let m = 'X'; for (const [at, s] of MOUTHS[beat] || []) { if (at > t) break; m = s; } return m; };
// A painted place in layers that slide past each other with the camera; each layer but the nearest has a
// pre-blurred copy that fades in on close shots (shallow focus).
function scenery(cam, place, layers) {
  const at = { x: -80, y: -45, width: 1760, height: 990 }, soft = [];
  for (const [n, k] of layers) {
    const g = cam.layer(k);
    mk('image', { href: `../img/${place}/${n}.webp`, ...at }, g);
    if (n !== 'front') soft.push(mk('image', { href: `../img/${place}/${n}-soft.webp`, ...at, opacity: 0 }, g));
  }
  return t => { const f = clamp01((cam.at(t).z - 2.4) / .9); soft.forEach(e => e.setAttribute('opacity', f)); };
}
// Shots: [time, view, [view, seconds]?]; the optional push eases toward a second view.
function shots(cam, list) { for (const [t, v, push] of list) { cam.cut(v, t); if (push) cam.to(push[0], t + .01, push[1], soft); } }
// A walk on the drawings, on twos: contact (near leg forward), passing, contact (far leg forward), passing.
const LEGS = [1, 2, 3, 4], SWING = [2, 0, 1, 0], BOB = [1, -1, 1, -1];
const walkPose = (tau, hold) => { const i = ((Math.floor(tau / hold) % 4) + 4) % 4; return { legs: LEGS[i], arm: SWING[i], bob: BOB[i] }; };

/* ---------- shot 1: leaving home ---------- */
// The dirt road runs past the gate and off to the right; the pigs set off along it and walk out of the picture,
// easing into their pace. Positions are a function of time alone.
const PIGS = [
  { id: 'pig1', x: 870, g: 862, k: .4, go: 0, hold: .12, v: 115, stop: true, bounce: 8, lean: 4, seed: 11 },
  { id: 'pig3', x: 745, g: 852, k: .41, go: .35, hold: .16, v: 100, bounce: 5, lean: 2, seed: 23 },
  { id: 'pig2', x: 620, g: 842, k: .41, go: .9, hold: .22, v: 82, bounce: 7, lean: 6, seed: 37 },
];
const MOM = { x: 470, g: 810, k: .52 };
const S1 = TIMINGS.shot1.parts.s01b, SET_OFF = 3.55, PACK = 2.44, LOOK = S1 + 2.47, WOLF = S1 + 3.45;
function pigAt(o, T) {
  // The first pig stops to wave back.
  const tau = T - SET_OFF - o.go, u = Math.max(0, o.stop ? Math.min(tau, LOOK - .25 - SET_OFF - o.go) : tau), d = o.v * (u - (1 - Math.exp(-3 * u)) / 3);
  return { tau, x: o.x + d, g: o.g - .05 * d, k: o.k * (1 - d / 6000) };
}
const inPic = ({ x, y, z }) => ({ x: Math.min(1640 - 800 / z, Math.max(800 / z - 40, x)), y: Math.min(910 - 450 / z, Math.max(450 / z - 20, y)), z });
const pigsView = (T, z, dy = 0) => { const ps = PIGS.map(o => pigAt(o, T)); return inPic({ x: ps.reduce((s, p) => s + p.x, 0) / 3 + 40 / z, y: ps.reduce((s, p) => s + p.g, 0) / 3 - 70 + dy, z }); };
const follow = (T0, z, dy) => ({ x: t => pigsView(T0 + t, z, dy).x, y: t => pigsView(T0 + t, z, dy).y, z });
const momHead = z => inPic({ x: MOM.x + 30, y: MOM.g - 160, z });   // head and shoulders   // her head a little above the middle

function shot1(p, T0, D) {
  const cam = camera(p, D, inPic({ x: 800, y: 450, z: 1 }));
  // The ground, the cottage and the actors share the camera's own plane (k = 1); sky and hills lag, flowers lead.
  const focus = scenery(cam, 'cottage', [['sky', .15], ['far', .4], ['ground', 1], ['mid', 1]]);
  const actors = cam.layer(1);
  const mom = TOON.posed(actors, 'mother');
  const pigs = PIGS.map(o => ({ o, a: TOON.posed(actors, o.id) })).sort((u, v) => u.o.g - v.o.g);
  pigs.forEach(({ a }) => actors.appendChild(a.root));   // nearer pigs in front
  pigs.forEach(({ a }) => {   // a bindle over the shoulder, behind the body
    const [sx, sy] = a.R.shoulder;
    mk('image', { href: '../img/props/bindle.webp', x: -425, y: -355, width: 850, height: 711, transform: `translate(${sx - 150},${sy - 120}) scale(-.55,.55) rotate(-8)` }, a.back);
  });
  const front = cam.layer(1.4);
  mk('image', { href: '../img/cottage/front.webp', x: -80, y: -45, width: 1760, height: 990 }, front);   // near flowers: gone on close shots
  // The imagined wolf (screen space): thought bubbles from her head, then a round frame with the wolf grinning.
  const bubbles = [0, 1, 2].map(i => mk('circle', { r: 10 + i * 8, fill: '#fff', stroke: '#151314', 'stroke-width': 4, opacity: 0 }, p));
  const inset = G(p, { x: 1290, y: 245, s: 0 });
  mk('circle', { r: 182, fill: '#fff', stroke: '#151314', 'stroke-width': 6 }, inset);
  const clip = 'wolfclip' + Math.random().toString(36).slice(2, 8);   // a fresh id: an old scene's clip may still be in the page
  mk('clipPath', { id: clip }, mk('defs', {}, inset)).appendChild(mk('circle', { r: 168 }));
  const inner = G(inset); inner.setAttribute('clip-path', `url(#${clip})`);
  mk('circle', { r: 168, fill: '#22331d' }, inner);
  for (let i = 0; i < 7; i++) mk('path', { d: `M${-175 + i * 55} 175L${-152 + i * 55} ${-50 - (i % 3) * 32}L${-130 + i * 55} 175Z`, fill: '#182714' }, inner);
  const wolf = TOON.posed(inner, 'wolf');

  shots(cam, [
    [0, inPic({ x: 800, y: 450, z: 1 }), [inPic({ x: 690, y: 520, z: 1.25 }), 1.4]],       // the cottage, pushing in
    [1.47, inPic({ x: 690, y: 690, z: 2.4 }), [inPic({ x: 705, y: 686, z: 2.55 }), 2]],     // the three of them, ready to go
    [SET_OFF + .25, pigsView(SET_OFF + .25, 1.8), [pigsView(S1 + .3, 1.7), S1 - SET_OFF - .25]],   // off they go: one smooth pan that ends on them
    [S1, momHead(5.2), [momHead(5.6), 2.4]],                                                  // Mother calls after them
    [LOOK, (p => inPic({ x: p.x - 120, y: p.g - 90, z: 2.3 }))(pigAt(PIGS[0], LOOK)), [(p => inPic({ x: p.x - 90, y: p.g - 90, z: 2.4 }))(pigAt(PIGS[0], WOLF)), WOLF - LOOK]],   // the first pig turns and waves back
    [WOLF, momHead(6.2), [momHead(6.8), D - WOLF]],                              // her worried face
  ]);
  clockRun(t => {
    const T = T0 + t;
    focus(t);
    front.setAttribute('opacity', t < 1.47 ? 1 : 0);   // near flowers only in the opening wide shot
    for (const { o, a } of pigs) {
      const at = pigAt(o, T), walking = at.tau > 0 && !(o.stop && T > LOOK - .25), wp = walkPose(at.tau, o.hold), hop = clamp01(1 - Math.abs(T - PACK - o.go * .3) / .18);
      const waving = o.stop && T > LOOK;
      a.pose({
        x: at.x, ground: at.g, k: at.k, dir: waving ? -1 : 1, lean: walking ? o.lean : 0,   // turns back to wave
        legs: walking ? wp.legs : 0, arm: waving ? 3 : walking ? wp.arm : 0,
        bob: (walking ? o.bounce * wp.bob : 0) + 14 * hop,
        face: { blink: blinkAt(T, o.seed), gaze: [1, -.1], mouth: waving && Math.floor(T / .14) % 3 ? 'C' : 'X' },
      });
    }
    // Mother: on her line she waves her handkerchief and calls; at "big bad wolf" a hand goes to her chest.
    const s = T - S1, worried = T > WOLF - .1;
    mom.pose({
      x: MOM.x, ground: MOM.g, k: MOM.k, lean: s > 0 && !worried ? -2 : worried ? 2 : 0, bob: 3 * Math.sin(T * 2.1),
      arm: worried ? 2 : s > 0 ? 1 : 0,
      face: { mouth: s > 0 ? mouthAt('s01b', s) : 'X', blink: worried ? 0 : blinkAt(T, 3), gaze: [1, worried ? -.3 : 0], raise: worried ? .6 : s > 0 ? .4 : 0, wide: worried ? 1 : 0, worry: worried ? 1 : 0, smile: worried ? -.7 : .8 },
    });
    // The imagined wolf.
    const show = T > WOLF + .05 ? 1 - Math.exp(-7 * (T - WOLF - .05)) * Math.cos(9 * (T - WOLF - .05)) : 0;
    bubbles.forEach((e, i) => { e.setAttribute('opacity', clamp01((T - WOLF + .05 - i * .08) / .1)); e.setAttribute('cx', 1000 + i * 70); e.setAttribute('cy', 470 - i * 55 + 3 * Math.sin(T * 4 + i)); });
    put(inset, { s: Math.max(0, show), r: 4 * Math.sin(T * 3) * show });
    wolf.pose({ x: -55, ground: 560 + 8 * Math.abs(Math.sin(T * 4)), k: 2.1, lean: 4 * Math.sin(T * 3.3), arm: 0, face: { mouth: 'D', blink: blinkAt(T, 9), gaze: [.6, 0], raise: 1 } });
  }, D);
}

/* ---------- shot 2: the straw house ---------- */
// The meadow is 2100 × 900 world px: the road across at y 610–740, three plots behind it (x 200–650, 900–1300, 1500–1900).
const MW = 2100;
const inMeadow = ({ x, y, z }) => ({ x: Math.min(MW - 800 / z, Math.max(800 / z, x)), y: Math.min(900 - 450 / z, Math.max(450 / z, y)), z });
function meadow(cam) {
  const soft = [];
  for (const [n, k, pad] of [['sky', .15, 260], ['far', .45, 160], ['ground', 1, 0]]) {
    const g = cam.layer(k), at = { x: -pad, y: -pad * .43, width: MW + 2 * pad, height: 900 + .86 * pad };
    mk('image', { href: `../img/meadow/${n}.webp`, ...at, preserveAspectRatio: 'none' }, g);
    soft.push(mk('image', { href: `../img/meadow/${n}-soft.webp`, ...at, preserveAspectRatio: 'none', opacity: 0 }, g));
  }
  return t => { const f = clamp01((cam.at(t).z - 2.4) / .9); soft.forEach(e => e.setAttribute('opacity', f)); };
}
const prop = (p, n, x, base, h, [w0, h0]) => {   // a prop standing with its base centre at (x, base), h tall
  const w = h * w0 / h0, g = G(p, { x, y: base });
  mk('image', { href: `../img/props/${n}.webp`, x: -w / 2, y: -h, width: w, height: h }, g);
  return g;
};
// Word times on the shot's clock (silence was inserted after "swish", "swoosh" and "flump" for the building).
const SHOT2 = { big: 1.68, steps: [3.61, 5.76, 7.88], house: 10.32, says: TIMINGS.shot2.parts.s02b };
SHOT2.easy = SHOT2.says + .1; SHOT2.time = SHOT2.says + 1.78; SHOT2.nap = SHOT2.says + 2.41;
const STRAW = { x: 410, base: 598, h: 400, size: [858, 916] }, HAY = { x: 800, base: 606, h: 230, size: [965, 867] };
const HOUSE_AT = 560, HAY_AT = 700;   // where she tosses from, where she picks up

// A house in stages: one drawing per stage (img/props/<name>_1..3.webp, aligned), the current one shown;
// each new stage lands with a squash and a puff of dust.
function staged(p, name, { x, base, h, size }) {
  const w = h * size[0] / size[1], g = G(p, { x, y: base });
  const pics = [1, 2, 3].map(k => mk('image', { href: `../img/props/${name}_${k}.webp`, x: -w / 2, y: -h, width: w, height: h, visibility: 'hidden' }, g));
  const dust = Array.from({ length: 9 }, (_, i) => mk('ellipse', { fill: '#eadfc2', opacity: 0 }, p));
  return (stage, since, rock = 0) => {   // stage 0 = nothing yet; since = seconds since it landed; rock: a lean, degrees
    pics.forEach((e, k) => e.setAttribute('visibility', k === stage - 1 ? 'visible' : 'hidden'));
    const sq = since < .6 ? 1 - .14 * Math.exp(-7 * since) * Math.cos(18 * since) : 1;
    g.setAttribute('transform', `translate(${x},${base}) rotate(${rock}) scale(${2 - sq},${sq})`);
    dust.forEach((e, i) => {
      const q = clamp01(since / .7), a = (i / 8) * Math.PI, on = stage > 0 && since < .7;
      e.setAttribute('cx', x + Math.cos(a) * (w * .35 + 90 * q) * (i % 2 ? 1 : -1)); e.setAttribute('cy', base - 10 - Math.sin(a) * 25 * q - 20 * q);
      e.setAttribute('rx', 26 + 40 * q); e.setAttribute('ry', 16 + 22 * q); e.setAttribute('opacity', on ? .85 * (1 - q) : 0);
    });
  };
}

function shot2(p, D) {
  const S2 = SHOT2, cam = camera(p, D, inMeadow({ x: 420, y: 560, z: 1.7 }));
  const focus = meadow(cam), world = cam.layer(1);
  const house = staged(world, 'straw_house', STRAW);
  const hay = prop(world, 'haystack', HAY.x, HAY.base, HAY.h, HAY.size);
  const pig = TOON.posed(world, 'pig1');
  const flying = mk('image', { href: '../img/props/bundle.webp', x: -55, y: -59, width: 110, height: 118, visibility: 'hidden' }, world);
  const zzz = [0, 1, 2].map(i => { const e = T(world, 'z', { x: 0, y: 0, size: 38 + i * 12, weight: 900, fill: '#fff', o: 0 }); e.setAttribute('stroke', '#151314'); e.setAttribute('stroke-width', 5); e.setAttribute('paint-order', 'stroke'); return e; });
  shots(cam, [
    [0, inMeadow({ x: 330, y: 560, z: 1.7 }), [inMeadow({ x: 520, y: 545, z: 1.75 }), 2.8]],        // she comes down the road
    [S2.steps[0] - .45, inMeadow({ x: 580, y: 480, z: 1.5 }), [inMeadow({ x: 560, y: 470, z: 1.6 }), S2.house - S2.steps[0]]], // the building
    [S2.house, inMeadow({ x: 500, y: 500, z: 1.8 }), [inMeadow({ x: 520, y: 505, z: 1.95 }), 2.4]],  // done
    [S2.easy - .05, { x: 600, y: 520, z: 3.4 }, [{ x: 605, y: 522, z: 3.6 }, 1.6]],                  // close: "Easy peasy!"
    [S2.time - .1, inMeadow({ x: 470, y: 520, z: 2.1 }), [inMeadow({ x: 460, y: 540, z: 2.3 }), D - S2.time]], // and down she lies
  ]);
  const trips = S2.steps.map(w => w - .35), LAND = 1.2;   // a trip: grab, carry, toss; the stage lands LAND after the grab
  for (const a of trips) cam.shake(4, a + LAND, .3, 9);
  const STOP = 2.3, X0 = -60, G0 = 690;
  clockRun(t => {
    focus(t);
    // Which part of the work she is in, and where.
    const k = trips.filter(a => t >= a).length - 1, a = trips[k] ?? 0, u = t - a, last = k === trips.length - 1;
    let x = HAY_AT, dir = 1, whole = null, legs = 0, arm = 0, bob = 2 * Math.sin(t * 2.4), lean = 0, carry = false;
    if (t < STOP) { const wp = walkPose(t, .12); x = X0 + (HAY_AT - X0) * t / STOP; legs = wp.legs; arm = wp.arm; bob = 7 * wp.bob; lean = 4; }
    else if (k >= 0 && u < .75) { x = HAY_AT + (HOUSE_AT - HAY_AT) * smooth(u / .75); dir = -1; whole = 'carry'; carry = true; bob = -10 * Math.abs(Math.sin(u * 12)); }
    else if (k >= 0 && u < 1.05) { x = HOUSE_AT; dir = -1; whole = 'toss'; bob = -14 * Math.sin(Math.PI * clamp01((u - .75) / .3)); }
    else if (k >= 0 && !last && u < 1.85) { const q = (u - 1.05) / .8, wp = walkPose(u, .09); x = HOUSE_AT + (HAY_AT - HOUSE_AT) * smooth(q); legs = wp.legs; arm = wp.arm; bob = 8 * wp.bob; lean = 6; }
    else if (k >= 0 && last) { x = HOUSE_AT; dir = u < 1.5 ? -1 : 1; bob = u > 1.5 && u < 1.9 ? -30 * Math.sin(Math.PI * (u - 1.5) / .4) : bob; arm = t > S2.house ? 4 : 0; }
    const napping = t > S2.nap, sayT = t - S2.says, talking = sayT > 0 && t < S2.nap, wow = t > S2.big && t < trips[0] ? 1 : 0;
    pig.pose({
      x: napping ? 455 : x, ground: napping ? 640 : G0, k: napping ? .8 : .62, dir, lean,
      legs, arm, bob, whole: napping ? 'nap' : whole,
      face: { mouth: talking ? mouthAt('s02b', sayT) : 'X', blink: blinkAt(t, 11), gaze: wow ? [1, -.6] : [1, 0], raise: wow || talking ? .8 : 0, wide: wow, smile: .9 },
    });
    // The haystack loses a bite at each grab; the house gets its next stage when the bundle lands.
    const bites = trips.filter(b => t >= b).length, left = 1 - bites / 3;
    hay.setAttribute('transform', `translate(${HAY.x},${HAY.base}) scale(${.45 + .55 * left},${left})`);
    hay.style.visibility = left > 0 ? '' : 'hidden';
    const landed = trips.filter(b => t >= b + LAND), stage = landed.length;
    house(stage, stage ? t - landed[stage - 1] - LAND : 9);
    // The bundle she throws: an arc from her raised hands onto the house.
    const fq = clamp01((u - .82) / (LAND - .82));
    flying.setAttribute('visibility', k >= 0 && u > .82 && u < LAND ? 'visible' : 'hidden');
    if (k >= 0) { const sx = HOUSE_AT - 30, sy = 470, ex = STRAW.x, ey = STRAW.base - STRAW.h * (k + 1) / 3.2;
      flying.setAttribute('transform', `translate(${sx + (ex - sx) * fq},${sy + (ey - sy) * fq - 140 * Math.sin(Math.PI * fq)}) rotate(${-300 * fq})`); }
    // Zzz rises above her as she naps.
    zzz.forEach((z, i) => { const q = ((t - S2.nap - .4 - i * .45) % 1.6 + 1.6) % 1.6 / 1.6, on = t > S2.nap + .4 + i * .45; put(z, { x: 545 + 40 * q + i * 10, y: 560 - 130 * q, o: on ? Math.sin(Math.PI * q) : 0 }); });
  }, D);
}

/* ---------- shots 3 and 4: the stick house and the brick house ---------- */
// A house that grows from the ground up: its image clipped to a rising band. grow(f) shows the bottom f of it.
function growing(p, n, x, base, h, size) {
  const id = 'grow' + Math.random().toString(36).slice(2, 8), w = h * size[0] / size[1], hold = G(p);
  const r = mk('rect', { x: x - w, width: 2 * w, y: base, height: 0 }, mk('clipPath', { id }, mk('defs', {}, p)));
  hold.setAttribute('clip-path', `url(#${id})`);
  const g = prop(hold, n, x, base, h, size);
  return { g, hold, grow: f => { r.setAttribute('y', base - (h + 60) * f); r.setAttribute('height', (h + 60) * f + 4); } };
}
const notes = (p, n) => Array.from({ length: n }, (_, i) => { const e = T(p, i % 2 ? '♫' : '♪', { x: 0, y: 0, size: 44, weight: 700, fill: '#fff', o: 0 }); e.setAttribute('stroke', '#151314'); e.setAttribute('stroke-width', 5); e.setAttribute('paint-order', 'stroke'); return e; });
const SHOT3 = { says: TIMINGS.shot3.parts.s03b, pile: 2.26, taps: [3.24, 4.86, 6.44], wobbly: 8.21 };   // silences after each "tap"
SHOT3.music = SHOT3.says + 1.75;
const STICKS = { x: 1030, base: 600, h: 390, size: [826, 895] }, PILE = { x: 1360, base: 612, h: 170, size: [895, 702] };

function shot3(p, D) {
  const S3 = SHOT3, cam = camera(p, D, inMeadow({ x: 1000, y: 560, z: 1.7 }));
  const focus = meadow(cam), world = cam.layer(1);
  const house = staged(world, 'stick_house', STICKS), flyers = [0, 1, 2].map(() => mk('image', { href: '../img/props/stickpile.webp', x: -50, y: -20, width: 100, height: 40, visibility: 'hidden' }, world));
  const pile = prop(world, 'stickpile', PILE.x, PILE.base, PILE.h, PILE.size);
  const pig = TOON.posed(world, 'pig2'), music = notes(world, 4);
  shots(cam, [
    [0, inMeadow({ x: 860, y: 560, z: 1.7 }), [inMeadow({ x: 1060, y: 545, z: 1.75 }), 2.8]],   // he strolls up to the plot
    [S3.taps[0] - .3, inMeadow({ x: 1100, y: 480, z: 1.5 })],                                    // tap, tap, tap
    [S3.says - .05, { x: 1205, y: 525, z: 3.2 }, [{ x: 1210, y: 528, z: 3.4 }, 1.6]],          // "Good enough for me!"
    [S3.music - .1, inMeadow({ x: 1120, y: 500, z: 1.9 }), [inMeadow({ x: 1120, y: 510, z: 2.05 }), D - S3.music]], // and he dances
  ]);
  for (const w of S3.taps) cam.shake(3, w, .25, 10);
  const STOP = 2.6, X0 = 760, X1 = 1180, G0 = 690;
  clockRun(t => {
    focus(t);
    const walking = t < STOP, x = walking ? X0 + (X1 - X0) * t / STOP : X1, wp = walkPose(t, .22);
    // Hammering: the hammer comes down on each "tap"; the house grows a third each time, then wobbles.
    // Each "tap" starts three strikes; sticks fly from the pile, and the next stage of the house lands on the third.
    const strikes = S3.taps.flatMap(w => [w, w + .35, w + .7]);
    const hammering = t > S3.taps[0] - .35 && t < S3.taps[2] + 1;
    const down = strikes.some(w => t > w - .05 && t < w + .15);
    const lands = S3.taps.map(w => w + .75), stage = lands.filter(w => t >= w).length;
    house(stage, stage ? t - lands[stage - 1] : 9, t > S3.wobbly ? 1.5 * Math.sin(t * 7) : 0);   // the finished house keeps a little wobble
    flyers.forEach((f, i) => {
      const w = S3.taps[i], q = clamp01((t - w + .1) / .8);
      f.setAttribute('visibility', q > 0 && q < 1 ? 'visible' : 'hidden');

  staged(world, 'brick_house', BRICKS)(3, 9); out.el.style.display = 'none';
  const wolfOut = TOON.posed(world, 'wolf'), smoke = Array.from({ length: 12 }, () => mk('circle', { fill: '#9a9a9a', opacity: 0 }, world));
  cam.to({ x: HOOK.x, y: 470, z: 2.2 }, S10.wolf - .4, .8, io);
  cam.shake(10, S10.splash, .5, 9); cam.to({ x: 1000, y: 470, z: 1.3 }, S10.ow + .2, .6, io);   // close on the pot until he howls
  out.to({ x: 1150, y: 480, z: 1.15 }, S10.away, S10.never - S10.away, soft);
  clockRun(t => {
    fire(t); focus(t);
    const outside = t > S10.shot - .3; out.el.style.display = outside ? '' : 'none'; cam.el.style.display = outside ? 'none' : '';
    // Down he drops (arms out), splash, sits steaming in the pot, then howls and shoots back up.
    const fall = clamp01((t - S10.wolf + .3) / (S10.splash - S10.wolf + .3)), inPot = t > S10.splash, rise = t > S10.ow ? (t - S10.ow) : 0;
    // In the pot: plunge out of sight, bubbles, his head comes up to the eyes, he goes red and shakes, then OWWW.
    const SUNK = RIM + 290, EYES = RIM + 175, w = t - S10.splash;
    const plunge = smooth(w / .35), surface = smooth((w - 1.3) / 1.1), shake = t > S10.hot ? Math.min(1, (t - S10.hot) / .8) : 0;
    const gyIn = SUNK - (SUNK - EYES) * surface + (w < .35 ? -(SUNK - RIM - 60) * (1 - plunge) : 0);
    const gy = !inPot ? -200 + (RIM + 60 + 200) * fall * fall : t < S10.ow ? gyIn + 3 * Math.sin(t * 60) * shake : EYES - 900 * rise * rise;
    const red = inPot && t < S10.ow + .4 ? clamp01((t - S10.hot + .3) / 1) : 0;
    wolfIn.root.style.filter = red > 0 ? `sepia(${.5 * red}) saturate(${1 + 3 * red}) hue-rotate(${-25 * red}deg)` : '';   // boiling red
    rings.forEach((e, i) => { const q = clamp01((w - i * .18) / .9); e.setAttribute('cx', HOOK.x); e.setAttribute('cy', RIM + 4); e.setAttribute('rx', 30 + 70 * q); e.setAttribute('ry', 6 + 12 * q); e.setAttribute('opacity', inPot && q < 1 ? .9 * (1 - q) : 0); });
    bubbles.forEach((e, i) => { const q = ((w - .4 - i * .19) % .7 + .7) % .7 / .7, on = w > .4 && t < S10.ow;
      e.setAttribute('cx', HOOK.x - 60 + (i * 29) % 120); e.setAttribute('cy', RIM + 10 - 14 * q); e.setAttribute('r', (4 + (i % 3) * 3) * (q < .85 ? 1 : 1.6)); e.setAttribute('opacity', on ? (q < .85 ? .9 : 0) : 0); });
    wolfIn.pose({ x: HOOK.x + 4 * Math.sin(t * 47) * shake * (t < S10.ow ? 1 : 0), ground: gy, k: .7, whole: !inPot ? 'inhale' : t > S10.ow - .1 ? 'howl' : null, sy: t > S10.ow ? 1 + .5 * clamp01(rise * 3) : 1,
      face: { blink: 0, wide: 1, worry: red, smile: -red, gaze: [1, -.4 * red] } });
    cam.world.appendChild(pot);   // the pot in front of him: he sits inside it
    drops.forEach((e, i) => { const q = t - S10.splash - (i % 4) * .03, on = q > 0 && q < .9, a = -Math.PI * (i / 15);
      e.setAttribute('visibility', on ? 'visible' : 'hidden'); e.setAttribute('transform', `translate(${HOOK.x + Math.cos(a) * 420 * q},${HOOK.y + 30 + Math.sin(a) * 380 * q + 700 * q * q}) rotate(${a * 57 + 90})`); });
    steam.forEach((e, i) => { const q = ((t - S10.splash - i * .25) % 2 + 2) % 2 / 2, on = inPot && t < S10.shot;
      e.setAttribute('cx', HOOK.x - 60 + (i * 17) % 120 + 20 * Math.sin(t * 2 + i)); e.setAttribute('cy', HOOK.y + 10 - 220 * q); e.setAttribute('rx', 20 + 30 * q); e.setAttribute('ry', 14 + 20 * q); e.setAttribute('opacity', on ? .8 * (1 - q) : 0); });
    pigs.forEach(({ a, x }, i) => a.pose({ x, ground: FLOOR + 10, k: .92, whole: t > S10.ow + .4 && i < 2 ? 'laugh' : null,
      face: { blink: blinkAt(t, 11 + i * 12), wide: t > S10.splash ? 1 : 0, gaze: [1, -.3], smile: .9 } }));
    // Outside: out of the chimney, stretched, high into the sky; down again and off to the woods with a smoking tail.
    const u = t - S10.shot, flyUp = u < 1.2, ox = flyUp ? CHIM.x - 180 * u : CHIM.x - 216 - 520 * (u - 1.2);
    const oy = flyUp ? CHIM.y + 40 - 300 * Math.sin(Math.PI * u / 1.2) + 450 * Math.max(0, u - .6) ** 2 * 4 : 712;   // up, over, down to the road
    const wr = walkPose(u, .07);
    wolfOut.pose({ x: ox, ground: oy, k: .8, whole: flyUp ? 'howl' : null, dir: flyUp ? 1 : -1, sy: flyUp ? 1.4 : 1, lean: flyUp ? 0 : 10,
      legs: flyUp ? 0 : wr.legs, arm: flyUp ? 0 : wr.arm, bob: flyUp ? 0 : 10 * wr.bob, face: { blink: 0, wide: 1, worry: 1, mouth: 'D', smile: -.6 } });
    smoke.forEach((e, i) => { const q = ((t * 1.6 + i / 12) % 1), on = u > 0 && t < S10.never + .5;
      e.setAttribute('cx', ox + (u > .9 ? 80 : 0) + 120 * q * (u > .9 ? 1 : 0)); e.setAttribute('cy', oy - 120 + (flyUp ? 200 * q : -60 * q)); e.setAttribute('r', 14 + 30 * q); e.setAttribute('opacity', on ? .6 * (1 - q) : 0); });
  }, D);
}

const S11 = { pigs: 1.49, brick: 3.89, other: 5.21, bricks: 7.41, happily: 9.59, after: 10.44 }, END = 3.2;
function shot11(p, D) {
  const cam = camera(p, D + END, inMeadow({ x: 1700, y: 520, z: 1.8 }));
  const focus = meadow(cam), world = cam.layer(1);
  const house = staged(world, 'brick_house', BRICKS);
  const pigs = ['pig1', 'pig2', 'pig3'].map(n => TOON.posed(world, n));
  const shed = prop(world, 'brickpile', BRICKS.x + 260, BRICKS.base + 20, 130, BPILE.size);
  const glow = mk('rect', { x: 0, y: 0, width: 1600, height: 900, fill: '#ffcf7a', opacity: 0, style: 'mix-blend-mode: soft-light; pointer-events: none' }, p);
  const black = mk('rect', { x: 0, y: 0, width: 1600, height: 900, fill: '#141210', opacity: 0 }, p);
  const end = T(p, 'The End', { x: 800, y: 470, size: 110, weight: 800, fill: '#fff6e0', anchor: 'middle', o: 0 });
  end.setAttribute('font-family', 'Georgia, serif'); end.setAttribute('font-style', 'italic');
  cam.to(inMeadow({ x: 1700, y: 500, z: 1.6 }), 0, S11.other, soft);
  cam.to(inMeadow({ x: 1850, y: 480, z: 1.9 }), S11.other, S11.happily - S11.other, soft);
  cam.to(inMeadow({ x: 1300, y: 450, z: 1 }), S11.happily, D + END - S11.happily, soft);
  clockRun(t => {
    focus(t); house(3, 9);
    // Dancing in a ring in front of the house; then two of them help: hammering, laying bricks; then dancing again.
    const helping = t > S11.other && t < S11.happily, ring = !helping;
    pigs.forEach((a, i) => {
      const ph = t * 2.2 + i * 2.09, x = 1640 + Math.cos(ph) * 120, back = Math.sin(ph) < 0;
      const hx = [1880, 1960, 1800][i];
      a.pose(ring ? { x, ground: 702 + Math.sin(ph) * 14, k: .62 + Math.sin(ph) * .03, dir: Math.cos(ph + Math.PI / 2) > 0 ? 1 : -1,
          legs: walkPose(t + i * .1, .18).legs, arm: 3, bob: -10 * Math.abs(Math.sin(t * 8 + i)), face: { blink: blinkAt(t, 11 + i * 12), mouth: 'D', smile: 1 } }
        : { x: hx, ground: 705, k: .62, dir: i === 2 ? 1 : -1,
          arm: i === 1 ? (Math.floor(t / .35) % 2 ? 5 : 4) : i === 2 ? (Math.floor(t / .6) % 2 ? 5 : 4) : 3, legs: 0,
          face: { blink: blinkAt(t, 11 + i * 12), smile: .9 } });
      a.root.parentNode.appendChild(back ? a.root : a.root);
    });
    glow.setAttribute('opacity', .5 * smooth((t - S11.happily) / 1.5));
    black.setAttribute('opacity', smooth((t - D - .2) / 1.4));
    put(end, { o: smooth((t - D - .9) / 1), y: 470 - 20 * smooth((t - D - .9) / 1) });
  }, D + END);
}

/* ---------- beats: [id, title, run(m, D), extra] ---------- */
const BEATS = [
  ['shot1', 'Leaving home', (m, D) => shot1(panel(0), 0, D), { lead: false }],   // narration and Mother's line, one clip
  ['shot2', 'The straw house', (m, D) => shot2(panel(0), D), { lead: false }],
  ['shot3', 'The stick house', (m, D) => shot3(panel(0), D), { lead: false }],
  ['shot4', 'The brick house', (m, D) => shot4(panel(0), D), { lead: false }],
  ['shot5', 'The wolf', (m, D) => shot5(panel(0), D), { lead: false, pre: PRE5 }],
  ['shot6', 'Huff and puff', (m, D) => shot6(panel(0), D), { lead: false, pre: PRE6 }],
  ['shot7', 'The stick house falls', (m, D) => shot7(panel(0), D), { lead: false, pre: PRE7 }],
  ['shot8', 'The brick house stands', (m, D) => shot8(panel(0), D), { lead: false, pre: PRE8 }],
  ['shot9', 'Down the chimney', (m, D) => shot9(panel(0), D), { lead: false }],
  ['shot10', 'Splash!', (m, D) => shot10(panel(0), D), { lead: false }],
  ['shot11', 'Happily ever after', (m, D) => shot11(panel(0), D), { lead: false }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// Decode every character drawing and prop when the page opens, before any scene needs it.
for (const n of ['mother', 'pig1', 'pig2', 'pig3', 'wolf']) {
  for (const k in POSES[n].parts) TOON.preload(`../img/${n}/pose/${k}.webp`);
  for (const k in RIGS[n].parts) TOON.preload(`../img/${n}/rig/${k}.webp`);
}
for (const k of ['bindle', 'bundle', 'haystack', 'stickpile', 'brickpile', 'straw_house_1', 'straw_house_2', 'straw_house_3', 'stick_house_1', 'stick_house_2', 'stick_house_3', 'brick_house_1', 'brick_house_2', 'brick_house_3']) TOON.preload(`../img/props/${k}.webp`);
/* ---------- background music ---------- */
// One track per part of the story, following the picture: its position is the time since the part began, so
// pausing, seeking and changing beats keep it in step. Tracks crossfade at part changes; the music sits lower while
// someone is speaking, and follows the player's volume.
const BGM = [['m1-home', ['shot1', 'shot2', 'shot3', 'shot4']], ['m2-wolf', ['shot5', 'shot6', 'shot7', 'shot8']], ['m3-chimney', ['shot9', 'shot10']], ['m4-ending', ['shot11']]]
  .map(([n, beats]) => ({ n, beats, a: Object.assign(new Audio(`audio/bgm/${n}.mp3`), { preload: 'auto', loop: true, volume: 0 }), v: 0 }));
const beatLen = id => { const b = BEATS.find(x => x.id === id); return (b.pre || 0) + TIMINGS[id].dur + .6; };
let lastTick = performance.now();
function bgmTick(now) {
  const dt = Math.min(.1, (now - lastTick) / 1000); lastTick = now;
  const id = BEATS[P.i]?.id, on = P.started && P.playing && !P.waiting && !P.done;
  const speaking = P.audio && !P.audio.paused && !P.audio.ended;
  const master = +(document.getElementById('volume')?.value ?? 1) * (speaking ? .16 : .3);
  for (const m of BGM) {
    const k = m.beats.indexOf(id), current = on && k >= 0;
    m.v = Math.max(0, Math.min(1, m.v + (current ? 1 : -1) * dt / .8));   // 0.8 s fades
    m.a.volume = m.v * master;
    if (current) {
      const want = (m.beats.slice(0, k).reduce((s, b) => s + beatLen(b), 0) + P.t) % (m.a.duration || 1e9);
      if (Math.abs(m.a.currentTime - want) > .5) m.a.currentTime = want;
      if (m.a.paused) m.a.play().catch(() => {});
    } else if (m.v === 0 && !m.a.paused) m.a.pause();
  }
  if (!on && !P.done) for (const m of BGM) m.a.pause();   // paused: silence at once (at the end it fades out)
  requestAnimationFrame(bgmTick);
}
requestAnimationFrame(bgmTick);
boot();
</script>
