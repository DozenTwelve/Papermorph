<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Shooting an Elephant</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
<style>
/* The film opens on the sight, not on a title card: the cover stays as the click target (it starts the film and the
   sound), but shows nothing: the reticle is the cursor (the picture moves under it), and after a few idle seconds a
   line says how to fire. */
.cover { background: transparent; cursor: none; }
.cover > div { display: none; }
.cover::after { content: 'move to aim  ·  click to fire  ·  with sound'; position: absolute; left: 0; right: 0; bottom: 60px; text-align: center;
  font: italic 400 38px "EB Garamond", Georgia, serif; letter-spacing: .04em; color: var(--chalk); opacity: 0; animation: hint 1s 1.5s forwards; }
@keyframes hint { to { opacity: .95; } }
@media (pointer: coarse) { .cover::after { content: 'tap to fire  ·  with sound'; } }
/* the sight drifts with the shooter's breath while it waits (wall clock: only before the first click) */
body:has(.cover:not([hidden])) .breath { animation: breath 4.2s ease-in-out infinite; }
@keyframes breath { 0%, 100% { transform: translate(0, 0); } 30% { transform: translate(5px, -7px); } 65% { transform: translate(-4px, 4px); } }
</style>
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../lib/film.js"></script>
<script src="audio/en/timings.js"></script>
<script src="../img/art.js"></script>
<script src="../lib/lines.js"></script>
<script src="../lib/shapes.js"></script>
<script src="../lib/puppets.js"></script>
<script>
'use strict';
// lead: false — every opening is timed by hand, so the engine never pulls a beat's first reveal earlier
const CHAPTER = { number: 1, title: 'Shooting an Elephant', minutes: 9, language: 'en', lead: false, film: true };   // film: its shots are question beats

const OPEN_PRE = 5.5;   // the shot, the trumpet and the title in the black, before Orwell's first sentence
const SIGHT = { x: 800, y: 430, r: 330 };

// the view through the rifle's sight: the elephant in a circle, black around it, a post-and-crosshair reticle
function sight(p, name, id) {
  const outer = G(p, {}), g = mk('g', { class: 'breath' }, outer);
  const cp = mk('clipPath', { id }, mk('defs', {}, g));
  mk('circle', { cx: SIGHT.x, cy: SIGHT.y, r: SIGHT.r }, cp);
  const view = G(mk('g', { 'clip-path': `url(#${id})` }, g), {});
  mk('rect', { x: 0, y: 0, width: 1600, height: 900, fill: '#7d8277' }, view);
  pic(aimable(view), name, { x: SIGHT.x + 150, y: SIGHT.y + 70, h: 880 }).setAttribute('filter', 'grayscale(1) contrast(1.1)');
  const { x, y, r } = SIGHT;
  mk('path', { d: `M-200 -200H1800V1100H-200Z M${x - r} ${y}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0Z`, fill: '#040805', 'fill-rule': 'evenodd' }, g);
  const ink = { stroke: '#0b0b0b', fill: 'none' };
  mk('path', { d: `M${x - r} ${y}H${x - 26}M${x + 26} ${y}H${x + r}M${x} ${y - r}V${y - 26}`, 'stroke-width': 2, ...ink }, g);
  mk('path', { d: `M${x - r} ${y}H${x - 150}M${x + 150} ${y}H${x + r}M${x} ${y + r}V${y + 18}`, 'stroke-width': 9, ...ink }, g);
  mk('circle', { cx: x, cy: y, r: r - 2, 'stroke-width': 6, stroke: '#000', fill: 'none' }, g);
  return outer;
}
// a point (fx, fy, 0..1 of the picture inside its border) of a print placed by pic(), in stage coordinates
const spot = (g, name, fx, fy) => { const [W, H] = ART[name], k = g._w / W; return [g._x + (fx - .5) * (W - 112) * k, g._y + (fy - .5) * (H - 112) * k]; };
// a new picture for the next sentence: the old one fades as this one comes in, on the beat clock
const cut = (t, dur = .35) => { if (S.panel) hide(S.panel, t - .1, .2, lin); const q = panel(t); put(q, { o: 0 }); show(q, t + .05, dur, lin); return q; };   // the old one (its words too) is gone before the new one is half in
// a slow push toward (fx, fy) of a picture placed by pic(), never past its edges (closeups() without the label)
function toward(g, name, fx, fy, Z, t0, dur) {
  const b = 56 * g._w / ART[name][0];   // a print's border: the view stays on the picture inside it
  const lim = (v, half, screen) => Math.max(-(half - screen / Z), Math.min(half - screen / Z, v));
  const dx = lim((fx - .5) * g._w, g._w / 2 - b, 800), dy = lim((fy - .5) * g._h, g._h / 2 - b, 450);
  tw(g, { s: Z, x: 800 - Z * dx, y: 450 - Z * dy }, t0, dur, soft);
}
// a close-up of a rifle laid beside a photograph, with a cream line from it to the rifle in the picture (gx, gy: 0..1)
function gunInset(p0, photo, photoName, [gx, gy], name, label, { x, y, w, r = 0 }, t0) {
  const p = G(p0, {}), [px, py] = spot(photo, photoName, gx, gy);
  line(p, `M${px} ${py}L${x - w * .3} ${y - 40}`, t0, .35, 3, { opacity: .9 });
  put(mk('circle', { cx: px, cy: py, r: 9, fill: 'none', stroke: CREAM, 'stroke-width': 3 }, p), { o: 0 });
  const dot = p.lastChild; show(dot, t0, .2);
  pic(p, name, { x, y, w, r, at: t0 + .2, from: [60, 0], dur: .45 });
  tag(p, label, x, y + w * .17 + 36, t0 + .5, { anchor: 'middle', size: 36, fill: CREAM });
  return p;
}
// a comic panel: a print's picture cropped to fill the box [x, y, w, h] around a point of interest (fx, fy), with a
// cream frame; it slides in from `from` ([dx, dy], or [x, y, scale] for one that starts large and stays there until
// moved) at t0. Returns the group, with at(fx, fy) giving a point of the picture on stage.
let panelN = 0;
function comicPanel(p, name, [bx, by, bw, bh], [fx, fy], t0, from = [0, 40]) {
  const [W, H] = ART[name], iw = W - 112, ih = H - 112;   // the picture inside the print's border
  const k = Math.max(bw / iw, bh / ih);
  const ox = Math.min(0, Math.max(bw - iw * k, bw / 2 - fx * iw * k)), oy = Math.min(0, Math.max(bh - ih * k, bh / 2 - fy * ih * k));
  const big = from.length > 2, g = G(p, { x: from[0], y: from[1], s: from[2] || 1, o: 0 }), id = `panel${panelN++}`;
  mk('rect', { x: bx, y: by, width: bw, height: bh }, mk('clipPath', { id }, mk('defs', {}, g)));
  const c = mk('g', { 'clip-path': `url(#${id})` }, g);
  mk('image', { href: `../img/${name}.webp`, x: bx + ox - 56 * k, y: by + oy - 56 * k, width: W * k, height: H * k }, c);
  mk('rect', { x: bx, y: by, width: bw, height: bh, fill: 'none', stroke: CREAM, 'stroke-width': 6 }, g);
  tw(g, big ? { o: 1 } : { x: 0, y: 0, o: 1 }, t0, .35, out);   // a large one keeps its place until it is moved
  g.at = (u, v) => [bx + ox + u * iw * k, by + oy + v * ih * k];
  return g;
}
// a figure of the jeering crowd (SHAPES man0..7), standing on `base`, rocking with laughter on the beat clock
function shadow(p, i, x, base, h, at, phase, D, { o = 1, flip = false } = {}) {
  const g = G(p, { x, y: base + 40, o: 0 });
  const c = cutout(g, `man${i}`, 0, 0, h, { flip, rough: false });
  tw(g, { y: base, o }, at, .35, out);
  clockRun(t => { const q = (t - at) * 3.1 + phase * 6.3; put(c, t < at ? { y: 0, r: 0 } : { y: -4 * Math.abs(Math.sin(q)), r: 2.2 * Math.sin(q * .5) }); }, D, { tail: true });
  return g;
}
// spaced capitals for a plan's labels
function label(p, str, x, y, t0, { size = 22, o = .7 } = {}) {
  const e = T(p, str, { x, y, size, font: KEY, weight: 500, fill: CREAM, anchor: 'middle', o: 0 });
  e.setAttribute('letter-spacing', '.3em'); tw(e, { o }, t0, .5); return e;
}
// puppets (lib/puppets.js) on the beat clock: mounted into p, posed every frame from t0; at(tt) may move them
PUP.defs(document.getElementById('stage'));
function puppet(p, fig, x, y, k, { flip = false, t0 = 0, D, filter = true, at, rate = 1 } = {}) {
  PUP.mount(p, fig, x, y, k, flip, filter);
  clockRun(tt => {
    fig.pose((tt - t0) * rate);
    if (filter) PUP.boilAt(fig, tt);
    if (at) { const q = at(tt); fig.g.setAttribute('transform', `translate(${q.x.toFixed(1)},${q.y.toFixed(1)}) scale(${flip ? -k : k},${k})`); }
  }, D, { tail: true });
  return fig;
}
// a crowd: one group carrying one boiling filter, its figures mounted without their own
function troupe(p, D) { const g = G(p, {}); g.setAttribute('filter', 'url(#pupRim0)'); clockRun(tt => PUP.boilAt(g, tt), D, { tail: true }); return g; }
// a small theatre drawn in SVG: the proscenium with its valance and tassels, curtains that part, the boards, footlights,
// a spotlight, and an audience in silhouette in the foreground. Returns the groups the action needs.
function theatre(p, t0, D) {
  const g = G(p, {}), FLOOR = 640, L = 250, R = 1350, TOP = 110;
  // the stage's back: dark, a faint painted backdrop of palms and a pagoda, as a touring company would hang
  mk('rect', { x: L, y: TOP, width: R - L, height: FLOOR - TOP, fill: '#0c1610' }, g);
  const back = G(g, { o: 0 });
  for (const [x, h] of [[360, 300], [470, 240], [1130, 280], [1240, 220]]) {
    mk('path', { d: `M${x} ${FLOOR}C${x + 6} ${FLOOR - h * .5} ${x - 4} ${FLOOR - h * .8} ${x + 10} ${FLOOR - h}`, fill: 'none', stroke: CREAM, 'stroke-width': 5, opacity: .18 }, back);
    for (let k = 0; k < 6; k++) { const a = -2.6 + k * .55; mk('path', { d: `M${x + 10} ${FLOOR - h}q${40 * Math.cos(a)} ${30 * Math.sin(a) - 10} ${80 * Math.cos(a)} ${70 * Math.sin(a) + 20}`, fill: 'none', stroke: CREAM, 'stroke-width': 4, opacity: .18 }, back); }
  }
  show(back, t0 + .6, .8);
  // the boards in perspective, and the footlights along the front edge
  const boards = G(g, { o: 0 });
  mk('path', { d: `M${L - 60} 700L${L} ${FLOOR}H${R}L${R + 60} 700Z`, fill: '#1a2a20', stroke: CREAM, 'stroke-width': 2.5 }, boards);
  for (let i = 1; i < 12; i++) { const x = L + (R - L) * i / 12, xb = L - 60 + (R - L + 120) * i / 12; mk('path', { d: `M${x} ${FLOOR}L${xb} 700`, stroke: CREAM, 'stroke-width': 1.2, opacity: .3 }, boards); }
  const lights = G(boards, {});
  for (let i = 0; i < 14; i++) { const x = L + 20 + (R - L - 40) * i / 13; mk('ellipse', { cx: x, cy: 704, rx: 16, ry: 8, fill: CREAM, opacity: .85 }, lights); mk('ellipse', { cx: x, cy: 700, rx: 34, ry: 22, fill: CREAM, opacity: .12 }, lights); }
  show(boards, t0 + .2, .6);
  // the spotlight: a soft cone from above and a pool of light on the boards (it widens on "leading actor")
  const spot = G(g, { o: 0 });
  mk('path', { d: `M760 ${TOP}L860 ${TOP}L980 ${FLOOR + 10}L620 ${FLOOR + 10}Z`, fill: CREAM, opacity: .07 }, spot);
  mk('ellipse', { cx: 800, cy: FLOOR + 14, rx: 200, ry: 26, fill: CREAM, opacity: .16 }, spot);
  // the proscenium: pillars, an arch of double lines, a scalloped valance with tassels
  const frame = G(g, {});
  const stroke = { fill: 'none', stroke: CREAM, 'stroke-linejoin': 'round' };
  mk('path', { d: `M${L - 70} 720V${TOP - 10}H${R + 70}V720H${R}V${TOP + 40}H${L}V720Z`, fill: CARD }, frame);
  mk('path', { d: `M${L - 50} 720V${TOP + 10}H${R + 50}V720M${L - 30} 720V${TOP + 26}H${R + 30}V720`, ...stroke, 'stroke-width': 2.4 }, frame);
  for (const x of [L - 40, R + 40]) for (let y = 160; y < 700; y += 60) mk('path', { d: `M${x - 10} ${y}h20M${x} ${y - 8}v16`, stroke: CREAM, 'stroke-width': 1.6, opacity: .6 }, frame);
  let val = `M${L} ${TOP + 40}`;
  for (let i = 0; i < 16; i++) { const x0 = L + (R - L) * i / 16, x1 = L + (R - L) * (i + 1) / 16; val += `Q${(x0 + x1) / 2} ${TOP + 96} ${x1} ${TOP + 40}`; }
  mk('path', { d: val + `V${TOP + 26}H${L}Z`, fill: CARD, stroke: CREAM, 'stroke-width': 2.4 }, frame);
  for (let i = 1; i < 16; i++) { const x = L + (R - L) * i / 16; mk('path', { d: `M${x} ${TOP + 40}v26m-7 0h14l-3 18h-8Z`, fill: CREAM, stroke: CREAM, 'stroke-width': 2 }, frame); }
  // the sign on the valance (filled in later) and the curtains, which part from the middle
  const sign = G(g, {});
  const cid = 'stageOpening' + (theatre.n = (theatre.n || 0) + 1);
  mk('rect', { x: L, y: TOP, width: R - L, height: FLOOR + 40 - TOP }, mk('clipPath', { id: cid }, mk('defs', {}, g)));
  const drapes = mk('g', { 'clip-path': `url(#${cid})` }, g);
  g.insertBefore(drapes, frame);   // behind the proscenium
  const curtains = [-1, 1].map(sx => {
    const c = G(drapes, {}), x0 = 800, x1 = sx < 0 ? L : R;
    let d = `M${x0} ${TOP + 40}L${x1} ${TOP + 40}L${x1} ${FLOOR + 10}`;
    for (let i = 8; i >= 0; i--) d += `Q${x1 + (x0 - x1) * (i + .5) / 8} ${FLOOR + 30} ${x1 + (x0 - x1) * i / 8} ${FLOOR + 10}`;
    mk('path', { d: d + 'Z', fill: '#2a0d0d', stroke: CREAM, 'stroke-width': 2.4 }, c);
    for (let i = 1; i < 8; i++) { const x = x1 + (x0 - x1) * i / 8; mk('path', { d: `M${x} ${TOP + 44}C${x - 10 * sx} ${TOP + 240} ${x + 10 * sx} ${FLOOR - 200} ${x} ${FLOOR + 12}`, fill: 'none', stroke: CREAM, 'stroke-width': 1.4, opacity: .45 }, c); }
    return c;
  });
  // the audience in the foreground: rows of heads and shoulders, black against the light, each one a little different:
  // a gaung baung head-cloth with its knot to one side, a hair knot, a bare head, now and then an umbrella
  const aud = G(p, {});
  const R2 = rng(1936), ink = { fill: CARD, stroke: CREAM, 'stroke-width': 2.2, 'paint-order': 'stroke', 'stroke-linejoin': 'round' };
  for (let row = 0; row < 3; row++) for (let i = 0; i < 16 - row * 2; i++) {
    const x = 40 + i * (1520 / (15 - row * 2)) + (R2() - .5) * 40 + row * 30, y = 940 - row * 70, k = (1.3 - row * .2) * (.92 + R2() * .16), h = G(aud, {});
    const sw = 66 + R2() * 14, hr = 33 + R2() * 6, kind = ['cloth', 'bare', 'knot', 'cloth', 'bare', 'umbrella'][Math.floor(R2() * 6)];
    if (false) {   // (umbrellas stood up over the stage: left out)   // held up behind the head, its ribs as notches
      mk('path', { d: `M${x + 20 * k} ${y - 120 * k}V${y - 230 * k}`, stroke: CREAM, 'stroke-width': 3 }, h);
      let d = `M${x - 70 * k} ${y - 210 * k}Q${x + 20 * k} ${y - 300 * k} ${x + 110 * k} ${y - 210 * k}`;
      for (let j = 6; j >= 0; j--) d += `Q${x - 70 * k + 180 * k * (j + .5) / 7} ${y - 200 * k} ${x - 70 * k + 180 * k * j / 7} ${y - 210 * k}`;
      mk('path', { d, ...ink }, h);
    }
    mk('path', { d: `M${x - sw * k} ${y}C${x - (sw - 4) * k} ${y - 58 * k} ${x - 34 * k} ${y - 68 * k} ${x - 20 * k} ${y - 76 * k}L${x - 16 * k} ${y - 92 * k}C${x - hr * k} ${y - 100 * k} ${x - hr * k} ${y - 152 * k} ${x} ${y - 154 * k}C${x + hr * k} ${y - 152 * k} ${x + hr * k} ${y - 100 * k} ${x + 16 * k} ${y - 92 * k}L${x + 20 * k} ${y - 76 * k}C${x + 34 * k} ${y - 68 * k} ${x + (sw - 4) * k} ${y - 58 * k} ${x + sw * k} ${y}Z`, ...ink }, h);
    if (kind === 'cloth') {   // the cloth wound round the head, its knot standing out at one side
      const sd = R2() < .5 ? -1 : 1;
      mk('path', { d: `M${x - (hr + 4) * k} ${y - 128 * k}C${x - hr * k} ${y - 162 * k} ${x + hr * k} ${y - 162 * k} ${x + (hr + 4) * k} ${y - 128 * k}C${x + 10 * k} ${y - 136 * k} ${x - 10 * k} ${y - 136 * k} ${x - (hr + 4) * k} ${y - 128 * k}Z`, ...ink }, h);
      mk('circle', { cx: x + sd * (hr - 6) * k, cy: y - 146 * k, r: 8 * k, ...ink }, h);   // its knot
    }
    if (kind === 'knot') mk('circle', { cx: x, cy: y - 160 * k, r: 13 * k, ...ink }, h);
    h._x = x; h._y = y - 154 * k;
  }
  return { g, frame, curtains, spot, sign, aud, FLOOR };
}
// a wooden marionette of the officer, drawn in SVG: pith helmet, tunic, belt, shorts, socks and boots, the rifle slung
// across his back; limbs in two pieces with pegs at the joints. pose({ x, y, a, arms: [u, f, u, f], legs: [u, f, u, f] })
// places it: (x, y) is the neck, a the body's lean, limb angles in degrees from hanging straight down (+ swings forward).
// Returns the stage points of the head, the hands and the knees for the strings.
function marionette(p) {
  const g = G(p, {}), part = (d, host = g) => mk('path', { d, fill: CARD, stroke: CREAM, 'stroke-width': 2.4, 'paint-order': 'stroke', 'stroke-linejoin': 'round' }, host);
  const seg = host => mk('g', {}, host || g);
  const legB = [seg(), seg()], armB = [seg(), seg()], body = seg(), legF = [seg(), seg()], armF = [seg(), seg()], head = seg();
  const limb = (gs, upper, lower, w0, w1, end) => {
    part(`M${-w0} -6C${-w0} ${upper * .5} ${-w1} ${upper - 8} ${-w1} ${upper}H${w1}C${w1} ${upper - 8} ${w0} ${upper * .5} ${w0} -6Z`, gs[0]);
    mk('circle', { cx: 0, cy: upper, r: 6, fill: CREAM }, gs[0]);
    part(`M${-w1} -4V${lower - 10}H${w1}V-4Z` + end, gs[1]);
  };
  limb(legB, 80, 76, 15, 11, 'M-12 62H14L34 70C40 72 40 80 32 80H-14Z');
  limb(legF, 80, 76, 15, 11, 'M-12 62H14L34 70C40 72 40 80 32 80H-14Z');
  limb(armB, 70, 64, 11, 8, 'M-10 54C-12 70 12 72 10 54Z');
  limb(armF, 70, 64, 11, 8, 'M-10 54C-12 70 12 72 10 54Z');
  // the rifle across his back, stock at the hip, muzzle up past the shoulder
  part('M-40 150L-34 146L44 -64L52 -60L-20 152L-24 170C-28 178 -44 176 -42 166Z', body);
  part('M-34 0C-12 -8 12 -8 34 0L38 104C40 120 36 136 30 150H-30C-36 136 -40 120 -38 104Z', body);   // the tunic
  mk('path', { d: 'M-36 112H36M-30 4L34 104', stroke: CREAM, 'stroke-width': 3, opacity: .75 }, body);   // belt and strap
  for (const y of [30, 60, 90]) mk('circle', { cx: 8, cy: y, r: 3, fill: CREAM, opacity: .7 }, body);   // buttons
  part('M-10 -2V-14H10V-2Z', head);
  part('M-28 -50C-28 -82 30 -84 30 -50L34 -40L28 -38C28 -26 18 -14 2 -14C-18 -14 -28 -28 -28 -50Z', head);   // the face, carved
  part('M-52 -58C-46 -66 -30 -70 -24 -72C-24 -104 26 -110 30 -74C40 -72 52 -66 56 -58C20 -62 -20 -62 -52 -58Z', head);   // the helmet
  mk('circle', { cx: 14, cy: -46, r: 3.5, fill: CREAM }, head);   // a painted eye
  mk('path', { d: 'M10 -30q10 -4 18 0', stroke: CREAM, 'stroke-width': 3, fill: 'none' }, head);   // a painted moustache
  const rad = d => d * Math.PI / 180, dir = d => [Math.sin(rad(d)), Math.cos(rad(d))];
  const place = (e, x, y, d) => e.setAttribute('transform', `translate(${x.toFixed(1)},${y.toFixed(1)}) rotate(${(-d).toFixed(2)})`);
  function pose({ x, y, a = 0, arms = [6, 4, -6, 4], legs = [3, 0, -3, 0] }) {
    const ca = Math.cos(rad(a)), sa = Math.sin(rad(a)), W = (lx, ly) => [x + lx * ca - ly * sa, y + lx * sa + ly * ca];
    place(body, x, y, -a); place(head, x, y, -a * 1.4);
    const out = { head: W(0, -96) };
    [[armF, 22, arms[0], arms[1], 'handF'], [armB, -18, arms[2], arms[3], 'handB']].forEach(([gs, sx, u, f, key]) => {
      const [sx0, sy0] = W(sx, 10), [ux, uy] = dir(u), ex = sx0 + 70 * ux, ey = sy0 + 70 * uy, [fx, fy] = dir(u + f);
      place(gs[0], sx0, sy0, u); place(gs[1], ex, ey, u + f); out[key] = [ex + 60 * fx, ey + 60 * fy];
    });
    [[legF, 12, legs[0], legs[1], 'kneeF'], [legB, -10, legs[2], legs[3], 'kneeB']].forEach(([gs, hx, u, f, key]) => {
      const [hx0, hy0] = W(hx, 146), [ux, uy] = dir(u);
      place(gs[0], hx0, hy0, u); place(gs[1], hx0 + 80 * ux, hy0 + 80 * uy, u + f); out[key] = [hx0 + 80 * ux, hy0 + 80 * uy];
    });
    return out;
  }
  return { g, pose };
}

// the elephant as a jointed shadow puppet: its silhouette (SHAPES.elephant, facing left) cut into the body, the forelegs,
// the hind legs and the trunk, each turning about its joint; one rim round the whole (PUP's filter, boiling).
// pose({ x, y, h, r, s, fore, hind, trunk, breathe }): (x, y) the middle of its feet on the ground, h its height,
// r a lean of the whole about the point `about` (0..1 of the shape, default its feet), angles in degrees.
function elephantPuppet(p, D) {
  const S = SHAPES.elephant, W = S.w, H = S.h, wrap = G(p, {}), uid = 'ep' + (elephantPuppet.n = (elephantPuppet.n || 0) + 1);
  wrap.setAttribute('filter', 'url(#pupRim0)'); clockRun(tt => PUP.boilAt(wrap, tt), D, { tail: true });
  const all = mk('g', {}, wrap), defs = mk('defs', {}, all);

    const voidS = mk('path', { d: SLOT, fill: '#000', transform: at }, p); put(voidS, { o: 0 });
    tw(voidS, { o: 1 }, m('grows') + .5, 1.3, io);
    tw(p, { s: 1.35, x: 800 - 1.35 * FACE[0], y: 450 - 1.35 * FACE[1] }, t, m('laugh') - t + .2, soft);
    // then the dark closes in from the edges until only the mask-face hangs in a small pool of light. (Heart of Darkness)
    const gid = 'dark' + Math.floor(t * 100), gr = mk('radialGradient', { id: gid, gradientUnits: 'userSpaceOnUse', cx: FACE[0], cy: FACE[1], r: 1600 }, mk('defs', {}, p));
    mk('stop', { offset: .55, 'stop-color': '#000', 'stop-opacity': 0 }, gr); mk('stop', { offset: 1, 'stop-color': '#000', 'stop-opacity': 1 }, gr);
    mk('rect', { x: -1600, y: -1200, width: 4800, height: 3300, fill: `url(#${gid})` }, p);
    // then, on "laugh", the faces come up out of the dark all round it, laughing at him; the mask stays where it is
    clockRun(tt => gr.setAttribute('r', (1600 - 1360 * smooth01(span01(tt, m('grows') + .5, m('laugh') - .4)) + 760 * smooth01(span01(tt, m('laugh') - .1, m('laugh') + 1))).toFixed(0)), D, { tail: true });
    const crowdL = G(p, { o: 0 }); p.insertBefore(crowdL, p.firstChild);   // behind the mask
    pic(crowdL, 'eager', { x: FACE[0], y: FACE[1], h: 800 / 1.35 });
    show(crowdL, m('laugh') - .1, .6);
    tw(crowdL, { o: .45 }, m('laughed') - 3.4, .5);   // the faces sink back a little for the last words
    sfx('p4', m('laugh') - .1, 'jeer', .45);
    // the last words under the mask, in the dark at the foot of the frame (the panel is zoomed 1.35 about the face)
    say(p, ['“… one long struggle not to be laughed at.”'], FACE[0], FACE[1] + 300 / 1.35, m('laughed') - 3, m('laughed') + .6, { size: 64 / 1.35, anchor: 'middle', mark: ['laughed'] });



  }, { pre: .8 }],

  // Part 5, the shooting. Seven beats; between them the reader fires (on the page) or the shot is fired for them (video)
  ['p5a', 'The aim', (m, D) => {
    // "I shoved the cartridges into the magazine and lay down on the road to get a better aim."
    let p = panel(0);
    const pr = pic(p, 'prone', { x: 800, y: 450, h: 800, at: 0, from: [0, 0], dur: .5 });
    toward(pr, 'prone', .45, .6, 1.25, 0, .01); toward(pr, 'prone', .5, .5, 1.1, m('lay'), 4);
    sfx('p5a', m('cart'), 'clack', .7); sfx('p5a', m('cart') + .4, 'clack', .7);
    // "The crowd grew very still, and a deep, low, happy sigh, as of people who see the theatre curtain go up at last,
    // breathed from innumerable throats." — the theatre of part 4: the curtain goes up on the elephant in the paddy
    let t = m('sigh') - .8; p = cut(t);
    const th = theatre(p, t, D);
    const stageEl = elephantPuppet(G(p, {}), D); p.insertBefore(stageEl.g.parentNode, th.aud);
    stageEl.pose({ x: 820, y: th.FLOOR + 6, h: 300 });
    th.curtains.forEach((c, i) => tw(c, { x: (i ? 1 : -1) * 560, o: .9 }, m('curtain') - .3, 1.6, io));
    th.aud.childNodes.forEach(h => put(h, { o: 1 }));
    show(th.spot, m('curtain'), .6);
    sfx('p5a', m('sigh') - .2, 'sigh', 1.2);
    // "The rifle was a beautiful German thing with cross-hair sights."
    t = m('s3') - .2; p = cut(t);
    scope(p, a => { mk('rect', { x: 0, y: 0, width: 1600, height: 900, fill: '#59604f' }, a); paddy(a, 600); });
    label(p, 'CROSS-HAIR SIGHTS', 800, 850, m('cross') + .2, { size: 26, o: .9 });
    // "… an imaginary bar running from ear-hole to ear-hole. I ought … to have aimed straight at his ear-hole; actually I
    // aimed several inches in front of this, thinking the brain would be further forward." — a hunting manual's plate
    t = m('s4') - .2; p = cut(t);
    const hd = pic(p, 'e-head', { x: 800, y: 450, h: 820, at: t, from: [0, 0], dur: .5 });
    push(hd, t, m('forward') + .4, 1.04);
    tw(hd, { o: .55 }, m('bar') - .5, .5);
    const [bx_, by_] = spot(hd, 'e-head', .52, .3), [ex, ey] = spot(hd, 'e-head', .6, .43), [ax, ay] = spot(hd, 'e-head', .46, .44);
    const plate = G(p, {});
    const brain = path(plate, `M${bx_ - 70} ${by_}a70 46 0 1 0 140 0a70 46 0 1 0 -140 0`, { stroke: CREAM, 'stroke-width': 3.5, 'stroke-dasharray': '10 8', fill: 'none' }, { d: 0 });
    draw(brain, m('bar') - .4, .6);
    tag(plate, 'the brain', bx_ + 84, by_ - 40, m('bar'), { size: 32, fill: CREAM });
    line(plate, `M${ex - 260} ${ey}H${ex + 160}`, m('bar') + .2, .6, 3, { 'stroke-dasharray': '6 6' });
    tag(plate, 'an imaginary bar, ear-hole to ear-hole', ex + 170, ey + 8, m('bar') + .5, { size: 30, fill: CREAM });
    const eh = G(plate, { x: ex, y: ey, o: 0 }); mk('circle', { r: 15, fill: 'none', stroke: CREAM, 'stroke-width': 4 }, eh); show(eh, m('ear') - .1, .3);
    tag(plate, 'ear-hole: where to aim', ex + 24, ey + 52, m('ear') + .2, { size: 30, fill: CREAM });
    const xx = path(plate, `M${ax - 18} ${ay - 18}l36 36M${ax + 18} ${ay - 18}l-36 36`, { stroke: HOT, 'stroke-width': 8, 'stroke-linecap': 'round' }, { d: 0 });
    draw(xx, m('inches') - .1, .35);
    tag(plate, 'where I aimed', ax - 26, ay + 60, m('inches') + .3, { size: 34, fill: HOT, anchor: 'end' });
    // and the sight: the same picture as the film's first frame; the reader fires
    t = m('forward') + .5; p = cut(t, .3);
    // larger than the first frame's (880), so the aim has room to move up and down (±205 px, not ±70)
    scope(p, a => { const g = pic(a, 'elephant-side', { x: SCOPE.x + 196, y: SCOPE.y + 91, h: 1150 }); g.setAttribute('filter', 'grayscale(1) contrast(1.1)'); a.shot = { g, name: 'elephant-side', n: 0 }; });
  }, { pre: .6, ask: fireAsk(1, 'p5b', { head: 0 }), hold: 1.5 }],

  ['p5b', 'The first shot', (m, D) => {
    let p = panel(0);
    openingShots('p5b', [.01]); flashAt(p, 0, LIVE.p5b); jolt(p, 0);
    // "… I heard the devilish roar of glee that went up from the crowd."
    const e0 = pic(p, 'graze', { x: 800, y: 450, h: 800 });
    sfx('p5b', m('roar') - .2, 'roar', 1.4);
    const cr = G(p, { o: 0 }); pic(cr, 'glance', { x: 800, y: 450, h: 800 }); show(cr, m('roar') - .3, .25); hide(cr, m('s2') + .2, .4);
    // "… a mysterious, terrible change had come over the elephant. He looked suddenly stricken, shrunken, immensely old"
    const e1 = wounds(pic(p, 'e-stricken', { x: 800, y: 450, h: 800, o: 0 }), 'e-stricken', 1);
    tw(e1, { o: 1 }, m('change') - .2, .5, lin);   // the change, quicker than a dissolve should be
    push(e1, m('change'), m('s4'), 1.06); hide(e0, m('change') + .4, .01, lin);
    // "… he sagged flabbily to his knees."
    const e2 = wounds(pic(p, 'e-knees', { x: 800, y: 450, h: 800, o: 0 }), 'e-knees', 1);
    tw(e2, { o: 1 }, m('knees') - 1.6, 1.8, io);
    toward(e2, 'e-knees', .38, .5, 1.25, m('knees'), m('thousands') + 1 - m('knees')); hide(e1, m('knees') + .3, .01, lin);

    // the sight again, on him kneeling

  }, { pre: .6, ask: fireAsk(1, 'p5c', { head: 1 }), hold: 1.5 }],

  ['p5c', 'The second shot', (m, D) => {
    let p = panel(0);
    openingShots('p5c', [.01]); flashAt(p, 0, LIVE.p5c); jolt(p, 0);
    wounds(pic(p, 'e-knees', { x: 800, y: 450, h: 800 }), 'e-knees', 2);
    // "… climbed with desperate slowness to his feet and stood weakly upright, with legs sagging and head drooping."
    const e = wounds(pic(p, 'e-rise', { x: 800, y: 450, h: 800, o: 0 }), 'e-rise', 2);
    tw(e, { o: 1 }, m('climbed') - .3, 3.2, io);

  }, { pre: .6, ask: fireAsk(1, 'p5d', { head: 2 }), hold: 1.5 }],

  ['p5d', 'The third shot', (m, D) => {

    // "That was the shot that did for him."
    const e0 = wounds(pic(p, 'e-rise', { x: 800, y: 450, h: 800 }), 'e-rise', 3);
    // "… he seemed to tower upward like a huge rock toppling, his trunk reaching skyward like a tree."
    const e1 = wounds(pic(p, 'e-topple', { x: 800, y: 450, h: 800, o: 0 }), 'e-topple', 3);
    tw(e1, { o: 1 }, m('rise') - .4, 1.4, io);

    tw(e2, { o: 1 }, tc, .08, lin); hide(e1, tc + .1, .01, lin);

  ['p5e', 'Not dead', (m, D) => {
    let p = panel(0);
    // "… he was not dead. He was breathing very rhythmically with long rattling gasps, his great mound of a side painfully
    // rising and falling."
    for (let k = 0; k < 4; k++) sfx('p5e', .2 + k * 8, 'gasps', 1.1);

    const e1 = wounds(pic(p, 'e-gasp', { x: 800, y: 450, h: 800, o: 0 }), 'e-gasp', 3); breathing(e1, D, { y0: 720, amp: .016 });
    tw(e1, { o: 1 }, m('s2') - .3, 1, io); hide(e0, m('s2') + .8, .01, lin);
    toward(e1, 'e-gasp', .3, .55, 1.25, m('gasps'), 4);
    const t = m('gasps') + 3.2; p = cut(t, .3);

  ['p5f', 'Still he did not die', (m, D) => {
    let p = panel(0);
    openingShots('p5f', [.01, .6]); flashAt(p, 0, LIVE.p5f); flashAt(p, .6, LIVE.p5f); jolt(p, 0); jolt(p, .6, 9);
    for (let k = 0; k < 2; k++) sfx('p5f', .2 + k * 8, 'gasps', 1.1);
    const e0 = wounds(pic(p, 'e-down', { x: 800, y: 450, h: 800 }), 'e-down', 3); const br = breathing(e0, D, { y0: 700 });
    // "The thick blood welled out of him like red velvet, but still he did not die." — the only red that spreads

    const eb = wounds(pic(br, 'e-down-blood', { x: 800, y: 450, h: 800, o: 0 }), 'e-down', 3);

  ['p5g', 'Half an hour', (m, D) => {
    let p = panel(0);
    const shots = [...Array(8)].map((_, k) => .02 + k * .28);
    openingShots('p5g', shots, true); shots.forEach(t => { flashAt(p, t, LIVE.p5g); jolt(p, t, 5); });
    for (let k = 0; k < 3; k++) sfx('p5g', .2 + k * 8, 'gasps', 1);
    const e0 = wounds(pic(p, 'e-gasp-blood', { x: 800, y: 450, h: 800 }), 'e-gasp-blood', 3); breathing(e0, D, { y0: 720, amp: .016 });
    // "They seemed to make no impression. The tortured gasps continued as steadily as the ticking of a clock."
    for (let k = 0; k < 9; k++) sfx('p5g', m('s3') + k, 'tick', 1.2);
    // "In the end I could not stand it any longer and went away." — the view draws back and the light goes
    tw(e0, { s: .8 }, m('away') - .5, D - m('away'), soft);
    const dark = put(mk('rect', { x: -2000, y: -2000, width: 6000, height: 5000, fill: '#000' }, p), { o: 0 });
    tw(dark, { o: 1 }, m('away'), D - m('away') - .2, io);
    // "I heard later that it took him half an hour to die."
    say(p, ['“… it took him half an hour to die.”'], 800, 460, m('s5') + .3, m('hour') + .8, { size: 56, anchor: 'middle', mark: ['hour'] });
  }, { pre: .4 }],

  // Part 6, afterwards: one take; then the title, the author, the year, and The End
  ['p6', 'Afterwards', (m, D) => {
    // "Afterwards, of course, there were endless discussions about the shooting of the elephant. Among the Europeans
    // opinion was divided. The older men said I was right, the younger men said it was a damn shame …"
    let p = panel(0);
    const cl = pic(p, 'club', { x: 800, y: 450, h: 800, at: 0, from: [0, 0], dur: .8 });
    push(cl, 0, m('s3'), 1.04);

    say(p, ['“… a sufficient pretext', 'for shooting the elephant.”'], 800, 400, m('pretext') - 2, m('s5') + .6, { size: 64, anchor: 'middle', mark: ['pretext'] });
    // "I often wondered whether any of the others grasped that I had done it solely to avoid looking a fool."
    t = m('s5') + 1.2; p = cut(t);
    const of = pic(p, 'officer', { x: 800, y: 450, h: 800, at: t, from: [0, 0], dur: .6 });
    toward(of, 'officer', .48, .3, 1.3, t, D - t + 1);
    tw(of, { o: .3 }, m('fool') - 2.4, .5);
    say(p, ['“… solely to avoid', 'looking a fool.”'], 800, 400, m('fool') - 2.2, m('fool') + .5, { size: 70, anchor: 'middle', mark: ['fool'] });
    // the end card
    t = D + 2.2; p = cut(t, 1);
    put(mk('rect', { x: -10, y: -10, width: 1620, height: 920, fill: '#030604' }, p), { o: 1 });
    key(p, 'Shooting an Elephant', 800, 400, t + .8, { size: 110 });
    tag(p, 'George Orwell  ·  1936', 800, 480, t + 1.8, { anchor: 'middle', size: 40, fill: CREAM });
    const end = T(p, 'The End', { x: 800, y: 650, size: 44, font: SER, weight: 400, fill: CREAM, anchor: 'middle', o: 0 });
    end.setAttribute('font-style', 'italic'); end.setAttribute('letter-spacing', '.12em');
    show(end, t + 4, 1.2);
    hide(end, t + 9, .01, lin);   // (the beat's length: the card holds about 5 s)
  }, { pre: .8 }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

/* ---------- music ----------
   Elgar's Crown of India (1912, written for the imperial Durbar) under Moulmein: it waits until the black has passed. */
// Grieg's Mountain King, one piece through the whole part: it sinks to a fifth as he finds the body and comes back as the
// orderly runs for the rifle (the levels are in m2-grieg-p2.mp3, mixed to the beat clock: down 1.2 s before "I rounded
// the hut", up 1.6 s after "As soon as I saw the dead man"; MUSIC_OFF would silence it, not lower it)
music('audio/bgm/m2-grieg-p2.mp3', ['p2'], .55, 1.5);
// Grieg's Morning Mood under part 3: the morning, the crowd, the elephant at peace
music('audio/bgm/m3-grieg-morning.mp3', ['p3'], .5, 2);
// Grieg's Death of Aase under part 4: grave, rising
music('audio/bgm/m4-grieg-aase.mp3', ['p4'], .5, 2.5);
// Satie's first Gymnopédie under the shooting: slow and plain against what happens; it plays on while the page waits
// for the reader to fire (rising a little, engine v2.3), and plays on through the end
music('audio/bgm/m5-satie.mp3', ['p5a', 'p5b', 'p5c', 'p5d', 'p5e', 'p5f', 'p5g', 'p6'], .4, 2.5);   // and on to the end
music('audio/bgm/m1-crown-menuetto.mp3', ['open'], .5, 3);
window.MUSIC_OFF = { open: t => t < OPEN_PRE - .8 };
sfx('open', .01, 'rifle', 2);
// the first shot can miss: the elephant only trumpets if the crosshair was on it when the reader fired; a miss sends
// birds up instead (as Orwell's own first shot was misplaced). Decided at the click, before the film starts.
sfx('open', .5, 'trumpet', 1.6);
sfx('open', .35, 'flee', 0);
// the elephant in elephant-grazing-gen.png, as fractions of the picture (inside the print's border)
const ELEPHANT = [[.42, .02], [.62, 0], [1, .1], [1, 1], [.6, 1], [.55, .72], [.5, .86], [.4, .87], [.33, .75], [.33, .45], [.37, .22]];
function onElephant() {
  // the crosshair (SIGHT) over the picture, which sits at SIGHT + (150, 70) + the aim, 880 high with its border
  const [W, H] = ART['elephant-side'], k = 880 / H, iw = (W - 112) * k, ih = (H - 112) * k;
  const fx = .5 + (SIGHT.x - (SIGHT.x + 150 + AIM.x)) / iw, fy = .5 + (SIGHT.y - (SIGHT.y + 70 + AIM.y)) / ih;
  let inside = false;   // point in polygon (even-odd)
  for (let i = 0, j = ELEPHANT.length - 1; i < ELEPHANT.length; j = i++) {
    const [xi, yi] = ELEPHANT[i], [xj, yj] = ELEPHANT[j];
    if ((yi > fy) !== (yj > fy) && fx < (xj - xi) * (fy - yi) / (yj - yi) + xi) inside = !inside;
  }
  return inside;
}
const fire = () => { if (P.started) return; const hit = onElephant(); sfx('open', .5, 'trumpet', hit ? 1.6 : 0); sfx('open', .35, 'flee', hit ? 0 : 1.4); };
$('cover').addEventListener('click', fire, true);
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') fire(); }, true);
sfx('open', 1.6, 'ring', .8);

// the fonts must be in before words are measured
Promise.all(['600 40px Oswald', '500 40px Oswald', 'italic 400 40px "EB Garamond"', '400 40px "EB Garamond"']
  .map(f => document.fonts.load(f))).then(boot);
</script>
