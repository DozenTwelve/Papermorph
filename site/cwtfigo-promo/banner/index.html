<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex">
<title>CWTFIGO banner</title>
<link rel="stylesheet" href="../lib/book.css">
<style>
  html, body { margin: 0; background: #16130f; }
  svg#banner { display: block; width: 1280px; height: 640px; position: absolute; top: 0; left: 0; }
  #frame { display: none; }   /* the engine builds its player frame on load; this page has no player */
</style>
</head>
<body>
<!-- The CWTFIGO repository banner and social preview (1280 × 640), drawn with the film's own puppets and set: Claude on
     the left with his cigar, Martin on the right holding up his fixed laptop, the title between them in the end card's
     lettering. ?line=1 adds "Claude, what the fuck is going on?" under the title. Rendered to PNG by a screenshot. -->
<svg id="banner" viewBox="0 0 1280 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bnVignette" cx=".5" cy=".5" r=".75"><stop offset=".45" stop-color="#16130f" stop-opacity=".55"/><stop offset="1" stop-color="#16130f" stop-opacity=".92"/></radialGradient>
    <radialGradient id="bnGlow" cx=".5" cy=".5" r=".5"><stop offset="0" stop-color="#ef601d" stop-opacity=".22"/><stop offset="1" stop-color="#ef601d" stop-opacity="0"/></radialGradient>
  </defs>
  <image href="../img/sets/garage/bg-soft.webp" x="-40" y="-20" width="1360" height="765" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1280" height="640" fill="url(#bnVignette)"/>
  <ellipse cx="640" cy="320" rx="360" ry="170" fill="url(#bnGlow)"/>
  <g id="cast"></g>
  <g id="title"></g>
</svg>
<script src="../lib/engine.js"></script>
<script src="../lib/paper.js"></script>
<script src="../lib/cast.js"></script>
<script src="../lib/cwt.js"></script>
<script src="../ch01/kit.js"></script>
<script>
'use strict';
{   // a block of its own: the engine and kit scripts above declare globals such as M
const line = new URLSearchParams(location.search).has('line');
const cast = document.getElementById('cast');
// Claude: front on, half-lidded, the grid-teeth smirk, the cigar, the ✻ on his antenna
claudePuppet(cast).pose({ x: 194, y: 574, s: 1.75, lids: .45, brow: .2, look: .15, eyeX: .3, mouth: 0, cigar: true, spin: 18,
  armL: 14, armR: 14 }, 0);
// Martin: the "My configs!" pose, cleaned up: the open laptop held up at his chest by the sides of its base, his loud
// desktop on it, a big open grin
const mart = martinPuppet(cast), M = { x: 1108, y: 574, s: 1.02, lids: 0, brow: .15, mouth: 'D', eyeX: -.1, headR: -4 };
const k = CW.martin.K * M.s, w = 440, cy = -520, hw = w / 2 + 6;
const DESK = `<g transform="scale(${(w / 415).toFixed(3)})"><g transform="translate(-152 -106)">${screenSVG('desk', 152, 72, 304, 144)}</g></g>`;
mart.pose({ ...M, chest: { name: 'laptop-open', w, y: cy, screen: DESK },
  ...mart.aim(M, 'L', [M.x - hw * k, M.y + (cy + .22 * w) * k]), ...mart.aim(M, 'R', [M.x + hw * k, M.y + (cy + .22 * w) * k]),
  frontL: true, frontR: true }, 0);
// the title, in the end card's lettering
const t = document.getElementById('title');
t.innerHTML = `<text x="640" y="${line ? 318 : 348}" text-anchor="middle" font-family="${MARKER}" font-size="118" fill="#ef601d"
    stroke="#16130f" stroke-width="10" paint-order="stroke" letter-spacing="2">CWTFIGO</text>` +
  (line ? `<text x="640" y="382" text-anchor="middle" font-family="${MARKER}" font-size="30" fill="#f4ede0" stroke="#16130f" stroke-width="6" paint-order="stroke">Claude, what the fuck is going on?</text>` : '');
document.fonts.ready.then(() => Promise.all([...document.images, ...document.querySelectorAll('image')].map(i => i.decode ? i.decode().catch(() => {}) : 0)))
  .then(() => document.body.dataset.ready = '1');
}
</script>
</body>
</html>
