<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Claude, what the fuck is going on?</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<!-- The CWTFIGO promo: one beat per scene. Order matters: engine, sets, kit, cast, the audio data (eleven.py: timings.js;
     mouths.py: mouths.js; join.py: shots.js), shared helpers, the episode kit, then the scenes. -->
<script src="../lib/engine.js"></script>
<script src="../img/sets/sets.js"></script>
<script src="../img/puppets/baked.js" onerror="0"></script>
<script src="../lib/paper.js"></script>
<script src="../lib/cast.js"></script>
<script src="audio/en/timings.js"></script>
<script src="audio/en/mouths.js"></script>
<script src="audio/en/shots.js"></script>
<script src="../lib/shared.js"></script>
<script src="../lib/cwt.js"></script>
<script src="kit.js"></script>
<script src="scene1.js"></script>
<script src="scene2.js"></script>
<script src="scene3.js"></script>
<script src="scene4.js"></script>
<script src="scene5.js"></script>
<script src="scene6.js"></script>
<script src="scene7.js"></script>
<script src="scene8.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'Claude, what the fuck is going on?', minutes: 2, language: 'en', film: true };
try { if (localStorage.getItem('captions') === null) setCaptions(true, false); } catch {}   // captions on at the first visit

const BEATS = [
  ['scene1', 'The door', (m, D) => scene1(panel(0), D, m), { lead: false, pre: PRE1 }],
  ['scene2', 'You ask Claude', (m, D) => scene2(panel(0), D, m), { lead: false, pre: PRE2 }],
  ['scene3', 'Pop', (m, D) => scene3(panel(0), D, m), { lead: false, pre: PRE3 }],
  ['scene4', 'Can I run this?', (m, D) => scene4(panel(0), D, m), { lead: false, pre: PRE4 }],
  ['scene5', 'YOLO', (m, D) => scene5(panel(0), D, m), { lead: false, pre: PRE5 }],
  ['scene6', 'Found it', (m, D) => scene6(panel(0), D, m), { lead: false, pre: PRE6 }],
  ['scene7', 'Online', (m, D) => scene7(panel(0), D, m), { lead: false, pre: PRE7 }],
  ['scene8', 'Tag', (m, D) => scene8(panel(0), D, m), { lead: false, pre: PRE8 }],
  ['end', 'CWTFIGO', (m, D) => endScene(panel(0), D), { lead: false, pre: 4.45, dur: .05 }],   // all lead-in, so the music is up
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

// The score (CW_MUSIC in kit.js): the 3 s guitar opener is an effect at the top of scene 1; the bed, one file, runs
// under the whole film from right after it (its cut starts with that silence, music.py cut --even, -16 LUFS), ducked
// under the dialogue, drops out for rm -rf until "Kidding." and from Claude's sign through "NO.", comes back on the
// black and up under the end card, and fades out there.
music(`audio/bgm/${CW_MUSIC.bgm}.mp3`, undefined, .66, .5);   // under a line (30 %) about -30 LUFS, 12 dB under the -18 LUFS voices
window.MUSIC_OFF = {
  scene5: t => t >= clipAt('scene5', PRE5, 'm11') - .05 && t < clipAt('scene5', PRE5, 'c10'),
  scene8: t => t >= clipAt('scene8', PRE8, 'd04') - .1 && t < BLACK8(),
  end: t => t > 3.1,   // fades out under the card
};
window.MUSIC_UP_IN_PRE = true;   // up to 70 % (about -23 LUFS) in every beat's lead-in with no line: the pop, the terminal, the card
boot();
</script>
</body>
</html>
