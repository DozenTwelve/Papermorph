<body>
<script src="../lib/engine.js"></script>
<script src="../img/sets/sets.js"></script>
<script src="../img/puppets/baked.js" onerror="0"></script>
<script src="../lib/paper.js"></script>
<script>window.SP_SHUT = .9;   // a shut eye keeps its lid line (Yui's frozen cringe reads as empty eyes otherwise)</script>
<script src="../lib/cast.js"></script>
<script src="audio/en/timings.js"></script>
<script src="audio/en/mouths.js"></script>
<script src="audio/en/shots.js"></script>

<script src="scene2.js"></script>
<script src="scene3.js"></script>
<script src="scene4.js"></script>
<script src="scene5.js"></script>
<script src="scene6.js"></script>
<script>
'use strict';
const CHAPTER = { number: 7, title: 'Baka Means Cow', minutes: 2, language: 'en' };
// captions on the first time: a third of the film is Spanish and Japanese
try { if (localStorage.getItem('captions') === null) setCaptions(true, false); } catch {}

/* ---------- beats: one per scene ---------- */
const BEATS = [
  ['scene1', 'Arrival', (m, D) => scene1(panel(0), D), { lead: false, pre: PRE1 }],
  ['scene2', 'The queen of the house', (m, D) => scene2(panel(0), D), { lead: false, pre: PRE2 }],
  ['scene3', 'The collision', (m, D) => scene3(panel(0), D), { lead: false, pre: PRE3 }],
  ['scene4', 'The whisper', (m, D) => scene4(panel(0), D), { lead: false, pre: PRE4 }],
  ['scene5', 'Vaca. Cow. Not baka.', (m, D) => scene5(panel(0), D), { lead: false, pre: PRE5 }],
  ['scene6', 'Mi casa', (m, D) => scene6(panel(0), D), { lead: false, pre: PRE6 }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

/* ---------- background music ----------
   The Three Little Pigs' score (Lyria), reused from episode 2's folder: one track per listed scene (the engine's
   music(), 0.8 s crossfades), ducked under speech. The home theme carries the day at the farm; the chimney theme
   under the dusk and the naming. */
music('../ch02/audio/bgm/m1-home.mp3', ['scene1', 'scene2', 'scene3', 'scene4', 'scene5'], .26);
music('../ch02/audio/bgm/m3-chimney.mp3', ['scene6'], .24);
paperWarm(g => { pedroPuppet(g); yuiPuppet(g, { holds: { case: 1 } }); mePuppet(g); cowPuppet(g); });
boot();
</script>
</body>
</html>
