<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>How to Move a Cow</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../img/sets/sets.js"></script>
<script src="../img/puppets/baked.js" onerror="0"></script>
<script src="../lib/paper.js"></script>
<script>window.SP_SHUT = .9;   // a shut eye keeps its lid line (long bows read as empty eyes otherwise)</script>
<script src="../lib/cast.js"></script>
<script src="audio/en/timings.js"></script>
<script src="audio/en/mouths.js"></script>
<script src="audio/en/shots.js"></script>
<script src="../lib/shared.js"></script>
<script src="farm.js"></script>
<script src="scene1.js"></script>
<script src="scene2.js"></script>
<script src="scene3.js"></script>
<script src="scene4.js"></script>
<script>
'use strict';
const CHAPTER = { number: 3, title: 'How to Move a Cow', minutes: 2, language: 'en', next: '../ch04/' };
// captions on the first time: half the film is Chinese and Hindi
try { if (localStorage.getItem('captions') === null) setCaptions(true, false); } catch {}

/* ---------- beats: one per scene ---------- */
const BEATS = [
  ['scene1', "The cow won't move", (m, D) => scene1(panel(0), D), { lead: false, pre: PRE1 }],
  ['scene2', 'Violence and superstition', (m, D) => scene2(panel(0), D), { lead: false, pre: PRE2 }],
  ['scene3', 'Of its own free will', (m, D) => scene3(panel(0), D), { lead: false, pre: PRE3 }],
  ['scene4', 'Lying flat', (m, D) => scene4(panel(0), D), { lead: false, pre: PRE4 }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

/* ---------- background music ----------
   The Three Little Pigs' score (Lyria), reused from episode 2's folder: one track per listed scene (the engine's
   music(), 0.8 s crossfades), lower under speech. Scene 2 has its own track (this folder) that drops out for the
   crickets after the prayer; the march stops when the cow lies down. */
music('../ch02/audio/bgm/m1-home.mp3', ['scene1'], .3);
music('audio/bgm/m-s2-standoff.mp3', ['scene2'], .27);
music('../ch02/audio/bgm/m3-chimney.mp3', ['scene3', 'scene4'], .22);
window.MUSIC_OFF = { scene2: t => t > (window.S2_HUSH ?? 1e9), scene4: t => t > (window.S4_STOP ?? 1e9) };
paperWarm(g => { americanPuppet(g, { holds: { coil: whipCoilSVG, whip: whipHandleSVG } }); chinesePuppet(g, { holds: { rod: rodHeldSVG, hay: haySVG } }); indianPuppet(g); cowPuppet(g); });
boot();
</script>
</body>
</html>
