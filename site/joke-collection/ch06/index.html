<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Four Dogs</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../img/sets/sets.js"></script>
<script src="../img/puppets/baked.js" onerror="0"></script>
<script src="../lib/paper.js"></script>
<script>window.SP_SHUT = .9;   // a shut eye keeps its lid line (as episode 3): a full lid left two blank skin ovals</script>
<script src="../lib/cast.js"></script>
<script src="audio/en/timings.js"></script>
<script src="audio/en/mouths.js"></script>
<script src="audio/en/shots.js"></script>
<script src="../lib/shared.js"></script>
<script src="dogs.js"></script>
<script src="scene1.js"></script>
<script src="scene2.js"></script>
<script src="scene3.js"></script>
<script src="scene4.js"></script>
<script>
'use strict';
const CHAPTER = { number: 6, title: 'Four Dogs', minutes: 2, language: 'en', next: '../ch07/' };
try { if (localStorage.getItem('captions') === null) setCaptions(true, false); } catch {}

/* ---------- beats: one per scene ---------- */
const BEATS = [
  ['scene1', 'Three dogs', (m, D) => scene1(panel(0), D), { lead: false, pre: PRE1 }],
  ['scene2', 'Back home', (m, D) => scene2(panel(0), D), { lead: false, pre: PRE2 }],
  ['scene3', 'What is meat?', (m, D) => scene3(panel(0), D), { lead: false, pre: PRE3 }],
  ['scene4', 'Shh', (m, D) => scene4(panel(0), D), { lead: false, pre: PRE4 }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

/* ---------- background music ----------
   The Three Little Pigs' score (Lyria), reused from episode 2's folder: one track per listed scene (the engine's
   music(), 0.8 s crossfades), lower under speech. The home theme under the introductions, fading when the narrator
   hesitates before the fourth dog (scene 1 sets S1_STOP); the march under the American dog's boast and his "back
   home", fading as he barks for real in the alley (scene 2 sets S2_STOP). Scenes 3 and 4 have no music: the chopping
   and the silences carry them. */
music('../ch02/audio/bgm/m1-home.mp3', ['scene1'], .3);
music('../ch02/audio/bgm/m3-chimney.mp3', ['scene2'], .3);
window.MUSIC_OFF = { scene1: t => t > (window.S1_STOP ?? 1e9), scene2: t => t > (window.S2_STOP ?? 1e9) };
paperWarm(g => { usDog(g); plDog(g); suDog(g); cnDog(g); boxProp(g); prop(g, steakSVG + bowlSVG); });
boot();
</script>
</body>
</html>
