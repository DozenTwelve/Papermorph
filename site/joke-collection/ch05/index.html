<script>
'use strict';
const CHAPTER = { number: 5, title: 'The Penguin and the Zoo', minutes: 2, language: 'en', next: '../ch06/' };
try { if (localStorage.getItem('captions') === null) setCaptions(true, false); } catch {}

/* ---------- beats: one per scene ---------- */
const BEATS = [
  ['scene1', 'The follower', (m, D) => scene1(panel(0), D), { lead: false, pre: PRE1 }],
  ['scene2', 'Good idea!', (m, D) => scene2(panel(0), D), { lead: false, pre: PRE2 }],
  ['scene3', 'The next day', (m, D) => scene3(panel(0), D), { lead: false, pre: PRE3 }],
  ['scene4', 'At the beach', (m, D) => scene4(panel(0), D), { lead: false, pre: PRE4 }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

/* ---------- background music ----------
   The Three Little Pigs' score (Lyria), reused from episode 2's folder: one track per listed scene (the engine's
   music(), 0.8 s crossfades), lower under speech. The home theme carries the walk through town (scenes 1–2; scene 2
   may fade it for its tail with S2_HUSH); scene 3 (the punchline) has no music; the march comes in for the beach and
   stops before the policeman's last stare (scene 4 sets S4_STOP). */
music('../ch02/audio/bgm/m1-home.mp3', ['scene1', 'scene2'], .3);
music('../ch02/audio/bgm/m3-chimney.mp3', ['scene4'], .3);
window.MUSIC_OFF = { scene2: t => t > (window.S2_HUSH ?? 1e9), scene4: t => t > (window.S4_STOP ?? 1e9) };
paperWarm(g => { manPuppet(g, { holds: { fish: fishSVG, bucket: bucketSVG, photo: photoSVG } }); copPuppet(g, { holds: { chips: chipsSVG, chip: chipSVG } }); penguinPuppet(g); prop(g, posterSVG); });
boot();
</script>
