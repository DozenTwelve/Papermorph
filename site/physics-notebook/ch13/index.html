<script>
'use strict';
const CHAPTER = { number: 13, label: 5, title: 'Forms of Energy', minutes: 9, language: 'en' };

/* ---------- chapter drawing helpers ---------- */
const DEG = Math.PI / 180;
const ink = (p, d, w = 5, attrs = {}) => path(p, d, { stroke: INK, 'stroke-width': w, ...attrs });
const ground = (p, y, x1 = 150, x2 = 1570) => ink(p, `M${x1} ${y}C${x1 + 300} ${y - 5} ${x2 - 500} ${y + 5} ${x2} ${y - 2}`, 4);
const circ = (p, cx, cy, r, fill = '#fff', w = 4) => mk('circle', { cx, cy, r, fill, stroke: INK, 'stroke-width': w }, p);
const pale = c => mix(c, '#ffffff', .55);
// Largest size up to `size` at which str fits in w px.
const fitSize = (str, w, size, font = HAND) => Math.min(size, size * w / handW(str, size, font));

// A doodled kid: ink limbs, a shirt, a round head. Origin at the feet; faces right (flip for left).
// Pose angles in degrees, 0 = hanging straight down, positive = toward the way the kid faces. Forearms and shins
// are relative to their upper limb. b = back limb, f = front limb.
const KL = { torso: 80, head: 28, ua: 44, fa: 40, th: 50, sh: 48 };
const STAND = { lean: 0, ub: -10, fb: 12, uf: 10, ff: 8, tb: -5, sb: 0, tf: 5, sf: 0 };
function kid(p, { x = 0, y = 0, s = 1, shirt = HL.blue, flip = false, o = 1, pose = STAND } = {}) {
  const g = G(p, { x, y, s, o });
  const f = mk('g', {}, g);
  const L = KL, hipY = -(L.th + L.sh), P = { ...pose };
  const back = ink(f, '', 5.5);
  const shirtP = mk('path', { fill: shirt, stroke: INK, 'stroke-width': 4, 'stroke-linejoin': 'round' }, f);
  const headG = G(f);
  circ(headG, 0, 0, L.head, '#fff', 4.5);
  ink(headG, 'M-24 -14Q-14 -36 8 -27Q14 -33 22 -24', 4.5);
  mk('circle', { cx: 9, cy: -2, r: 3.6, fill: INK }, headG);
  mk('circle', { cx: 21, cy: -2, r: 3.6, fill: INK }, headG);
  const mouth = ink(headG, 'M9 11Q16 17 23 10', 3.5);
  const front = ink(f, '', 5.5);
  const sn = a => Math.sin(a * DEG), cs = a => Math.cos(a * DEG);
  const seg = ([x0, y0], a, l) => [x0 + sn(a) * l, y0 + cs(a) * l];
  const pl = pts => 'M' + pts.map(q => q[0].toFixed(1) + ' ' + q[1].toFixed(1)).join('L');
  const K = { g, P, mouth, head: headG };
  function joints() {
    const H = [0, hipY], N = [sn(P.lean) * L.torso, hipY - cs(P.lean) * L.torso];
    const Sh = [N[0] - sn(P.lean) * 8, N[1] + cs(P.lean) * 8];
    const arm = (u, fo) => { const E = seg(Sh, u, L.ua); return [Sh, E, seg(E, u + fo, L.fa)]; };
    const leg = (t, k) => { const Kn = seg(H, t, L.th); return [H, Kn, seg(Kn, t + k, L.sh)]; };
    return { H, N, ab: arm(P.ub, P.fb), af: arm(P.uf, P.ff), lb: leg(P.tb, P.sb), lf: leg(P.tf, P.sf) };
  }
  const foot = l => { const F = l[2]; return `M${(F[0] - 3).toFixed(1)} ${F[1].toFixed(1)}L${(F[0] + 15).toFixed(1)} ${F[1].toFixed(1)}`; };
  K.update = () => {
    const J = K.J = joints(), px = cs(P.lean), py = sn(P.lean);
    back.setAttribute('d', pl(J.ab) + pl(J.lb) + foot(J.lb));
    front.setAttribute('d', pl(J.af) + pl(J.lf) + foot(J.lf));
    const [N, H] = [J.N, J.H];
    shirtP.setAttribute('d', pl([[N[0] + px * 15, N[1] + py * 15], [H[0] + px * 20, H[1] + py * 20 + 6],
      [H[0] - px * 20, H[1] - py * 20 + 6], [N[0] - px * 15, N[1] - py * 15]]) + 'Z');
    put(headG, { x: N[0] + sn(P.lean) * (L.head + 3), y: N[1] - cs(P.lean) * (L.head + 3) });
  };
  K.face = left => { flip = left; f.setAttribute('transform', left ? 'scale(-1 1)' : ''); return K; };
  K.pose = Q => { Object.assign(P, Q); K.update(); return K; };
  K.to = (Q, t0, dur = .4, ease = io) => {
    let from;
    prog(q => { if (!from) from = { ...P }; for (const k in Q) P[k] = from[k] + (Q[k] - from[k]) * q; K.update(); }, t0, dur, ease);
    return K;
  };
  // A hand ('f' or 'b') in the parent's coordinates, from the current pose and the group's place.
  K.hand = (w = 'f') => {
    const s = st(g), J = joints(), q = (w === 'f' ? J.af : J.ab)[2];
    return [s.x + s.s * (flip ? -q[0] : q[0]), s.y + s.s * q[1]];
  };
  K.update();
  return flip ? K.face(true) : K;
}
const POSE = {
  swingBack: { lean: 18, ub: -150, fb: 10, uf: -140, ff: 10, tb: -12, sb: 4, tf: 12, sf: -4 },
  swingHit: { lean: 22, ub: 6, fb: 0, uf: 14, ff: 0, tb: -12, sb: 4, tf: 12, sf: -4 },
  holdUp: { lean: 0, ub: -8, fb: 12, uf: 112, ff: -8, tb: -5, sb: 0, tf: 5, sf: 0 },
  kickBack: { lean: -6, ub: 30, fb: 30, uf: -30, ff: 40, tb: -40, sb: -60, tf: 4, sf: 0 },
  kick: { lean: -14, ub: -40, fb: 40, uf: 40, ff: 30, tb: 5, sb: 0, tf: 70, sf: -8 },
  run: { lean: 14, ub: -50, fb: 70, uf: 50, ff: 80, tb: -38, sb: -62, tf: 46, sf: -12 },
  eat: { lean: 6, ub: -8, fb: 14, uf: 40, ff: 128, tb: -5, sb: 0, tf: 5, sf: 0 },
  wheel: { lean: 4, ub: 40, fb: 40, uf: 50, ff: 40, tb: 0, sb: 0, tf: 0, sf: 0 },
  cheer: { lean: 0, ub: -150, fb: -10, uf: 150, ff: 10, tb: -8, sb: 0, tf: 8, sf: 0 },
  follow: { lean: 6, ub: 150, fb: 20, uf: 160, ff: 20, tb: -12, sb: 4, tf: 12, sf: -4 },
  trap: { lean: 0, ub: -10, fb: 12, uf: 10, ff: 8, tb: -5, sb: 0, tf: 28, sf: -14 },
  shout: { lean: 4, ub: -20, fb: 30, uf: 60, ff: 70, tb: -6, sb: 0, tf: 6, sf: 0 },
};

/* ---------- props ---------- */
function ball(p, x, y, r = 24, fill = '#ff6f8f') {
  const g = G(p, { x, y });
  circ(g, 0, 0, r, fill, 4);
  ink(g, `M${-r * .55} ${-r * .3}Q${-r * .35} ${-r * .62} ${-r * .05} ${-r * .66}`, 3.5, { stroke: '#fff', opacity: .7 });
  return g;
}
function tennisBall(p, x, y, r = 22) {
  const g = G(p, { x, y });
  circ(g, 0, 0, r, '#d7ef3f', 4);
  ink(g, `M${-r * .9} ${-r * .3}Q0 ${r * .25} ${r * .9} ${-r * .3}`, 3, { stroke: '#fff' });
  return g;
}
function bowlingBall(p, x, y, r = 46) {
  const g = G(p, { x, y });
  circ(g, 0, 0, r, '#3c4a8c', 4.5);
  for (const [a, b] of [[-12, -18], [4, -22], [-4, -6]]) mk('circle', { cx: a * r / 46, cy: b * r / 46, r: 5 * r / 46, fill: INK }, g);
  return g;
}
function flame(p, x, y, s = 1) {
  const g = G(p, { x, y, s });
  path(g, 'M0 40C-34 40 -40 8 -22 -14C-14 -24 -10 -36 -12 -48C6 -38 30 -18 30 10C30 30 18 40 0 40Z', { fill: EN.thermal, stroke: INK, 'stroke-width': 4 });
  path(g, 'M0 38C-14 38 -18 22 -10 10C-4 2 0 -6 0 -14C10 -4 16 8 14 20C12 32 8 38 0 38Z', { fill: EN.light });
  return g;
}
function speaker(p, x, y, s = 1) {
  const g = G(p, { x, y, s });
  path(g, 'M-40 -14H-22L0 -34V34L-22 14H-40Z', { fill: pale(EN.sound), stroke: INK, 'stroke-width': 4 });
  for (const r of [16, 30, 44]) ink(g, `M${8 + r * .4} ${-r}Q${14 + r} 0 ${8 + r * .4} ${r}`, 4, { stroke: EN.sound });
  return g;
}
function sunDoodle(p, x, y, r = 46) {
  const g = G(p, { x, y });
  for (let i = 0; i < 12; i++) {
    const a = i * 30 * DEG;
    ink(g, `M${Math.cos(a) * (r + 10)} ${Math.sin(a) * (r + 10)}L${Math.cos(a) * (r + 30)} ${Math.sin(a) * (r + 30)}`, 4.5, { stroke: '#e0a400' });
  }
  circ(g, 0, 0, r, EN.light, 4);
  mk('circle', { cx: -r * .3, cy: -r * .12, r: r * .07, fill: INK }, g);
  mk('circle', { cx: r * .3, cy: -r * .12, r: r * .07, fill: INK }, g);
  ink(g, `M${-r * .3} ${r * .22}Q0 ${r * .48} ${r * .3} ${r * .22}`, 3.5);
  return g;
}
function speedLines(p, x, y, n = 3, len = 60, color = INK) {
  const g = G(p, { x, y });
  for (let i = 0; i < n; i++) ink(g, `M${-len - i * 10} ${(i - (n - 1) / 2) * 16}H${-12 - i * 6}`, 4, { stroke: color });
  return g;
}
function plant(p, x, y, s = 1) {
  const g = G(p, { x, y, s });
  ink(g, 'M0 0C4 -60 -6 -130 0 -200', 6, { stroke: '#3f7d1c' });
  const leaf = (d, r) => path(g, d, { fill: '#9fd356', stroke: INK, 'stroke-width': 3.5, transform: r ? `rotate(${r})` : '' });
  leaf('M0 -80C-40 -110 -90 -96 -110 -70C-70 -60 -30 -62 0 -80Z');
  leaf('M2 -130C40 -160 90 -150 108 -122C70 -110 30 -112 2 -130Z');
  leaf('M0 -196C-20 -230 -60 -238 -78 -226C-60 -200 -30 -192 0 -196Z');
  path(g, 'M-34 0H34L26 46H-26Z', { fill: '#e9925a', stroke: INK, 'stroke-width': 4 });
  return g;
}
function plate(p, x, y) {
  const g = G(p, { x, y });
  mk('ellipse', { cx: 0, cy: 0, rx: 70, ry: 16, fill: '#fff', stroke: INK, 'stroke-width': 4 }, g);
  for (const [bx, r] of [[-24, 14], [-8, 16], [8, 13]]) circ(g, bx, -18, r, '#6cb33a', 3);
  ink(g, 'M-16 -2V-12', 5, { stroke: '#3f7d1c' });
  path(g, 'M22 -6L58 -26L52 -4Z', { fill: '#ff9a3c', stroke: INK, 'stroke-width': 3 });
  return g;
}
function golfClub(p) {                                   // shaft along +y from the grip at (0, 0)
  const g = G(p);
  ink(g, 'M0 0V150', 5);
  path(g, 'M-4 146H26Q32 158 22 162H-6Z', { fill: '#9aa3ad', stroke: INK, 'stroke-width': 3.5 });
  return g;
}
function bumperCar(p, x, y, color, flip = false) {       // origin at the floor under the middle
  const g = G(p, { x, y });
  const f = mk('g', flip ? { transform: 'scale(-1 1)' } : {}, g);
  path(f, 'M-120 -30C-124 -60 -110 -96 -70 -100L40 -100C60 -100 76 -84 84 -66L120 -52C130 -48 132 -36 126 -30Z',
    { fill: color, stroke: INK, 'stroke-width': 4.5 });
  path(f, 'M-132 -34H138Q150 -34 150 -20Q150 -6 138 -6H-132Q-144 -6 -144 -20Q-144 -34 -132 -34Z', { fill: '#3a3a3a', stroke: INK, 'stroke-width': 4 });
  ink(f, 'M40 -100L60 -140', 5); ink(f, 'M46 -144L76 -134', 6);
  return g;
}
function bookcase(p, x, y, w, h, shelves) {              // top left at (x, y); shelves: y values of shelf tops
  const g = G(p);
  mk('rect', { x, y, width: w, height: h, fill: '#f0d3a6', stroke: INK, 'stroke-width': 5, rx: 4 }, g);
  for (const sy of shelves) mk('rect', { x: x + 2, y: sy, width: w - 4, height: 14, fill: '#d8a868', stroke: INK, 'stroke-width': 3.5 }, g);
  ink(g, `M${x + 16} ${y + h}V${y + h + 22}M${x + w - 16} ${y + h}V${y + h + 22}`, 6);
  return g;
}
function bookDoodle(p, x, y, w, h, color) {               // bottom middle at (x, y)
  const g = G(p, { x, y });
  mk('rect', { x: -w / 2, y: -h, width: w, height: h, fill: color, stroke: INK, 'stroke-width': 4, rx: 3 }, g);
  ink(g, `M${-w / 2 + 6} ${-h + 16}H${w / 2 - 6}M${-w / 2 + 6} ${-24}H${w / 2 - 6}`, 3);
  return g;
}
function skyscraper(p, x, top, w, base) {
  const g = G(p);
  mk('rect', { x, y: top, width: w, height: base - top, fill: '#cfd8e3', stroke: INK, 'stroke-width': 4.5 }, g);
  for (let yy = top + 26; yy < base - 40; yy += 46) for (let k = 0; k < 3; k++)
    mk('rect', { x: x + 18 + k * (w - 36) / 3, y: yy, width: (w - 36) / 3 - 14, height: 24, fill: '#8fc3ea', stroke: INK, 'stroke-width': 2.5 }, g);
  return g;
}
// The book's wavy highlighter frame around a heading.
function wavyHeading(p, str, x, y, color, { size = 64, t0 = 0 } = {}) {
  const g = G(p, { o: 0 });
  const w = handW(str.toUpperCase(), size, HEAD) + str.length * 1.5 + 70, h = size + 50;
  let d = `M${x - w / 2} ${y - h / 2 - size * .33}`;
  const k = 14, n = Math.round(w / 40);
  const top = y - h / 2 - size * .33, bot = y + h / 2 - size * .33;
  for (let i = 1; i <= n; i++) d += `Q${x - w / 2 + (i - .5) * w / n} ${top - (i % 2 ? k : -k) * .5} ${x - w / 2 + i * w / n} ${top}`;
  d += `Q${x + w / 2 + 24} ${(top + bot) / 2} ${x + w / 2} ${bot}`;
  for (let i = n - 1; i >= 0; i--) d += `Q${x - w / 2 + (i + .5) * w / n} ${bot + (i % 2 ? k : -k) * .5} ${x - w / 2 + i * w / n} ${bot}`;
  d += `Q${x - w / 2 - 24} ${(top + bot) / 2} ${x - w / 2} ${top}`;
  path(g, d, { stroke: color, 'stroke-width': 12, fill: '#fff' });
  const t = head(g, str, x, y, { size, fill: '#fff' });
  t.setAttribute('stroke', INK); t.setAttribute('stroke-width', 2.5); t.setAttribute('paint-order', 'stroke');
  show(g, t0);
  return g;
}
// A ribbon card from the book's lists: name in capitals, a short description under it.
function ribbon(p, x, y, w, name, desc, color, t0) {
  const g = G(p, { x, y, o: 0, s: .9 });
  path(g, `M${-w / 2 + 8} -48L${w / 2} -52L${w / 2 + 10} 48L${-w / 2} 52Z`, { fill: color });
  const ns = fitSize(name.toUpperCase(), w - 24, 26, HEAD);
  head(g, name, 0, -10, { size: ns });
  hand(g, desc, 0, 30, { size: fitSize(desc, w - 20, 27) });
  pop(g, t0);
  return g;
}
// A picture frame for one form of energy (circle) with a drawing inside.
function vignette(p, x, y, r, t0) {
  const g = G(p, { x, y, o: 0, s: .8 });
  circ(g, 0, 0, r, '#fff', 4.5);
  pop(g, t0);
  return g;
}

/* ---------- scene builders shared by beats ---------- */
const HILL = { x0: 360, x1: 1250, yb: 790, yt: 330, r: 26 };
const hillY = x => { const u = Math.min(1, Math.max(0, (x - HILL.x0) / (HILL.x1 - HILL.x0))); return HILL.yb - (HILL.yb - HILL.yt) * (3 * u * u - 2 * u * u * u); };
function drawHill(p) {
  let d = `M150 ${HILL.yb}L${HILL.x0} ${HILL.yb}`;
  for (let x = HILL.x0; x <= 1570; x += 20) d += `L${x} ${hillY(x).toFixed(1)}`;
  path(p, d + 'L1570 900L150 900Z', { fill: '#e4f2c9', stroke: 'none' });
  ink(p, d, 5);
  for (const x of [520, 760, 980, 1180, 1400]) ink(p, `M${x} ${hillY(x) + 40}l6 -14l6 14l6 -12`, 3, { stroke: '#7fb24a' });
}
const ballOnHill = x => { const dx = 1, s = (hillY(x + dx) - hillY(x - dx)) / (2 * dx), n = Math.hypot(1, s); return [x + s * HILL.r / n, hillY(x) - HILL.r / n]; };

/* ---------- motion helpers: everything below is a pure function of the beat time ---------- */
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, q) => a + (b - a) * q;
const lerpPose = (A, B, q) => { const o = {}; for (const k in A) o[k] = lerp(A[k], B[k] ?? A[k], q); return o; };
// Poses keyed by time [[t, pose, ease?], …]: held before the first key and after the last, eased between.
function poseAt(keys, t) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 0; i < keys.length - 1; i++) {
    const [t0, A] = keys[i], [t1, B, e = io] = keys[i + 1];
    if (t < t1) return lerpPose(A, B, e(clamp01((t - t0) / (t1 - t0))));
  }
  return keys[keys.length - 1][1];
}
// A running (or walking) pose at gait phase ph; one cycle is two steps. Drive ph from the distance covered.
function gait(ph, run = true) {
  const a = run ? 40 : 24, b0 = run ? 15 : 4, b1 = run ? 70 : 35, arm = run ? 45 : 22, fa = run ? 85 : 20;
  const leg = q => [(run ? 8 : 2) + a * Math.sin(q), -(b0 + b1 * Math.max(0, Math.cos(q)))];
  const [tf, sf] = leg(ph), [tb, sb] = leg(ph + Math.PI);
  return { lean: run ? 14 : 3, uf: 10 - arm * Math.sin(ph), ff: fa, ub: 10 + arm * Math.sin(ph), fb: fa, tf, sf, tb, sb };
}
const STRIDE = 186;   // world px per gait cycle at s = 1 (two steps)
// Hops as a function of t: from `start`, each move [t0, dur, x, y, h] jumps along an arc h high.
function hopsAt(start, moves, t) {
  let [x, y] = start;
  for (const [t0, dur, x2, y2, h = 80] of moves) {
    if (t < t0) break;
    const q = clamp01((t - t0) / dur);
    if (q < 1) return [lerp(x, x2, q), lerp(y, y2, q) - h * 4 * q * (1 - q)];
    [x, y] = [x2, y2];
  }
  return [x, y];
}
const star = (p, x, y, s = 1) => {
  const g = G(p, { x, y, s: 0, o: 0 });
  path(g, 'M0 -34L8 -10L32 -10L12 4L20 28L0 14L-20 28L-12 4L-32 -10L-8 -10Z', { fill: EN.light, stroke: INK, 'stroke-width': 3 });
  g._s = s;
  return g;
};
const flash = (g, t0, hold = .35) => { tw(g, { s: g._s, o: 1 }, t0, .15, out); tw(g, { o: 0, s: g._s * 1.3 }, t0 + hold, .3); };
const stripedBall = (p, x, y, r, fill) => { const g = ball(p, x, y, r, fill); ink(g, `M${-r} 0H${r}`, 3, { stroke: '#fff', opacity: .8 }); return g; };

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'Forms of energy', (m, D) => {
    const p = G(scene);
    S.panel = p;
    show(hand(p, 'Unit 2 · Energy', 200, 230, { size: 36, fill: COL.dim, anchor: 'start', o: 0 }), .2);
    show(hand(p, 'Chapter 5', 200, 300, { size: 44, anchor: 'start', o: 0 }), .3);
    term(p, 'Forms of', 200, 440, { size: 100, anchor: 'start', color: HL.yellow, t0: m('title') });
    term(p, 'Energy', 200, 580, { size: 130, anchor: 'start', color: HL.pink, t0: m('title', .35) });
    ground(p, 760, 960, 1480);
    const b = blip(p, { x: 1220, y: 470, s: 1.7, o: 0, form: 'light' }).live(D);
    show(b.g, m('blob', -.1), .15); tw(b.g, { y: 760 }, m('blob', -.1), .42, q => q * q); b.squash(m('blob', .32), .3, .45);
    ['chemical', 'thermal', 'sound', 'kinetic'].forEach((f, i) => { const t = m('forms', i * .7); b.hop(1220, 760, t, .5, 60); b.form(f, t + .15, .3); });
    show(hand(p, 'changes form · never disappears', 1220, 840, { size: 34, fill: COL.dim, o: 0 }), m('never'));
  }],
  ['forms', 'Many forms', (m, D) => {
    const p = panel(0);
    ground(p, 760, 520, 1080);
    const b = blip(p, { x: 800, y: 760, s: 1.5, form: 'kinetic' }).live(D, 1);
    const spots = [['heat', 330, 360, 'thermal', g => flame(g, 0, 4, 1.3)], ['sound', 620, 250, 'sound', g => speaker(g, -6, 0, 1.2)],
      ['light', 980, 250, 'light', g => sunDoodle(g, 0, 0, 34)], ['motion', 1270, 360, 'kinetic', g => { ball(g, 18, 0, 30); speedLines(g, -14, 0, 3, 50); }]];
    for (const [mark, x, y, form, drawIt] of spots) {
      const v = vignette(p, x, y, 92, m(mark));
      drawIt(v);
      hand(v, mark, 0, 140, { size: 40, fill: mix(EN[form], INK, .3) });
      b.hop(800, 760, m(mark, -.08), .4, 36).form(form, m(mark), .25).look((x - 800) / 480, -1, m(mark));

  ['kinetic', 'Kinetic energies', (m, D) => {

      ['coal', g => path(g, 'M-24 10L-16 -16L8 -24L26 -4L18 18L-8 22Z', { fill: '#2b2b2b', stroke: INK, 'stroke-width': 3 })]];
    fuels.forEach(([name, drawIt], i) => { const g = G(p, { x: 470 + i * 165, y: 780, o: 0, s: .7 }); drawIt(g); hand(g, name, 0, 66, { size: 28 }); pop(g, m('fuel', i * .45)); });

  ['count', 'Always changing', (m, D) => {

    const ang = i => -Math.PI / 2 + i * 2 * Math.PI / 9;
