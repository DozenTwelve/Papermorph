<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Little Red Riding Hood</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<script src="../lib/engine.js"></script>
<script src="../img/sets/sets.js"></script>
<script src="../img/puppets/baked.js" onerror="0"></script>
<script src="../lib/paper.js"></script>
<script src="../lib/cast.js"></script>
<script src="audio/en/timings.js"></script>
<script src="audio/en/mouths.js"></script>
<script src="audio/en/shots.js"></script>
<script>
'use strict';
const CHAPTER = { number: 1, title: 'Little Red Riding Hood', minutes: 4, language: 'en' };
// A picture book: captions are on unless the reader turned them off.
try { if (localStorage.getItem('captions') === null) setCaptions(true, false); } catch {}

// The time (beat clock) of a word: part `b` of a joined scene, `w` seconds into its clip.
const word = (scene, pre, b, w) => pre + TIMINGS[scene].parts[b] + w;

/* ---------- scene 1: home ---------- */
// The ground at the cottage door is y 790; puppets here are at scale .6 (Red about 245 px tall).
const PRE1 = 1.5, DOOR = 6.75, OUT = 7.05, LAND = 8.25;
const SC1 = t => PRE1 + TIMINGS.scene1.parts.s01b + t;   // a moment in Mother's line
const T13 = 8.9, GIVE = 9.15, REACH = 9.85, TAKE = 10.35;
const T14 = SC1(5.25), T15 = PRE1 + TIMINGS.scene1.parts.s01c - .15, SC1c = t => PRE1 + TIMINGS.scene1.parts.s01c + t;
// 1.6: Red turns round and walks off along the garden path toward the woods; the path climbs and narrows into the
// distance, so she grows smaller as she goes. Mother waves from the door. A near tree trunk wipes to scene 2.
const T16 = T15 + 1.5, TURN = T16 + .25, WALK = TURN + .4, WIPE = 23.55;
const pathY = x => 806 - .05 * (x - 560), depth = x => .62 * (1 - .32 * Math.min(1, Math.max(0, (x - 830) / 970)));
// A raised finger that wags on twos while she says the words between a and b.
const wag = (q, a, b) => q > a && q < b ? 9 * (Math.floor(q * FPS / 2) % 2 ? 1 : -1) : 0;
const tween = (q, t0, d, a, b) => a + (b - a) * span(q, t0, t0 + d);
const footY = (gy, s) => gy - 170 * s;   // hip height for feet on the ground line gy
function door(parent) {
  const g = mk('g', {}, parent);
  g.innerHTML = `<g filter="url(#paper)"><path d="M606,790 L606,476 Q675,424 744,476 L744,790 Z" fill="#8a5a32"/>
    <path d="M640,450 V790 M675,436 V790 M710,450 V790" stroke="#6e4426" stroke-width="3"/>
    <path d="M606,530 h70 M606,720 h70" stroke="#3b2a1e" stroke-width="9"/><circle cx="726" cy="630" r="7" fill="#caa24c"/></g>`;
  bakeAll(g);
  const open = [1, .7, .3, -.1, -.4, -.55];
  return q => { const k = Math.floor((q - DOOR) * FPS); tf(g, `translate(606,0) scale(${k < 0 ? 1 : open[Math.min(k, open.length - 1)]},1) translate(-606,0)`); };
}
function scene1(p, D) {
  // 1.1 from the treetops down to the cottage, then a slow push toward the door
  const cam = paperCam(p, 'home', { x: 800, y: -260, z: 1 });
  cam.to({ y: 450 }, .4, 3.2).to({ x: 690, y: 560, z: 1.45 }, 3.8, 2.8);
  // 1.2 medium on the door: it swings open and Red spins out into the garden, ending turned back toward the house
  cam.cut({ x: 745, y: 640, z: 2 }, 6.6);
  // 1.3 two-shot: Mother steps into the doorway and hands Red the basket
  cam.cut({ x: 760, y: 600, z: 1.7 }, T13);
  // 1.4 Mother close, facing us, finger raised; 1.5 Red close, nodding hard. Each is alone in her close-up.
  cam.cut({ x: 708, y: 552, z: 4.4 }, T14).soft(T14, true);
  // The reverse angle for Red's close-up: from the doorway out over the garden, so a second camera on its own set,
  // with Red drawn large in it instead of zooming.
  const out = paperCam(p, 'homeOut').soft(0, 'all'), redOut = redPuppet(out.stage);
  cam.cut({ x: 1000, y: 470, z: 1 }, T16).soft(T16, false).to({ x: 1140 }, WALK + .3, 3);
  const wipe = trunkWipe(p, WIPE, D - WIPE - .05);
  const puffs = smoke(cam.stage, 932, 84), theDoor = door(cam.stage), mom = motherPuppet(cam.stage), red = redPuppet(cam.stage);
  stopClock(D, (q, f) => {
    const reverse = q >= T15 && q < T15 + 1.5;
    vis(cam.root, !reverse); vis(out.root, reverse);
    if (reverse) {
      out.apply(q, f);
      redOut.pose({ x: 800, y: 430 + 194 * 2.88, s: 2.88, head: 'F', mouth: mouthAt('s01c', q - SC1c(0)), shut: blinking(q, [19.4]),
        nod: [.1, .45].some(t => q >= SC1c(t) && q < SC1c(t) + 2 / FPS) ? 22 : 0, rua: 4, rfa: -2 }, f);
      return;
    }
    cam.apply(q, f); puffs(q); theDoor(q); wipe(q);

    vis(mom.g, q >= T13);
    const held = q < TAKE, sm = .6;
    mom.pose({
      x: 690, y: 790 - 212 * sm, s: sm,
      ua: q < TAKE ? tween(q, GIVE, .45, 6, -45) : tween(q, TAKE + .15, .5, -45, 6),
      fa: q < TAKE ? tween(q, GIVE, .45, -6, -15) : tween(q, TAKE + .15, .5, -15, -6),
      finger: q >= T14 && q < T15, head: q >= T14 && q < T15 ? 'F' : 'P',
      rua: -28, rfa: -146 + wag(q, SC1(5.4), SC1(6.1)) + wag(q, SC1(6.7), SC1(7.9)), lua: 40, lfa: -58,
      basket: held, swing: held ? 6 * Math.exp(-(q - GIVE) * 2.5) * Math.sin((q - GIVE) * 9) * (q > GIVE) : 0,
      brow: q < T14 ? span(q, SC1(3.0), SC1(3.3)) : -.7 * span(q, SC1(6.6), SC1(6.8)), headR: q < T14 ? 4 * span(q, SC1(3.0), SC1(3.3)) : -3 * span(q, SC1(6.6), SC1(6.8)),
      mouth: mouthAt('s01b', q - SC1(0)), shut: blinking(q, [11.4, 15.6, 22.4]),
      ...(q >= TURN + .2 ? { ua: -118, fa: -30 + (Math.floor(q * FPS / 2) % 2 ? 22 : -22) } : {}),   // waving on twos
    }, f);

    vis(red.g, q >= DOOR + .25 && !(q >= T14 && q < T15));
    const u = Math.min(1, Math.max(0, (q - OUT) / (LAND - OUT))), after = Math.max(0, q - LAND), s = .6 + .02 * u;
    const settle = Math.exp(-after * 3) * Math.sin(after * 10), spinning = u > 0 && u < 1;
    const sinceTake = Math.max(0, q - TAKE), sway = 7 * Math.exp(-sinceTake * 2.2) * Math.sin(sinceTake * 8);
    if (q >= T16) {   // 1.6
      const w = walk(q - WALK, { period: .85, A: 26 }), xs = 830 + w.d * .5, sr = depth(xs), x = 830 + w.d * sr;
      const tw = Math.min(1, Math.max(0, (q - TURN) / .35)), walking = q > WALK;
      red.pose({ x, y: pathY(x) - (170 - w.drop) * sr, s: sr, turn: -Math.cos(Math.PI * tw),
        near: w.near, far: w.far, kNear: w.kNear, kFar: w.kFar, cape: walking ? 3 + 3 * Math.sin(2 * w.ph + .6) : 3,
        ua: walking ? -8 + 6 * Math.sin(w.ph) : -8, fa: -78, swing: walking ? 9 * Math.sin(w.ph - 1) : 0,
        headR: walking ? 2 * Math.sin(2 * w.ph) : 0, shut: blinking(q, [21.6]) }, f);
      return;
    }
    red.pose({
      x: 675 + 155 * ease(u), y: footY(790 + 10 * u, s) - 16 * Math.abs(Math.sin(Math.PI * 3 * u)), s,
      turn: Math.cos(Math.PI * 3 * ease(u)),                     // one and a half turns: she ends facing the door
      near: 12 * Math.sin(6 * Math.PI * u), far: -12 * Math.sin(6 * Math.PI * u),
      kNear: 22 * Math.abs(Math.sin(3 * Math.PI * u)), kFar: 14 * Math.abs(Math.sin(3 * Math.PI * u + 1)),
      cape: 3 + 30 * Math.sin(Math.PI * u) + 6 * settle,
      ua: spinning ? -8 - 62 * Math.sin(Math.PI * u) : q < TAKE ? tween(q, REACH, .4, 4 + 4 * settle, -70) : tween(q, TAKE + .05, .5, -70, -8),
      fa: spinning ? -24 : q < TAKE ? tween(q, REACH, .4, -10, -20) : tween(q, TAKE + .05, .5, -20, -78),
      basket: !held, swing: sway,
      headR: spinning ? 0 : -2 * settle - 3 * span(q, SC1(3.2), SC1(3.5)) + 3 * span(q, T15, T15 + .2), shut: blinking(q, [9.6, 13.9, 19.4]),

    }, f);
  });
}

/* ---------- sound effects ----------
   sfx(beat, at, name, vol): play audio/sfx/<name>.mp3 when the clock of beat `beat` passes `at` in normal playback
   (seeking past it does not fire it). Pausing stops them. Synthesized like the recipes of the Skill's scripts/sfx.py. */
const SFX = [], sfxOn = [];
const sfx = (beat, at, name, vol = 1) => SFX.push({ beat, at, name, vol });
let sfxLast = { i: -1, t: 0 };
function sfxTick() {
  const id = BEATS[P.i]?.id, on = P.started && P.playing && !P.waiting && !P.done;
  if (on && sfxLast.i === P.i && P.t > sfxLast.t && P.t - sfxLast.t < .5)
    for (const e of SFX) if (e.beat === id && e.at > sfxLast.t && e.at <= P.t) {
      const a = new Audio(`audio/sfx/${e.name}.mp3`); a.volume = e.vol * +(document.getElementById('volume')?.value ?? 1); a.playbackRate = P.rate || 1;
      a.play().catch(() => {}); sfxOn.push(a); a.onended = () => sfxOn.splice(sfxOn.indexOf(a), 1);
    }
  if (!on) while (sfxOn.length) sfxOn.pop().pause();
  sfxLast = { i: P.i, t: P.t };
  requestAnimationFrame(sfxTick);
}
requestAnimationFrame(sfxTick);

/* ---------- shared for scenes 2–11 ---------- */
// Beat-clock time of `t` seconds into clip `clip` of a joined scene that starts its narration `pre` s in.
const clipAt = (scene, pre, clip, t = 0) => pre + TIMINGS[scene].parts[clip] + t;
const onTwos = q => Math.floor(q * FPS / 2) % 2 ? 1 : -1;
const between = (q, a, b) => q >= a && q < b;
// Who is speaking: [clip, scene, pre] → the mouth for this frame, or 'X'.
const lips = (q, scene, pre, ...clips) => { for (const c of clips) { const m = mouthAt(c, q - clipAt(scene, pre, c)); if (m !== 'X') return m; } return 'X'; };
// The ground the path runs on in the woods, and where a puppet's hip sits for feet on it.
const WOODS = 785, hipOn = (gy, s, feet = 170) => gy - feet * s;
// A walk of a puppet from x0 to the right (dir -1: to the left), stopping cleanly after `steps` steps.
function walker(x0, s, opts = {}, dir = 1, steps = Infinity) {
  const half = (opts.period || 1) / 2;
  return tau => { const w = walk(Math.min(tau, steps * half), opts); return { ...w, x: x0 + dir * w.d * s }; };
}
const bushBackSVG = (x, y) => `<g filter="url(#paper)" transform="translate(${x},${y}) scale(.9)"><circle cx="-80" cy="-40" r="58" fill="#2f5638"/><circle cx="80" cy="-46" r="62" fill="#2f5638"/>
  <rect x="-110" y="-70" width="220" height="90" rx="30" fill="#26482f"/><circle cx="0" cy="-122" r="50" fill="#3a6844"/></g>`;
const bushFrontSVG = (x, y) => `<g filter="url(#paper)" transform="translate(${x},${y}) scale(.9)"><circle cx="-30" cy="-6" r="40" fill="#3a6844"/><circle cx="40" cy="-4" r="42" fill="#3a6844"/></g>`;
// Round eyes in the dark of a bush: open (0 … 1) and look (-1 … 1).
function bushEyes(parent, x, y) {
  const g = mk('g', {}, parent);
  const e = [-23, 23].map(dx => { const w = mk('g', { transform: `translate(${x + dx},${y})` }, g); mk('ellipse', { rx: 13.5, ry: 11.5, fill: '#fbf4e2' }, w); return [w, mk('circle', { r: 6, fill: '#22150e' }, w)]; });
  return (open, look) => { vis(g, open > 0); e.forEach(([w, p], i) => { tf(w, `translate(${x + [-23, 23][i]},${y}) scale(1,${Math.max(.05, open).toFixed(2)})`); p.setAttribute('cx', (6 * look).toFixed(1)); }); };
}
const doorLeaf = (parent, d, fill, hinge, extra = '') => { const g = prop(parent, `<g filter="url(#paper)"><path d="${d}" fill="${fill}"/>${extra}</g>`); return k => tf(g, `translate(${hinge},0) scale(${k.toFixed(2)},1) translate(${-hinge},0)`); };
// Door positions over its frames from shut (1) to open; returns the door's scale at time q for an opening at t0.
const OPENING = [1, .75, .45, .15, -.15, -.35];
const opening = (q, t0, steps = OPENING) => q < t0 ? steps[0] : steps[Math.min(steps.length - 1, Math.floor((q - t0) * FPS))];
const quiltSVG = `<g filter="url(#paper)"><path d="M736,646 C800,630 900,640 1000,628 C1100,620 1200,632 1344,640 L1350,764 L730,764 Z" fill="#b5523b"/>
  ${[0, 1, 2, 3, 4].map(i => `<rect x="${770 + i * 112}" y="${660 + (i % 2) * 34}" width="70" height="44" fill="${i % 2 ? '#e8c4a0' : '#c8704a'}"/>`).join('')}</g>`;
function roomProps(cam, order) {
  // order: puppet slots between the room's pieces, back to front. Returns the pieces' controls.
  const st = cam.stage, slot = n => mk('g', {}, st), r = {};
  r.daylight = prop(st, `<g filter="url(#paper)"><rect x="176" y="436" width="188" height="364" fill="#f6e7b8"/><rect x="176" y="690" width="188" height="110" fill="#8db35b"/></g>`);
  r.atDoor = slot();
  r.door = doorLeaf(st, 'M176,436 H364 V800 H176 Z', '#8a5a32', 176, '<path d="M220,436 V800 M270,436 V800 M320,436 V800" stroke="#6e4426" stroke-width="3"/><rect x="330" y="600" width="22" height="8" fill="#3b2a1e"/>');
  r.inWardrobe = slot();
  r.wardrobe = doorLeaf(st, 'M1790,410 H1932 V790 H1790 Z', '#8a5a32', 1790, '<circle cx="1918" cy="600" r="6" fill="#caa24c"/><path d="M1810,430 h102 v160 h-102 Z" fill="none" stroke="#6e4426" stroke-width="4"/>');
  r.inBed = slot();
  r.quilt = prop(st, quiltSVG);
  r.front = slot();
  return r;
}

/* ---------- scene 2: the woods ---------- */
const PRE2 = .9;
function scene2(p, D) {
  const EYES = PRE2 + TIMINGS.scene2.marks['s02.eyes'], BX = 1180, BY = 742;
  const cam = paperCam(p, 'forest', { x: 460, y: 470, z: 1 });
  prop(cam.stage, bushBackSVG(BX, BY)); const eyes = bushEyes(cam.stage, BX, BY - 50); prop(cam.stage, bushFrontSVG(BX, BY));
  const red = redPuppet(cam.stage), wipe = trunkWipe(p, 0, .8, 'out');
  const go = walker(300, .6, { period: .95, A: 24 });
  // 2.1 follow her along the path; 2.2 at "But someone was watching" the camera stops and pushes in on the bush
  // she has just passed; 2.3 the eyes, close, watching her go.
  cam.to({ x: t => go(t).x + 160 }, 0, .01).to({ x: BX, y: 650, z: 2.3 }, EYES, 1.3).cut({ x: BX, y: BY - 50, z: 5.5 }, EYES + 2.1);
  stopClock(D, (q, f) => {
    cam.apply(q, f); wipe(q);
    const w = go(q), s = .6;
    red.pose({ x: w.x, y: hipOn(WOODS, s) + w.drop * s, s, near: w.near, far: w.far, kNear: w.kNear, kFar: w.kFar,
      cape: 3 + 3 * Math.sin(2 * w.ph + .6), ua: -8 + 6 * Math.sin(w.ph), fa: -78, swing: 9 * Math.sin(w.ph - 1), headR: 2 * Math.sin(2 * w.ph), shut: blinking(q, [2.6]) }, f);
    const o = q < EYES + .8 ? 0 : q < EYES + .9 ? .3 : between(q, EYES + 3.4, EYES + 3.57) ? .1 : 1;
    eyes(o, q < EYES + 2.3 ? .4 : Math.min(1, .4 + (q - EYES - 2.3) * .5));
  });
}

/* ---------- scene 3: the wolf ---------- */
const PRE3 = 2.2;
function scene3(p, D) {
  const C = (c, t) => clipAt('scene3', PRE3, c, t), TX = 2250, POP = 1.5, STOP = 1.425;
  const cam = paperCam(p, 'forest', { x: 2060, y: 560, z: 1.45 });
  const wolf = wolfPuppet(cam.stage), red = redPuppet(cam.stage);
  prop(cam.stage, `<g filter="url(#paper)"><path d="M${TX - 64},800 C${TX - 50},500 ${TX - 56},200 ${TX - 40},-200 L${TX + 44},-200 C${TX + 56},200 ${TX + 50},500 ${TX + 66},800 Z" fill="#6e4a30"/>
    <path d="M${TX - 20},700 C${TX - 10},500 ${TX - 24},300 ${TX - 12},0 M${TX + 22},760 C${TX + 30},520 ${TX + 18},300 ${TX + 26},40" stroke="#5a3b24" stroke-width="6" fill="none"/></g>`);
  // 3.2 the wolf's view of her: the woods behind her, his ear and shoulder dark and close at the edge
  const rev = paperCam(p, 'forestRev').soft(0, 'all'), redRev = redPuppet(rev.stage);
  prop(rev.root, `<g filter="url(#paper)"><path d="M1290,900 C1300,700 1380,560 1480,520 L1520,380 L1560,500 C1620,520 1660,560 1680,600 L1680,900 Z" fill="#3e3a36"/></g>`);
  const go = walker(1640, .6, { period: .95, A: 24 }, 1, 3);
  cam.cut({ x: 2120, y: 520, z: 2.6 }, C('s03c', -.05)).soft(C('s03c', -.05), true);
  stopClock(D, (q, f) => {
    const reverse = between(q, C('s03b', -.05), C('s03c', -.05));
    vis(cam.root, !reverse); vis(rev.root, reverse);
    if (reverse) {
      rev.apply(q, f);
      redRev.pose({ x: 760, y: 430 + 194 * 2, s: 2, head: 'F', mouth: mouthAt('s03b', q - C('s03b')), shut: blinking(q, [C('s03b', 1.6)]),
        rua: q > C('s03b', 2.2) ? -96 : 6, rfa: q > C('s03b', 2.2) ? -10 : -4 }, f);
      return;
    }
    cam.apply(q, f);
    const w = go(q), s = .6, startle = between(q, POP + .1, POP + .1 + 2 / FPS);
    red.pose({ x: w.x - (q > POP + .1 ? 12 : 0), y: hipOn(WOODS, s) + w.drop * s - (startle ? 12 : 0), s,
      near: w.near, far: w.far, kNear: w.kNear, kFar: w.kFar, cape: 3, ua: -8, fa: -78,
      headR: q > POP + .1 ? -4 : 0, shut: blinking(q, [6.2, 12.0]), mouth: 'X' }, f);
    // the wolf hops out from behind the trunk, bows with his cap in his paw, then asks
    const hop = Math.min(1, Math.max(0, (q - POP) / .4)), land = between(q, POP + .4, POP + .4 + 2 / FPS);
    const bow = q < C('s03', 3) ? span(q, C('s03', .2), C('s03', .6)) : 1 - span(q, C('s03', 3), C('s03', 3.4));
    const aside = q >= C('s03c', -.05);
    wolf.pose({ x: TX + 10 - 150 * hop, y: hipOn(WOODS, s, 200) - 50 * Math.sin(Math.PI * hop) + (land ? 6 : 0), s, turn: -1,
      lean: 26 * bow, cap: bow > .05 ? 'hand' : 'on', ua: bow > .05 ? -20 * bow : q > C('s03', 3.4) && q < C('s03b') ? -46 : 6, fa: bow > .05 ? -125 * bow : -20,
      tail: 8 * Math.sin(q * 5), head: aside ? 'F' : 'P', mouth: lips(q, 'scene3', PRE3, 's03', 's03c'),
      rua: 40, rfa: -104 + 8 * onTwos(q), lua: -40, lfa: 104 - 8 * onTwos(q),
      brow: aside && q > C('s03c', 2.5) ? onTwos(q) : 0, look: aside && q < C('s03c', 2.3) ? -1 : 0, shut: blinking(q, [4.0, 14.8]) }, f);
  });
}

/* ---------- scene 4: flowers ---------- */
const PRE4 = .3;
function scene4(p, D) {
  const C = (c, t) => clipAt('scene4', PRE4, c, t), PICK = PRE4 + TIMINGS.scene4.marks['s04b.pick'], RUN = PRE4 + TIMINGS.scene4.marks['s04b.run'];
  const cam = paperCam(p, 'forest', { x: 2000, y: 560, z: 1.5 });
  const red = redPuppet(cam.stage), wolf = wolfPuppet(cam.stage);
  // 4.1 he sweeps a paw at the meadow and the camera follows it; 4.2 she skips into the flowers and picks;
  // 4.3 low, running with him along the path (she is a blur behind, still picking)
  cam.to({ x: 3250, y: 500, z: 1.05 }, C('s04', 2.1), 2.6);
  const RX = 2950, runner = walker(2600, .6, { L: 196, A: 26, period: .5, knee: 60 });
  cam.cut({ x: 2700, y: 620, z: 1.7 }, RUN).to({ x: t => Math.min(3600, runner(t - RUN).x + 100) }, RUN, .01);
  stopClock(D, (q, f) => {
    cam.apply(q, f);
    const s = .6, run = q >= RUN;
    if (!run) {
      const sweep = span(q, C('s04', 1.7), C('s04', 2.1));
      wolf.pose({ x: 2120, y: hipOn(WOODS, s, 200), s, turn: q < C('s04', 1.6) ? -1 : q < C('s04', 1.9) ? .2 : 1,
        lean: q < C('s04', 1.5) ? 8 * span(q, C('s04', 0), C('s04', .3)) : 0, ua: q < C('s04', 1.5) ? -50 : -60 - 50 * sweep, fa: -20,
        mouth: lips(q, 'scene4', PRE4, 's04'), tail: 8 * Math.sin(q * 5), shut: blinking(q, [1.1]) }, f);
    } else {
      const w = runner(q - RUN);
      wolf.pose({ x: w.x, y: hipOn(WOODS, s, 200) + w.drop * s - 6, s, near: w.near, far: w.far, kNear: w.kNear, kFar: w.kFar,
        lean: 28, ua: -30 + 45 * Math.sin(w.ph), fa: -40, tail: -25 + 6 * Math.sin(2 * w.ph), mouth: 'D', jaw: .5 }, f);
    }
    // Red: before the pan she stands at the bend; off-screen she runs on; in the meadow she skips in and picks
    if (q < PICK) {
      red.pose({ x: 1883, y: hipOn(WOODS, s), s, ua: -8, fa: -78, headR: -3, shut: blinking(q, [2.4]) }, f);
    } else {

  const spill = prop(R.front, `<g filter="url(#paper)">${[[-60, 4, '#d6493f'], [-30, -6, '#f6efe0'], [0, 6, '#efae48'], [30, -4, '#e88ab0'], [60, 6, '#d6493f'], [-90, 8, '#f6efe0']].map(([x, y, c]) =>
    `<rect x="${x - 14}" y="${y - 2}" width="28" height="3" fill="#4f7a34"/><circle cx="${x + 14}" cy="${y}" r="9" fill="${c}"/>`).join('')}</g>`, { transform: 'translate(720,796) scale(.7)' });
  // 9.1 he crouches on the bed and leaps; she ducks and cries for help; he sails over her, snaps the bouquet out of her
  // hands and lands face first in it; 9.2 the wardrobe rattles and
  // bursts open: Grandma and her umbrella; 9.3 wide: she runs at him and brings it down on his head; he bolts for the
  // door — 9.4 where the woodcutter steps in; 9.5 wide: Grandma one side, the woodcutter the other, the window; the leap.
  const DOOR = C('s09b', -.05), WIDE = C('s09c', -.05);
  cam.cut({ x: 1800, y: 560, z: 1.8 }, C('s09', -.7)).cut({ x: 1150, y: 500, z: 1.1 }, C('s09', .9))
    .cut({ x: 290, y: 560, z: 1.8 }, DOOR).cut({ x: 1000, y: 470, z: .95 }, WIDE).shake(CRASH, 3 / FPS, 10);
  const runner = walker(780, .6, { L: 196, A: 26, period: .5, knee: 60 }, -1, 3);
  stopClock(D, (q, f) => {
    cam.apply(q, f); R.door(-.35); win(q);
    R.wardrobe(q < C('s09', -.7) ? 1 : q < BANG ? 1 + .04 * onTwos(q) : opening(q, BANG, [1, .4, -.2, -.45, -.4]));
    const s = .6, sw = q >= WIDE;
    vis(spill, q >= LAND9);
    // the wolf
    let o;
    const leap = Math.min(1, Math.max(0, (q - .3) / .9)), crouch = span(q, 0, .25) * (1 - leap), UP = C('s09', 1.2);
    if (q < LAND9) o = { x: 1250 - 470 * ease(leap), y: 630 + 12 * crouch + 122 * leap - 80 * Math.sin(Math.PI * leap), turn: -1, lean: 20 * crouch + 40 * leap, ua: -120, fa: -30, near: -40 * Math.sin(Math.PI * leap), far: 40 * Math.sin(Math.PI * leap), tail: -30 * leap,
      mouth: leap > .3 && leap < .7 ? 'D' : 'X', jaw: leap > .3 && leap < .55 ? 1 : null };
    else if (q < UP) o = { x: 780, y: 752, turn: -1, lean: 78, shut: true, ua: -120, fa: -30 };
    else if (q < RUN) {
      const r = span(q, UP, UP + .5), hit = between(q, WHACK + .1, WHACK + .45);
      o = { x: 780, y: 752 - 72 * r - (hit ? 40 * Math.sin(Math.PI * (q - WHACK - .1) / .35) : 0), turn: -1, lean: 78 * (1 - r),
        ua: q > WHACK + .1 ? -160 : -20, fa: q > WHACK + .1 ? -30 : -10, brow: q > WHACK + .1 ? 1 : 0, ear: hit ? onTwos(q) : 0,
        shut: between(q, WHACK + .1, WHACK + .9), mouth: hit ? 'D' : 'X' };
    } else if (q < DOOR) { const w = runner(q - RUN); o = { x: w.x, y: 680 + w.drop * s, turn: -1, near: w.near, far: w.far, kNear: w.kNear, kFar: w.kFar, lean: 28, ua: -30 + 40 * Math.sin(w.ph), fa: -40, brow: 1, tail: -20 }; }
    else if (q < WIDE) {   // skids to a stop in front of the woodcutter
      const k = span(q, DOOR, DOOR + .3);
      o = { x: 470 - 40 * k + (q > DOOR + .5 ? 1.5 * onTwos(q) : 0), y: 680, turn: -1, lean: -14, near: 28 * (1 - k), far: -20 * (1 - k), ua: -100, fa: -60, brow: 1, tail: 10 };
    } else if (q < LEAP) {   // looks at Grandma, at the woodcutter, at the window; crouches
      const look = q < M9('gran') ? -1 : q < M9('wood') ? 1 - 2 * span(q, M9('wood'), M9('wood') + .12) : -1 + 2 * span(q, M9('way'), M9('way') + .12);
      const cr = span(q, LEAP - .35, LEAP - .05);
      o = { x: 430, y: 680 + 14 * cr, turn: q < M9('wood') ? -1 + 2 * span(q, M9('gran'), M9('gran') + .12) : look, lean: 22 * cr, headR: q > M9('way') + .2 ? -12 * (1 - cr) : 0,
        ua: -100 + 60 * cr, fa: -60, brow: 1, near: 20 * cr, far: 20 * cr, kNear: 40 * cr, kFar: 40 * cr, tail: 10 };
    } else { const u = Math.min(1, (q - LEAP) / .9); o = { x: 430 + 1110 * u, y: 694 - 224 * u - 300 * Math.sin(Math.PI * u), s: s * (1 - .3 * u * u), turn: 1, lean: 30, near: -30, far: 30, ua: -150, fa: -20, tail: -30, brow: 1 }; }
    vis(wolf.g, q < CRASH);
    wolf.pose({ s, cap: 'off', night: true, glasses: false, ...o }, f);
    // Red: ducks, then watches the wolf; at the crash, the window
    const duck = between(q, .45, 1.9);
    red.pose({ x: 1030, y: hipOn(800, s) + (duck ? 62 * s : 0), s, turn: q < 1.9 || q > CRASH - .3 ? 1 : -1, near: duck ? -62 : 0, far: duck ? -50 : 0, kNear: duck ? 104 : 0, kFar: duck ? 100 : 0,   // a squat
      ua: duck ? -150 : -8, fa: duck ? -40 : -78, headR: duck ? 10 : sw && q > LEAP ? -8 : 0, bouquet: q < .75 ? 7 : 0, shut: duck,
      mouth: lips(q, 'scene9', PRE9, 's09a') }, f);
    // Grandma: out of the wardrobe in a hop, across the room, the umbrella down on his head; then she shakes it at him
    vis(gran.g, q >= BANG + 1 / FPS);
    const hop = span(q, BANG, BANG + .5), run = span(q, C('s09', .9), C('s09', 1.9)), whack = span(q, WHACK, WHACK + .16);
    gran.pose({ x: 1860 - 160 * hop - 810 * run, y: 692 - 110 * Math.sin(Math.PI * hop) - (run > 0 && run < 1 ? 8 * Math.abs(Math.sin(q * 14)) : 0), s: .55,
      turn: q > CRASH - .4 ? 1 : -1, cap: false, glasses: false, umbrella: true, mouth: lips(q, 'scene9', PRE9, 's09'),
      ua: q < WHACK ? -175 : -175 + 47 * whack + (between(q, WHACK + .5, RUN) || between(q, WIDE, LEAP) ? 30 * onTwos(q) : 0), fa: -10, brow: -1 }, f);
    // the woodcutter steps into the doorway
    vis(wood.g, q >= DOOR);
    const stamp = between(q, C('s09b', 1.7), C('s09b', 1.7) + 2 / FPS);
    wood.pose({ x: 200 + 68 * span(q, DOOR, DOOR + .35), y: hipOn(800, .62, 200), s: .62, ua: -20, fa: -150, lean: q > C('s09b', 1.6) ? 8 : 0, hop: stamp ? -10 : 0, brow: -1,
      mouth: lips(q, 'scene9', PRE9, 's09b'), shut: blinking(q, [C('s09b', 2.4)]) }, f);
  });
}

/* ---------- scene 10: away into the woods ---------- */
const PRE10 = .3;
function scene10(p, D) {
  const C = (c, t) => clipAt('scene10', PRE10, c, t);
  const cam = paperCam(p, 'grandmaOut', { x: 1750, y: 470, z: 1 }, { stages: ['inside'] });
  // the window he went through: the room redrawn over the set's cross bars, the woodcutter seen only through the hole,
  // jagged glass left in the frame and a few shards on the grass below
  mk('rect', { x: 1300, y: 520, width: 160, height: 120 }, mk('clipPath', { id: 'pane10' }, cam.stage));
  const pane = mk('g', { 'clip-path': 'url(#pane10)' }, cam.stage);
  prop(pane, '<g filter="url(#paper)"><rect x="1296" y="516" width="168" height="44" fill="#6e4a30"/><rect x="1296" y="560" width="168" height="84" fill="#5a3a24"/></g>');
  const wood = woodcutterPuppet(pane);
  prop(cam.stage, `<path d="M1300,520 L1346,520 L1312,556 L1300,546 Z M1460,520 L1412,520 L1442,538 L1460,572 Z M1300,640 L1300,598 L1318,620 L1338,640 Z M1460,640 L1420,640 L1440,620 L1460,600 Z"
      fill="#e8f4f6" stroke="#ffffff" stroke-width="2" opacity=".85"/>
    <g filter="url(#paper)" fill="#6e4a30"><path d="M1376,520 h8 v22 l-5,7 l-3,-6 Z M1376,640 h8 v-24 l-4,-7 l-4,9 Z M1300,577 v7 h20 l6,-3 l-8,-4 Z M1460,577 v7 h-18 l-5,-4 l6,-3 Z"/></g>
    ${[[1312, 812, 30], [1340, 820, -20], [1371, 808, 60], [1398, 818, 10], [1430, 811, -45], [1452, 822, 80]].map(([x, y, r]) =>
      `<path d="M0,-8 L6,6 L-6,4 Z" fill="#e8f4f6" stroke="#ffffff" stroke-width="1.5" transform="translate(${x},${y}) rotate(${r}) scale(1.4)"/>`).join('')}`);
  const wolf = wolfPuppet(cam.stage), wipe = trunkWipe(p, D - .7, .65);   // time passes: to the table
  cam.to({ x: 2560, y: 640, z: 2.4 }, C('s10b', 0), 3.4);
  const backPath = x => 808 - (x - 1380) * 116 / 1620, far = x => .6 * (1 - .78 * Math.min(1, (x - 1380) / 1620));
  stopClock(D, (q, f) => {
    cam.apply(q, f); wipe(q);
    const w = walk(Math.max(0, q - .25), { L: 196, A: 28, period: .48, knee: 60 }), xs = 1420 + w.d * .3, s = far(xs), x = 1420 + w.d * s;
    wolf.pose({ x, y: backPath(x) - (200 - w.drop) * s - (q < .25 ? 20 * (1 - q / .25) : 0), s, near: w.near, far: w.far, kNear: w.kNear, kFar: w.kFar,
      lean: 26, ua: -30 + 45 * Math.sin(w.ph), fa: -40, tail: -25 + 6 * Math.sin(2 * w.ph), cap: 'off', night: true, jaw: .4 }, f);
    wood.pose({ x: 1372, y: 560 + 224 * .62, s: .62, axe: false, ua: -150, fa: -20 + 14 * onTwos(q), brow: -1, mouth: lips(q, 'scene10', PRE10, 's10'), shut: blinking(q, [C('s10b', .8)]) }, f);
  });
}

/* ---------- scene 11: cake ---------- */
const PRE11 = .8;
function scene11(p, D) {
  const C = (c, t) => clipAt('scene11', PRE11, c, t);
  const cam = paperCam(p, 'room', { x: 2475, y: 590, z: 1.75 }), st = cam.stage;
  const gran = grandmaPuppet(st), red = redPuppet(st), wood = woodcutterPuppet(st);
  prop(st, `<g filter="url(#paper)"><path d="M2262,636 L2698,636 L2712,800 L2248,800 Z" fill="#f6efe0"/><path d="M2256,700 L2704,700" stroke="#c8322f" stroke-width="10" stroke-dasharray="14 10"/></g>
    <g filter="url(#paper)"><ellipse cx="2405" cy="630" rx="42" ry="11" fill="#b5853c"/><rect x="2363" y="610" width="84" height="20" fill="#d9a85a"/><ellipse cx="2405" cy="610" rx="42" ry="11" fill="#f6efe0"/>
      <path d="M2405,610 L2447,610 L2442,620 Z" fill="#c8322f"/></g>
    <g filter="url(#paper)"><path d="M2556,632 L2560,580 Q2576,566 2592,580 L2596,632 Z" fill="#3f5f8a"/><path d="M2594,590 q16,4 6,24" stroke="#3f5f8a" stroke-width="6" fill="none"/></g>
    <g filter="url(#paper)"><rect x="2348" y="616" width="18" height="20" fill="#f6e7b8"/><rect x="2606" y="616" width="18" height="20" fill="#f6e7b8"/><rect x="2516" y="616" width="16" height="20" fill="#f6e7b8"/></g>`);
  const warm = mk('rect', { width: 1600, height: 900, fill: '#ffb050', opacity: .1 }, p), wipe = trunkWipe(p, 0, .8, 'out');
  const shut = iris(p, C('s11c', 1.0), 1.2, 805, 445), card = endCard(p, C('s11c', 2.3));
  // 11.1 the three at the table; 11.2 Red close, to us; 11.3 back out, and the iris closes on her
  cam.cut({ x: 2480, y: 535, z: 3.4 }, C('s11b', -.05)).soft(C('s11b', -.05), true).cut({ x: 2475, y: 560, z: 1.5 }, C('s11c', -.05)).soft(C('s11c', -.05), false).to({ x: 2480, y: 520, z: 1.9 }, C('s11c', .1), 2.4);
  stopClock(D, (q, f) => {
    cam.apply(q, f); wipe(q); shut(q); card(q);
    const eat = between(q, C('s11', .5), C('s11', 1.2)) || between(q, C('s11', 1.6), C('s11', 2.4));
    gran.pose({ x: 2330, y: 655, s: .55, cap: true, glasses: true, ua: eat ? -60 : 6, fa: eat ? -110 : -6, blush: span(q, C('s11', 3), C('s11', 4.2)), shut: blinking(q, [C('s11', 1.0), C('s11b', 3)]) }, f);
    red.pose({ x: 2482, y: 660, s: .6, head: 'F', basket: false, mouth: lips(q, 'scene11', PRE11, 's11b'), shut: blinking(q, [C('s11', 2.6), C('s11b', 5.6)]) || between(q, C('s11b', 5.0), C('s11b', 5.0) + 3 / FPS) }, f);
    wood.pose({ x: 2640, y: 668, s: .62, turn: -1, axe: false, mouth: between(q, C('s11', 3.0), C('s11', 4.6)) ? (onTwos(q) > 0 ? 'D' : 'C') : 'X', shut: blinking(q, [C('s11', 1.8), C('s11b', 4)]) }, f);
  });
}

/* ---------- beats: [id, title, run(m, D), extra] ---------- */
const BEATS = [
  ['scene1', 'Home', (m, D) => scene1(panel(0), D), { lead: false, pre: PRE1 }],
  ['scene2', 'Into the woods', (m, D) => scene2(panel(0), D), { lead: false, pre: PRE2 }],
  ['scene3', 'Good morning', (m, D) => scene3(panel(0), D), { lead: false, pre: PRE3 }],
  ['scene4', 'Flowers', (m, D) => scene4(panel(0), D), { lead: false, pre: PRE4 }],
  ['scene5', 'Knock, knock', (m, D) => scene5(panel(0), D), { lead: false, pre: PRE5 }],
  ['scene6', 'The wardrobe', (m, D) => scene6(panel(0), D), { lead: false, pre: PRE6 }],
  ['scene7', 'The open door', (m, D) => scene7(panel(0), D), { lead: false, pre: PRE7 }],
  ['scene8', 'What big ears', (m, D) => scene8(panel(0), D), { lead: false, pre: PRE8 }],
  ['scene9', 'Out!', (m, D) => scene9(panel(0), D), { lead: false, pre: PRE9 }],
  ['scene10', 'Away', (m, D) => scene10(panel(0), D), { lead: false, pre: PRE10 }],
  ['scene11', 'Cake', (m, D) => scene11(panel(0), D), { lead: false, pre: PRE11 }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));
// The music is the Three Little Pigs' score (Lyria), reused.
/* ---------- background music ---------- */
// One track per part of the story, following the picture: its position is the time since the part began, so
// pausing, seeking and changing beats keep it in step. Tracks crossfade at part changes; the music sits lower while
// someone is speaking, and follows the player's volume.
const BGM = [['m1-home', ['scene1', 'scene2']], ['m2-wolf', ['scene3', 'scene4', 'scene5']], ['m3-chimney', ['scene6', 'scene7', 'scene8', 'scene9']], ['m4-ending', ['scene10', 'scene11']]]
  .map(([n, beats]) => ({ n, beats, a: Object.assign(new Audio(`audio/bgm/${n}.mp3`), { preload: 'auto', loop: true, volume: 0 }), v: 0 }));
const beatLen = id => { const b = BEATS.find(x => x.id === id); return (b.pre || 0) + TIMINGS[id].dur + .6; };
let lastTick = performance.now();
function bgmTick(now) {
  const dt = Math.min(.1, (now - lastTick) / 1000); lastTick = now;
  const id = BEATS[P.i]?.id, on = P.started && P.playing && !P.waiting && !P.done;
  const speaking = P.audio && !P.audio.paused && !P.audio.ended;
  const master = +(document.getElementById('volume')?.value ?? 1) * (speaking ? .16 : .3);
  for (const m of BGM) {
    const k = m.beats.indexOf(id), current = on && k >= 0;
    m.v = Math.max(0, Math.min(1, m.v + (current ? 1 : -1) * dt / .8));   // 0.8 s fades
    m.a.volume = m.v * master;
    if (current) {
      const want = (m.beats.slice(0, k).reduce((s, b) => s + beatLen(b), 0) + P.t) % (m.a.duration || 1e9);
      if (Math.abs(m.a.currentTime - want) > .5) m.a.currentTime = want;
      if (m.a.paused) m.a.play().catch(() => {});
    } else if (m.v === 0 && !m.a.paused) m.a.pause();
  }
  if (!on && !P.done) for (const m of BGM) m.a.pause();   // paused: silence at once (at the end it fades out)
  requestAnimationFrame(bgmTick);
}
requestAnimationFrame(bgmTick);
paperWarm(g => { redPuppet(g); motherPuppet(g); wolfPuppet(g); grandmaPuppet(g); woodcutterPuppet(g); door(g); smoke(g, 0, 0); });
boot();
