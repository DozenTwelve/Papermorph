// chapter practice. Notes and storyboard intents: books/science/chapters/ch11.md.

const Q_CARD = { x: 96, y: 586, w: 1408, cls: 'band' };   // a band card under the scenes; it moves up by itself when taller

Object.assign(PH_SPR, { building: [16, 31], feather: [10, 4], duck: [12, 10], stone: [9, 6] });   // books/science/images/ch11.py
const ground = (p, y = GY, x = 0, w = 1600) => { phBlock(p, x, y, w, 70, PH.grass, { top: 8, ol: 0 }); mk('rect', { x, y: y + 70, width: w, height: 6, fill: PH.grass, opacity: .5 }, p); };
const marks = (p, y, x0, x1) => { for (let x = x0; x < x1; x += 140) mk('rect', { x, y: y + 18, width: 24, height: 8, fill: lt(PH.grass, .2) }, p); };
const AIR = '#9fd3e6';      // air resistance and buoyant force are forces too (orange); this tint is for air streaks only
const SKY = '#0c1418';      // deep space
const POLE_N = '#d9534f', POLE_S = '#4a7fc1';
const G_PX = 1400;          // gravity in px/s² for quick everyday drops (apple, notebook scenes)

/* ---------- shared pictures ---------- */
// The same shapes as ch10: a thought bubble over a head, a part title, and a three-row summary with small pictures.
function thought(p, [x0, y0, x1, y1], x, lines, t0) {
  const q = G(p, { o: 0 });
  mk('rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: 40, fill: '#22322d', stroke: COL.dim, 'stroke-width': 3 }, q);
  path(q, `M${x - 30} ${y1 - 2}L${x + 30} ${y1 - 2}L${x} ${y1 + 66}Z`, { fill: COL.dim });
  lines.forEach((s, i) => T(q, s, { x: (x0 + x1) / 2, y: y0 + 70 + i * 56, size: 42, anchor: 'middle' }));
  show(q, t0); return q;
}
function opener(p, x, y, part, name, name2) {
  const g = G(p, { o: 0, y: 24 });
  phLabel(g, part.toUpperCase(), { x, y: y - 80, size: 30, fill: COL.dim, weight: 600 }); phLabel(g, name, { x, y, size: 80, weight: 600 });
  if (name2) phLabel(g, name2, { x, y: y + 86, size: 80, weight: 600 });
  tw(g, { o: 1, y: 0 }, .2, 1.1, out); return g;
}
function summary(p, m, rows, next) {
  rows.forEach(([lines, icon], i) => {
    const g = G(p, { x: -16, y: 250 + i * 220, o: 0 });
    lines.forEach((s, j) => T(g, s, { x: 430, y: j * 50, size: 38, weight: 600 }));
    icon(g); tw(g, { o: 1, x: 0 }, m(['w1', 'w2', 'w3'][i]), .6);

  txt(p, next, 800, 860, m('end'), { size: 32, fill: COL.dim, weight: 500 });
}
// Deep space: a dark field with fixed pixel stars.
function space(p, n = 80, seed = 1) {
  mk('rect', { x: 0, y: 0, width: 1600, height: 900, fill: SKY }, p);
  let d = '';
  for (let i = 0; i < n; i++) { const k = 2 + Math.round(3 * phHash(i, seed + 3)); d += `M${Math.round(1600 * phHash(i, seed))} ${Math.round(900 * phHash(i, seed + 1))}h${k}v${k}h${-k}Z`; }
  path(p, d, { fill: COL.chalk, opacity: .55 });
}
// A pixel disc (rock, moon, planet) of radius r in cells of c px: lit from the top left, a few craters. One path per
// colour keeps it cheap. lump > 0 makes an uneven rock.
function pixDisc(p, r, { c = 10, base = '#8d8a80', craters = 0, seed = 1, lump = 0, o = {} } = {}) {
  const g = G(p, o), ds = { [lt(base, .25)]: '', [base]: '', [dk(base, .3)]: '', [dk(base, .5)]: '' }, ks = Object.keys(ds);
  const cr = Array.from({ length: craters }, (_, i) => [(phHash(i, seed) - .5) * 1.2 * r, (phHash(i, seed + 1) - .5) * 1.2 * r, r * (.1 + .12 * phHash(i, seed + 2))]);
  for (let y = -r; y < r; y += c) for (let x = -r; x < r; x += c) {
    const cx = x + c / 2, cy = y + c / 2, a = Math.atan2(cy, cx), rr = r * (1 + lump * (.12 * Math.sin(3 * a + seed) + .08 * Math.sin(5 * a + 2 * seed)));
    if (Math.hypot(cx, cy) > rr) continue;
    const lit = (-cx - cy) / (r * 1.4), hole = cr.some(([hx, hy, hr]) => Math.hypot(cx - hx, cy - hy) < hr);
    const k = hole ? 3 : lit > .35 ? 0 : lit > -.35 ? 1 : 2;
    ds[ks[k]] += `M${x} ${y}h${c}v${c}h${-c}Z`;
  }
  ks.forEach(col => { if (ds[col]) path(g, ds[col], { fill: col }); });
  return g;
}
// A hanging spring scale marked in newtons, its top hook at (x, y0). set(F) stretches it to F newtons; it returns the
// y of the bottom hook. ppn: px of stretch per newton.
function springScale(p, { x, y0, max = 100, every = 10, ppn = 2, label = 'N' }) {
  const g = G(p), H = max * ppn + 90, top = y0 + 30;
  path(g, `M${x} ${y0}V${top}`, { stroke: COL.dim, 'stroke-width': 6 });
  phBlock(g, x - 40, top, 80, H, '#c8ccc4', { top: 6, right: 8, ol: 2.5 });
  mk('rect', { x: x - 14, y: top + 14, width: 28, height: H - 28, fill: '#e9ebe4' }, g);
  for (let v = 0; v <= max; v += every) {
    const yy = top + 40 + v * ppn;
    path(g, `M${x - 36} ${yy}H${x - 18}`, { stroke: PH.out, 'stroke-width': 2.5 });
    if (v % (every * 2) === 0) T(g, String(v), { x: x - 50, y: yy + 8, size: 22, fill: COL.chalk, anchor: 'end', weight: 600 });
  }
  T(g, label, { x: x - 50, y: top + 10, size: 22, fill: COL.dim, anchor: 'end', weight: 600 });
  const spring = path(g, '', { stroke: '#6a7570', 'stroke-width': 4, fill: 'none' }), ptr = path(g, '', { stroke: COL.bad, 'stroke-width': 5 });
  const rod = path(g, '', { stroke: '#6a7570', 'stroke-width': 6 }), hook = path(g, '', { stroke: '#6a7570', 'stroke-width': 5, fill: 'none' });
  return Object.assign(g, {
    set(F) {
      const yp = top + 40 + F * ppn, z = 8;
      let d = `M${x} ${top + 14}`;
      for (let i = 1; i <= z; i++) d += `L${x + (i % 2 ? 10 : -10)} ${top + 14 + (yp - top - 14) * (i - .5) / z}`;
      spring.setAttribute('d', d + `L${x} ${yp}`); ptr.setAttribute('d', `M${x - 34} ${yp}H${x + 34}`);
      const yb = top + H + 40 + F * ppn;
      rod.setAttribute('d', `M${x} ${yp}V${yb - 16}`); hook.setAttribute('d', `M${x} ${yb - 16}v10a10 10 0 1 1 -10 10`);
      return yb + 10;
    },

}
// A thrown or dropped ball (SVG, so it can be any size): a plain coloured disc with a highlight.
function ballEl(p, r, fill = '#e07a2e') { const g = G(p); mk('circle', { r, fill, ...phLine(2) }, g); mk('circle', { cx: -r * .35, cy: -r * .35, r: r * .25, fill: '#fff', opacity: .45 }, g); return g; }
// Fixed-step integration (deterministic, so pause and seek show the same frame): returns state(t) by interpolation.
function integrate(step, s0, T0, T1, dt = 1 / 240) {
  const out = [s0.slice()]; let s = s0.slice();
  for (let t = T0; t < T1; t += dt) { s = step(s, t, dt); out.push(s.slice()); }
  return t => { const k = Math.max(0, Math.min(out.length - 1.001, (t - T0) / dt)), i = Math.floor(k), f = k - i; return out[i].map((v, j) => v + (out[i + 1][j] - v) * f); };
}

// A table top at y from x0 to x1 (legs down to the floor y1); returns the top y.
function table(p, y, x0, x1, y1) {
  phBlock(p, x0, y, x1 - x0, 26, '#a87a4f', { top: 6, ol: 0 });
  [x0 + 30, x1 - 60].forEach(x => phBlock(p, x, y + 26, 30, y1 - y - 26, '#7d5737', { top: 0, ol: 0 }));
  return y;
}
// A closed notebook seen from the side (bottom centre at the origin).
function notebook(p) { const g = G(p); phBlock(g, -150, -50, 300, 50, '#c0504d', { top: 0, ol: 2.5 }); mk('rect', { x: -144, y: -40, width: 288, height: 26, fill: '#f4f1e8' }, g); return g; }
// Something shoved to speed v0 at t0 that slows at a (px/s²) until it stops: x(t) and v(t) from x0.
function slider(x0, v0, a, t0) {
  const T1 = v0 / a;
  return { a, x: t => { const u = Math.min(Math.max(0, t - t0), T1); return x0 + v0 * u - a * u * u / 2; }, v: t => { const u = t - t0; return u > 0 && u < T1 ? v0 - a * u : 0; } };
}

// A bar magnet centred on the origin, 260 × 70; poles 'SN' = south on the left, north on the right.
function magnet(p, poles = 'SN') {
  const g = G(p);
  [...poles].forEach((k, i) => { phBlock(g, -130 + i * 130, -35, 130, 70, k === 'N' ? POLE_N : POLE_S, { top: 8, ol: 2.5 }); phLabel(g, k, { x: -65 + i * 130, y: 14, size: 40 }); });
  return g;
}
// A paper clip lying flat (origin at its middle).
function clip(p) { const g = G(p); path(g, 'M-22 -6H18A6 6 0 0 1 18 6H-16A4 4 0 0 1 -16 -2H12', { stroke: '#c3ccce', 'stroke-width': 3.5, fill: 'none' }); return g; }
const HAIR_C = '#3e4751';

// A ball whirled on a string, seen from above, around you at (cx, cy): w.at(t) draws the frame. The ball keeps the
// same speed; its velocity (yellow) is tangent; the string's pull (orange, from t = pull) points to the centre. After
// release it flies on along the tangent at the same speed.
function whirl(p, cx, cy, R, P, { release = Infinity, pull = Infinity } = {}) {
  const W = 2 * Math.PI / P, you = phTop(p, 'you_top', { x: cx, y: cy, s: 3.2 }), str = path(p, '', { stroke: COL.chalk, 'stroke-width': 3 });
  const ball = ballEl(p, 24), v = forceArrow(p, { color: VEL, w: 12, size: 30 }), f = forceArrow(p, { w: 14, size: 30 }), trail = path(p, '', { stroke: COL.chalk, 'stroke-width': 3, 'stroke-dasharray': '10 10', opacity: .6 });
  mk('circle', { cx, cy, r: R, fill: 'none', stroke: COL.faint, 'stroke-width': 2, 'stroke-dasharray': '4 10' }, p);
  p.appendChild(str); p.appendChild(you); p.appendChild(ball); p.appendChild(v); p.appendChild(f);
  return { at(t) {
    const tt = Math.min(t, release), q = W * tt, x0 = cx + R * Math.cos(q), y0 = cy + R * Math.sin(q), ux = -Math.sin(q), uy = Math.cos(q), u = Math.max(0, t - release);
    const x = x0 + W * R * ux * u, y = y0 + W * R * uy * u;
    put(ball, { x, y }); put(you, { r: q * 57.3 });
    const hx = cx + 40 * Math.cos(q), hy = cy + 40 * Math.sin(q);
    str.setAttribute('d', u > 0 ? `M${hx} ${hy}l${(R - 60) * .5 * Math.cos(q + .5)} ${(R - 60) * .5 * Math.sin(q + .5)}` : `M${hx} ${hy}L${x} ${y}`);
    trail.setAttribute('d', u > 0 ? `M${x0} ${y0}L${x} ${y}` : '');
    v.set(x + 30 * ux, y + 30 * uy, 120, Math.atan2(uy, ux) * 57.3, '');
    f.set(x - 30 * Math.cos(q), y - 30 * Math.sin(q), t > pull && u === 0 ? 110 : 0, q * 57.3 + 180, t > pull + 3 ? '' : 'string pull', [-ux, -uy]);   // label trails behind, away from the velocity arrow
  } };
}
// A tub of water seen from the side, centred on x, water surface at y, w wide, depth d.
function tubScene(p, x, y, w, d) {
  const g = G(p);
  mk('rect', { x: x - w / 2, y, width: w, height: d, fill: '#3f7fb0', opacity: .6 }, g);
  path(g, `M${x - w / 2} ${y}H${x + w / 2}`, { stroke: '#9fd3e6', 'stroke-width': 4 });
  path(g, `M${x - w / 2 - 8} ${y - 60}V${y + d + 8}H${x + w / 2 + 8}V${y - 60}`, { stroke: '#c3ccce', 'stroke-width': 12, fill: 'none' });
  // call front() after adding what floats in it: a see-through layer of water over their underwater parts
  g.front = () => { const e = mk('rect', { x: x - w / 2, y, width: w, height: d, fill: '#3f7fb0', opacity: .45 }, p); return e; };
  return g;
}
let PRACTICE;   // the practice beat's panel: its question pictures are drawn there
const PICS = {
  'p-grav': g => { pixDisc(g, 60, { seed: 2, lump: 1, o: { x: 560, y: 760 } }); pixDisc(g, 60, { seed: 7, lump: 1, o: { x: 1040, y: 760 } }); forceArrow(g, { w: 12 }).set(620, 740, 120, 0, ''); forceArrow(g, { w: 12 }).set(980, 780, 120, 180, ''); },
  'p-bowl': g => { const b = G(g, { x: 620, y: 760 }); mk('circle', { r: 70, fill: '#22282a', ...phLine(2) }, b); phBall(g, 70, { x: 980, y: 760 }); },
  'p-dist': g => { pixDisc(g, 50, { seed: 2, lump: 1, o: { x: 400, y: 760 } }); pixDisc(g, 50, { seed: 7, lump: 1, o: { x: 1200, y: 760 } }); path(g, 'M470 840H1130', { stroke: COL.dim, 'stroke-width': 4, 'stroke-dasharray': '10 8' }); },
  'p-cart': g => { phBlock(g, 300, 840, 1000, 12, PH.walk, { top: 0, ol: 0 }); phSprite(g, 'cart', { x: 800, y: 840, s: 2 }); forceArrow(g, { w: 12 }).set(760, 830, 90, 180, ''); },
  'p-feather': g => { phSprite(g, 'feather', { x: 800, y: 770, s: 3 }); forceArrow(g, { w: 12 }).set(720, 760, 80, -90, ''); forceArrow(g, { w: 12 }).set(880, 770, 80, 90, ''); },
  'p-term': g => { phActor(g, 'you', { x: 800, y: 860, s: 1.4, anim: 'jump' }); forceArrow(g, { w: 12 }).set(720, 760, 80, 90, ''); forceArrow(g, { w: 12 }).set(880, 760, 80, -90, ''); },
  'p-like': g => { const a = magnet(g, 'SN'), b = magnet(g, 'NS'); put(a, { x: 600, y: 780 }); put(b, { x: 1000, y: 780 }); forceArrow(g, { w: 12 }).set(600, 720, 90, 180, ''); forceArrow(g, { w: 12 }).set(1000, 720, 90, 0, ''); },
  'p-cent': g => { mk('circle', { cx: 800, cy: 760, r: 90, fill: 'none', stroke: COL.faint, 'stroke-width': 3 }, g); put(ballEl(g, 18), { x: 890, y: 760 }); forceArrow(g, { w: 10 }).set(866, 760, 56, 180, ''); },
  'p-boat': g => { tubScene(g, 800, 780, 500, 90); phSprite(g, 'duck', { x: 800, y: 820, s: 1.6 }); },
  'p-dog': g => { tubScene(g, 800, 780, 500, 90); phSprite(g, 'duck', { x: 800, y: 820, s: 1.6 }); },
};
const withPics = qs => qs.map(q => ({ ...q, build(body, api) { const old = PRACTICE.querySelector('.pic'); if (old) old.remove(); const g = G(PRACTICE); g.classList.add('pic'); PICS[q.id]?.(g); return q.build(body, api); } }));

/* ---------- beats ---------- */
const BEATS = [
/* ---------- part 1: gravity and weight ---------- */
['intro', 'Gravity, friction, and more forces', (m, D) => {
  const p = panel(0), Y = Y1, tq = m('q'), tf = 1.1;
  // An apple drops from the tree into your hands: gravity acts on it the whole time (the hands push up once it rests).
  ground(p, Y);
  const a = phActor(p, 'you', { x: 470, y: Y, s: 3, anim: 'catch' }), [hx, hy] = a.hand('F');
  phSprite(p, 'tree', { x: hx - 250, y: Y + 2, s: 4.6 });   // a big tree behind you; its canopy reaches over your hands
  p.appendChild(a);                                              // you in front of the trunk
  const ap = phSprite(p, 'apple', { s: 1.6 }), x = hx + 22, top = Y - 300, rest = hy + 6, tl = tf + Math.sqrt(2 * (rest - top) / G_PX);

  clockRun(t => {

  phLabel(ttl, 'Gravity, Friction,', { x: 1150, y: 420, size: 76 }); phLabel(ttl, 'and More Forces', { x: 1150, y: 500, size: 76 });
  tw(ttl, { o: 1, y: 0 }, .3, 1.1, out);

}, { lead: false }],
['gravity', 'Gravity', (m, D) => {
  const p = panel(0), tp = m('pull'), tn = m('never'), tc = m('close'), Y = 520, d0 = 900, R0 = 100;
  // Two equal rocks start at rest and pull each other together: each feels the same pull, growing as 1/d².

  const run = K => integrate(([d, v], t, dt) => { const a = t < tp ? 0 : -K / (d * d); return [d + v * dt, v + a * dt]; }, [d0, 0], 0, D);

['strength', 'Mass and distance', (m, D) => {
  const p = panel(0), ts = m('small'), tb = m('big'), tf = m('far'), V = 350, cy = 470;
  // Two panels with the same rock speed and the same miss distance: a small moon on the left bends the path a little,
