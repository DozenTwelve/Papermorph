'use strict';
// Chapter 17, one page in book order of ideas: part 1 (turbines, fossil fuels and their limits, nuclear), part 2
// (renewable resources: water, tides, wind), part 3 (sun, earth's heat, biomass), then the chapter practice.
// Energy blocks keep the book's colours (kinetic yellow, potential blue, chemical lime, heat red, light pale gold) and
// electric energy is ch16's electron blue; water blue, steam white, smoke grey. Every turbine, stream and electron
// moves whenever it is on screen. Notes, storyboard and errata: books/science/chapters/ch17.md.
const CHAPTER = { number: 17, label: 9, title: 'Electrical Energy Sources', minutes: 12, language: 'en' };
const Q_CARD = { x: 96, y: 586, w: 1408, cls: 'band' };   // a band card under the scenes
const Y1 = 740;                                           // ground line
const sm = (t, a, b) => io(ramp(t, a, b));
const lerp = (a, b, k) => a + (b - a) * k;
const ELE = CHG_N, EARTH = '#3b3229', GRASS = '#3f6a4c', ENAMEL = '#e4e0d4', BOX = '#16221f', HOTW = '#f4a493';
const say = (p, s, x, y, t0, o = {}) => { const e = phLabel(p, s, { x, y, size: 32, ...o, o: 0 }); show(e, t0); return e; };
const line = (p, parts, x, y, t0, o = {}) => { const e = runs(p, parts, { x, y, size: 40, ...o }); show(e, t0); return e; };
const frameBox = (p, x, y, w, h, fill = BOX, stroke = COL.faint) => mk('rect', { x, y, width: w, height: h, rx: 18, fill, stroke, 'stroke-width': 3 }, p);
const spinAt = (t, keys) => phaseOf(t, keys);             // a rotor's angle (rad) from [time, rad/s] keys
// Outdoor ground from y down: earth with a grass band on top.
const outdoors = (p, y = Y1, x = -2000, w = 8000, h = 1600) => { phBlock(p, x, y, w, h, EARTH, { top: 0, ol: 0 }); phBlock(p, x, y, w, 14, GRASS, { top: 0, ol: 0 }); };
// A block's place along a route at distance s (clamped at the ends).
const onRoute = (b, R, s) => { const [x, y] = R.at(s); put(b, { x, y }); return [x, y]; };

/* ---------- shared pictures ---------- */
// The same shapes as ch10–16: a part title and a three-row summary with small pictures.
function opener(p, x, y, part, name, name2) {
  const g = G(p, { o: 0, y: 24 });
  phLabel(g, part.toUpperCase(), { x, y: y - 80, size: 30, fill: COL.dim, weight: 600 }); phLabel(g, name, { x, y, size: 80, weight: 600 });
  if (name2) phLabel(g, name2, { x, y: y + 86, size: 80, weight: 600 });
  tw(g, { o: 1, y: 0 }, .2, 1.1, out); return g;
}
function summary(p, m, rows, next) {
  rows.forEach(([lines, icon], i) => {
    const g = G(p, { x: -16, y: 250 + i * 220, o: 0 });
    lines.forEach((s, j) => T(g, s, { x: 430, y: j * 50, size: 38, weight: 600 }));
    icon(g); tw(g, { o: 1, x: 0 }, m(['w1', 'w2', 'w3'][i]), .6);
  });
  txt(p, next, 800, 860, m('end'), { size: 32, fill: COL.dim, weight: 500 });
}
// A floor lamp standing at (x, y) (as in ch15–16); g.glow is its light cone, g.shade its shade.
function floorLamp(p, x, y = Y1) {
  const g = G(p, { x, y });
  const glow_ = path(g, 'M-50 -350L-210 0H210L50 -350Z', { fill: LIGHT, 'fill-opacity': .16 }); put(glow_, { o: 0 });
  phBlock(g, -40, -14, 80, 14, '#4a5458', { top: 3 }); phBlock(g, -5, -350, 10, 336, '#7d8a86', { top: 0 });
  const shade = path(g, 'M-50 -350L-80 -420H80L50 -350Z', { fill: '#d8c79a', ...phLine() });
  return Object.assign(g, { glow: glow_, shade });
}
// The radiation sign: three black blades on yellow, centred on (x, y).
function trefoil(p, { x = 0, y = 0, r = 30, bg = '#f3c95c', fg = '#1b1f1d' } = {}) {
  const g = G(p, { x, y }); mk('circle', { r: r * 1.22, fill: bg, ...phLine(2) }, g);
  let d = '';
  for (let k = 0; k < 3; k++) {
    const a0 = (-120 + k * 120) * Math.PI / 180, a1 = (-60 + k * 120) * Math.PI / 180, r0 = r * .3;
    const P = (rr, a) => `${(rr * Math.cos(a)).toFixed(1)} ${(rr * Math.sin(a)).toFixed(1)}`;
    d += `M${P(r0, a0)}L${P(r, a0)}A${r} ${r} 0 0 1 ${P(r, a1)}L${P(r0, a1)}A${r0} ${r0} 0 0 0 ${P(r0, a0)}Z`;
  }
  path(g, d, { fill: fg }); mk('circle', { r: r * .18, fill: fg }, g);
  return g;
}
// A uranium nucleus: protons (red) and neutrons (grey) packed in a disc, in two halves (g.L, g.R) that can fly apart.
function nucleus(p, { x = 0, y = 0, n = 34, r = 19, s = 1, o = 1 } = {}) {
  const g = G(p, { x, y, s, o }), L = G(g), R = G(g);
  for (let i = 0; i < n; i++) {
    const a = i * 2.39996, d = r * 1.05 * Math.sqrt(i + .5), bx = d * Math.cos(a), by = d * Math.sin(a);
    mk('circle', { cx: bx.toFixed(1), cy: by.toFixed(1), r, fill: i % 2 ? '#9aa5a8' : CHG_P, ...phLine(2) }, bx < 0 ? L : R);
  }
  return Object.assign(g, { L, R });
}
// A small tree that grows: g.set(k) scales it from a sprout (0) to a young tree (1).
function sapling(p, x, y) {
  const g = G(p, { x, y }), t = phSprite(g, 'tree', { s: .2 });
  return Object.assign(g, { set(k) { put(t, { s: .2 + .5 * k }); return g; } }).set(0);
}

// The coal power plant (fossil beat and q1), standing on y 500: the boiler, the steam pipe, the turbine and generator,
// the line out to a house. f.set(t, {heat, steam, a, el, lit}) draws a moment.
function fossilPlant(p) {
  const g = G(p);
  mk('rect', { x: 600, y: 150, width: 650, height: 350, rx: 10, fill: '#22302b', stroke: COL.faint, 'stroke-width': 3 }, g);
  phBlock(g, 560, 40, 44, 460, '#7a6d62', { top: 6 });
  const smoke = puffs(g, 582, 40, { color: SMOKE, rise: 140, drift: 90, r0: 14, r1: 46 });
  const b = boiler(g, { x: 730, y: 500, w: 200, fh: 110, th: 140 });
  const sp = pipeFlow(g, route([b.out, [b.out[0], 190], [870, 190], [870, 330], [918, 330]]), { w: 18, color: STEAM, dash: [22, 20] });
  const tg = turbineGen(g, { x: 960, y: 330, s: .8, R: 70, L: 110, gap: 40, GW: 150 });
  const wR = route([tg.term, [tg.term[0], 200], [1250, 200]]); wire(g, wR, { w: 6 }); const wf = eFlow(g, wR, { gap: 40, r: 6 });
  const py = pylon(g, { x: 1340, y: 500, h: 230 });
  const pl = powerLine(g, [[1250, 200], py.top, [1452, 430]]);
  const house = litHouse(g, { x: 1515, y: 500 });
  return Object.assign(g, {
    b, sp, tg, house, smoke, wf, pl,
    set(t, { heat = 1, steam = 1, a = 0, el = 0, lit = 1, smk = 1 } = {}) {
      b.set(t, heat); sp.set(110 * t, steam); tg.set(a); wf.set(el); pl.set(el); house.set(lit); smoke.set(t, smk);
      return g;
    },
  });
}

// The hydroelectric dam in cross-section (hydro beat and q2): lake, dam, the pipe to the turbine pit, the river and
// the line out to a house. d.set(t, {L, flow, a, el, lit, out}) draws a moment; L is the lake's level (y).
function damScene(p) {
  const g = G(p);
  path(g, 'M-40 190L0 190L210 690L556 711V900H-40Z', { fill: EARTH, ...phLine() });
  path(g, 'M-40 190H0L210 690', { stroke: GRASS, 'stroke-width': 10, fill: 'none' });
  outdoors(g, Y1 + 20, 700, 1000, 300);
  mk('rect', { x: 788, y: 590, width: 196, height: 320, fill: '#24302c', ...phLine() }, g);   // the turbine pit, cut away
  const inflow = pipeFlow(g, route([[-30, 236], [60, 330], [120, 420], [170, 560]]), { w: 16, walls: false, dash: [20, 18] });
  const lake = path(g, '', { fill: WATER, ...phLine(2) }), rip = path(g, '', { stroke: lt(WATER, .5), 'stroke-width': 4, fill: 'none', 'stroke-linecap': 'round' });
  path(g, 'M556 226H648L792 790H556Z', { fill: '#a7adaa', ...phLine() });
  const pipe = pipeFlow(g, route([[546, 650], [760, 776], [838, 815]]), { w: 22 });
  const river = G(g); mk('rect', { x: 950, y: 828, width: 700, height: 80, fill: WATER }, river);
  const rw = windLines(river, { x0: 940, x1: 1750, y0: 842, y1: 890, n: 9, len: 70, color: lt(WATER, .5) });
  const tg = turbineGen(g, { x: 885, y: 815, s: .72, r: -90, R: 66, L: 96, rows: 2, gap: 34, GW: 150 });
  const outS = pipeFlow(g, route([[905, 852], [960, 868], [1010, 862]]), { w: 18, walls: false, dash: [18, 16] });
  const wR = route([tg.term, [796, tg.term[1]], [796, 560]]); wire(g, wR, { w: 6 }); const wf = eFlow(g, wR, { gap: 40, r: 6 });
  const p1 = pylon(g, { x: 1110, y: Y1 + 20, h: 230 }), p2 = pylon(g, { x: 1360, y: Y1 + 20, h: 230 });
  const pl = powerLine(g, [[796, 560], p1.top, p2.top, [1462, 690]]);
  const house = litHouse(g, { x: 1525, y: Y1 + 20 });
  const lakeAt = L => { const xL = 210 * (L - 190) / 500; return `M${xL.toFixed(1)} ${L.toFixed(1)}H556V711L210 690Z`; };
  return Object.assign(g, {
    lake, pipe, river, tg, house, lakeAt,
    set(t, { L = 300, flow = 1, a = 0, el = 0, lit = 1, out = 1, inK = 1 } = {}) {
      thAtt(lake, 'd', lakeAt(L));
      const xL = 210 * (L - 190) / 500; let d = '';
      for (let x = xL + 30 + ((t * 30) % 60); x < 540; x += 60) d += `M${x.toFixed(1)} ${(L + 12).toFixed(1)}q10 -7 20 0t20 0`;
      thAtt(rip, 'd', d);
      inflow.set(120 * t, inK); pipe.set(240 * t, flow); outS.set(160 * t, out); rw.set(70 * t);
      tg.set(a); wf.set(el); pl.set(el); house.set(lit);
      return g;
    },
  });
}

// The geothermal plant in cross-section (geo beat and q3): hot rock and magma below, the production well, the turbine,
// the cooling tower, the injection well and the house. s.set(t, {well, steam, a, el, lit, cool, inj}).
function geoScene(p) {
  const g = G(p);
  outdoors(g, 330, -400, 2400, 900);
  path(g, 'M-400 470H2000M-400 590H2000', { stroke: '#2e2620', 'stroke-width': 6 });
  const hot = G(g); mk('rect', { x: -400, y: 640, width: 2400, height: 300, fill: MAGMA, opacity: .16 }, hot); mk('rect', { x: -400, y: 750, width: 2400, height: 200, fill: MAGMA, opacity: .2 }, hot);
  const magma = mk('ellipse', { cx: 250, cy: 880, rx: 230, ry: 70, fill: MAGMA, ...phLine() }, g);
  const heat = [90, 200, 640, 1180, 1420, 1560].map((x, i) => riseLines(g, x, 860, { n: 3, h: 30 }));
  const well = pipeFlow(g, route([[480, 760], [480, 330]]), { w: 22, color: HOTW, dash: [22, 20] });
  const steamP = pipeFlow(g, route([[480, 330], [480, 240], [682, 240]]), { w: 20, color: STEAM, dash: [22, 20] });
  const tg = turbineGen(g, { x: 720, y: 240, s: .7, R: 70, L: 110, gap: 40, GW: 150 });
  const exh = pipeFlow(g, route([[720, 280], [720, 306], [1064, 306]]), { w: 16, color: STEAM, dash: [20, 18] });
  const tower = coolingTower(g, { x: 1150, y: 330, h: 230, w: 200 });
  const pf = puffs(g, 1150, 100, { rise: 90, drift: 30, r0: 16, r1: 44, per: 2.6 });
  const drops = path(g, '', { fill: lt(WATER, .3) });
  const inj = pipeFlow(g, route([[1236, 318], [1320, 318], [1320, 760]]), { w: 22, color: WATER, dash: [22, 20] });
  const loop = path(g, 'M1320 790C1100 830 700 830 480 790', { stroke: lt(WATER, .4), 'stroke-width': 5, fill: 'none', 'stroke-dasharray': '16 14' }, { d: 0 });
  const wR = route([tg.term, [tg.term[0], 66], [1412, 66], [1412, 262]]); wire(g, wR, { w: 6 }); const wf = eFlow(g, wR, { gap: 40, r: 6 });
  const house = litHouse(g, { x: 1480, y: 330 });
  return Object.assign(g, {
    tg, tower, inj, well, magma, house, loop,
    set(t, { wellK = 1, steamK = 1, a = 0, el = 0, lit = 1, coolK = 1, injK = 1 } = {}) {
      heat.forEach((h, i) => { const q = ((t * .35 + i * .27) % 1); put(h, { y: 900 - 220 * q, o: Math.min(1, q * 5, (1 - q) * 3) }); });
      well.set(130 * t, wellK); steamP.set(130 * t, steamK); exh.set(110 * t, coolK); inj.set(120 * t, injK);
      tg.set(a); wf.set(el); house.set(lit); pf.set(t, coolK);
      let d = '';
      if (coolK > .05) for (let i = 0; i < 8; i++) { const q = ((t * .8 + i / 8) % 1), x = 1110 + 80 * phHash(i, 2), y = 170 + 130 * q; d += `M${x.toFixed(1)} ${(y - 9).toFixed(1)}q6 9 0 13q-6 -4 0 -13Z`; }
      thAtt(drops, 'd', d);
      return g;
    },
  });
}

}, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

let PRACTICE;   // the practice beat's panel: its question pictures are drawn there
const PICS = {
  'p-fossil': g => { phBlock(g, 780, 740, 36, 130, '#7a6d62', { top: 5 }); [[800, 720, 22], [830, 690, 30], [870, 660, 36]].forEach(([x, y, r]) => mk('circle', { cx: x, cy: y, r, fill: SMOKE, opacity: .7 }, g)); },
  'p-nuc': g => { phBlock(g, 776, 760, 48, 70, '#e0c040', { top: 4 }); trefoil(g, { x: 800, y: 795, r: 14 }); },
  'p-turb': g => { turbineGen(g, { x: 740, y: 810, s: .45, R: 70, L: 100, gap: 30, GW: 140 }).set(.6); },
  'p-which': g => { solarPanel(g, { x: 800, y: 810, w: 180, h: 70 }); },
  'p-solar': g => { solarPanel(g, { x: 730, y: 810, w: 120, h: 50 }); path(g, 'M840 790h40l-30 20h40l-30 20h40', { stroke: WATER, 'stroke-width': 7, fill: 'none' }); },
  'p-uran': g => { nucleus(g, { x: 800, y: 810, s: .5 }); },
  'p-hydro': g => { path(g, 'M700 760H770V860H700Z', { fill: WATER }); path(g, 'M770 750H800L840 860H770Z', { fill: '#a7adaa', ...phLine(2) }); path(g, 'M800 850H900', { stroke: WATER, 'stroke-width': 10 }); },
  'p-geo': g => { phBlock(g, 700, 780, 200, 90, EARTH, { top: 0 }); mk('rect', { x: 700, y: 830, width: 200, height: 40, fill: MAGMA, opacity: .5 }, g); path(g, 'M760 840V740', { stroke: '#9aa5a8', 'stroke-width': 8 }); },
  'p-bio': g => { campfire(g, { x: 800, y: 860, s: .7 }); },
};
const withPics = qs => qs.map(q => ({ ...q, build(body, api) { const old = PRACTICE.querySelector('.pic'); if (old) old.remove(); const g = G(PRACTICE, { x: 800, y: 870, s: 1.8 }); g.classList.add('pic'); PICS[q.id]?.(G(g, { x: -800, y: -870 })); return q.build(body, api); } }));

boot();
</script>
