<script>
'use strict';
const CHAPTER = { number: 19, label: 10, title: 'The Sun-Earth-Moon System', minutes: 14, language: 'en' };

/* ---------- chapter helpers ---------- */
const at = (e, o, t) => tw(e, o, t, 0);                       // a cut: e takes state o at time t
const call = (t, f) => prog(q => { if (q === 1) f(); }, t, 0, lin);
const TILT = 23.44;
const deg = d => d * Math.PI / 180;
const clamp01 = v => Math.max(0, Math.min(1, v));
const lerp = (a, b, q) => a + (b - a) * q;
// Piecewise motion through keyframes [[t, v], …]: held before the first and after the last; ease per segment.
function keyf(t, keys, ease = lin) {
  if (t <= keys[0][0]) return keys[0][1];
  for (let i = 1; i < keys.length; i++) if (t <= keys[i][0]) {
    const [t0, v0] = keys[i - 1], [t1, v1] = keys[i];
    return lerp(v0, v1, ease(clamp01((t - t0) / Math.max(1e-6, t1 - t0))));
  }
  return keys[keys.length - 1][1];
}
// Screen angle (degrees) from (x, y) toward (sx, sy): where the light comes from.
const toward = (x, y, sx, sy) => Math.atan2(sy - y, sx - x) * 180 / Math.PI;
// Keep e in the back layer while it is behind (far side of an orbit), in the front layer otherwise.
function depth(e, behind, front) { let cur; return far => { const L = far ? behind : front; if (L !== cur) { L.appendChild(e); cur = L; } }; }
// Blinks for the cast, every few seconds; a wagging tail for the dog.
function alive(D, kidG, dogG, seed = 0) {
  clockRun(t => {
    if (kidG) kidG.blink(((t + seed) % 3.7) < .13);
    if (dogG) { dogG.blink(((t + seed + 1.6) % 4.3) < .13); if (!dogG._still) dogG.wag(t); }
  }, D);
}
// Section heading in the notebook's green, top left.
function heading(p, str, t0 = .2) { const h = pen(p, str, { x: 56, y: 76, size: 44, fill: INK.def }); show(h, t0); return h; }
// A handwritten label shown at t0.
function lab(p, str, x, y, t0, o = {}) { const e = pen(p, str, { x, y, size: 32, ...o }); show(e, t0, .4); return e; }
function hlAt(p, str, x, y, t0, o = {}) { return hlIn(hl(p, str, { x, y, size: 40, o: 0, ...o }), t0); }
function lead(p, x1, y1, x2, y2, t0, color = INK.note) { const e = path(p, `M${x1} ${y1}L${x2} ${y2}`, { stroke: color, 'stroke-width': 2.5, 'stroke-opacity': .8 }, { d: 0 }); draw(e, t0, .4); return e; }
const setText = (g, str) => { const t = g.firstChild; if (t.textContent !== str) t.textContent = str; };
// A small moon disc for top-down diagrams, lit from the sun on the left.
const moonDot = (p, x, y, r = 34, o = 1) => globe(p, { x, y, r, kind: '#c9c6bd', light: 180, night: .9, rim: false, o });

// Evening on a hill above the sea: sky, a setting sun and a rising moon behind the land, a tree for the seasons.
function dusk(p) {
  const g = G(p), id = 'dusk' + (++spaceN);
  const gr = mk('linearGradient', { id, x1: 0, y1: 0, x2: 0, y2: 1 }, mk('defs', {}, g));
  [[0, '#18204a'], [.55, '#5b3f74'], [.8, '#e0805a'], [1, '#f4b26a']].forEach(([k, c]) => mk('stop', { offset: k, 'stop-color': c }, gr));
  mk('rect', { width: 1600, height: 700, fill: `url(#${id})` }, g);
  const dim = put(mk('rect', { width: 1600, height: 700, fill: '#0b1226' }, g), { o: 0 });
  const sky = G(g);
  const sun = sunBody(sky, { x: 1290, y: 600, r: 52, glow: 3 });
  const moon = globe(sky, { x: 170, y: 720, r: 40, kind: 'moon', light: 0, c: 1, rim: false });
  const sea = G(g);
  mk('rect', { x: 0, y: 650, width: 1600, height: 250, fill: '#2d4f78' }, sea);
  path(sea, 'M0 650H1600', { stroke: '#f4b26a', 'stroke-width': 2, 'stroke-opacity': .6 });
  path(g, 'M820 900C960 790 1080 760 1600 742V900Z', { fill: '#cdb07c', stroke: 'none' });
  const water = path(g, 'M1010 900C1120 820 1250 790 1600 778H1720V960H1010Z', { fill: '#3d6b98', stroke: 'none', 'fill-opacity': .92 });
  path(g, 'M0 690C180 600 420 560 620 600C780 632 880 760 960 900H0Z', { fill: '#24402f', stroke: 'none' });
  const tree = G(g, { x: 250, y: 616 });
  path(tree, 'M0 0V-90M0 -50L-26 -78M0 -64L22 -92', { stroke: '#4a3426', 'stroke-width': 12 });
  const leaves = mk('circle', { cx: 0, cy: -110, r: 58, fill: '#4f9a52' }, tree);
  return { g, sun, moon, water, tree, leaves, dim };
}

// The orbit with Earth at the solstices and equinoxes (June left, September in front, December right, March behind),
// axes all parallel; the ones in dim are faded.
function fourSeasons(p, D, dim) {
  const C = [800, 480], RX = 560, RY = 220, E = {};
  orbit(p, ...C, RX, RY);
  sunBody(p, { x: C[0], y: C[1], r: 80 });
  const pos = { jun: [180, 0, 0], sep: [270, -90, -.6], dec: [0, 180, 0], mar: [90, 90, .6] };
  for (const [k, [a, light, c]] of Object.entries(pos)) {
    const [x, y] = orbitAt(...C, RX, RY, a);
    E[k] = globe(p, { x, y, r: 62, light, c, tilt: TILT, o: dim.includes(k) ? .35 : 1 }); put(E[k].axis, { o: 1 });
  }
  clockRun(t => Object.values(E).forEach(e => e.spin(30 * t)), D);
  return E;
}

/* ---------- beats: [id, title, run(m, D), { ask }?] ---------- */
const BEATS = [
  ['intro', 'The Sun-Earth-Moon System', (m, D) => {
    const p = panel(0); spaceBg(p, { seed: 3 });
    const C = [250, 610], RX = 640, RY = 110;
    const behind = G(p); orbit(p, C[0], C[1], RX, RY, { o: .6 });
    sunBody(p, { x: 250, y: 600, r: 150 });
    const front = G(p);
    const e = globe(front, { r: 70 }), mo = globe(front, { r: 20, kind: 'moon' }), moDepth = depth(mo, behind, front);
    clockRun(t => {
      const [x, y] = orbitAt(...C, RX, RY, -26 + 3 * t);
      put(e, { x, y }); e.spin(40 + 30 * t).light(toward(x, y, ...C));
      const a = 40 * t, mx = x + 110 * Math.cos(deg(a)), my = y - 34 * Math.sin(deg(a));
      put(mo, { x: mx, y: my }); mo.light(toward(mx, my, ...C)); moDepth(Math.sin(deg(a)) > 0);
    }, D);
    const t = G(p, { o: 0, y: 20 });
    pen(t, 'Outer space · Chapter 10', { x: 800, y: 170, size: 34, fill: INK.blue, anchor: 'middle', o: 1 });
    pen(t, 'The Sun-Earth-Moon System', { x: 800, y: 270, size: 92, fill: INK.note, anchor: 'middle', o: 1 });
    const ul = path(t, 'M380 302Q800 286 1220 300', { stroke: INK.hl, 'stroke-width': 8 }, { d: 0 });
    tw(t, { o: 1, y: 0 }, .2, 1, out); draw(ul, .9, .7);
    lab(p, 'three bodies, always moving', 800, 380, m('sub'), { anchor: 'middle', fill: INK.hl, size: 38 });
  }],
  ['daily', 'Every day in the sky', (m, D) => {
    const p = panel(0), d = dusk(p);
    const k = kid(p, { x: 600, y: 600, s: .8, pose: 'stand' }), dg = dog(p, { x: 700, y: 606, s: .8 });
    alive(D, k, dg);
    // sunset: the sun sinks behind the sea and the sky dims with it
    tw(d.sun, { y: 700 }, m('set') - .6, 3.4, io); tw(d.dim, { o: .35 }, m('set') - .6, 4);
    prog(q => k.pose('stand', 'point', q), m('set') - .4, .5);
    lab(p, 'sunset', 1290, 560, m('set', .4), { anchor: 'middle' });
    // moonrise on the other side: kid and dog turn to it
    call(m('rise') - .45, () => { k.face(-1); dg.face(-1); });
    prog(q => k.pose('point', 'pointUp', q), m('rise') - .4, .6);
    tw(d.moon, { y: 330 }, m('rise') - .5, 3.2, out);
    lab(p, 'moonrise', 170, 260, m('rise', .8), { anchor: 'middle' });
    // the tide creeps up the beach
    call(m('tide') - .4, () => { k.face(1); dg.face(1); });
    prog(q => k.pose('pointUp', 'stand', q), m('tide') - .4, .5);
    tw(d.water, { y: -42, x: -90 }, m('tide') - .3, 4.5, soft);
    lab(p, 'the tide comes in', 1330, 860, m('tide', .6), { anchor: 'middle' });
    // a year passes on the tree
    const cols = ['#4f9a52', '#d9822b', '#e8eef5', '#7cc76f'];
    prog(q => { const u = q * 3, i = Math.min(2, Math.floor(u)); d.leaves.setAttribute('fill', mix(cols[i], cols[i + 1], u - i)); }, m('seas') - .2, 4, lin);
    lab(p, 'seasons', 250, 440, m('seas'), { anchor: 'middle' });
    const all = G(p, { o: 0, y: -16 }); tw(all, { o: 1, y: 0 }, m('all'), .6, out);
    mk('rect', { x: 330, y: 40, width: 940, height: 92, rx: 20, fill: INK.paper, 'fill-opacity': .95 }, all);
    pen(all, 'all from the sun, Earth & moon moving together', { x: 800, y: 100, size: 40, fill: INK.ink, anchor: 'middle', o: 1 });
  }],
  ['shape', 'A slightly squashed sphere', (m, D) => {
    const p = panel(0); spaceBg(p, { seed: 11 }); heading(p, 'The EARTH');
    const sqg = G(p), e = globe(sqg, { x: 600, y: 470, r: 270, kind: 'earthBig', light: 180, c: .9, night: .6 });
    prog(q => sqg.setAttribute('transform', `translate(600 470) scale(${1 + .06 * q} ${1 - .08 * q}) translate(-600 -470)`), m('sq'), 1.4);
    lab(p, 'SPHERE', 600, 150, .4, { anchor: 'middle', fill: INK.blue, size: 44 });
    lab(p, '(squash exaggerated!)', 600, 800, m('sq', .9), { anchor: 'middle', fill: INK.hl, size: 28 });
    // the kid walks in and spins a ball of dough on one finger; it flattens into a crust
    const k = kid(p, { x: 1700, y: 860, s: 1.1, face: -1 }), t0 = m('dough') - 1.9, t1 = m('dough') - .2;
    alive(D, k, null);
    clockRun(t => { const x = keyf(t, [[t0, 1700], [t1, 1240]]); put(k, { x }); if (t < t1) k.walk(1700 - x); }, D);
    prog(q => k.pose('stand', 'pointUp', q), t1, .5);
    const dough = G(k.prop, { y: -24, o: 0 }), dz = mk('g', {}, dough);
    mk('ellipse', { rx: 110, ry: 20, fill: '#efd9a8' }, dz); mk('ellipse', { rx: 92, ry: 13, fill: '#f6e6c2' }, dz);
    const streak = path(dough, 'M-70 -34A90 26 0 0 0 70 -34', { stroke: INK.note, 'stroke-width': 3, 'stroke-dasharray': '10 10' });
    show(dough, t1 + .3, .3);
    prog(q => { dz.setAttribute('transform', `scale(${.5 + .5 * q} ${1.9 - .9 * q})`); streak.setAttribute('stroke-dashoffset', -q * 200); }, t1 + .3, 3.2, out);
    lab(p, 'spinning dough spreads out', 1250, 330, m('dough', 1), { anchor: 'middle' });
    const eq = G(p), eqL = path(eq, 'M330 470H870', { stroke: INK.blue, 'stroke-width': 5 }, { d: 0 }); draw(eqL, m('eq'), .8);
    lab(eq, 'equator: 12,756 km', 600, 455, m('eq', .5), { anchor: 'middle', fill: INK.blue, size: 36 });
    const pl = G(p), plL = path(pl, 'M600 200V740', { stroke: INK.pink, 'stroke-width': 5 }, { d: 0 }); draw(plL, m('pole'), .8);
    const plT = G(pl, { o: 0 }); show(plT, m('pole', .5));
    pen(plT, 'pole to pole:\n12,713 km', { x: 900, y: 150, size: 34, fill: INK.pink, o: 1 });
    path(plT, 'M890 170L620 200', { stroke: INK.pink, 'stroke-width': 2.5 });
    lab(p, 'only 0.3% different —\ntoo small to see!', 900, 640, m('tiny'), { fill: INK.hl, size: 34 });
  }],
  ['magnet', 'Earth is a magnet', (m, D) => {
    const p = panel(0); spaceBg(p, { seed: 12 }); heading(p, 'The EARTH');
    const C = [700, 480], R = 200;
    const field = G(p, { x: C[0], y: C[1], r: -10 }), lines = [];
    [1.35, 1.8, 2.5, 3.6].forEach(L => [1, -1].forEach(sd => {
      const pts = []; for (let a = 8; a <= 172; a += 4) { const th = deg(a), r = L * R * Math.sin(th) ** 2; if (r >= R * .98) pts.push([sd * r * Math.sin(th), -r * Math.cos(th)]); }
      if (pts.length > 1) lines.push(path(field, 'M' + pts.map(q => q.map(v => v.toFixed(1)).join(' ')).join('L'), { stroke: INK.blue, 'stroke-width': 3, 'stroke-opacity': .75 }, { d: 0 }));
    }));
    lines.forEach((l, i) => draw(l, m('field') + i * .12, 1.1));
    globe(p, { x: C[0], y: C[1], r: R, kind: 'earthBig', light: 180, c: .9, night: .5 });
    const core = G(p, { x: C[0], y: C[1], o: 0, s: .6 });
    mk('circle', { r: 110, fill: '#e07a3a', 'fill-opacity': .92 }, core); mk('circle', { r: 50, fill: '#ffd36b' }, core);
    pen(core, 'liquid iron\nouter core', { x: 0, y: -60, size: 28, fill: INK.ink, anchor: 'middle', o: 1 });
    // the core churns: its glow pulses while the narration describes it
    tw(core, { o: 1, s: 1 }, .5, .7, back);
    prog(q => put(core.children[0], { s: 1 + .03 * Math.sin(q * 40) }), .5, 5, lin);
    hide(core, m('field'), .6);
    lab(p, 'magnetic field', 1020, 200, m('field', .6), { fill: INK.blue });
    // the compass needle swings and settles pointing north
    const cp = G(p, { x: 1320, y: 620, o: 0, s: .7 }); pop(cp, m('comp') - .3);
    mk('circle', { r: 120, fill: INK.paper, stroke: '#8a6f55', 'stroke-width': 10 }, cp);
    pen(cp, 'N', { y: -78, size: 36, fill: INK.ink, anchor: 'middle', o: 1 });
    const nd = G(cp);
    path(nd, 'M0 -90L14 0L0 0Z', { fill: '#e5533d', stroke: 'none' }); path(nd, 'M0 90L-14 0L0 0Z', { fill: '#9aa3b5', stroke: 'none' });
    path(nd, 'M0 -90L-14 0L0 0Z', { fill: '#c43f2c', stroke: 'none' }); path(nd, 'M0 90L14 0L0 0Z', { fill: '#7b8396', stroke: 'none' });
    mk('circle', { r: 8, fill: INK.ink }, cp);
    clockRun(t => { const u = Math.max(0, t - m('comp')); put(nd, { r: t < m('comp') ? 75 : 75 * Math.exp(-1.3 * u) * Math.cos(4.2 * u) }); }, D);
    lab(p, 'compass', 1320, 790, m('comp', .4), { anchor: 'middle' });
    const gn = G(p, { o: 0 }); show(gn, m('off'));
    mk('circle', { cx: C[0], cy: C[1] - R, r: 9, fill: INK.note }, gn);
    pen(gn, 'geographic North Pole', { x: C[0] + 70, y: C[1] - R - 70, size: 28, o: 1 });
    path(gn, `M${C[0] + 6} ${C[1] - R - 8}L${C[0] + 66} ${C[1] - R - 62}`, { stroke: INK.note, 'stroke-width': 2.5 });
    const mn = G(p, { o: 0 }); show(mn, m('off', 1.2));
    const mx = C[0] - R * Math.sin(deg(10)), my = C[1] - R * Math.cos(deg(10));
    const md = G(mn, { x: mx, y: my }); mk('circle', { r: 9, fill: '#e5533d' }, md);
    pen(mn, 'magnetic north', { x: mx - 70, y: my - 70, size: 28, fill: '#ff8f7a', anchor: 'end', o: 1 });
    path(mn, `M${mx - 6} ${my - 8}L${mx - 66} ${my - 62}`, { stroke: '#ff8f7a', 'stroke-width': 2.5 });
    // it wanders: the dot drifts a little, leaving a dotted trail
    const trail = path(mn, `M${mx} ${my}Q${mx + 14} ${my - 6} ${mx + 26} ${my + 2}`, { stroke: '#ff8f7a', 'stroke-width': 3, 'stroke-dasharray': '3 6' }, { d: 0 });
    draw(trail, m('drift'), 2.4, lin); prog(q => put(md, { x: mx + 26 * q, y: my - 6 * Math.sin(q * Math.PI) + 2 * q }), m('drift'), 2.4, lin);
    lab(p, 'it drifts a little every year', 220, 820, m('drift'), { fill: INK.hl });
  }],
  ['rotate', 'Rotation', (m, D) => {
    const p = panel(0); spaceBg(p, { seed: 13 }); heading(p, "Earth's Motion");
    const e = globe(p, { x: 800, y: 470, r: 220, light: 180, c: .6 }), T0 = m('day');
    // a slow spin, then one whole turn while the clock counts a day
    const turn = t => 12 * t + 360 * soft(clamp01((t - T0) / 4));
    const hrs = lab(p, '', 1230, 760, T0, { fill: INK.hl, size: 44 });
    clockRun(t => { e.spin(turn(t)); setText(hrs, t < T0 ? '' : `${Math.round(24 * soft(clamp01((t - T0) / 4)))} h`); }, D);
    tw(e.axis, { o: 1 }, m('axis') - .3, .5);
    lab(p, 'axis', 830, 160, m('axis', .2), { size: 36 });
    lab(p, 'N', 770, 196, m('axis', .2), { size: 36, fill: INK.hl }); lab(p, 'S', 770, 790, m('axis', .2), { size: 36, fill: INK.hl });
    draw(spinArrow(p, 800, 470, 290, 200, 340, { ry: 70, color: INK.hl, w: 6 }), m('rot'), .8);
    hlAt(p, 'ROTATION', 1260, 260, m('rot'));
    lab(p, '1 turn ≈ 24 hours\n= 1 day', 1170, 600, m('day'), { fill: INK.blue, size: 40 });
  }],
  ['daynight', 'Day and night', (m, D) => {
    const p = panel(0); spaceBg(p, { seed: 14 });
    sunBody(p, { x: -120, y: 450, r: 220 });
    raysOn(sunRays(p, { x0: 140, x1: 560, y0: 250, y1: 650, n: 5 }), m('lit') - .3);
    const e = globe(p, { x: 900, y: 450, r: 240, kind: 'pole', light: 180, night: .82 });
    lab(p, 'seen from above the North Pole', 900, 120, .4, { anchor: 'middle', fill: INK.dim });
    lab(p, 'DAY', 640, 260, m('lit'), { size: 40, fill: INK.hl }); lab(p, 'NIGHT', 1180, 260, m('lit'), { size: 40, fill: INK.blue });
    // the kid stands on the turning Earth: midnight on the right, morning at the top, noon facing the sun, evening below
    const pin = G(p, { x: 900, y: 450 }), me = G(pin, { y: -240 }), k = kid(me, { s: .32 });
    const spin = t => keyf(t, [[0, 50], [m('ride'), 90], [m('noon'), 180], [m('eve'), 270], [D, 330]]);
    clockRun(t => { const a = spin(t); e.spin(a); put(pin, { r: 90 - a }); }, D);
    alive(D, k, null);
    lab(p, 'morning', 1060, 200, m('ride')); lab(p, 'noon', 560, 530, m('noon'), { anchor: 'end' });
    lab(p, 'evening', 900, 740, m('eve'), { anchor: 'middle' });
    draw(spinArrow(p, 900, 450, 290, 60, 120, { color: INK.hl }), m('ride'));
    // from the ground: the sun seems to cross the sky from east to west
    const box = G(p, { o: 0 }); show(box, m('sky') - .2);
    mk('rect', { x: 1150, y: 540, width: 420, height: 300, rx: 18, fill: '#2f4f86', stroke: INK.note, 'stroke-width': 3 }, box);
    path(box, 'M1190 760Q1360 560 1530 760', { stroke: INK.hl, 'stroke-width': 3, 'stroke-dasharray': '8 8' });
    const bs = G(box); mk('circle', { r: 22, fill: SKY.sun }, bs);
    mk('rect', { x: 1150, y: 760, width: 420, height: 80, fill: '#24402f' }, box);
    kid(box, { x: 1360, y: 790, s: .18, pose: 'lookUp' });
    pen(box, 'E', { x: 1170, y: 805, size: 30, o: 1 }); pen(box, 'W', { x: 1535, y: 805, size: 30, o: 1 });
    pen(box, 'what we see from the ground', { x: 1360, y: 580, size: 26, anchor: 'middle', fill: INK.note, o: 1 });
    clockRun(t => { const u = clamp01((t - m('sky')) / 5.5); put(bs, { x: (1 - u) ** 2 * 1190 + 2 * u * (1 - u) * 1360 + u * u * 1530, y: (1 - u) ** 2 * 760 + 2 * u * (1 - u) * 560 + u * u * 760 }); }, D);
    lab(p, "the sun isn't moving — we are!", 1360, 880, m('us'), { anchor: 'middle', fill: INK.hl });
  }],
  ['revolve', 'Revolution', (m, D) => {
    const p = panel(0); spaceBg(p, { seed: 15 });
    const C = [800, 470], RX = 600, RY = 230;
    const o = put(orbit(p, ...C, RX, RY), { o: 0 }); show(o, m('orb') - .3);
    const behind = G(p); sunBody(p, { x: C[0], y: C[1], r: 90 }); const front = G(p);
    const e = globe(front, { r: 50 }), dz = depth(e, behind, front), T0 = m('rev'), T1 = D - .4;
    const day = lab(p, '', 1250, 800, T0, { fill: INK.blue, size: 40 });
    clockRun(t => {
      const a = 250 + 360 * soft(clamp01((t - T0) / (T1 - T0))), [x, y] = orbitAt(...C, RX, RY, a);
      put(e, { x, y, s: 1 + .3 * (y - C[1]) / RY }); e.spin(40 * t).light(toward(x, y, ...C)); dz(y < C[1]);
      setText(day, t < T0 ? '' : `day ${Math.round(365.25 * soft(clamp01((t - T0) / (T1 - T0))))}`);
    }, D);
    hlAt(p, 'REVOLUTION', 800, 140, m('rev'));
    lab(p, 'ORBIT', 1290, 330, m('orb'), { size: 40, fill: INK.blue });
    lab(p, '1 revolution = 365¼ days = 1 year', 800, 880, m('year'), { anchor: 'middle', size: 40, fill: INK.hl });
  }],
  ['leap', 'Leap years', (m, D) => {

    lab(p, 'LOW TIDE', E[0], E[1] + R + 70, m('lo', .3), { anchor: 'middle', fill: INK.note, size: 34 });
    lab(p, 'moon', 1460, 560, .5, { anchor: 'middle' });
  }],
  ['tideday', 'Two tides a day', (m, D) => {
    const p = panel(0); spaceBg(p, { seed: 51 }); heading(p, 'TIDES');
    const E = [480, 470], R = 170;
    mk('ellipse', { cx: E[0], cy: E[1], rx: R + 60, ry: R - 4, fill: '#6fb7ff', 'fill-opacity': .55 }, p);
    const e = globe(p, { x: E[0], y: E[1], r: R, kind: 'pole', night: 0, rim: false });
    pen(p, 'moon →', { x: 830, y: 470, size: 34, o: 1 });
    // Earth turns under the bulges; our beach (the pin) turns with it. psi: degrees turned since high tide,
    // 15 degrees per hour; the water level there goes as cos(2 psi): high facing toward or away from the moon.
    const pin = G(p, { x: E[0], y: E[1] }); mk('circle', { cx: R + 4, r: 12, fill: '#e5533d', stroke: INK.note, 'stroke-width': 3 }, pin);
    const psi = t => keyf(t, [[m('beach'), 0], [m('h1'), 0], [m('l1'), 90], [m('h2'), 180], [m('l2'), 270], [m('two') + 2, 360]]);
    lab(p, 'our beach', E[0] + R + 30, E[1] + 50, m('beach'), { fill: '#ff8f7a' });
    const B = [1000, 640, 520, 300];
    const gb = G(p, { o: 0 }); show(gb, m('beach'));
    path(gb, `M${B[0]} ${B[1]}H${B[0] + B[2]}M${B[0]} ${B[1]}V${B[1] - B[3]}`, { stroke: INK.note, 'stroke-width': 3 });
    pen(gb, 'water level at our beach', { x: B[0], y: B[1] - B[3] - 20, size: 28, o: 1 });
    [['0 h', 0], ['6 h', .25], ['12 h', .5], ['18 h', .75], ['24 h', 1]].forEach(([s, k]) => pen(gb, s, { x: B[0] + B[2] * k, y: B[1] + 40, size: 24, anchor: 'middle', o: 1 }));
    const lvl = a => B[1] - B[3] / 2 - B[3] * .36 * Math.cos(deg(2 * a));
    const curve = path(gb, '', { stroke: '#6fb7ff', 'stroke-width': 5 }), dot = G(gb); mk('circle', { r: 9, fill: '#ff8f7a' }, dot);
    clockRun(t => {
      const a = psi(t); e.spin(a); put(pin, { r: -a });
      const pts = []; for (let k = 0; k <= Math.ceil(a / 6); k++) { const b = Math.min(a, k * 6); pts.push(`${(B[0] + B[2] * b / 360).toFixed(1)} ${lvl(b).toFixed(1)}`); }
      curve.setAttribute('d', 'M' + pts.join('L')); put(dot, { x: B[0] + B[2] * a / 360, y: lvl(a) });
    }, D);
    [['h1', 'high'], ['l1', 'low'], ['h2', 'high'], ['l2', 'low']].forEach(([k, s], i) =>
      lab(gb, s, B[0] + B[2] * i / 4, (s === 'high' ? lvl(0) - 20 : lvl(90) + 40), m(k), { anchor: 'middle', size: 26, fill: s === 'high' ? INK.blue : INK.note }));
    lab(p, '2 high + 2 low tides a day\nabout 6 hours apart', 1000, 160, m('two'), { fill: INK.hl, size: 36 });
  }],
  ['spring', 'Spring and neap tides', (m, D) => {
    const p = panel(0); spaceBg(p, { seed: 52 }); heading(p, 'TIDES');
    sunBody(p, { x: -150, y: 450, r: 200 });
    // new moon: the moon's and sun's pulls point the same way, so the bulge grows big
    const L = G(p, { o: 0 }); show(L, .3);
    const E1 = [560, 450];
    const b1 = put(mk('ellipse', { cx: E1[0], cy: E1[1], rx: 130, ry: 126, fill: '#6fb7ff', 'fill-opacity': .55 }, L), {});
    tw(b1, { a_rx: 200, a_ry: 120 }, m('spr') - .4, 1.4, soft);
    const e1 = globe(L, { x: E1[0], y: E1[1], r: 120, kind: 'pole', night: 0, rim: false });
    moonDot(L, E1[0] - 260, E1[1], 30);
    const grow = (f, x, y, len, a, t0) => { put(f, { o: 0 }); show(f, t0, .2); prog(q => f.set(x, y, Math.max(1, len * q), a), t0, .8, out); };
    const f1 = forceArrow(L, { label: 'moon', size: 24 }), f2 = forceArrow(L, { label: 'sun', size: 24, color: SKY.sun });
    f1.set(E1[0] - 210, E1[1] - 160, 1, 180); f2.set(E1[0] - 210, E1[1] + 160, 1, 180);
    grow(f1, E1[0] - 210, E1[1] - 160, 120, 180, m('line')); grow(f2, E1[0] - 210, E1[1] + 160, 70, 180, m('line') + .5);
    pen(L, 'NEW MOON: pulls line up', { x: E1[0] - 60, y: 210, size: 30, anchor: 'middle', o: 1 });
    hlAt(p, 'SPRING TIDES', E1[0] - 60, 760, m('spr'));
    lab(p, 'the water "springs" up', E1[0] - 60, 820, m('name'), { anchor: 'middle', size: 28 });
    // quarter moon: the pulls are at right angles, so the bulges stay small
    const N = G(p, { o: 0 }); show(N, m('right') - .3);
    const E2 = [1240, 420];
    const b2 = put(mk('ellipse', { cx: E2[0], cy: E2[1], rx: 128, ry: 128, fill: '#6fb7ff', 'fill-opacity': .45 }, N), {});
    tw(b2, { a_rx: 140, a_ry: 160 }, m('neap') - .4, 1.4, soft);
    const e2 = globe(N, { x: E2[0], y: E2[1], r: 120, kind: 'pole', night: 0, rim: false });
    clockRun(t => { e1.spin(8 * t); e2.spin(8 * t); }, D);
    moonDot(N, E2[0], E2[1] + 250, 30);
    const f3 = forceArrow(N, { label: 'moon', size: 24 }), f4 = forceArrow(N, { label: 'sun', size: 24, color: SKY.sun });
    f3.set(E2[0] + 170, E2[1] + 60, 1, 90); f4.set(E2[0] - 170, E2[1] - 40, 1, 180);
    grow(f3, E2[0] + 170, E2[1] + 60, 120, 90, m('right')); grow(f4, E2[0] - 170, E2[1] - 40, 70, 180, m('right') + .5);
    pen(N, 'QUARTER MOON: right angle', { x: E2[0], y: 210, size: 30, anchor: 'middle', o: 1 });
    hlAt(p, 'NEAP TIDES', E2[0], 760, m('neap'), { color: INK.def });
    lab(p, 'smaller tides', E2[0], 820, m('neap', .6), { anchor: 'middle', size: 28 });
  }],
  ['q5', 'Quick check: tides', (m, D) => {
    const p = panel(0); spaceBg(p, { seed: 53 });
    sunBody(p, { x: -150, y: 450, r: 200 });
    globe(p, { x: 460, y: 450, r: 100, kind: 'pole', light: 180, rim: false });
    moonDot(p, 720, 450, 30);
    pen(p, 'this week: the moon is here', { x: 600, y: 300, size: 30, anchor: 'middle', o: 1 });
  }, { ask: done => quiz({ x: 880, y: 140, w: 680, cls: 'side' }, [{
    id: 'c-tide', prompt: ['Sun, Earth and moon are lined up like this (a full moon). What kind of tides will we get?'],
    build: choice([['Spring tides: extra high and extra low'], ['Neap tides: smaller than usual'], ['No tides at all']], 0,
      'Lined up, the sun and moon pull along the same line, so their effects add up, at full moon as well as at new moon.',
      [null, 'Neap tides come at first and last quarter, when the pulls are at right angles.', 'The moon still pulls on the oceans, so there are always tides.']),
  }], done) }],
  ['wrap', 'Summary', (m, D) => {
    const p = panel(0); spaceBg(p, { seed: 60, o: .7 });
    pen(p, 'MY NOTES', { x: 160, y: 140, size: 48, fill: INK.def, o: 1 });
    [['Rotation (1 day) gives day and night; revolution (1 year) goes around the sun.', 'w1'],
      ["Seasons come from Earth's 23.44° tilt, not its distance from the sun.", 'w2'],
      ['Phases show how much of the sunlit half we see; eclipses need a perfect line-up.', 'w3'],
      ["The moon's gravity, helped by the sun, raises the tides.", 'w4']].forEach(([str, mark], i) => {
      const g = G(p, { x: -16, y: 270 + i * 140, o: 0 });
      mk('circle', { cx: 190, cy: -12, r: 28, fill: INK.hl }, g);
      T(g, String(i + 1), { x: 190, y: 0, size: 32, fill: INK.ink, weight: 700, anchor: 'middle', font: HAND });
      T(g, str, { x: 250, size: 36, font: HAND, fill: INK.note });
      tw(g, { o: 1, x: 0 }, m(mark), .6);
    });
    const k = kid(p, { x: 1480, y: 880, s: .6, face: -1 }), dg = dog(p, { x: 1360, y: 884, s: .5, face: -1 });
    alive(D, k, dg);
    ['w1', 'w2', 'w3', 'w4'].forEach(w => { prog(q => k.pose('stand', 'point', q), m(w) - .3, .4); prog(q => k.pose('point', 'stand', q), m(w) + 1.4, .5); });
  }],
  ['final1', 'Practice: Earth and the seasons', () => { const p = panel(0); spaceBg(p, { seed: 70, o: .5 }); }, { ask: done => quiz(SCREEN, FINAL1, done, 'Chapter practice, set 1 of 2') }],
  ['final2', 'Practice: moon, eclipses and tides', () => { const p = panel(0); spaceBg(p, { seed: 71, o: .5 }); }, { ask: done => quiz(SCREEN, FINAL2, done, 'Chapter practice, set 2 of 2') }],
  ['finish', 'Finished', () => { panel(0); }, { ask: finishCard }],
].map(([id, title, run, extra]) => ({ id, title, run, ...extra }));

/* ---------- practice ---------- */
const FINAL1 = [
  { id: 'p-axis', prompt: ['What is the imaginary line through the North and South Poles that Earth spins around?'],
    build: choice([['its axis'], ['the equator'], ['its orbit'], ['magnetic north']], 0, 'Earth rotates around its axis, once about every 24 hours.',
      [null, 'The equator runs around the middle of Earth, halfway between the poles.', 'The orbit is the path Earth follows around the sun.', 'Magnetic north is where a compass points, not a line Earth spins around.']) },
  { id: 'p-year', prompt: ['What motion does Earth complete once every year?'],
    build: choice([['one revolution around the sun'], ['one rotation on its axis'], ['one wobble of its tilt']], 0, 'One trip around the sun takes 365¼ days: a year.',
      [null, 'One rotation takes about a day, not a year.', "Earth's axis doesn't wobble from season to season; it keeps pointing the same way."]) },
  { id: 'p-summer', prompt: ['Why is it summer in the northern hemisphere in June?'],
    build: choice([['The north leans toward the sun, so sunlight is higher and days are longer.'], ['Earth is closest to the sun in June.'], ['The sun gives off more light in June.']], 0,
      'Higher, more direct sunlight for more hours a day warms the north.',
      [null, 'Earth is actually farthest from the sun in early July, and closest in January.', 'The sun shines about the same all year; what changes is how the light reaches us.']) },
  { id: 'p-tilt', prompt: ['If Earth were tilted more than 23.44°, how would the seasons change?'],
    build: choice([['They would be more extreme.'], ['They would be milder.'], ['They would stay the same.']], 0,
      'Summer sunlight would be even more direct and days even longer; winters would be darker and colder.',
      [null, 'Less tilt would make seasons milder; more tilt does the opposite.', 'The tilt is what causes seasons, so changing it changes them.']) },
  { id: 'p-solstice', prompt: ['Solstice or equinox?'],
    build: grid([
      { parts: ['Day and night are both about 12 hours everywhere.'], ans: ['eq'], why: 'At an equinox the sun is right over the equator.' },
      { parts: ['The longest day of the year in the north.'], ans: ['sol'], why: 'The June solstice, when the north leans most toward the sun.' },
      { parts: ['The axis leans neither toward nor away from the sun.'], ans: ['eq'], why: 'That is what makes day and night equal.' },
      { parts: ['Around December 21.'], ans: ['sol'], why: 'The December (winter) solstice.' },
    ], [['sol', 'Solstice', INK.hl], ['eq', 'Equinox', INK.def]], { multi: false, text: true }) },
];
const FINAL2 = [
  { id: 'p-spin', prompt: ['The moon takes 27.3 days to orbit Earth. How long does it take to spin once on its axis?'],
    build: choice([['27.3 days'], ['1 day'], ['29.5 days'], ["It doesn't spin."]], 0, 'The same time as one orbit, which is why one face always points at us.',
      [null, 'That is how long Earth takes to spin, not the moon.', '29.5 days is the cycle of phases, not one spin.', 'If it never spun, we would see all of its sides as it orbited.']) },
  { id: 'p-wax', prompt: ['Each night the lit part of the moon looks bigger. The moon is …'],
    build: choice([['waxing'], ['waning'], ['in a lunar eclipse']], 0, 'Waxing means growing: from new moon to full.',
      [null, 'Waning means shrinking, from full back to new.', 'An eclipse lasts a few hours, not night after night.']) },
  { id: 'p-solar', prompt: ['During a solar eclipse, where is the moon?'],
    build: choice([['between the sun and Earth'], ["in Earth's shadow"], ['at right angles to the sun']], 0, 'The moon blocks the sun and its shadow falls on Earth.',
      [null, "That is a lunar eclipse: Earth's shadow on the moon.", 'At right angles we see a quarter moon, not an eclipse.']) },
  { id: 'p-tides', prompt: ['How does the moon affect the water on Earth?'],
    build: choice([["Its gravity pulls the oceans into two bulges, making high and low tides."], ['Its light warms the water so it rises.'], ['It only affects lakes, not oceans.']], 0,
      'One bulge faces the moon, the other is on the far side; Earth turns under both.',
      [null, "Moonlight is only reflected sunlight and far too weak; it's gravity that raises the tides.", 'Gravity pulls on all water, but the effect is easiest to see on the huge oceans.']) },
  { id: 'p-count', prompt: ['How many high tides do most beaches get each day?'],
    build: choice([['2'], ['1'], ['4']], 0, 'Earth turns under two bulges a day: two highs and two lows.',
      [null, 'There are two bulges, one facing the moon and one on the far side.', 'Four is the total of highs and lows together: two of each.']) },
];
document.fonts.load('30px "Patrick Hand"').then(boot);
