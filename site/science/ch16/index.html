// A rectangular circuit, x0..x1 by y0..y1, with the battery standing on the left side (+ end up). Electrons leave the
// − end, go round and come back into the + end. Drawn: wire, electrons, battery. c.set(s) moves the electrons.
function loopCircuit(p, { x0, y0, x1, y1, bw = 160, bh = 70, gap = 56, r = 8, w = 12 }) {
  const ym = (y0 + y1) / 2, R = route([[x0, ym + bw / 2], [x0, y1], [x1, y1], [x1, y0], [x0, y0], [x0, ym - bw / 2]], true);
  const g = G(p); wire(g, R, { w });
  const flow = eFlow(g, R, { gap, r });
  const bat = battery(g, { x: x0, y: ym, w: bw, h: bh, r: -90 });
  return Object.assign(g, { R, flow, bat, set(s) { flow.set(s); return g; } });
}

// A field ring round a wire seen from above: an upright ellipse at x on a wire at y, with a head crawling round it.
function ringSet(p, xs, y, { rx = 16, ry = 74, color = MAGF } = {}) {
  const el = path(p, xs.map(x => `M${x} ${y - ry}A${rx} ${ry} 0 1 1 ${x} ${y + ry}A${rx} ${ry} 0 1 1 ${x} ${y - ry}`).join(''), { stroke: color, 'stroke-width': 4, fill: 'none' });
  const hd = path(p, '', { stroke: color, 'stroke-width': 4, fill: 'none' });

    el, hd, set(ph) {   // heads go down the front (right) half, so the field circles one way round the current
      let d = '';

}

    },
  });
}
