const CHAPTER = { number: 15, label: 7, title: 'Light and Sound Waves', minutes: 15, language: 'en', next: '../ch16/' };

const frameBox = (p, x, y, w, h, fill = BOX, stroke = COL.faint) => mk('rect', { x, y, width: w, height: h, rx: 18, fill, stroke, 'stroke-width': 3 }, p);
function starsIn(p, x, y, w, h, n = 60, seed = 1) {

const spaceBox = (p, x, y, w, h, seed = 3) => { const g = G(p); frameBox(g, x, y, w, h, SPACE, '#2a3a66'); starsIn(g, x + 10, y + 10, w - 20, h - 20, Math.round(w * h / 6000), seed); return g; };
// Arcs of a sound or radio wave around (cx, cy) facing dir (1 right, −1 left), one path each: a.set(radii, opacities).
function arcSet(p, n, { color = SOUND, w = 5, span: sp = .6, maxH = Infinity } = {}) {
  const els = Array.from({ length: n }, () => path(p, '', { stroke: color, 'stroke-width': w, fill: 'none' }));
  return {
    els,
    set(cx, cy, rs, os, dir = 1) {
      els.forEach((e, i) => {
        const r = rs[i] ?? 0, o = os[i] ?? 0;
        if (r <= 1 || o <= .01) { thAtt(e, 'opacity', 0); return; }
        const span = Math.min(sp, Math.asin(Math.min(1, maxH / r))), s = Math.sin(span), c = Math.cos(span);
        thAtt(e, 'd', `M${(cx + dir * r * c).toFixed(1)} ${(cy - r * s).toFixed(1)}A${r.toFixed(1)} ${r.toFixed(1)} 0 0 ${dir > 0 ? 1 : 0} ${(cx + dir * r * c).toFixed(1)} ${(cy + r * s).toFixed(1)}`);
        thAtt(e, 'opacity', Math.min(1, o));
      });
    },
  };
}
// Arcs leaving (cx, cy) every `gap` seconds from t0, at speed v px/s, fading out by R.
// The n most recent arcs are drawn; an arc fades out as it reaches R.
function arcsFrom(a, t, t0, cx, cy, { v = 260, gap = .45, R = 600, dir = 1, until = Infinity, n = a.els.length } = {}) {
  const rs = [], os = [], last = Math.min(Math.floor((t - t0) / gap), Math.floor((until - t0) / gap));
  for (let i = 0; i < n; i++) {
    const j = last - i, age = t - (t0 + j * gap), r = 18 + v * age;
    rs.push(r); os.push(t < t0 || j < 0 ? 0 : Math.max(0, 1 - r / R) * Math.min(1, age * 6));
  }
  a.set(cx, cy, rs, os, dir);
}

/* ---------- shared wave pictures ---------- */
// The measured water wave of part 1 (shape, wavelen): rest line at y 480, crests at 190, 710 and 1230.
const WV = { x0: 60, x1: 1300, y: 480, wl: 520 };
const crestX = k => WV.x0 + WV.wl * (.25 + k), troughX = k => WV.x0 + WV.wl * (.75 + k);
// The water wave travels right at WVS px/s, and red and blue light travel at that same speed too. wvPh(t, wl) is the
// phase for waveLine.set; wvRide(f0, lo, t, wl) rides a feature that sat at x f0 at t = 0 (a crest, a trough…) along
// with the wave, kept within [lo, lo + wl): x is where it is, o dips to 0 at the hop to the next crest so a marker
// slides along with its crest and then hands over.
const WVS = 120, wvMod = (a, n) => ((a % n) + n) % n;
const wvPh = (t, wl = WV.wl) => TAU * WVS * t / wl;
const wvRide = (f0, lo, t, wl = WV.wl, e = 45) => { const u = wvMod(f0 + WVS * t - lo, wl); return { x: lo + u, o: Math.min(1, u / e, (wl - u) / e) }; };
// The prism and the raindrop: rays traced with Snell's law, one per colour (the spread exaggerated to be seen).
const NPRISM = ROYGBIV.map((c, i) => 1.47 + .03 * i), NDROP = ROYGBIV.map((c, i) => 1.31 + .014 * i);
function hitLine([px, py], [dx, dy], [ax, ay], [bx, by]) {   // ray p + s·d against segment a–b: [s, point] or null
  const ex = bx - ax, ey = by - ay, den = dx * ey - dy * ex; if (Math.abs(den) < 1e-9) return null;
  const s = ((ax - px) * ey - (ay - py) * ex) / den, u = ((ax - px) * dy - (ay - py) * dx) / den;
  return s > 1e-6 && u >= 0 && u <= 1 ? [s, [px + s * dx, py + s * dy]] : null;
}
function prismPaths(P, start, dir) {   // P: triangle [[x, y] ×3]; returns per colour [entry, exit, far]
  const edges = [[P[0], P[1]], [P[1], P[2]], [P[2], P[0]]], cx = (P[0][0] + P[1][0] + P[2][0]) / 3, cy = (P[0][1] + P[1][1] + P[2][1]) / 3;
  const outN = ([a, b]) => { let nx = b[1] - a[1], ny = a[0] - b[0]; const L = Math.hypot(nx, ny); nx /= L; ny /= L; if ((a[0] - cx) * nx + (a[1] - cy) * ny < 0) { nx = -nx; ny = -ny; } return [nx, ny]; };
  const first = edges.map(e => [hitLine(start, dir, ...e), e]).filter(([h]) => h).sort((a, b) => a[0][0] - b[0][0])[0];
  const A = first[0][1], nA = outN(first[1]);
  return NPRISM.map(n => {
    const d1 = refractDir(dir, nA, 1, n), hit = edges.filter(e => e !== first[1]).map(e => [hitLine(A, d1, ...e), e]).filter(([h]) => h)[0];
    const B = hit[0][1], nB = outN(hit[1]), d2 = refractDir(d1, [-nB[0], -nB[1]], n, 1) || d1;
    return [A, B, [B[0] + d2[0] * 520, B[1] + d2[1] * 520]];
  });
}
function dropPaths(C, R, b) {   // a horizontal ray b px above the centre enters, reflects off the back, leaves
  const y = C[1] - b, x = C[0] - Math.sqrt(R * R - b * b), A = [x, y], nA = [(x - C[0]) / R, (y - C[1]) / R];
  return NDROP.map(n => {
    const d1 = refractDir([1, 0], nA, 1, n);
    const back = s => [A[0] + d1[0] * s, A[1] + d1[1] * s];
    const s1 = -2 * ((A[0] - C[0]) * d1[0] + (A[1] - C[1]) * d1[1]), B = back(s1), nB = [(B[0] - C[0]) / R, (B[1] - C[1]) / R];
    const d2 = reflectDir(d1, nB), s2 = -2 * ((B[0] - C[0]) * d2[0] + (B[1] - C[1]) * d2[1]), E = [B[0] + d2[0] * s2, B[1] + d2[1] * s2];
    const nE = [(E[0] - C[0]) / R, (E[1] - C[1]) / R], d3 = refractDir(d2, [-nE[0], -nE[1]], n, 1) || d2;
    return [A, B, E, [E[0] + d3[0] * 330, E[1] + d3[1] * 330]];
  });
}
