<script>
'use strict';
// Chapter 14, one page in book order: part 1 (temperature, thermometers, the three scales, absolute zero, converting),
// part 2 (thermal energy and heat), part 3 (conduction, convection, radiation), then the chapter practice. Molecules
// are dots whose speed lines grow with their speed; heat is red, cool is blue-grey; heat moves as red energy blocks.
// Notes, storyboard and errata: books/science/chapters/ch14.md.
const CHAPTER = { number: 14, label: 6, title: 'Thermal Energy', minutes: 11, language: 'en', next: '../ch15/' };
const Q_CARD = { x: 96, y: 586, w: 1408, cls: 'band' };   // a band card under the scenes; it moves up by itself when taller
const GY = 560;                                           // ground line in quick-check pictures
const Y1 = 740;                                           // floor line under big actors
const ground = (p, y = GY, x = 0, w = 1600) => { phBlock(p, x, y, w, 70, PH.grass, { top: 8, ol: 0 }); mk('rect', { x, y: y + 70, width: w, height: 6, fill: PH.grass, opacity: .5 }, p); };
const floorIn = (p, y = Y1, x = 0, w = 1600) => { phBlock(p, x, y, w, 90, '#6b5a48', { top: 8, ol: 0 }); };
const sm = (t, a, b) => io(ramp(t, a, b));
const lerp = (a, b, k) => a + (b - a) * k;
const SKIN = '#c98d63', ENAMEL = '#e4e0d4', WATER = '#3f7fb0';
const SC = { F: '#f0b86e', C: '#6fd0c4', K: '#e8a0c8' };   // the three scales: Fahrenheit amber, Celsius teal, Kelvin pink
const say = (p, s, x, y, t0, o = {}) => { const e = phLabel(p, s, { x, y, size: 32, ...o, o: 0 }); show(e, t0); return e; };
const line = (p, parts, x, y, t0, o = {}) => { const e = runs(p, parts, { x, y, size: 40, ...o }); show(e, t0); return e; };

/* ---------- shared pictures ---------- */
// The same shapes as ch10–13: a thought bubble over a head, a part title, and a three-row summary with small pictures.
function thought(p, [x0, y0, x1, y1], x, lines, t0) {
  const q = G(p, { o: 0 });
  mk('rect', { x: x0, y: y0, width: x1 - x0, height: y1 - y0, rx: 40, fill: '#22322d', stroke: COL.dim, 'stroke-width': 3 }, q);
  path(q, `M${x - 30} ${y1 - 2}L${x + 30} ${y1 - 2}L${x} ${y1 + 66}Z`, { fill: COL.dim });
  lines.forEach((s, i) => T(q, s, { x: (x0 + x1) / 2, y: y0 + 70 + i * 56, size: 42, anchor: 'middle' }));
  show(q, t0); return q;
}
function opener(p, x, y, part, name, name2) {
  const g = G(p, { o: 0, y: 24 });
  phLabel(g, part.toUpperCase(), { x, y: y - 80, size: 30, fill: COL.dim, weight: 600 }); phLabel(g, name, { x, y, size: 80, weight: 600 });
  if (name2) phLabel(g, name2, { x, y: y + 86, size: 80, weight: 600 });
  tw(g, { o: 1, y: 0 }, .2, 1.1, out); return g;
}
function summary(p, m, rows, next) {
  rows.forEach(([lines, icon], i) => {
    const g = G(p, { x: -16, y: 250 + i * 220, o: 0 });
    lines.forEach((s, j) => T(g, s, { x: 430, y: j * 50, size: 38, weight: 600 }));
    icon(g); tw(g, { o: 1, x: 0 }, m(['w1', 'w2', 'w3'][i]), .6);
  });
  txt(p, next, 800, 860, m('end'), { size: 32, fill: COL.dim, weight: 500 });
}

/* ---------- props: origin at the bottom centre unless noted ---------- */
function mug(p, o = {}) {   // a mug of hot cocoa, 110 wide and 100 tall, handle on the right
  const g = G(p, o);
  path(g, 'M50 -82h16q24 0 24 26v8q0 26 -24 26h-16', { stroke: ENAMEL, 'stroke-width': 13, fill: 'none' });
  phBlock(g, -55, -100, 110, 100, ENAMEL, { top: 0, right: 10 });
  mk('rect', { x: -49, y: -96, width: 98, height: 14, fill: '#6b3f2a' }, g);
  return g;
}
function milkGlass(p, o = {}) {   // a glass of cold chocolate milk, 84 wide and 130 tall
  const g = G(p, o);
  path(g, 'M-37 -110L-32 0H32L37 -110Z', { fill: '#c9a27e' });
  path(g, 'M-42 -130L-34 0H34L42 -130', { stroke: GLASS, 'stroke-width': 5, fill: 'none', 'stroke-linejoin': 'round' });
  [[-24, -64], [18, -92], [24, -38]].forEach(([x, y]) => mk('ellipse', { cx: x, cy: y, rx: 3, ry: 5, fill: '#fff', opacity: .7 }, g));
  return g;
}
function iceCube(p, sz = 120, o = {}) {
  const g = G(p, o);
  mk('rect', { x: -sz / 2, y: -sz, width: sz, height: sz, rx: sz * .16, fill: '#cfe8f5', opacity: .93, ...phLine(2.5) }, g);
  mk('rect', { x: -sz * .34, y: -sz * .84, width: sz * .3, height: sz * .12, rx: 4, fill: '#fff', opacity: .8 }, g);
  path(g, `M${sz * .16} ${-sz * .3}l${sz * .16} ${-sz * .16}`, { stroke: '#fff', 'stroke-width': 4, opacity: .7 });
  return g;
}
function table(p, x0, x1, top, legTo = Y1) {
  phBlock(p, x0 + 20, top + 16, 16, legTo - top - 16, '#7a5c40', { top: 0 }); phBlock(p, x1 - 36, top + 16, 16, legTo - top - 16, '#7a5c40', { top: 0 });
  phBlock(p, x0, top, x1 - x0, 18, WOOD, { top: 4 });
}
function beaker(p, x, hot, o = {}) {   // a beaker of hot (red-tinted) or iced water, 230 wide and 220 tall, at x on the table at 700
  const g = G(p, { x, y: 700, ...o });
  mk('rect', { x: -110, y: -180, width: 220, height: 180, fill: hot ? '#b0564a' : '#4a7fa8', opacity: .55 }, g);
  if (!hot) [[-60, -150, 12], [40, -160, -10]].forEach(([cx, cy, r]) => put(iceCube(g, 46), { x: cx, y: cy + 46, r }));
  path(g, 'M-115 -220V0H115V-220', { stroke: GLASS, 'stroke-width': 6, fill: 'none', 'stroke-linejoin': 'round' });
  return g;
}
// The scale ticks of a thermometer tube (fraction steps), drawn into its group so they travel with it.
function tubeTicks(t, n, len, w = 34) { let d = ''; for (let i = 1; i <= n; i++) d += `M${-w / 2 - 16} ${t.yAt(i / n)}h14`; return path(t, d, { stroke: COL.chalk, 'stroke-width': 3 }); }
function stove(p, x0, top) {   // a stove from the floor to `top`, a red-hot coil on the left, a cold one on the right
  const g = G(p);
  phBlock(g, x0, top + 14, 300, Y1 - top - 14, ENAMEL, { top: 6, right: 10 });
  phBlock(g, x0 + 30, top + 70, 240, Y1 - top - 100, '#3a4448', { top: 0 });
  [x0 + 60, x0 + 240].forEach(x => mk('circle', { cx: x, cy: top + 42, r: 9, fill: '#4a5458' }, g));
  const hot = mk('rect', { x: x0 + 15, y: top, width: 110, height: 14, rx: 7, fill: LIQ, ...phLine(2) }, g);
  mk('rect', { x: x0 + 175, y: top, width: 110, height: 14, rx: 7, fill: '#3a4448', ...phLine(2) }, g);
  return Object.assign(g, { hot, coilX: x0 + 70 });
}
function heater(p, x, o = {}) {   // a radiator standing on the floor at x, 180 wide and 150 tall; g.glow fades in red
  const g = G(p, { x, y: Y1, ...o });
  phBlock(g, -90, -20, 180, 20, '#9a958a', { top: 3 });
  for (let i = 0; i < 6; i++) phBlock(g, -86 + i * 30, -150, 22, 132, '#d9d4c8', { top: 5, right: 4 });
  const glow = mk('rect', { x: -90, y: -150, width: 180, height: 130, fill: HEAT, opacity: 0 }, g); put(glow, { o: 0 });
  return Object.assign(g, { glow });
}
function brick(p, x, y) { phBlock(p, x - 60, y - 40, 120, 40, '#b5523b', { top: 5, right: 6 }); }
function stars(p, n = 120) {
  let d = ''; for (let i = 0; i < n; i++) { const x = phHash(i, 1) * 1600, y = phHash(i, 2) * 900, r = .8 + 1.6 * phHash(i, 3); d += `M${(x - r).toFixed(1)} ${y.toFixed(1)}a${r} ${r} 0 1 0 ${2 * r} 0a${r} ${r} 0 1 0 ${-2 * r} 0`; }
  return path(p, d, { fill: '#dfe6ff', opacity: .8 });
}
// A ceiling fan hanging at (x, y): f.spin(angle) turns its two blade pairs (seen from the side).
function ceilingFan(p, x, y) {
  const g = G(p, { x, y });
  phBlock(g, -4, 0, 8, 44, '#7d8a86', { top: 0 }); phBlock(g, -22, 44, 44, 20, '#4a5458', { top: 3 });
  const a = path(g, '', { stroke: '#c9a36a', 'stroke-width': 10, 'stroke-linecap': 'round' }), b = path(g, '', { stroke: '#a8844f', 'stroke-width': 10, 'stroke-linecap': 'round' });
  return Object.assign(g, { spin(th) { const L = 150; thAtt(a, 'd', `M${-L * Math.cos(th)} 60H${L * Math.cos(th)}`); thAtt(b, 'd', `M${-L * Math.sin(th)} 62H${L * Math.sin(th)}`); } });
}

/* ---------- the scales picture: three thermometers, one liquid level, Celsius → world y ---------- */
const YC = c => 640 - 4.4 * c;
const TUBE_TOP = 170, BULB_TOP = YC(-280);
const TUBES = [['F', 470], ['C', 780], ['K', 1090]];
const toF = c => c * 9 / 5 + 32, toK = c => c + 273.15;
const fmtT = v => String(Math.round(v * 100) / 100).replace('-', '−');
const unitOf = u => (u === 'K' ? ' K' : ' °' + u);
const ROWS = [['boil', 100, 'water boils'], ['body', 37, 'body temperature'], ['room', 25, 'room temperature'], ['freeze', 0, 'water freezes'], ['zero', -273.15, 'absolute zero']];
function scalesWorld(W) {
  const rows = {}, tubes = {}, heads = {};
  ROWS.forEach(([k, c]) => { rows[k] = G(W, { o: 0 }); path(rows[k], `M430 ${YC(c)}H1270`, { stroke: COL.dim, 'stroke-width': 2, 'stroke-dasharray': '8 8' }); });
  TUBES.forEach(([u, x]) => {
    const step = { F: [-460, 220, 20, v => (v - 32) * 5 / 9], C: [-270, 100, 10, v => v], K: [0, 380, 10, v => v - 273.15] }[u];
    let d = ''; for (let v = step[0]; v <= step[1]; v += step[2]) d += `M${x - 34} ${YC(step[3](v)).toFixed(1)}h14`;
    path(W, d, { stroke: COL.dim, 'stroke-width': 2.5 });
    tubes[u] = thermoTube(W, { x, y: BULB_TOP + 30, len: BULB_TOP - TUBE_TOP, w: 34, bulb: 30 });
    heads[u] = phLabel(W, { F: 'Fahrenheit', C: 'Celsius', K: 'Kelvin' }[u], { x, y: 120, size: 36, fill: SC[u], o: 0 });
  });
  ROWS.forEach(([k, c, name]) => {
    TUBES.forEach(([u, x]) => { if (k !== 'zero' || u !== 'F') phLabel(rows[k], fmtT(u === 'F' ? toF(c) : u === 'K' ? toK(c) : c) + unitOf(u), { x: x + 28, y: YC(c) - 8, size: 28, fill: SC[u], anchor: 'start' }); });
    if (k !== 'zero') phLabel(rows[k], name, { x: 1290, y: YC(c) + 10, size: 30, anchor: 'start' });
  });
  return { rows, tubes, heads, setC(c) { const f = (BULB_TOP - YC(c)) / (BULB_TOP - TUBE_TOP); TUBES.forEach(([u]) => tubes[u].set(f)); } };
}

/* ---------- beats ---------- */
const BEATS = [
/* ---------- part 1: temperature and its scales ---------- */
['intro', 'Thermal energy', (m, D) => {
  const p = panel(0), tq = m('q'), TH = 10.9;   // TH: "wrap your hands around the mug"
  // You at a table with a steaming mug of cocoa and a glass of cold chocolate milk; you wrap your hands round the mug.
  floorIn(p); table(p, 330, 900, 600);
  const you = phActor(p, 'you', { x: 300, y: Y1, s: 2.4, anim: 'catch' }).show('stand');
  mug(p, { x: 410, y: 600 }); milkGlass(p, { x: 700, y: 600 });
  const steam = riseLines(p, 410, 470, { n: 3, c: COL.chalk }); put(steam, { o: 0 }); show(steam, .4);
  clockRun(t => { put(steam, { y: 470 - 10 * ((t * .9) % 1) }); if (t > TH) you.show('catch', 1); else you.show('stand'); }, D);
  const ttl = G(p, { o: 0, y: 24 });
  phLabel(ttl, 'Unit 2 · Energy · Chapter 6', { x: 1230, y: 330, size: 26, fill: COL.dim, weight: 600 });
  phLabel(ttl, 'Thermal', { x: 1230, y: 420, size: 76 }); phLabel(ttl, 'Energy', { x: 1230, y: 500, size: 76 });
  tw(ttl, { o: 1, y: 0 }, .3, 1.1, out);
  say(p, 'hot cocoa', 392, 728, 2.9, { size: 28, fill: HEAT, anchor: 'start' }); say(p, 'cold milk', 700, 728, 4.6, { size: 28, fill: COLD });
  thought(p, [60, 60, 900, 220], 300, ['What makes one hot and one cold?', 'Where does the heat go?'], tq);
}, { lead: false }],
['temp', 'Temperature', (m, D) => {
  const p = panel(0), th = m('hot'), tc = m('cold'), tk = m('kin'), ta = m('avg'), ts = m('same');
  // Two magnifier circles open over the drinks: fast red molecules in the cocoa, slow blue ones in the milk. Their speed
  // lines turn kinetic yellow; temperature is the average; thermometers beside them read high and low.
  table(p, 280, 1320, 770, 900);
  mug(p, { x: 480, y: 770 }); milkGlass(p, { x: 1120, y: 770 });
  phLabel(p, 'hot cocoa', { x: 480, y: 850, size: 30, fill: HEAT }); phLabel(p, 'cold milk', { x: 1120, y: 850, size: 30, fill: COLD });
  const lens = (cx, mx, my, t0, color, n) => {
    const g = G(p, { o: 0 });
    path(g, `M${mx - 50} ${my}L${cx - 190} ${540}M${mx + 50} ${my}L${cx + 190} ${540}`, { stroke: COL.faint, 'stroke-width': 3, 'stroke-dasharray': '8 8' });
    mk('circle', { cx, cy: 400, r: 232, fill: '#16221f', stroke: COL.chalk, 'stroke-width': 5 }, g);
    const f = molField(g, { x: cx - 160, y: 240, w: 320, h: 320, n, r: 11, color, trail: COL.chalk, seed: cx });
    tw(g, { o: 1 }, t0, .6); return f;
  };
  const fh = lens(480, 480, 676, .3, HEAT, 16), fc = lens(1120, 1120, 646, tc - .2, COLD, 16);
  clockRun(t => { fh.set(300 * t, 300); fc.set(70 * t, 70); }, D);
  say(p, 'fast', 480, 110, th, { size: 40, fill: HEAT }); say(p, 'slow', 1120, 110, tc + .3, { size: 40, fill: COLD });
  tw(fh.trails, { c_stroke: KIN }, tk, .6); tw(fc.trails, { c_stroke: KIN }, tk, .6);
  say(p, 'more kinetic energy', 480, 150, tk + .6, { size: 30, fill: KIN }); say(p, 'less kinetic energy', 1120, 150, tk + 2.4, { size: 30, fill: KIN });
  line(p, [['temperature', HEAT], [' = the '], ['average kinetic energy', KIN], [' of the molecules']], 800, 60, ta, { size: 40 });
  [[160, .8, HEAT, 'higher'], [1440, .25, COLD, 'lower']].forEach(([x, f, c, s]) => {
    const g = G(p, { o: 0 }); thermoTube(g, { x, y: 600, len: 300, w: 28, bulb: 26 }).set(f);
    phLabel(g, s, { x, y: 680, size: 30, fill: c }); phLabel(g, 'temperature', { x, y: 716, size: 26, fill: c }); show(g, ts + (x > 800 ? .5 : 0));
  });
}, { lead: false }],
['thermo', 'Thermometers', (m, D) => {
  const p = panel(0), th = m('hot'), tr = m('rise'), tc = m('cool'), trd = m('read');
  // A thermometer dips into hot water: the liquid's molecules speed up and spread, the column climbs. Moved into iced
  // water, it sinks. On the right, the liquid in the tube close up: its molecules and the column's height.
  table(p, 200, 1130, 700, 900);
  beaker(p, 430, true); beaker(p, 900, false);
  const steam = riseLines(p, 430, 470, { n: 3, c: COL.chalk }); put(steam, { o: .8 });
  const tube = thermoTube(p, { len: 260, w: 34, bulb: 30 }), tk = tubeTicks(tube, 8, 260); put(tk, { o: 0 }); show(tk, trd);
  // where the thermometer is: lifted at the hot beaker, dipped, lifted, carried over, dipped in the iced one
  const UP = 450, IN = 650, xAt = t => lerp(430, 900, sm(t, tc + .7, tc + 1.6)), yAt = t => lerp(UP, IN, sm(t, th, th + 1)) - (IN - UP) * sm(t, tc, tc + .7) + (IN - UP) * sm(t, tc + 1.6, tc + 2.3);
  const lev = t => .3 + .5 * sm(t, th + 2.4, tr + 1.2) - .62 * sm(t, tc + 2.3, tc + 4.3);   // the column follows the molecules
  const spd = t => 140 + 180 * sm(t, th + 1, th + 3.2) - 260 * sm(t, tc + 2.1, tc + 3.4);
  const keys = [[th + 1, 140], [th + 3.2, 320], [tc + 2.1, 320], [tc + 3.4, 60]];
  // the close-up: a tall tube; the liquid column's top and its molecules
  const zx = 1250, zw = 220, zb = 640, zt = 130;
  const zg = G(p);
  mk('rect', { x: zx, y: zt, width: zw, height: zb - zt, rx: 24, fill: '#16221f', stroke: GLASS, 'stroke-width': 5 }, zg);
  const col = mk('rect', { x: zx + 8, width: zw - 16, fill: LIQ, opacity: .35 }, zg);
  const f = molField(zg, { x: zx + 8, y: zb - 200, w: zw - 16, h: 200, n: 12, r: 11, color: LIQ, trail: KIN, seed: 3 });
  phLabel(zg, 'the liquid, close up', { x: zx + zw / 2, y: 690, size: 28, fill: COL.dim });
  const ztop = t => zb - 8 - (100 + 380 * lev(t));
  const link = path(p, '', { stroke: COL.faint, 'stroke-width': 3, 'stroke-dasharray': '8 8' });
  clockRun(t => {
    const x = xAt(t), y = yAt(t), L = lev(t); put(tube, { x, y }); tube.set(L);
    put(steam, { y: 470 - 10 * ((t * .9) % 1) });
    const top = ztop(t); thAtt(col, 'y', top); thAtt(col, 'height', zb - 8 - top);
    f.set(phaseOf(t, keys), spd(t), [zx + 8, top, zw - 16, zb - 8 - top]);
    thAtt(link, 'd', `M${x + 26} ${(y + tube.yAt(L)).toFixed(1)}L${zx} ${top.toFixed(1)}`);
  }, D);
  line(p, [['heat up', HEAT], [': most things expand · '], ['cool down', COLD], [': they contract']], 800, 80, 1.8, { size: 38 });
  hide(say(p, 'molecules speed up, spread apart', 1340, 735, th + 2.2, { size: 26, fill: KIN }), tc + 1.6);
  say(p, 'molecules slow down, move closer', 1340, 735, tc + 2.3, { size: 26, fill: COLD });
  hide(say(p, 'expands ↑', 560, 270, tr + .3, { size: 36, fill: HEAT, anchor: 'start' }), tc);
  const ct = say(p, 'contracts ↓', 1030, 440, tc + 3, { size: 36, fill: COLD, anchor: 'start' });
  say(p, 'the height shows the temperature', 690, 200, trd + .3, { size: 32, anchor: 'start' });
  hide(ct, trd);
}, { lead: false }],
['scales', 'Three temperature scales', (m, D) => {
  const p = panel(0), cam = camera(p, D), S_ = scalesWorld(cam.world);
  // Three thermometers read the same hotness on three scales; the liquid moves to each reference row as it is named.
  const tf = m('f'), tcl = m('c'), tk = m('k'), tb = m('boil'), tbo = m('body'), tr = m('room'), tfr = m('freeze');
  [['F', tf], ['C', tcl], ['K', tk]].forEach(([u, t0]) => show(S_.heads[u], t0));
  [['boil', tb], ['body', tbo], ['room', tr], ['freeze', tfr]].forEach(([k, t0]) => show(S_.rows[k], t0 + .2));
  const cAt = t => [[tb, 100], [tbo, 37], [tr, 25], [tfr, 0]].reduce((c, [t0, v]) => lerp(c, v, sm(t, t0 + .2, t0 + 1.6)), 25);
  clockRun(t => S_.setC(cAt(t)), D);
  say(p, 'same hotness, different numbers', 1390, 790, 28, { size: 26, fill: COL.dim });
}, { lead: false }],
['kelvin', 'Absolute zero', (m, D) => {
  const p = panel(0), cam = camera(p, D), S_ = scalesWorld(cam.world), tz = m('zero'), tsl = m('slow'), tst = m('stop'), tsi = m('si');
  // The camera pans down the same evenly ticked tubes, past freezing, to the very bottom of the Kelvin and Celsius
  // tubes, close enough to read the ticks and the 0 K row. Close up on the right, molecules slow as the liquid sinks
  // into view and down to 0 K; their speed sets the reading.
  Object.values(S_.heads).forEach(h => put(h, { o: 1 })); ['boil', 'body', 'room', 'freeze'].forEach(k => put(S_.rows[k], { o: 1 }));
  show(S_.rows.zero, tz);
  const Z = .9, CY = YC(-273.15) - 310 / Z, CX = 1090 + 320 / Z;   // 0 K row at screen y 760, Kelvin tube at x 480
  cam.to({ x: CX, y: CY, z: Z }, .3, 2.6);
  const keys = [[tsl + .6, 260], [tst + .4, 6]], v = t => keys[0][1] + (keys[1][1] - keys[0][1]) * ramp(t, keys[0][0], keys[1][0]);
  const TK = t => 273.15 * (v(t) / 260) ** 2;
  const ig = G(p, { o: 0 });
  mk('rect', { x: 920, y: 170, width: 380, height: 380, rx: 20, fill: '#16221f', stroke: COL.chalk, 'stroke-width': 4 }, ig);
  const f = molField(ig, { x: 930, y: 180, w: 360, h: 360, n: 14, r: 12, color: COLD, trail: KIN, seed: 9 });
  phLabel(ig, 'molecules', { x: 1110, y: 140, size: 30, fill: COL.dim });
  const rd = phLabel(ig, '', { x: 1110, y: 630, size: 60, fill: SC.K });
  pop(ig, tsl - .1); put(ig, { s: .9 });
  clockRun(t => { const k = TK(t); S_.setC(k - 273.15); f.set(phaseOf(t, keys), v(t)); phText(rd, `${Math.round(k)} K`); }, D);

['rad', 'Radiation', (m, D) => {
