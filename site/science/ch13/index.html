/* ---------- props: origin at the bottom centre unless noted ---------- */
// A golf club held at the hands: c.set(hx, hy, ang) points it at ang degrees (0 straight down, +90 forward, ±180 up)
// and returns the club head's position.
function golfClub(p, L) {
  const g = G(p), sh = path(g, '', { stroke: '#c3ccce', 'stroke-width': 7, 'stroke-linecap': 'round' }), hd = path(g, '', { stroke: '#4a5458', 'stroke-width': 16, 'stroke-linecap': 'round' });
  return Object.assign(g, {
    set(hx, hy, ang) {
      const r = ang * Math.PI / 180, s = Math.sin(r), c = Math.cos(r), x = hx + L * s, y = hy + L * c;
      sh.setAttribute('d', `M${hx.toFixed(1)} ${hy.toFixed(1)}L${x.toFixed(1)} ${y.toFixed(1)}`);
      hd.setAttribute('d', `M${(x - 4 * s).toFixed(1)} ${(y - 4 * c).toFixed(1)}L${(x + 22 * c).toFixed(1)} ${(y - 22 * s).toFixed(1)}`);
      return [x, y];
    },
  });
}
function golfBall(p, r = 12, o = {}) {   // centred on the origin
  const g = G(p, o);
  mk('circle', { r, fill: '#f8f6f0', ...phLine(2) }, g);
  mk('circle', { cx: -r * .3, cy: -r * .3, r: r * .28, fill: '#fff' }, g);
  return g;
}

function seated(p, role, o = {}) { return phActor(p, role, { anim: 'pedal', ...o }).show('pedal', 0); }

  phBlock(p, x - w / 2 - 16, top, 16, Y1 - top, '#8a6f55', { top: 0 }); phBlock(p, x + w / 2, top, 16, Y1 - top, '#8a6f55', { top: 0, right: 5 });

function bookUp(p, { w = 44, h = 120, c = '#c0504d', o = 1 } = {}) {   // a book standing on end, origin at its bottom centre

function campfire(p, o = {}) {   // logs; g.flame (scale it in from 0) sits on them
  const g = G(p, o);

function plant(p, o = {}) {   // a leafy vegetable in a soil bed patch; leaves reach up to about −150
  const g = G(p, o);
  [[-50, -70, -30], [50, -70, 30], [-26, -110, -12], [26, -110, 12], [0, -140, 0]].forEach(([x, y, r]) =>
    mk('ellipse', { cx: x, cy: y, rx: 28, ry: 52, fill: x ? '#5aa05a' : '#6fbf62', ...phLine(2), transform: `rotate(${r} ${x} ${y})` }, g));
  path(g, 'M0 0V-120', { stroke: '#3e7a42', 'stroke-width': 6 });

function nucleus(p, seed = 1, n = 9, o = {}) {   // a cluster of protons (red) and neutrons (grey), centred on the origin
  const g = G(p, o);
  for (let i = 0; i < n; i++) { const a = i * 2.4 + seed, r = 12 * Math.sqrt(i); mk('circle', { cx: r * Math.cos(a), cy: r * Math.sin(a), r: 12, fill: i % 2 ? '#e2553f' : '#b9c3c6', ...phLine(2) }, g); }
  return g;
}
// The pace of a golf swing: the swing position u along address 0, half back 1, top 2, impact 3, follow-through 4,
// mapped to the sprite frame and the club angle. Downswing passes the half-back frame again.
const SWING_ANG = [0, -180, -262, 0, 216];   // the club's angle at each key; 0 and 3 are replaced by the angle to the ball
function swingPose(u, a0) {
  const keys = SWING_ANG.map((a, i) => (i === 0 || i === 3 ? a0 : a)), i = Math.min(3, Math.floor(u)), k = u - i;
  const frame = u < .5 ? 0 : u < 1.5 ? 1 : u < 2.45 ? 2 : u < 2.8 ? 1 : u < 3.3 ? 3 : 4;
  return [frame, lerp(keys[i], keys[i + 1], k)];
}
// A golfer: actor + club. g.pose(u) sets the swing position; returns the club head's position.
// The ball sits where the club head reaches the ground at address: g.ballX, g.ballY (r = the ball's radius).
function golfer(p, { x, s, r = 12 }) {
  const a = phActor(p, 'you', { x, y: Y1, s, anim: 'swing' }), L = 7.4 * PX * s, cl = golfClub(p, L);
  a.show('swing', 0); const [hx, hy] = a.hand('F'), ballY = Y1 - r, ballX = hx + Math.sqrt(L * L - (ballY - hy) ** 2);
  const a0 = Math.asin((ballX - hx) / L) * 180 / Math.PI;
  return Object.assign(a, { club: cl, ballX, ballY, pose(u) { const [f, ang] = swingPose(u, a0); a.show('swing', f); const [h1, h2] = a.hand('F'); return cl.set(h1, h2, ang); } });
}

/* ---------- the two columns of forms: moving (kinetic) on the left, stored (potential) on the right ---------- */
function headers(p, t0) {
  const left = G(p, { o: 0 }), right = G(p, { o: 0 });
  runs(left, [['moving', KIN], [' · kinetic']], { x: 420, y: 210, size: 46, o: 1 });
  runs(right, [['stored', POT], [' · potential']], { x: 1180, y: 210, size: 46, o: 1 });
  path(p, 'M800 250V860', { stroke: COL.faint, 'stroke-width': 3 }); put(p.lastChild, { o: 0 }); show(p.lastChild, t0);
  show(left, t0); show(right, t0); return { left, right };
}
// A row: a live picture centred on (ix, yc) and its name and description at x. Returns the picture's update(t).
