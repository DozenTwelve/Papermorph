<script>

const CHAPTER = { number: 4, title: 'The Race', minutes: 2, language: 'en', next: '../ch05/' };

/* ---------- this episode's pieces ---------- */
// yellow is the needle (the vaccinated), red the virus
const VAX = MARK, KENT = [0.9, 51.2], SA = CITIES.Johannesburg, INDIA = [78, 22];
const WHO_TAG = 'WHO, 9 April 2021 · high- vs low-income countries', OWID_TAG = 'Our World in Data · 7-day average';
// India's new cases a day, weekly (Our World in Data, 7-day average)
const INDIA_CASES = [['2021-01-04', 18943], ['2021-01-11', 18018], ['2021-01-18', 15025], ['2021-01-25', 13709], ['2021-02-01', 12839], ['2021-02-08', 11512], ['2021-02-15', 11199], ['2021-02-22', 12752], ['2021-03-01', 15199], ['2021-03-08', 16737], ['2021-03-15', 22277], ['2021-03-22', 37249], ['2021-03-29', 56223], ['2021-04-05', 78489], ['2021-04-12', 134093], ['2021-04-19', 219172], ['2021-04-26', 321606], ['2021-05-03', 373206], ['2021-05-10', 390996], ['2021-05-17', 328984], ['2021-05-24', 255283], ['2021-05-31', 185012], ['2021-06-07', 123206], ['2021-06-14', 85776], ['2021-06-21', 60687], ['2021-06-28', 49159]];

// a row of people (Phosphor person), k of n lit yellow at tLit; centred on (x, y), cell c
function people(g, n, k, x, y, c, t0, tLit) {
  const x0 = x - n * c / 2;
  for (let i = 0; i < n; i++) {
    ico(g, 'person', x0 + (i + .5) * c, y, c * .95, '#5d564b', t0 + i * .06, { from: .4, dur: .2 });
    if (i < k) { const e = ico(g, 'person', x0 + (i + .5) * c, y, c * .95, VAX, tLit + i * .15, { from: 1.3, dur: .2 }); sfx(BEAT_ID, tLit + i * .15, 'tick', .9); }
  }
}
// the virus and the needle as runners
function virusGlyph(g, x, y, r = 30) {
  const e = G(g, { x, y });
  for (let i = 0; i < 10; i++) {
    const a = i / 10 * 2 * Math.PI, c = Math.cos(a), s = Math.sin(a);
    path(e, `M${c * r * .8} ${s * r * .8}L${c * r * 1.35} ${s * r * 1.35}`, { stroke: RED, 'stroke-width': 6, 'stroke-linecap': 'round' });
    mk('circle', { cx: c * r * 1.4, cy: s * r * 1.4, r: 7, fill: RED }, e);
  }
  mk('circle', { r, fill: RED }, e);
  return e;
}
function needleGlyph(g, x, y) {
  const e = G(g, { x, y });
  rect(e, -70, -6, 22, 12, { fill: LIGHT });                                   // plunger
  rect(e, -50, -18, 90, 36, { fill: LIGHT, rx: 5 });                           // barrel
  rect(e, -10, -12, 46, 24, { fill: VAX });                                    // the dose
  path(e, 'M40 0H96', { stroke: LIGHT, 'stroke-width': 5, 'stroke-linecap': 'round' });
  return e;
}
// race lanes: rows of [label, 'virus' | 'needle', pos(t) 0..1, t0]; the track from x 110 to 790, lanes 230 apart from y
function lanes(g, rows, y, t0) {
  const L = G(g, { o: 0 });
  show(L, t0, .2, lin);
  rows.forEach(([lab, who, pos, ta = t0], i) => {
    const ly = y + i * 300, ln = G(L, { o: ta > t0 ? 0 : 1 });
    if (ta > t0) show(ln, ta, .2, lin);
    path(ln, `M60 ${ly + 90}H840`, { stroke: '#4a453d', 'stroke-width': 4, 'stroke-dasharray': '18 14' });
    T(ln, lab.toUpperCase(), { x: 60, y: ly - 100, size: 54, fill: who === 'virus' ? RED : VAX, font: SANS, weight: 600 }).setAttribute('letter-spacing', '.06em');
    const r = who === 'virus' ? virusGlyph(ln, 0, ly, 44) : needleGlyph(ln, 0, ly);
    clockRun(t => put(r, { x: 150 + 560 * pos(t), y: ly + (who === 'virus' ? Math.sin(t * 9) * 6 : 0), s: who === 'virus' ? 1 : 1.6 }), 0, { tail: true });
  });
  path(L, `M800 ${y - 150}V${y + rows.length * 300 - 150}`, { stroke: LIGHT, 'stroke-width': 6, 'stroke-dasharray': '12 12' });   // the finish
  return L;
}
// a chart of a weekly series, drawn up to its playhead: rows [[date, v]], box x 80..820 and base y 1120, h 680 tall;
// cursor(t) -> rows drawn (a fractional index), ymax(t) -> the top of the scale. Returns the point of row i at t.
function curve(g, rows, cursor, ymax, { colour = RED, x0 = 80, x1 = 820, base = 1120, h = 680, years = true } = {}) {
  const c = G(g, {}), n = rows.length, X = i => x0 + (x1 - x0) * i / (n - 1);
  path(c, `M${x0} ${base}H${x1}`, { stroke: '#6a6258', 'stroke-width': 3 });
  if (years) rows.forEach(([d], i) => { if (d.slice(5, 7) === '01' && +d.slice(8) <= 7) T(c, d.slice(0, 4), { x: X(i), y: base + 46, size: 30, fill: MUTED, font: SANS, weight: 500, anchor: 'middle' }); });
  const area = path(c, '', { fill: colour, opacity: .28 }), line = path(c, '', { fill: 'none', stroke: colour, 'stroke-width': 6, 'stroke-linejoin': 'round' });
  const Y = (v, t) => base - h * v / ymax(t);
  clockRun(t => {
    const k = Math.min(n - 1, cursor(t)), pts = [];
    for (let i = 0; i <= k; i++) pts.push([X(i), Y(rows[i][1], t)]);
    const f = k - Math.floor(k), j = Math.floor(k);
    if (f && j + 1 < n) pts.push([X(j) + (X(j + 1) - X(j)) * f, Y(rows[j][1] + (rows[j + 1][1] - rows[j][1]) * f, t)]);
    const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join('');
    line.setAttribute('d', d);
    area.setAttribute('d', pts.length ? `${d}L${pts[pts.length - 1][0]} ${base}L${x0} ${base}Z` : '');
  }, 0, { tail: true });
  return (i, t) => [X(i), Y(rows[i][1], t)];
}
const wv = (col, a, b) => WAVES.filter(r => r[0] >= a && r[0] <= b).map(r => [r[0], r[col]]);
const idx = (rows, d) => rows.findIndex(r => r[0] >= d);
// a pin over the paper map: a ring and a dot at lon/lat, following the map's view
function pin(g, M, ll, t0, colour = RED) {
  const e = G(g, { o: 0 });
  mk('circle', { r: 30, fill: 'none', stroke: colour, 'stroke-width': 6 }, e);
  mk('circle', { r: 12, fill: colour }, e);
  tw(e, { o: 1 }, t0, .2, lin);
  sfx(BEAT_ID, t0, 'thud', .9);
  clockRun(t => { const P = M.xy(ll, t); if (P) put(e, { x: P[0], y: P[1], s: 1 + .25 * Math.max(0, Math.sin((t - t0) * 5)) * (t > t0) }); }, 0, { tail: true });
  return e;
}
// red rings rippling out of a point on the map from t0
function ripples(g, M, ll, t0, n = 6) {
  for (let i = 0; i < n; i++) {
    const c = mk('circle', { r: 0, fill: 'none', stroke: RED, 'stroke-width': 5, opacity: 0 }, g), a = t0 + i * .45;
    clockRun(t => {
      const q = ramp01(t, a, a + 1.8), P = M.xy(ll, t);
      if (!P || !q || q >= 1) return c.setAttribute('opacity', 0);
      c.setAttribute('cx', P[0]); c.setAttribute('cy', P[1]); c.setAttribute('r', 20 + q * 520); c.setAttribute('opacity', (1 - q) * .9);
    }, 0, { tail: true });
  }
}
const ease = (a, b, t0, t1) => t => a + (b - a) * smooth(ramp01(t, t0, t1));
const lerpView = (v0, v1, t0, t1) => t => { const q = smooth(ramp01(t, t0, t1)); return { lon: v0.lon + (v1.lon - v0.lon) * q, lat: v0.lat + (v1.lat - v0.lat) * q, H: v0.H * (v1.H / v0.H) ** q }; };

/* ---------- beats ---------- */
const OPEN_PRE = .3;
const BEATS = [
  // 0. The hook: the needle already in the arm; then the two crowds, one in four lit, one in five hundred lit
  ['hook', 'One in four, one in five hundred', (m, D) => {
    const p = panel(0);
    const o4 = m('one4'), po = m('poor'), o5 = m('one500');

    tw(g4, { s: 1.12 }, o4, po - o4 + .3, lin);
    word(s, '1 in 4', CX - 20, 980, o4 + .25, { size: 220, fill: VAX });
    label(s, 'Rich countries', CX - 20, 1170, m('rich'), { size: 60, fill: LIGHT, colour: DARK });
    srcTag(s, WHO_TAG, 50, 150, o4);
    // five hundred dots, one lit
    s = shot(p, po, undefined, { bg: DARK, swipe: true });
    const g5 = G(s, { x: CX - 20, y: 560 }), in5 = G(g5, { x: -(CX - 20), y: -560 });
    for (let i = 0; i < 500; i++) {
      const d = mk('circle', { cx: 146 + (i % 20) * 30, cy: 170 + Math.floor(i / 20) * 28, r: 10, fill: '#5d564b', opacity: 0 }, in5);
      show(d, po + .02 + (i % 20) * .012 + Math.floor(i / 20) * .02, .12, lin);
    }
    const lit = G(in5, { x: 146 + 13 * 30, y: 170 + 17 * 28, o: 0, s: 3 });
    mk('circle', { r: 12, fill: VAX }, lit); mk('circle', { r: 24, fill: 'none', stroke: VAX, 'stroke-width': 4 }, lit);
    tw(lit, { o: 1, s: 1 }, o5, .25, out);
    sfx('hook', o5, 'tick', 1.2);
    tw(g5, { s: 1.1 }, po, D - po, lin);

    label(s, 'Poor countries', CX - 20, 1240, po + .1, { size: 60, fill: LIGHT, colour: DARK });
    srcTag(s, WHO_TAG, 50, 150, po);
  }, { pre: OPEN_PRE }],

  // 1. Which series, which episode

    const p = panel(0);
    const s = shot(p, 0, undefined, { bg: DARK, swipe: 'quiet' });

  // 2. The needle starts: vials on the line; Britain, the first rich country to approve one
  ['vaccine', 'The vaccines', (m, D) => {
    const p = panel(0);
    const br = m('britain');
    let s = shot(p, 0, br, { whip: true });
    photo(s, 'ch04-vax-vials', 0, br + .3, { s0: 1.05, s1: 1.25, dx: 60 });
    label(s, '2 December 2020', CX - 20, 270, .1, { size: 70 });
    word(s, 'Vaccines', CX - 20, 1150, m('vax'), { size: 190, fill: VAX, stroke: DARK });
    // the map of Europe closing on Britain; the approval stamped on it
    s = shot(p, br, undefined, { bg: NIGHT, swipe: true });
    const view = lerpView({ lon: 5, lat: 50, H: .45 }, { lon: -2.5, lat: 53.5, H: .24 }, br - .2, D);
    const M = paperMap(s, D, view, { on: [br - .1, D + 1], cities: [['London', br + .4]] });
    const top = G(s, {});
    pin(top, M, CITIES.London, br + .2, VAX);
    word(s, 'Britain', CX - 20, 280, br + .1, { size: 130, fill: MAPINK, stroke: MAPLAND });
    label(s, 'First rich country', CX - 20, 1050, br + .9, { size: 56 });
    stamp(s, 'APPROVED', CX - 20, 1200, m('approve'), { size: 110, colour: '#2f6f73', r: -7 });

  ['alpha', 'Alpha', (m, D) => {
    const p = panel(0);
    const va = m('variant'), fa = m('faster'), th = m('three');

    word(s, 'New variant', CX - 20, 270, va + .05, { size: 120, fill: MAPINK, stroke: MAPLAND });

    srcTag(s, 'Public Health England, via Wikipedia', 50, 150, va);
    // the virus itself, pushing in
    s = shot(p, fa, th, { whip: true });
    found(s, 'virus-sem-red', 'NIAID, public domain', fa, th + .3, { s0: 1.1, s1: 1.45 });
    word(s, 'Spreads faster', CX - 20, 1180, fa + .05, { size: 130, fill: LIGHT, stroke: DARK });
    // pull out to the world: rings out of Britain, the count of countries (no countries lit: we have no list)
    s = shot(p, th, undefined, { bg: NIGHT, swipe: true });
    const v2 = lerpView({ lon: 2, lat: 49, H: .5 }, { lon: 10, lat: 35, H: 1.0 }, th, th + 1.6);
    const M2 = paperMap(s, D, v2, { on: [th - .1, D + 1] });
    ripples(G(s, {}), M2, KENT, th + .3, 5);

    word(s, 'First', CX - 20, 1240, m('first'), { size: 130, fill: VAX, stroke: DARK });

  // 6. Delta: India's second wave, the variant first identified there; it reaches the vaccinated too
  ['delta', 'Delta', (m, D) => {
    const p = panel(0);
    const wa = m('wave'), nw = m('new'), dl = m('delta'), vc = m('vaccinated');

    paperMap(s, D, v, { on: [nw - .1, vc + .4], lit: (c, t) => c === 'IND' ? .55 * ramp01(t, dl, dl + .3) : 0, cities: [['Delhi', nw + .3], ['Mumbai', nw + .5, 'l']] });
    label(s, 'New variant', CX - 20, 270, nw + .05, { size: 70, fill: MAPINK, colour: MAPLAND });
    word(s, 'Delta', CX - 20, 1200, dl, { size: 220, fill: RED, stroke: MAPLAND });
    sfx('delta', dl, 'bang', .8);
    srcTag(s, 'First identified in India · Wikipedia', 50, 150, nw);

    s = shot(p, vc, undefined, { bg: DARK, whip: true });
    const grp = G(s, { x: CX - 20, y: 700 }), in_ = G(grp, { x: -(CX - 20), y: -700 });

    tw(grp, { s: 1.15 }, vc, D - vc, lin);
    word(s, 'Even the vaccinated', CX - 20, 1200, vc, { size: 100, fill: LIGHT });

  ['omicron', 'Omicron', (m, D) => {

    word(s, 'Omicron', CX - 20, 1100, om, { size: 200, fill: RED, stroke: MAPLAND });
    label(s, 'More infectious still', CX - 20, 1240, m('infectious'), { size: 56, fill: MAPINK, colour: MAPLAND });
    srcTag(s, 'Detected in South Africa · Wikipedia', 50, 150, 0);

    const rows = wv(1, '2020-03-02', '2022-02-28'), pk = idx(rows, '2022-01-24');

    word(s, 'World', CX - 20, 270, ja + .05, { size: 120, fill: LIGHT });
    label(s, 'Reported cases a day', CX - 20, 380, ja + .2, { size: 44, fill: '#2a2620', colour: MUTED });
    const box = G(s, {});
    rect(box, 120, 1170, 620, 140, { fill: DARK, opacity: .92, rx: 10 });
    counter(box, 3386359, CX - 20, 1270, m35 - .3, { size: 110, fill: RED, dur: 1.1 });
    srcTag(s, OWID_TAG, 50, 150, ja);
  }],

  // 8. The answer to the hook: mid-2022, three in four against one in six; the race lanes once more
  ['gap', 'Still not fair', (m, D) => {
    const p = panel(0);
    const t4 = m('three4'), pr = m('poorest'), o6 = m('one6'), tl = o6 + 1.1;
    let s = shot(p, 0, pr, { bg: DARK, whip: true });
    label(s, 'Mid-2022', CX - 20, 270, 0, { size: 80 });
    const g4 = G(s, { x: CX - 20, y: 640 }), in4 = G(g4, { x: -(CX - 20), y: -640 });
    people(in4, 4, 3, CX - 20, 640, 180, 0, t4 + .1);
    tw(g4, { s: 1.12 }, 0, pr + .3, lin);
    word(s, '3 in 4', CX - 20, 980, t4 + .1, { size: 220, fill: VAX });
    label(s, 'Rich countries', CX - 20, 1170, m('rich'), { size: 60, fill: LIGHT, colour: DARK });
    srcTag(s, 'Our World in Data, June 2022 · high- vs low-income', 50, 150, 0);
    s = shot(p, pr, tl, { bg: DARK, swipe: true });
    const g6 = G(s, { x: CX - 20, y: 640 }), in6 = G(g6, { x: -(CX - 20), y: -640 });
    people(in6, 6, 1, CX - 20, 640, 125, pr, o6 + .1);
    tw(g6, { s: 1.12 }, pr, tl - pr + .3, lin);
    word(s, '1 in 6', CX - 20, 980, o6 + .1, { size: 220, fill: VAX });
    label(s, 'The poorest countries', CX - 20, 1170, pr + .1, { size: 60, fill: LIGHT, colour: DARK });
    srcTag(s, 'Our World in Data, June 2022 · high- vs low-income', 50, 150, pr);
    s = shot(p, tl, undefined, { bg: DARK, whip: true });
    lanes(s, [['Rich', 'needle', ease(.55, .85, tl, D)], ['Poorest', 'needle', ease(.08, .16, tl, D)]], 560, tl);
    word(s, 'Still not fair', CX - 20, 270, tl + .1, { size: 130, fill: LIGHT });
  }],

  // 9. Wave after wave, the count of the dead climbs; how many? next: the count
  ['end', 'The count climbs', (m, D) => {
    const p = panel(0);
    const ho = m('how'), pa = m('part');
    let s = shot(p, 0, pa, { bg: DARK, whip: true });
    const rows = wv(2, '2020-03-02', '2022-06-27');
    curve(s, rows, ease(0, rows.length - 1, 0, ho), () => 16000);
    word(s, 'Wave after wave', CX - 20, 270, 0, { size: 120, fill: LIGHT });
    const box = G(s, {});
    rect(box, 120, 330, 620, 200, { fill: '#15171c', opacity: .95, rx: 10 });
    const n = T(box, '', { x: CX - 20, y: 450, size: 100, fill: RED, font: SANS, weight: 600, anchor: 'middle' });
    T(box, 'REPORTED DEATHS', { x: CX - 20, y: 505, size: 36, fill: LIGHT, font: SANS, weight: 500, anchor: 'middle' }).setAttribute('letter-spacing', '.1em');
    const tot = WAVES.filter(r => r[0] <= '2022-06-27');
    clockRun(t => { const k = Math.min(tot.length - 1, Math.round(ease(0, tot.length - 1, 0, ho)(t))); n.textContent = tot[k][4].toLocaleString('en-US'); }, 0, { tail: true });
    for (let k = 0; k < 8; k++) sfx('end', .3 + k * (ho - .3) / 8, 'tick', .4);
    srcTag(s, 'Our World in Data · by June 2022', 50, 150, 0);
    const dim = rect(s, 0, 0, W, H, { fill: DARK, opacity: 0 });
    tw(dim, { opacity: .7 }, ho - .1, .3, lin);
    word(s, 'How many?', CX - 20, 1000, ho, { size: 170, fill: LIGHT });
    s = shot(p, pa, undefined, { bg: DARK, swipe: true });
    endCard(s, pa, 4);
  }],
].map(shortsBeat);

music('audio/bgm/ep4.mp3', undefined, +(new URLSearchParams(location.search).get('bgm') || .4), .05);
startPandemic();
</script>
