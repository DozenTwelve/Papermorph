<!doctype html>
<html lang="en" data-stage="portrait">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Pandemic · 0 · The pieces</title>
<link rel="stylesheet" href="../lib/engine.css">
<link rel="expect" href="#bar" blocking="render">
</head>
<body>
<!-- The series base's sample: three beats proving the shared pieces (lib/pandemic.js, lib/pglobe.js). Not an episode. -->
<script src="../lib/engine.js"></script>
<script src="audio/en/timings.js"></script>
<script src="../img/art.js"></script>
<script src="../img/geo-lite.js"></script>
<script src="../lib/icons.js"></script>
<script src="../lib/shorts.js"></script>
<script src="../lib/pandemic.js"></script>
<script>
'use strict';
const CHAPTER = { number: 0, title: 'The pieces', minutes: 1, language: 'en', next: '../ch01/' };

const ROUTES1 = ['Tokyo', 'Seoul', 'Bangkok', 'Singapore', 'Delhi', 'Tehran', 'Moscow', 'Milan', 'Paris', 'London', 'Madrid', 'Berlin', 'Cairo', 'Lagos', 'Sydney'];
const ROUTES2 = ['New York', 'Sao Paulo', 'Mexico City'];

/* ---------- beats ---------- */
const OPEN_PRE = .3;
const BEATS = [
  // 0. The globe turns to Wuhan and hands over to the paper map; red arcs carry the virus out, Europe seeds the Americas
  ['gone', 'Already left', (m, D) => {
    const p = panel(0);
    const s = shot(p, 0, undefined, { bg: NIGHT });
    const but = m('but'), tHand = 1.5, tOut = but + .1, tTurn = m('every') - .4;
    // one view for globe and map: the hand-over at tHand is invisible apart from the paper
    const view = t => {
      const a = smooth(ramp01(t, 0, tHand)), b = smooth(ramp01(t, tOut, tOut + 2.2)), c = smooth(ramp01(t, tTurn, tTurn + 1.6));
      return { lon: 60 + (WUHAN[0] - 60) * a + (78 - WUHAN[0]) * b + (15 - 78) * c,
        lat: 8 + (WUHAN[1] - 8) * a + (30 - WUHAN[1]) * b + (25 - 30) * c,
        H: 1.1 * (.42 / 1.1) ** a * (.95 / .42) ** b * (1.02 / .95) ** c };
    };
    Globe.clearMarks(); Globe.dot(...WUHAN);
    globeShot(s, D, view, () => 1, null, { on: [0, tHand + .5] });
    const mp = G(s, { o: 0 });
    show(mp, tHand, .45, lin);
    const tA = i => tOut + .3 + i * .17, tB = i => tTurn + .9 + i * .25;
    paperMap(mp, D, view, {
      prov: (n, t) => n === 'Hubei' ? ramp01(t, .3, .6) : 0,
      lit: (c, t) => c === 'ITA' ? .45 * ramp01(t, tA(7) + .8, tA(7) + 1.1) : 0,
      dots: [[...WUHAN, .2, 9]],
      routes: [...ROUTES1.map((n, i) => [WUHAN, CITIES[n], tA(i), .8]), ...ROUTES2.map((n, i) => [CITIES.Milan, CITIES[n], tB(i), .9])],
      cities: [['Wuhan', .5], ['Milan', tA(7) + .8, 'l'], ['New York', tB(0) + .9, 'l']],
      on: [tHand - .05, D + 1],
    });
    hide(word(s, 'Wuhan locks down', CX - 20, 260, 0, { size: 110, fill: LIGHT, stroke: DARK }), but - .15, .15, lin);
    word(s, 'Already gone', CX - 20, 260, but, { size: 130, fill: LIGHT, stroke: DARK });
    sfx('gone', but, 'whoosh', .5);
    word(s, 'Every continent', CX - 20, 1120, m('every'), { size: 100, fill: LIGHT, stroke: DARK });
    word(s, 'but one', CX - 20, 1240, m('butone'), { size: 100, fill: RED, stroke: DARK });
  }, { pre: OPEN_PRE }],

  // 1. Which series, which episode
  ['card', 'The series', (m, D) => {
    const p = panel(0);
    const s = shot(p, 0, undefined, { bg: DARK, swipe: 'quiet' });
    seriesCard(s, 0, 1, 1.3);
  }],

  // 2. A found photograph, full bleed, with its word; then the end card naming the next episode
  ['empty', 'Schools close', (m, D) => {
    const p = panel(0);
    const nx = 5.6;   // the end card, after the voice (the clip is padded with silence to 7.3 s)
    let s = shot(p, 0, nx, { whip: true });
    found(s, 'school-empty-classroom', 'U.S. Army photo, Pfc. Kaden Pitt', 0, nx, { s0: 1.0, s1: 1.18, dx: -40, dim: .25 });
    word(s, 'Schools close', CX - 20, 300, .1, { size: 120, fill: LIGHT, stroke: DARK });
    word(s, '1 billion', CX - 20, 1100, m('billion'), { size: 170, fill: MARK, stroke: DARK });
    word(s, 'students out of class', CX - 20, 1210, m('billion') + .3, { size: 64, fill: LIGHT, stroke: DARK });
    s = shot(p, nx, undefined, { bg: DARK, swipe: true });
    endCard(s, nx, 1);
  }],
].map(shortsBeat);

startPandemic();
</script>
</body>
</html>
